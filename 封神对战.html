        this.shenTong = 0;
        this.shenTongMax = 6;
        this.shenTongActive = false;
        this.shenTongTimer = 0;
        this.special = '';
        this.realm = '';
        this.moveLeft = false;
        this.moveRight = false;
        // 连击系统
        this.comboCount = 0;
        this.comboTimer = 0;
        this.attackType = 0; // 0-4 不同攻击类型
        this.lastComboTime = 0;
    }
    
    getColor() { return getFactionColor(this.faction); }
    
    moveByInput(dt) {
        if (!this.isAlive) return;
        const dtScale = dt / 16.67;
        let ax = 0;
        if (this.moveLeft) ax -= ACCEL;
        if (this.moveRight) ax += ACCEL;
        this.vx += ax * dtScale;
        if (!this.moveLeft && !this.moveRight) this.vx *= Math.pow(FRICTION, dtScale);
        this.vx = clamp(this.vx, -this.maxSpeed, this.maxSpeed);
        this.x += this.vx * dtScale;
        this.x = clamp(this.x, this.radius, SCREEN_WIDTH - this.radius);
    }
    
    attemptJump() {
        if (this.onGround && this.isAlive) {
            this.vy = -this.jumpStrength;
            this.onGround = false;
        }
    }
    
    applyPhysics(dt) {
        const dtScale = dt / 16.67;
        this.vy += GRAVITY * dtScale;
        this.y += this.vy * dtScale;
        if (this.y >= GROUND_Y) {
            this.y = GROUND_Y;
            this.vy = 0;
            this.onGround = true;
        } else {
            this.onGround = false;
        }
    }
    
    faceEnemy(enemy) {
        this.direction = enemy.x >= this.x ? 0 : 180;
    }
    
    attack(enemy, currentTime) {
        if (!this.isAlive || !enemy.isAlive) return null;
        if (currentTime - this.lastAttackTime < this.attackCooldown) return null;
        
        const dx = enemy.x - this.x;
        const dy = enemy.y - this.y;
        const distance = hypot(dx, dy);
        const rad = this.direction * Math.PI / 180;
        const frontDot = dx * Math.cos(rad) + dy * Math.sin(rad);
        const angleToEnemy = Math.atan2(dy, dx) * 180 / Math.PI;
        let angDiff = ((angleToEnemy - this.direction + 180) % 360) - 180;
        
        if (distance <= this.attackRange && frontDot > 0 && Math.abs(angDiff) <= ATTACK_FOV_DEG / 2) {
            let realDamage = Math.floor(this.attackPower * (1 - enemy.defensePower / 120));
            let isCrit = false;
            let isInstantKill = false;
            
            // 神通触发
            if (this.shenTong >= this.shenTongMax) {
                this.shenTongActive = true;
                this.shenTongTimer = 2000;
                
                realDamage = Math.floor(realDamage * 3.5);
                isCrit = true;
                
                const instantKillChance = 0.12 + this.attackPower * 0.0004;
                if (Math.random() < instantKillChance) {
                    realDamage = enemy.blood + 1;
                    isInstantKill = true;
                }
                
                this.shenTong = 0;
                spawnDivineEffect(this.x, this.y - 40, this, this.special);
                shake(20, 15);
            } else {
                this.shenTong++;
            }
            
            const msg = enemy.takeDamage(realDamage, this, isCrit, isInstantKill);
            this.attackDirRad = Math.atan2(dy, dx);
            this.attackIsRanged = false;
            
            // 根据法宝类型设置攻击动画时长
            const cat = fabaoCategory(this.fabao);
            const animMap = { 
                sword: 240, 
                spear: 240, 
                blade: 300, 
                axe: 320, 
                whip: 280, 
                staff: 260,
                hammer: 320,
                bow: 280,
                arrow: 280,
                fan: 220 
            };
            this.attackAnimTotal = animMap[cat] || 260;
            
            this.lastAttackTime = currentTime;
            this.attacking = true;
            this.attackDuration = this.attackAnimTotal;
            
            // 连击系统
            if (currentTime - this.lastComboTime < 600) {
                this.comboCount = (this.comboCount + 1) % 5;
            } else {
                this.comboCount = 0;
            }
            this.lastComboTime = currentTime;
            this.attackType = this.comboCount;
            this.comboTimer = 600;
            
            if (isInstantKill) {
                return `${this.name} 施展【${this.special}】，秒杀 ${enemy.name}！`;
            } else if (isCrit) {
                return `${this.name} 施展【${this.special}】，暴击 ${enemy.name}，造成 ${realDamage} 伤害！`;
            }
            return `${this.name} 使用 ${this.fabao} 攻击 ${enemy.name}，造成 ${realDamage} 伤害`;
        }
        return null;
    }
    
    takeDamage(damage, attacker, isCrit = false, isInstantKill = false) {
        if (this.defending) {
            const dx = attacker.x - this.x;
            const angleToAttacker = Math.atan2(0, dx) * 180 / Math.PI;
            let angDiff = ((angleToAttacker - this.direction + 180) % 360) - 180;
            if (Math.abs(angDiff) <= 100) {
                damage = Math.floor(damage * 0.35);
                spawnParticles(this.x, this.y - 30, 12, '#ffd700', 5, 4, true);
                spawnText(this.x, this.y - 45, '格挡!', '#ffd700', 18);
            } else {
                damage = Math.floor(damage * 0.75);
            }
        }
        
        // 阵法加成
        if (formationActive && currentFormation) {
            const formData = ALL_FORMATIONS[currentFormation];
            damage = Math.floor(damage * (1 - formData.defense / 200));
        }
        
        this.blood -= damage;
        
        if (isInstantKill) {
            spawnParticles(this.x, this.y - 30, 35, '#ff0000', 10, 6, true);
            spawnText(this.x, this.y - 70, '魂飞魄散!', '#ff0000', 32);
            shake(20, 12);
        } else if (isCrit) {
            spawnParticles(this.x, this.y - 30, 25, '#ffcc00', 8, 5, true);
            spawnText(this.x, this.y - 60, String(damage), '#ffcc00', 28);
        } else {
            spawnParticles(this.x, this.y - 30, Math.max(5, Math.floor(damage / 3)), '#cc0000', 5);
            spawnText(this.x, this.y - 55, String(damage), '#ff4444', 22);
        }
        
        if (damage > 20) shake(6, 4);
        
        this.hitTimer = 250;
        if (this.blood <= 0) {
            this.blood = 0;
            this.isAlive = false;
            spawnParticles(this.x, this.y, 45, this.getColor(), 8, 6, true);
            return `${this.name} 陨落！`;
        }
        return `${this.name} 受到 ${damage} 伤害`;
    }
    
    update(dt) {
        if (this.attacking) {
            this.attackDuration -= dt;
            if (this.attackDuration <= 0) this.attacking = false;
        }
        if (this.hitTimer > 0) this.hitTimer -= dt;
        if (this.defenseTimer > 0) {
            this.defenseTimer -= dt;
            if (this.defenseTimer <= 0) this.defending = false;
        }
        if (this.shenTongTimer > 0) {
            this.shenTongTimer -= dt;
            if (this.shenTongTimer <= 0) this.shenTongActive = false;
        }
        if (this.comboTimer > 0) {
            this.comboTimer -= dt;
            if (this.comboTimer <= 0) this.comboCount = 0;
        }
        
        const speed = Math.abs(this.vx);
        if (this.onGround && speed > 0.1) {
            this.runPhase += (speed / this.maxSpeed) * 0.2 * (dt / 16);
        }
        this.idlePhase += dt * 0.002;
    }
}

// ========== 绘制角色 - 飘逸仙侠剪影风格 ==========
function drawCharacter(ctx, ch, ox, oy) {
    const sx = ch.x - ox;
    const sy = ch.y - oy;
    const facing = ch.direction === 0 ? 1 : -1;
    const color = ch.getColor();
    const time = Date.now() * 0.001;
    const isFemale = FEMALE_HEROES.includes(ch.name);
    
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(facing, 1);
    
    // 受击闪烁
    if (ch.hitTimer > 0 && Math.floor(ch.hitTimer / 40) % 2 === 0) {
        ctx.globalAlpha = 0.5;
    }
    
    // 移动拖尾效果
    if (Math.abs(ch.vx) > 2) {
        const trailAlpha = Math.min(0.4, Math.abs(ch.vx) * 0.05);
        for (let i = 1; i <= 4; i++) {
            ctx.globalAlpha = trailAlpha * (1 - i * 0.2);
            ctx.save();
            ctx.translate(-ch.vx * i * 2 * facing, 0);
            drawSilhouette(ctx, ch, color, time, isFemale, 0.7);
            ctx.restore();
        }
        ctx.globalAlpha = ch.hitTimer > 0 ? 0.5 : 1;
    }
    
    // 神通激活 - 仙气缭绕
    if (ch.shenTongActive) {
        drawDivineAura(ctx, color, time);
    }
    
    // 主体剪影
    drawSilhouette(ctx, ch, color, time, isFemale, 1);
    
    // 防御结界
    if (ch.defending) {
        drawDefenseBarrier(ctx, color, time);
    }
    
    ctx.restore();
    
    // UI元素
    drawCharacterUI(ctx, ch, sx, sy, color);
}

// 绘制飘逸剪影
function drawSilhouette(ctx, ch, color, time, isFemale, scale) {
    const breathe = Math.sin(time * 2) * 2;
    const windSway = Math.sin(time * 1.5) * 3;
    const isMoving = Math.abs(ch.vx) > 0.5;
    const isJumping = !ch.onGround;
    const isAttacking = ch.attacking;
    const runPhase = ch.runPhase;
    
    ctx.save();
    ctx.scale(scale, scale);
    
    // 整体发光
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;
    
    // 飘带/披风 - 后层
    drawFlowingRibbon(ctx, color, time, windSway, isMoving, ch.vx, -1);
    
    // 长袍下摆 - 飘逸
    drawFlowingRobe(ctx, color, time, windSway, isMoving, runPhase, isFemale, isJumping);
    
    // 身体主体
    drawBody(ctx, color, breathe, isFemale, isAttacking, ch);
    
    // 手臂和武器
    drawArmsAndWeapon(ctx, ch, color, time, isAttacking);
    
    // 头部和发型
    drawHeadAndHair(ctx, color, time, windSway, isFemale, isMoving, ch.vx);
    
    // 飘带/披风 - 前层
    drawFlowingRibbon(ctx, color, time, windSway, isMoving, ch.vx, 1);
    
    ctx.shadowBlur = 0;
    ctx.restore();
}

// 绘制飘逸长袍
function drawFlowingRobe(ctx, color, time, windSway, isMoving, runPhase, isFemale, isJumping) {
    const robeColor = shadeColor(color, -25);
    const waveSpeed = isMoving ? 8 : 2;
    const waveAmp = isMoving ? 12 : 5;
    
    ctx.fillStyle = robeColor;
    ctx.beginPath();
    
    // 腰部起点
    const waistY = -20;
    const waistW = isFemale ? 10 : 12;
    
    ctx.moveTo(-waistW, waistY);
    
    // 左侧袍摆 - 多层波浪
    const leftFlow = Math.sin(time * waveSpeed + 1) * waveAmp + windSway;
    const leftMid = Math.sin(time * waveSpeed * 0.7) * (waveAmp * 0.6);
    ctx.quadraticCurveTo(
        -waistW - 8 + leftMid, waistY + 25,
        -waistW - 15 + leftFlow, waistY + 55
    );
    
    // 底部波浪边缘
    const segments = 6;
    for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const x = lerp(-waistW - 15 + leftFlow, waistW + 15 - leftFlow, t);
        const waveOffset = Math.sin(time * waveSpeed + t * 4) * 5;
        const y = waistY + 55 + waveOffset + (isJumping ? -10 : 0);
        
        if (i === 0) continue;
        ctx.lineTo(x, y);
    }
    
    // 右侧袍摆
    const rightFlow = Math.sin(time * waveSpeed) * waveAmp - windSway;
    ctx.quadraticCurveTo(
        waistW + 8 - leftMid, waistY + 25,
        waistW, waistY
    );
    
    ctx.closePath();
    ctx.fill();
    
    // 袍摆高光纹理
    ctx.strokeStyle = shadeColor(color, 20);
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.3;
    for (let i = 0; i < 3; i++) {
        const y = waistY + 20 + i * 12;
        ctx.beginPath();
        ctx.moveTo(-waistW - 5 + i * 2, y);
        ctx.quadraticCurveTo(
            0, y + Math.sin(time * 2 + i) * 3,
            waistW + 5 - i * 2, y
        );
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
}

// 绘制身体主体
function drawBody(ctx, color, breathe, isFemale, isAttacking, ch) {
    const torsoH = 35;
    const shoulderW = isFemale ? 14 : 18;
    const waistW = isFemale ? 8 : 10;
    
    // 上身轮廓
    ctx.fillStyle = color;
    ctx.beginPath();
    
    // 肩膀
    ctx.moveTo(-shoulderW, -torsoH - 5);
    
    // 左臂连接
    ctx.quadraticCurveTo(-shoulderW - 5, -torsoH + 5, -shoulderW - 3, -torsoH + 15);
    
    // 左侧身体曲线
    ctx.quadraticCurveTo(-waistW - 5, -torsoH/2, -waistW, -20);
    
    // 腰部
    ctx.lineTo(waistW, -20);
    
    // 右侧身体曲线
    ctx.quadraticCurveTo(waistW + 5, -torsoH/2, shoulderW + 3, -torsoH + 15);
    
    // 右臂连接
    ctx.quadraticCurveTo(shoulderW + 5, -torsoH + 5, shoulderW, -torsoH - 5);
    
    // 领口
    ctx.quadraticCurveTo(5, -torsoH - 10 + breathe, 0, -torsoH - 8);
    ctx.quadraticCurveTo(-5, -torsoH - 10 + breathe, -shoulderW, -torsoH - 5);
    
    ctx.closePath();
    ctx.fill();
    
    // 衣领V字
    ctx.strokeStyle = shadeColor(color, 30);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-6, -torsoH - 5);
    ctx.lineTo(0, -torsoH + 8);
    ctx.lineTo(6, -torsoH - 5);
    ctx.stroke();
    
    // 腰带
    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.ellipse(0, -22, waistW + 6, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // 腰带装饰
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, -22, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
}

// 绘制手臂和武器 - 强力连击系统
function drawArmsAndWeapon(ctx, ch, color, time, isAttacking) {
    const attackProgress = isAttacking ? (1 - ch.attackDuration / 300) : 0;
    const attackType = ch.attackType || 0;
    const isJumping = !ch.onGround;
    const isShenTong = ch.shenTongActive;
    const weaponCat = fabaoCategory(ch.fabao);
    const isBow = weaponCat === 'bow' || weaponCat === 'arrow';
    
    ctx.fillStyle = color;
    
    if (isAttacking) {
        // 根据连击次数和状态选择攻击动作
        if (isShenTong) {
            if (isBow) {
                drawArcherUltimate(ctx, ch, color, time, attackProgress);
            } else {
                drawUltimateAttack(ctx, ch, color, time, attackProgress);
            }
        } else if (isBow) {
            // 弓箭手专属攻击动作
            drawArcherAttack(ctx, ch, color, time, attackProgress, attackType);
        } else if (isJumping) {
            drawAerialAttack(ctx, ch, color, time, attackProgress);
        } else {
            switch(attackType) {
                case 0: drawSlashAttack(ctx, ch, color, attackProgress); break;
                case 1: drawThrustAttack(ctx, ch, color, attackProgress); break;
                case 2: drawSweepAttack(ctx, ch, color, attackProgress); break;
                case 3: drawSpinAttack(ctx, ch, color, time, attackProgress); break;
                case 4: drawHeavyAttack(ctx, ch, color, attackProgress); break;
            }
        }
    } else {
        if (isBow) {
            drawArcherIdle(ctx, ch, color, time);
        } else {
            drawIdlePose(ctx, ch, color, time);
        }
    }
}

// 弓箭手站立姿态
function drawArcherIdle(ctx, ch, color, time) {
    const idleSway = Math.sin(time * 1.5) * 0.08;
    
    // 左手持弓
    ctx.save();
    ctx.translate(-5, -35);
    ctx.rotate(-0.2 + idleSway);
    drawArm(ctx, color, 26, -0.1);
    
    ctx.save();
    ctx.translate(24, 0);
    ctx.rotate(0.1);
    drawFabao(ctx, ch.fabao, ch.getColor(), 0.9);
    ctx.restore();
    ctx.restore();
    
    // 右手垂下准备拿箭
    ctx.save();
    ctx.translate(10, -30);
    ctx.rotate(0.5 + idleSway);
    drawArm(ctx, color, 28, 0.3);
    ctx.restore();
}

// 弓箭手攻击动作 - 拉弓射箭
function drawArcherAttack(ctx, ch, color, time, progress, attackType) {
    // 拉弓阶段 0-0.4, 璧击阶段 0.4-0.6, 射出阶段 0.6-1
    const drawPhase = progress < 0.4 ? progress / 0.4 : 1;
    const holdPhase = progress >= 0.4 && progress < 0.6 ? (progress - 0.4) / 0.2 : 0;
    const releasePhase = progress >= 0.6 ? (progress - 0.6) / 0.4 : 0;
    
    const drawBack = drawPhase * 25;
    const bodyLean = Math.sin(drawPhase * Math.PI * 0.5) * 0.15;
    
    ctx.save();
    ctx.rotate(-bodyLean);
    
    // 左手持弓 - 前伸
    ctx.save();
    ctx.translate(-5 + drawPhase * 15, -38);
    ctx.rotate(-0.3 - drawPhase * 0.2);
    drawArm(ctx, color, 30 + drawPhase * 5, -0.1);
    
    // 弓
    ctx.save();
    ctx.translate(28, 0);
    ctx.rotate(0);
    drawFabao(ctx, ch.fabao, ch.getColor(), 1.1);
    ctx.restore();
    ctx.restore();
    
    // 右手拉弦
    ctx.save();
    ctx.translate(5 - drawBack * 0.8, -36);
    ctx.rotate(0.3 + drawPhase * 0.5);
    drawArm(ctx, color, 25 + drawBack * 0.3, 0.4);
    ctx.restore();
    
    // 箭矢飞行特效
    if (releasePhase > 0) {
        drawArrowFlight(ctx, color, releasePhase, attackType);
    }
    
    // 蓄力光晕
    if (drawPhase > 0.5 && releasePhase === 0) {
        ctx.globalAlpha = (drawPhase - 0.5) * 1.5;
        const glowSize = 15 + holdPhase * 10;
        const gradient = ctx.createRadialGradient(40, -35, 0, 40, -35, glowSize);
        gradient.addColorStop(0, '#ffffff');
        gradient.addColorStop(0.5, color);
        gradient.addColorStop(1, 'transparent');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(40, -35, glowSize, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
    
    ctx.restore();
}

// 箭矢飞行特效
function drawArrowFlight(ctx, color, progress, attackType) {
    const distance = progress * 150;
    const spread = attackType * 0.15; // 不同攻击类型不同散布
    
    ctx.save();
    ctx.translate(50, -35);
    
    // 主箭
    ctx.save();
    ctx.translate(distance, 0);
    
    // 箭身
    ctx.strokeStyle = '#8b6040';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-30, 0);
    ctx.lineTo(15, 0);
    ctx.stroke();
    
    // 箭头
    ctx.fillStyle = '#c0c0c0';
    ctx.beginPath();
    ctx.moveTo(15, -3);
    ctx.lineTo(25, 0);
    ctx.lineTo(15, 3);
    ctx.closePath();
    ctx.fill();
    
    // 箭尾羽
    ctx.fillStyle = '#ffffff88';
    ctx.beginPath();
    ctx.moveTo(-28, 0);
    ctx.lineTo(-35, -5);
    ctx.lineTo(-30, 0);
    ctx.lineTo(-35, 5);
    ctx.closePath();
    ctx.fill();
    
    ctx.restore();
    
    // 箭矢拖尾
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.6 * (1 - progress);
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(distance - 20, 0);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    
    // 多重箭 (连珠箭效果)
    if (attackType >= 2) {
        for (let i = 1; i <= attackType - 1; i++) {
            const offsetY = (i % 2 === 0 ? 1 : -1) * (Math.ceil(i/2) * 15);
            const delay = i * 0.1;
            const arrowDist = Math.max(0, (progress - delay) * 150);
            
            if (arrowDist > 0) {
                ctx.globalAlpha = 0.7;
                ctx.strokeStyle = '#8b6040';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(arrowDist - 25, offsetY);
                ctx.lineTo(arrowDist + 10, offsetY);
                ctx.stroke();
                
                ctx.fillStyle = '#c0c0c0';
                ctx.beginPath();
                ctx.moveTo(arrowDist + 10, offsetY - 2);
                ctx.lineTo(arrowDist + 18, offsetY);
                ctx.lineTo(arrowDist + 10, offsetY + 2);
                ctx.closePath();
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
    }
    
    ctx.restore();
}

// 弓箭手终极大招 - 射日神功
function drawArcherUltimate(ctx, ch, color, time, progress) {
    const chargePhase = progress < 0.5 ? progress / 0.5 : 1;
    const releasePhase = progress >= 0.5 ? (progress - 0.5) / 0.5 : 0;
    
    // 背景光球
    ctx.save();
    const sunSize = 30 + chargePhase * 50;
    const sunGrad = ctx.createRadialGradient(0, -40, 0, 0, -40, sunSize);
    sunGrad.addColorStop(0, '#ffffff');
    sunGrad.addColorStop(0.3, '#ffff00');
    sunGrad.addColorStop(0.6, '#ff8800');
    sunGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = sunGrad;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.arc(0, -40, sunSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
    
    // 拉弓姿态
    ctx.save();
    ctx.translate(0, -chargePhase * 10);
    
    // 左手持弓
    ctx.save();
    ctx.translate(-5, -35);
    ctx.rotate(-0.5);
    drawArm(ctx, color, 35, -0.2);
    ctx.save();
    ctx.translate(32, 0);
    drawFabao(ctx, ch.fabao, ch.getColor(), 1.3);
    ctx.restore();
    ctx.restore();
    
    // 右手拉弦
    ctx.save();
    ctx.translate(-20, -35);
    ctx.rotate(0.8);
    drawArm(ctx, color, 30, 0.5);
    ctx.restore();
    
    ctx.restore();
    
    // 多箭齐发
    if (releasePhase > 0) {
        const numArrows = 9;
        for (let i = 0; i < numArrows; i++) {
            const angle = ((i - 4) / 8) * 0.6;
            const delay = i * 0.05;
            const arrowProgress = Math.max(0, (releasePhase - delay) * 1.5);
            
            if (arrowProgress > 0) {
                ctx.save();
                ctx.translate(40, -40);
                ctx.rotate(angle);
                
                const dist = arrowProgress * 200;
                
                // 金色神箭
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(dist, 0);
                ctx.stroke();
                
                // 箭头光芒
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(dist, 0, 5 * (1 - arrowProgress * 0.5), 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.restore();
            }
        }
    }
}

// 站立姿态
function drawIdlePose(ctx, ch, color, time) {
    const idleSway = Math.sin(time * 1.5) * 0.1;
    const breathe = Math.sin(time * 2) * 0.03;
    
    // 左手负于身后 - 仙侠站姿
    ctx.save();
    ctx.translate(-14, -32);
    ctx.rotate(-0.8 + idleSway);
    drawArm(ctx, color, 26, -0.2);
    ctx.restore();
    
    // 右手持武器 - 优雅斜持
    ctx.save();
    ctx.translate(12, -35);
    ctx.rotate(0.4 + idleSway + breathe);
    drawArm(ctx, color, 28, 0.15);
    
    ctx.save();
    ctx.translate(26, 2);
    ctx.rotate(-0.3 + Math.sin(time * 2) * 0.05);
    drawFabao(ctx, ch.fabao, ch.getColor(), 1);
    ctx.restore();
    
    ctx.restore();
}

// 攻击1: 横斩 - 从右上到左下的弧形斩击
function drawSlashAttack(ctx, ch, color, progress) {
    const phase = progress < 0.3 ? progress / 0.3 : 
                  progress < 0.7 ? 1 : 
                  1 - (progress - 0.7) / 0.3;
    const swingAngle = -1.5 + phase * 3.5;
    const bodyTwist = Math.sin(progress * Math.PI) * 0.15;
    
    // 后手平衡
    ctx.save();
    ctx.translate(-15, -30);
    ctx.rotate(-1.2 + bodyTwist);
    drawArm(ctx, color, 30, -0.4);
    ctx.restore();
    
    // 攻击手 - 大弧度挥砍
    ctx.save();
    ctx.translate(10 + phase * 8, -42 + phase * 10);
    ctx.rotate(swingAngle);
    drawArm(ctx, color, 35, 0.3);
    
    ctx.save();
    ctx.translate(33, 0);
    ctx.rotate(0.2);
    drawFabao(ctx, ch.fabao, ch.getColor(), 1.3);
    ctx.restore();
    
    // 剑气弧形轨迹
    if (progress > 0.2 && progress < 0.75) {
        drawSlashTrail(ctx, color, progress, swingAngle, 70);
    }
    
    ctx.restore();
}

// 攻击2: 突刺 - 快速前刺
function drawThrustAttack(ctx, ch, color, progress) {
    const thrustDist = Math.sin(progress * Math.PI) * 45;
    const prepPhase = progress < 0.25 ? progress / 0.25 : 1;
    const pullBack = (1 - prepPhase) * 15;
    
    // 后手收拢
    ctx.save();
    ctx.translate(-12, -28);
    ctx.rotate(-0.6);
    drawArm(ctx, color, 22, -0.2);
    ctx.restore();
    
    // 双手前刺
    ctx.save();
    ctx.translate(8 - pullBack + thrustDist * 0.3, -38);
    ctx.rotate(0.1);
    
    // 主手
    drawArm(ctx, color, 30 + thrustDist * 0.4, 0.1);
    
    // 武器前刺
    ctx.save();
    ctx.translate(28 + thrustDist, 0);
    ctx.rotate(0);
    drawFabao(ctx, ch.fabao, ch.getColor(), 1.2);
    ctx.restore();
    
    // 刺击特效
    if (progress > 0.3 && progress < 0.8) {
        drawThrustTrail(ctx, color, progress, thrustDist);
    }
    
    ctx.restore();
}

// 攻击3: 横扫 - 大范围横扫
function drawSweepAttack(ctx, ch, color, progress) {
    const sweepAngle = -2 + progress * 4.5;
    const crouch = Math.sin(progress * Math.PI) * 8;
    
    ctx.save();
    ctx.translate(0, crouch);
    
    // 后手平衡
    ctx.save();
    ctx.translate(-18, -25);
    ctx.rotate(-1 - progress * 0.5);
    drawArm(ctx, color, 28, -0.3);
    ctx.restore();
    
    // 攻击手 - 低姿横扫
    ctx.save();
    ctx.translate(5, -28 + crouch * 0.5);
    ctx.rotate(sweepAngle);
    drawArm(ctx, color, 38, 0.4);
    
    ctx.save();
    ctx.translate(36, 0);
    ctx.rotate(0.3);
    drawFabao(ctx, ch.fabao, ch.getColor(), 1.4);
    ctx.restore();
    
    // 大范围扫击波
    if (progress > 0.15 && progress < 0.85) {
        drawSweepWave(ctx, color, progress);
    }
    
    ctx.restore();
    ctx.restore();
}

// 攻击4: 旋转斩 - 360度旋转攻击
function drawSpinAttack(ctx, ch, color, time, progress) {
    const spinAngle = progress * Math.PI * 2.5;
    const liftHeight = Math.sin(progress * Math.PI) * 15;
    
    ctx.save();
    ctx.translate(0, -liftHeight);
    ctx.rotate(Math.sin(spinAngle) * 0.2);
    
    // 双手向外展开
    const armAngle = spinAngle + time * 2;
    
    // 左手
    ctx.save();
    ctx.translate(-5, -35);
    ctx.rotate(-Math.PI/2 + Math.sin(armAngle) * 0.5);
    drawArm(ctx, color, 32, 0);
    ctx.restore();
    
    // 右手持武器
    ctx.save();
    ctx.translate(5, -35);
    ctx.rotate(Math.PI/2 + Math.cos(armAngle) * 0.5);
    drawArm(ctx, color, 35, 0);
    
    ctx.save();
    ctx.translate(33, 0);
    ctx.rotate(spinAngle * 0.5);
    drawFabao(ctx, ch.fabao, ch.getColor(), 1.3);
    ctx.restore();
    ctx.restore();
    
    // 旋转光环
    drawSpinEffect(ctx, color, progress, spinAngle);
    
    ctx.restore();
}

// 攻击5: 重击 - 蓄力下动
function drawHeavyAttack(ctx, ch, color, progress) {
    const prepPhase = progress < 0.4 ? progress / 0.4 : 1;
    const strikePhase = progress >= 0.4 ? (progress - 0.4) / 0.6 : 0;
    const raiseHeight = prepPhase * 25;
    const strikeDown = strikePhase * 40;
    const bodyLean = Math.sin(strikePhase * Math.PI) * 0.3;
    
    ctx.save();
    ctx.rotate(bodyLean);
    
    // 双手举起后砍下
    ctx.save();
    ctx.translate(0, -40 - raiseHeight + strikeDown);
    
    const armAngle = prepPhase * -2 + strikePhase * 3.5;
    
    // 左手
    ctx.save();
    ctx.translate(-8, 0);
    ctx.rotate(armAngle - 0.3);
    drawArm(ctx, color, 30, -0.2);
    ctx.restore();
    
    // 右手
    ctx.save();
    ctx.translate(8, 0);
    ctx.rotate(armAngle + 0.3);
    drawArm(ctx, color, 30, 0.2);
    
    ctx.save();
    ctx.translate(28, 0);
    ctx.rotate(armAngle * 0.3);
    drawFabao(ctx, ch.fabao, ch.getColor(), 1.5);
    ctx.restore();
    ctx.restore();
    
    ctx.restore();
    
    // 重击特效
    if (strikePhase > 0.5) {
        drawHeavyImpact(ctx, color, strikePhase);
    }
    
    ctx.restore();
}

// 空中攻击
function drawAerialAttack(ctx, ch, color, time, progress) {
    const spinAngle = progress * Math.PI * 1.5;
    const dive = progress > 0.5 ? (progress - 0.5) * 2 : 0;
    
    ctx.save();
    ctx.rotate(spinAngle * 0.3);
    
    // 飞踢姿态
    ctx.save();
    ctx.translate(0, -35);
    ctx.rotate(-0.5 + dive);
    
    // 双手向后
    ctx.save();
    ctx.translate(-10, 0);
    ctx.rotate(-1.5 - dive);
    drawArm(ctx, color, 28, -0.3);
    ctx.restore();
    
    ctx.save();
    ctx.translate(10, 0);
    ctx.rotate(-1 - dive * 0.5);
    drawArm(ctx, color, 30, 0.2);
    
    ctx.save();
    ctx.translate(28, 0);
    ctx.rotate(-dive);
    drawFabao(ctx, ch.fabao, ch.getColor(), 1.2);
    ctx.restore();
    ctx.restore();
    
    ctx.restore();
    
    // 空中拖尾
    drawAerialTrail(ctx, color, progress);
    
    ctx.restore();
}

// 终极大招攻击
function drawUltimateAttack(ctx, ch, color, time, progress) {
    const burstPhase = progress < 0.3 ? progress / 0.3 : 1;
    const attackPhase = progress >= 0.3 ? (progress - 0.3) / 0.7 : 0;
    const auraSize = 40 + burstPhase * 60;
    
    // 爆发光环
    ctx.save();
    ctx.globalAlpha = 0.6;
    const gradient = ctx.createRadialGradient(0, -35, 0, 0, -35, auraSize);
    gradient.addColorStop(0, '#ffffff');
    gradient.addColorStop(0.3, color);
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(0, -35, auraSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
    
    // 旋转多重攻击
    const numStrikes = 6;
    for (let i = 0; i < numStrikes; i++) {
        const strikeAngle = (i / numStrikes) * Math.PI * 2 + attackPhase * Math.PI * 4;
        const strikeProgress = (attackPhase * numStrikes - i) % 1;
        
        if (strikeProgress > 0 && strikeProgress < 0.5) {
            ctx.save();
            ctx.rotate(strikeAngle);
            ctx.translate(50, 0);
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.shadowColor = color;
            ctx.shadowBlur = 15;
            ctx.globalAlpha = 1 - strikeProgress * 2;
            ctx.beginPath();
            ctx.moveTo(0, -20);
            ctx.lineTo(40, 0);
            ctx.lineTo(0, 20);
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
            
            ctx.restore();
        }
    }
    
    // 中心姿态 - 御剑飞仙
    ctx.save();
    ctx.translate(0, -35);
    ctx.rotate(time * 3);
    
    // 双手结印
    ctx.save();
    ctx.translate(-15, 0);
    ctx.rotate(-0.8);
    drawArm(ctx, color, 25, -0.3);
    ctx.restore();
    
    ctx.save();
    ctx.translate(15, 0);
    ctx.rotate(0.8);
    drawArm(ctx, color, 25, 0.3);
    ctx.restore();
    
    // 武器绕身旋转
    for (let i = 0; i < 3; i++) {
        const angle = (i / 3) * Math.PI * 2 + time * 5;
        ctx.save();
        ctx.rotate(angle);
        ctx.translate(35, 0);
        ctx.rotate(angle * 2);
        drawFabao(ctx, ch.fabao, color, 0.8);
        ctx.restore();
    }
    
    ctx.restore();
}

// === 攻击特效绘制函数 ===

// 斩击轨迹
function drawSlashTrail(ctx, color, progress, angle, radius) {
    const intensity = Math.sin(progress * Math.PI);
    ctx.save();
    ctx.globalAlpha = intensity * 0.8;
    
    // 多层剑气
    for (let i = 0; i < 3; i++) {
        const r = radius - i * 15;
        const width = 8 - i * 2;
        
        const grad = ctx.createLinearGradient(-r, 0, r, 0);
        grad.addColorStop(0, 'transparent');
        grad.addColorStop(0.3, color);
        grad.addColorStop(0.7, '#ffffff');
        grad.addColorStop(1, 'transparent');
        
        ctx.strokeStyle = grad;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(0, 0, r, angle - 1.2, angle + 0.3);
        ctx.stroke();
    }
    
    ctx.shadowBlur = 0;
    ctx.restore();
}

// 突刺轨迹
function drawThrustTrail(ctx, color, progress, distance) {
    const intensity = Math.sin(progress * Math.PI);
    ctx.save();
    ctx.globalAlpha = intensity * 0.7;
    
    // 突刺光束
    const grad = ctx.createLinearGradient(0, 0, distance + 50, 0);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(0.2, color + '88');
    grad.addColorStop(0.8, '#ffffff');
    grad.addColorStop(1, color);
    
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(20, -8);
    ctx.lineTo(distance + 60, -3);
    ctx.lineTo(distance + 80, 0);
    ctx.lineTo(distance + 60, 3);
    ctx.lineTo(20, 8);
    ctx.closePath();
    ctx.fill();
    
    // 尖端光芒
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(distance + 70, 0, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    ctx.restore();
}

// 扫击波
function drawSweepWave(ctx, color, progress) {
    const intensity = Math.sin(progress * Math.PI);
    const waveRadius = 30 + progress * 80;
    
    ctx.save();
    ctx.globalAlpha = intensity * 0.6;
    
    // 地面冲击波
    ctx.strokeStyle = color;
    ctx.lineWidth = 6;
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.ellipse(0, 20, waveRadius, 15, 0, 0, Math.PI);
    ctx.stroke();
    
    // 内层
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 20, waveRadius * 0.7, 10, 0, 0, Math.PI);
    ctx.stroke();
    
    ctx.shadowBlur = 0;
    ctx.restore();
}

// 旋转特效
function drawSpinEffect(ctx, color, progress, angle) {
    const intensity = Math.sin(progress * Math.PI);
    
    ctx.save();
    ctx.globalAlpha = intensity * 0.5;
    
    // 旋转光环
    for (let i = 0; i < 8; i++) {
        const trailAngle = angle - i * 0.3;
        const trailAlpha = 1 - i * 0.12;
        const r = 50 + Math.sin(angle * 2 + i) * 10;
        
        ctx.strokeStyle = color;
        ctx.lineWidth = 4 - i * 0.4;
        ctx.globalAlpha = intensity * trailAlpha * 0.4;
        ctx.beginPath();
        ctx.arc(0, -20, r, trailAngle - 0.5, trailAngle + 0.2);
        ctx.stroke();
    }
    
    // 中心光球
    ctx.globalAlpha = intensity * 0.8;
    const grad = ctx.createRadialGradient(0, -20, 0, 0, -20, 30);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.5, color);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, -20, 30, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
}

// 重击特效
function drawHeavyImpact(ctx, color, progress) {
    const intensity = 1 - progress;
    const impactSize = progress * 100;
    
    ctx.save();
    ctx.globalAlpha = intensity * 0.7;
    ctx.translate(0, 30);
    
    // 冲击波
    ctx.strokeStyle = color;
    ctx.lineWidth = 5;
    ctx.shadowColor = color;
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.ellipse(0, 0, impactSize, impactSize * 0.3, 0, 0, Math.PI * 2);
    ctx.stroke();
    
    // 裂纹
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const len = impactSize * 0.8;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(angle) * len, Math.sin(angle) * len * 0.3);
        ctx.stroke();
    }
    
    // 碎石飞溅
    ctx.fillStyle = '#888';
    for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2 + progress * 2;
        const dist = impactSize * 0.6 * (0.5 + Math.random() * 0.5);
        const size = 3 + Math.random() * 4;
        const x = Math.cos(angle) * dist;
        const y = Math.sin(angle) * dist * 0.3 - progress * 30;
        ctx.beginPath();
        ctx.arc(x, y, size * intensity, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.shadowBlur = 0;
    ctx.restore();
}

// 空中拖尾
function drawAerialTrail(ctx, color, progress) {
    ctx.save();
    
    for (let i = 0; i < 6; i++) {
        const trailAlpha = (1 - i * 0.15) * (1 - progress * 0.5);
        ctx.globalAlpha = trailAlpha * 0.4;
        ctx.fillStyle = color;
        
        const offsetX = -i * 8;
        const offsetY = i * 5;
        const scale = 1 - i * 0.1;
        
        ctx.beginPath();
        ctx.ellipse(offsetX, -35 + offsetY, 15 * scale, 25 * scale, progress * 0.5, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.restore();
}

// 绘制单个手臂
function drawArm(ctx, color, length, bend) {
    ctx.fillStyle = color;
    ctx.beginPath();
    
    // 上臂
    ctx.moveTo(-3, 0);
    ctx.quadraticCurveTo(
        -4 + bend * 10, length * 0.4,
        -2 + bend * 8, length * 0.55
    );
    
    // 下臂到手
    ctx.quadraticCurveTo(
        bend * 5, length * 0.75,
        2, length
    );
    
    // 袖口
    ctx.lineTo(6, length - 3);
    ctx.quadraticCurveTo(4, length * 0.7, 4, length * 0.5);
    ctx.quadraticCurveTo(5 + bend * 5, length * 0.3, 3, 0);
    
    ctx.closePath();
    ctx.fill();
    
    // 袖口飘逸
    ctx.strokeStyle = shadeColor(color, 15);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-2, length - 5);
    ctx.quadraticCurveTo(2, length + 8, 6, length - 5);
    ctx.stroke();
}

// 绘制头部和发型
function drawHeadAndHair(ctx, color, time, windSway, isFemale, isMoving, vx) {
    const headY = -58;
    const headR = isFemale ? 9 : 10;
    const hairFlow = windSway + (isMoving ? -vx * 2 : 0);
    
    // 头发底层 - 飘逸长发
    ctx.fillStyle = shadeColor(color, -40);
    ctx.beginPath();
    
    if (isFemale) {
        // 女性 - 长发飘飘
        ctx.moveTo(-headR - 2, headY - 5);
        // 左侧长发
        ctx.quadraticCurveTo(
            -headR - 8 + hairFlow * 0.5, headY + 20,
            -headR - 12 + hairFlow, headY + 50
        );
        ctx.quadraticCurveTo(
            -headR - 5 + hairFlow * 0.3, headY + 35,
            -headR + 2, headY + 15
        );
        // 后脑
        ctx.lineTo(headR - 2, headY + 15);
        // 右侧长发
        ctx.quadraticCurveTo(
            headR + 5 - hairFlow * 0.3, headY + 35,
            headR + 10 - hairFlow * 0.8, headY + 45
        );
        ctx.quadraticCurveTo(
            headR + 6 - hairFlow * 0.5, headY + 20,
            headR + 2, headY - 5
        );
    } else {
        // 男性 - 束发飘带
        ctx.moveTo(-headR, headY - 3);
        ctx.quadraticCurveTo(-headR - 3 + hairFlow * 0.3, headY + 10, -headR - 5 + hairFlow * 0.5, headY + 25);
        ctx.lineTo(-headR + 5, headY + 10);
        ctx.lineTo(headR - 5, headY + 10);
        ctx.lineTo(headR + 5 - hairFlow * 0.5, headY + 25);
        ctx.quadraticCurveTo(headR + 3 - hairFlow * 0.3, headY + 10, headR, headY - 3);
    }
    
    ctx.closePath();
    ctx.fill();
    
    // 头部剪影
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(0, headY, headR, 0, Math.PI * 2);
    ctx.fill();
    
    // 发髻/头冠
    ctx.fillStyle = shadeColor(color, -30);
    if (isFemale) {
        // 女性发髻
        ctx.beginPath();
        ctx.ellipse(0, headY - headR - 3, 6, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // 发簪
        ctx.fillStyle = '#ffd700';
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.moveTo(-1, headY - headR - 12);
        ctx.lineTo(0, headY - headR - 20);
        ctx.lineTo(1, headY - headR - 12);
        ctx.fill();
        
        // 簪花
        ctx.beginPath();
        ctx.arc(-4, headY - headR - 8, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // 飘带
        ctx.strokeStyle = '#ff6688';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(4, headY - headR - 5);
        ctx.quadraticCurveTo(
            10 + hairFlow, headY - headR + 15,
            8 + hairFlow * 1.5, headY - headR + 35
        );
        ctx.stroke();
    } else {
        // 男性发冠
        ctx.beginPath();
        ctx.moveTo(-5, headY - headR);
        ctx.lineTo(0, headY - headR - 12);
        ctx.lineTo(5, headY - headR);
        ctx.closePath();
        ctx.fill();
        
        // 发带飘动
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, headY - headR - 10);
        ctx.quadraticCurveTo(
            -15 + hairFlow, headY - headR + 5,
            -25 + hairFlow * 2, headY - headR + 20
        );
        ctx.stroke();
        
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, headY - headR - 8);
        ctx.quadraticCurveTo(
            -12 + hairFlow * 0.8, headY - headR + 8,
            -20 + hairFlow * 1.5, headY - headR + 28
        );
        ctx.stroke();
    }
}

// 绘制飘带
function drawFlowingRibbon(ctx, color, time, windSway, isMoving, vx, layer) {
    const ribbonColor = layer > 0 ? shadeColor(color, 20) : shadeColor(color, -20);
    const baseX = layer > 0 ? 8 : -10;
    const speed = isMoving ? 4 : 2;
    const amplitude = isMoving ? 20 : 8;
    const flowOffset = -vx * 3 * layer;
    
    ctx.strokeStyle = ribbonColor;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.8;
    
    ctx.beginPath();
    ctx.moveTo(baseX, -25);
    
    // 飘带曲线
    const points = 8;
    for (let i = 1; i <= points; i++) {
        const t = i / points;
        const wave = Math.sin(time * speed + t * 3 + layer) * amplitude * t;
        const x = baseX + wave + flowOffset * t;
        const y = -25 + t * 60;
        
        if (i === 1) {
            ctx.quadraticCurveTo(baseX + wave * 0.3, -25 + 15, x, y);
        } else {
            ctx.lineTo(x, y);
        }
    }
    
    ctx.stroke();
    ctx.globalAlpha = 1;
}

// 绘制神通光环
function drawDivineAura(ctx, color, time) {
    // 仙气光环
    for (let i = 0; i < 3; i++) {
        const r = 50 + i * 20 + Math.sin(time * 3 + i) * 10;
        const gradient = ctx.createRadialGradient(0, -35, r * 0.3, 0, -35, r);
        gradient.addColorStop(0, color + '44');
        gradient.addColorStop(0.5, color + '22');
        gradient.addColorStop(1, 'transparent');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, -35, r, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // 环绕光点
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2 + time * 2;
        const r = 45 + Math.sin(time * 4 + i) * 10;
        const x = Math.cos(angle) * r;
        const y = -35 + Math.sin(angle) * r * 0.4;
        const size = 2 + Math.sin(time * 5 + i) * 1;
        
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
    }
}

// 绘制防御结界
function drawDefenseBarrier(ctx, color, time) {
    ctx.save();
    
    // 八卦护盾
    const r = 40;
    ctx.strokeStyle = '#88ccff';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#88ccff';
    ctx.shadowBlur = 20;
    
    // 外圈
    ctx.beginPath();
    ctx.arc(0, -30, r, 0, Math.PI * 2);
    ctx.stroke();
    
    // 内部八卦纹
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.6;
    for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2 + time;
        ctx.beginPath();
        ctx.moveTo(0, -30);
        ctx.lineTo(Math.cos(angle) * r, -30 + Math.sin(angle) * r);
        ctx.stroke();
    }
    
    // 太极图案
    ctx.fillStyle = '#88ccff';
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.arc(0, -30, r * 0.3, 0, Math.PI, true);
    ctx.arc(0, -30 + r * 0.15, r * 0.15, Math.PI, 0, true);
    ctx.arc(0, -30 - r * 0.15, r * 0.15, Math.PI, 0, false);
    ctx.fill();
    
    ctx.restore();
}

// 绘制角色UI
function drawCharacterUI(ctx, ch, sx, sy, color) {
    const barWidth = 55;
    const barY = sy - 100;
    const healthPercent = ch.blood / ch.maxBlood;
    const shenTongPercent = ch.shenTong / ch.shenTongMax;
    
    // 血条背景
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(ctx, sx - barWidth/2 - 3, barY - 3, barWidth + 6, 10, 5);
    ctx.fill();
    
    // 血条
    const healthColor = healthPercent > 0.5 ? '#44ff88' : (healthPercent > 0.25 ? '#ffaa00' : '#ff4444');
    const healthGradient = ctx.createLinearGradient(sx - barWidth/2, 0, sx + barWidth/2, 0);
    healthGradient.addColorStop(0, healthColor);
    healthGradient.addColorStop(1, shadeColor(healthColor, -20));
    
    ctx.fillStyle = healthGradient;
    ctx.shadowColor = healthColor;
    ctx.shadowBlur = 8;
    roundRect(ctx, sx - barWidth/2, barY, barWidth * healthPercent, 4, 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    // 神通条
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(ctx, sx - barWidth/2 - 3, barY + 8, barWidth + 6, 6, 3);
    ctx.fill();
    
    const stGradient = ctx.createLinearGradient(sx - barWidth/2, 0, sx + barWidth/2, 0);
    stGradient.addColorStop(0, '#aa66ff');
    stGradient.addColorStop(1, '#ff66aa');
    
    ctx.fillStyle = stGradient;
    ctx.shadowColor = '#aa66ff';
    ctx.shadowBlur = 6;
    roundRect(ctx, sx - barWidth/2, barY + 10, barWidth * shenTongPercent, 2, 1);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    // 名字
    ctx.font = 'bold 13px Microsoft YaHei';
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 6;
    ctx.fillText(ch.name, sx, barY - 10);
    
    // 境界小字
    ctx.font = '10px Microsoft YaHei';
    ctx.fillStyle = '#aaa';
    ctx.fillText(ch.realm, sx, barY - 22);
    ctx.shadowBlur = 0;
}

function shadeColor(color, percent) {
    const num = parseInt(color.replace('#', ''), 16);
    const amt = Math.round(2.55 * percent);
    const R = Math.max(0, Math.min(255, (num >> 16) + amt));
    const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
    const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
    return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
}

// ========== 绘制法宝 - 飘逸仙器风格 ==========
function drawFabao(ctx, fabao, color, scale = 1) {
    const cat = fabaoCategory(fabao);
    const time = Date.now() * 0.001;
    
    ctx.save();
    ctx.scale(scale, scale);
    
    // 法宝光芒
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    
    switch(cat) {
        case 'sword':
            drawElegantSword(ctx, color, time);
            break;
        case 'spear':
            drawElegantSpear(ctx, color, time);
            break;
        case 'whip':
            drawElegantWhip(ctx, color, time);
            break;
        case 'banner':
            drawElegantBanner(ctx, color, time);
            break;
        case 'ring':
            drawElegantRing(ctx, color, time);
            break;
        case 'pagoda':
            drawElegantPagoda(ctx, color, time);
            break;
        case 'fan':
            drawElegantFan(ctx, color, time);
            break;
        case 'pearl':
            drawElegantPearl(ctx, color, time);
            break;
        case 'ribbon':
            drawElegantRibbon(ctx, color, time);
            break;
        case 'wheel':
            drawElegantWheel(ctx, color, time);
            break;
        case 'blade':
            drawElegantBlade(ctx, color, time);
            break;
        case 'bow':
        case 'arrow':
            drawElegantBow(ctx, color, time);
            break;
        case 'halberd':
            drawElegantHalberd(ctx, color, time);
            break;
        case 'hammer':
            drawElegantHammer(ctx, color, time);
            break;
        case 'staff':
            drawElegantStaff(ctx, color, time);
            break;
        default:
            drawElegantSword(ctx, color, time);
    }
    
    ctx.shadowBlur = 0;
    ctx.restore();
}

// 飘逸仙剑
function drawElegantSword(ctx, color, time) {
    const glow = Math.sin(time * 3) * 0.2 + 0.8;
    
    // 剑身渐变
    const bladeGrad = ctx.createLinearGradient(0, 0, 55, 0);
    bladeGrad.addColorStop(0, '#e8e8e8');
    bladeGrad.addColorStop(0.4, '#ffffff');
    bladeGrad.addColorStop(0.6, '#c0e0ff');
    bladeGrad.addColorStop(1, '#88ccff');
    
    // 剑身
    ctx.fillStyle = bladeGrad;
    ctx.beginPath();
    ctx.moveTo(8, 0);
    ctx.lineTo(52, -2);
    ctx.lineTo(58, 0);
    ctx.lineTo(52, 2);
    ctx.lineTo(8, 0);
    ctx.closePath();
    ctx.fill();
    
    // 剑脊高光
    ctx.strokeStyle = `rgba(255,255,255,${glow})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(55, 0);
    ctx.stroke();
    
    // 剑格 - 精致
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.ellipse(6, 0, 3, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // 剑格装饰
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.arc(6, 0, 2, 0, Math.PI * 2);
    ctx.fill();
    
    // 剑柄
    const handleGrad = ctx.createLinearGradient(-12, 0, 6, 0);
    handleGrad.addColorStop(0, '#4a3020');
    handleGrad.addColorStop(0.5, '#8b6040');
    handleGrad.addColorStop(1, '#4a3020');
    ctx.fillStyle = handleGrad;
    ctx.fillRect(-12, -3, 18, 6);
    
    // 剑穗
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(-12, 0, 4, 0, Math.PI * 2);
    ctx.fill();
    
    // 剑穗飘带
    ctx.strokeStyle = '#ff6666';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.quadraticCurveTo(-20 + Math.sin(time * 4) * 5, 15, -25 + Math.sin(time * 3) * 8, 30);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.quadraticCurveTo(-22 + Math.sin(time * 4 + 1) * 4, 12, -28 + Math.sin(time * 3 + 1) * 6, 25);
    ctx.stroke();
}

// 飘逸长枪
function drawElegantSpear(ctx, color, time) {
    // 枪杆
    const shaftGrad = ctx.createLinearGradient(-25, 0, 65, 0);
    shaftGrad.addColorStop(0, '#3a2010');
    shaftGrad.addColorStop(0.5, '#6b4020');
    shaftGrad.addColorStop(1, '#3a2010');
    ctx.strokeStyle = shaftGrad;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-25, 0);
    ctx.lineTo(55, 0);
    ctx.stroke();
    
    // 枪头 - 亮银
    const tipGrad = ctx.createLinearGradient(55, -10, 75, 10);
    tipGrad.addColorStop(0, '#e0e0e0');
    tipGrad.addColorStop(0.5, '#ffffff');
    tipGrad.addColorStop(1, '#b0b0b0');
    ctx.fillStyle = tipGrad;
    ctx.beginPath();
    ctx.moveTo(55, -6);
    ctx.lineTo(75, 0);
    ctx.lineTo(55, 6);
    ctx.quadraticCurveTo(58, 0, 55, -6);
    ctx.fill();
    
    // 枪头高光
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(56, -3);
    ctx.lineTo(72, 0);
    ctx.stroke();
    
    // 红缨 - 飘逸
    ctx.strokeStyle = '#ff3333';
    ctx.lineWidth = 3;
    const tassleX = 50;
    for (let i = 0; i < 6; i++) {
        const offset = (i - 2.5) * 3;
        ctx.beginPath();
        ctx.moveTo(tassleX, 0);
        ctx.quadraticCurveTo(
            tassleX - 10 + Math.sin(time * 5 + i) * 5, 
            offset + 12,
            tassleX - 20 + Math.sin(time * 4 + i) * 10, 
            offset + 25
        );
        ctx.stroke();
    }
}

// 飘逸钢鞭
function drawElegantWhip(ctx, color, time) {
    // 鞭身 - 波浪形
    ctx.strokeStyle = '#404040';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    for (let i = 1; i <= 10; i++) {
        const t = i / 10;
        const x = t * 60;
        const y = Math.sin(t * 4 + time * 6) * (6 + t * 4);
        ctx.lineTo(x, y);
    }
    ctx.stroke();
    
    // 鞭身高光
    ctx.strokeStyle = '#808080';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(2, -1);
    for (let i = 1; i <= 10; i++) {
        const t = i / 10;
        const x = t * 60;
        const y = Math.sin(t * 4 + time * 6) * (6 + t * 4) - 2;
        ctx.lineTo(x, y);
    }
    ctx.stroke();
    
    // 鞭把
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.ellipse(-5, 0, 6, 4, 0, 0, Math.PI * 2);
    ctx.fill();
}

// 飘逸幡旗
function drawElegantBanner(ctx, color, time) {
    // 旗杆
    ctx.strokeStyle = '#8b6040';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 15);
    ctx.lineTo(0, -35);
    ctx.stroke();
    
    // 旗帜 - 飘动
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, -35);
    const waveAmp = 8 + Math.sin(time * 3) * 3;
    ctx.quadraticCurveTo(20 + waveAmp, -30 + Math.sin(time * 4) * 3, 35 + waveAmp, -25);
    ctx.quadraticCurveTo(40 + waveAmp * 0.5, -15, 35 + waveAmp * 0.3, -5);
    ctx.quadraticCurveTo(20, 0 + Math.sin(time * 4 + 1) * 2, 0, 5);
    ctx.closePath();
    ctx.fill();
    
    // 旗帜纹理
    ctx.strokeStyle = shadeColor(color, 30);
    ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(3, -30 + i * 12);
        ctx.quadraticCurveTo(20 + waveAmp * 0.5, -28 + i * 12, 30 + waveAmp * 0.3, -25 + i * 12);
        ctx.stroke();
    }
    
    // 旗尖
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(-3, -38);
    ctx.lineTo(0, -48);
    ctx.lineTo(3, -38);
    ctx.closePath();
    ctx.fill();
}

// 飘逸干坤圈
function drawElegantRing(ctx, color, time) {
    const glow = Math.sin(time * 4) * 0.3 + 0.7;
    
    // 外圈
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 4;
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 15 * glow;
    ctx.beginPath();
    ctx.arc(25, 0, 18, 0, Math.PI * 2);
    ctx.stroke();
    
    // 内纹
    ctx.strokeStyle = '#ffee88';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(25, 0, 14, 0, Math.PI * 2);
    ctx.stroke();
    
    // 旋转符文
    ctx.strokeStyle = `rgba(255, 215, 0, ${glow})`;
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2 + time * 2;
        ctx.beginPath();
        ctx.arc(25, 0, 16, angle, angle + 0.3);
        ctx.stroke();
    }
}

// 飘逸玲珑塔
function drawElegantPagoda(ctx, color, time) {
    const float = Math.sin(time * 2) * 2;
    
    ctx.save();
    ctx.translate(15, float);
    
    // 塔身
    for (let i = 0; i < 5; i++) {
        const w = 22 - i * 4;
        const h = 10;
        const y = -i * 12;
        
        const tierGrad = ctx.createLinearGradient(-w/2, y, w/2, y + h);
        tierGrad.addColorStop(0, '#ffd700');
        tierGrad.addColorStop(0.5, '#ffee88');
        tierGrad.addColorStop(1, '#cc9900');
        
        ctx.fillStyle = tierGrad;
        ctx.beginPath();
        ctx.moveTo(-w/2, y);
        ctx.lineTo(-w/2 - 3, y + h);
        ctx.lineTo(w/2 + 3, y + h);
        ctx.lineTo(w/2, y);
        ctx.closePath();
        ctx.fill();
    }
    
    // 塔顶
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.moveTo(0, -60);
    ctx.lineTo(5, -50);
    ctx.lineTo(-5, -50);
    ctx.closePath();
    ctx.fill();
    
    // 塔光
    ctx.fillStyle = `rgba(255, 255, 200, ${0.3 + Math.sin(time * 5) * 0.2})`;
    ctx.beginPath();
    ctx.arc(0, -30, 30, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
}

// 飘逸羽扇
function drawElegantFan(ctx, color, time) {
    const spread = 0.9; // 扇子张开角度
    
    // 扇面
    const fanGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, 38);
    fanGrad.addColorStop(0, shadeColor(color, 20));
    fanGrad.addColorStop(0.7, color);
    fanGrad.addColorStop(1, shadeColor(color, -20));
    
    ctx.fillStyle = fanGrad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, 38, -spread, spread);
    ctx.closePath();
    ctx.fill();
    
    // 扇骨 - 精致
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 1.5;
    for (let i = -4; i <= 4; i++) {
        const angle = i * spread / 4;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(angle) * 36, Math.sin(angle) * 36);
        ctx.stroke();
    }
    
    // 扇边
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 38, -spread, spread);
    ctx.stroke();
    
    // 扇柄
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(-2, -5, 4, 12);
    
    // 扇坠
    ctx.strokeStyle = '#ff6666';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.quadraticCurveTo(5 + Math.sin(time * 4) * 3, 18, 3 + Math.sin(time * 3) * 5, 28);
    ctx.stroke();
}

// 飘逸宝珠
function drawElegantPearl(ctx, color, time) {
    const pulse = Math.sin(time * 3) * 0.15 + 1;
    const r = 14 * pulse;
    
    // 外光
    const outerGlow = ctx.createRadialGradient(22, 0, r * 0.5, 22, 0, r * 2);
    outerGlow.addColorStop(0, color + '44');
    outerGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = outerGlow;
    ctx.beginPath();
    ctx.arc(22, 0, r * 2, 0, Math.PI * 2);
    ctx.fill();
    
    // 珠体
    const pearlGrad = ctx.createRadialGradient(18, -4, 0, 22, 0, r);
    pearlGrad.addColorStop(0, '#ffffff');
    pearlGrad.addColorStop(0.3, '#ffffee');
    pearlGrad.addColorStop(0.7, color);
    pearlGrad.addColorStop(1, shadeColor(color, -30));
    
    ctx.fillStyle = pearlGrad;
    ctx.beginPath();
    ctx.arc(22, 0, r, 0, Math.PI * 2);
    ctx.fill();
    
    // 高光点
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(18, -5, 4, 0, Math.PI * 2);
    ctx.fill();
    
    // 环绕光点
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2 + time * 2;
        const orbitR = r + 8;
        const x = 22 + Math.cos(angle) * orbitR;
        const y = Math.sin(angle) * orbitR * 0.5;
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

// 飘逸缩地 / 飘带
function drawElegantRibbon(ctx, color, time) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    
    ctx.beginPath();
    ctx.moveTo(0, 0);
    for (let i = 1; i <= 12; i++) {
        const t = i / 12;
        const x = t * 50;
        const y = Math.sin(t * 6 + time * 5) * 15 * t;
        ctx.lineTo(x, y);
    }
    ctx.stroke();
    
    // 高光
    ctx.strokeStyle = shadeColor(color, 40);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(2, -1);
    for (let i = 1; i <= 12; i++) {
        const t = i / 12;
        const x = t * 50;
        const y = Math.sin(t * 6 + time * 5) * 15 * t - 2;
        ctx.lineTo(x, y);
    }
    ctx.stroke();
}

// 飘逸风火轮
function drawElegantWheel(ctx, color, time) {
    const spin = time * 8;
    
    ctx.save();
    ctx.translate(20, 0);
    ctx.rotate(spin);
    
    // 火焰光环
    const fireGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, 20);
    fireGrad.addColorStop(0, '#ffff00');
    fireGrad.addColorStop(0.5, '#ff6600');
    fireGrad.addColorStop(1, '#ff000044');
    ctx.fillStyle = fireGrad;
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.fill();
    
    // 轮辐
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(angle) * 15, Math.sin(angle) * 15);
        ctx.stroke();
    }
    
    // 中心
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
    
    // 火焰拖尾
    ctx.fillStyle = '#ff660066';
    for (let i = 0; i < 8; i++) {
        const trail = (spin - i * 0.3) % (Math.PI * 2);
        const x = 20 + Math.cos(trail) * 15;
        const y = Math.sin(trail) * 15;
        ctx.beginPath();
        ctx.arc(x, y, 4 - i * 0.4, 0, Math.PI * 2);
        ctx.fill();
    }
}

// 飘逸三尖两刃刀 / 大刀
function drawElegantBlade(ctx, color, time) {
    const glow = Math.sin(time * 3) * 0.2 + 0.8;
    
    // 刀杆
    const shaftGrad = ctx.createLinearGradient(-20, 0, 20, 0);
    shaftGrad.addColorStop(0, '#3a2010');
    shaftGrad.addColorStop(0.5, '#6b4020');
    shaftGrad.addColorStop(1, '#3a2010');
    ctx.strokeStyle = shaftGrad;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-25, 0);
    ctx.lineTo(15, 0);
    ctx.stroke();
    
    // 三尖刀头 - 独特造型
    const bladeGrad = ctx.createLinearGradient(15, -20, 70, 20);
    bladeGrad.addColorStop(0, '#c0c0c0');
    bladeGrad.addColorStop(0.3, '#ffffff');
    bladeGrad.addColorStop(0.7, '#e0e0e0');
    bladeGrad.addColorStop(1, '#a0a0a0');
    
    ctx.fillStyle = bladeGrad;
    ctx.beginPath();

// ========== 绘制背景 ==========
function drawBackground(ctx) {
    // 渐变天空
    const skyGradient = ctx.createLinearGradient(0, 0, 0, SCREEN_HEIGHT);
    skyGradient.addColorStop(0, '#0a0a2e');
    skyGradient.addColorStop(0.3, '#1a1a4e');
    skyGradient.addColorStop(0.6, '#2a1a3e');
    skyGradient.addColorStop(1, '#1a0a1e');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
    
    // 星星
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 80; i++) {
        const x = (i * 137 + Date.now() * 0.001) % SCREEN_WIDTH;
        const y = (i * 89) % (SCREEN_HEIGHT - 150);
        const size = 0.5 + (i % 3) * 0.5;
        const alpha = 0.3 + Math.sin(Date.now() * 0.002 + i) * 0.3;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // 云雾
    for (let i = 0; i < 5; i++) {
        const x = ((Date.now() * 0.01 + i * 250) % (SCREEN_WIDTH + 200)) - 100;
        const y = 80 + i * 60;
        const gradient = ctx.createRadialGradient(x, y, 0, x, y, 80);
        gradient.addColorStop(0, 'rgba(100, 80, 120, 0.15)');
        gradient.addColorStop(1, 'transparent');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.ellipse(x, y, 120, 40, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // 远山
    ctx.fillStyle = '#1a1a3e';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for (let x = 0; x <= SCREEN_WIDTH; x += 50) {
        const h = 80 + Math.sin(x * 0.01) * 40 + Math.sin(x * 0.02) * 20;
        ctx.lineTo(x, GROUND_Y - h);
    }
    ctx.lineTo(SCREEN_WIDTH, GROUND_Y);
    ctx.closePath();
    ctx.fill();
    
    // 地面
    const groundGradient = ctx.createLinearGradient(0, GROUND_Y, 0, SCREEN_HEIGHT);
    groundGradient.addColorStop(0, '#2a2a4a');
    groundGradient.addColorStop(1, '#1a1a2a');
    ctx.fillStyle = groundGradient;
    ctx.fillRect(0, GROUND_Y, SCREEN_WIDTH, SCREEN_HEIGHT - GROUND_Y);
    
    // 地面纹理
    ctx.strokeStyle = '#3a3a5a';
    ctx.lineWidth = 1;
    for (let x = 0; x < SCREEN_WIDTH; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y);
        ctx.lineTo(x + 15, SCREEN_HEIGHT);
        ctx.stroke();
    }
}

// ========== AI系统 ==========
class AIController {
    constructor(character, enemy) {
        this.char = character;
        this.enemy = enemy;
        this.lastDecisionTime = 0;
        this.decisionInterval = 150;
        this.targetX = character.x;
        this.aggressiveness = 0.6 + Math.random() * 0.3;
    }
    
    update(currentTime) {
        if (!this.char.isAlive || !this.enemy.isAlive) return;
        
        if (currentTime - this.lastDecisionTime > this.decisionInterval) {
            this.makeDecision(currentTime);
            this.lastDecisionTime = currentTime;
        }
        
        // 移动控制
        const dx = this.targetX - this.char.x;
        this.char.moveLeft = dx < -15;
        this.char.moveRight = dx > 15;
        this.char.faceEnemy(this.enemy);
    }
    
    makeDecision(currentTime) {
        const dx = this.enemy.x - this.char.x;
        const dist = Math.abs(dx);
        const inRange = dist <= this.char.attackRange * 0.9;
        const closeRange = dist < 80;
        
        // 攻击决策
        if (inRange && Math.random() < this.aggressiveness) {
            const result = this.char.attack(this.enemy, currentTime);
            if (result) battleLog.unshift(result);
        }
        
        // 防御决策
        if (closeRange && this.enemy.attacking && Math.random() < 0.4) {
            this.char.defending = true;
            this.char.defenseTimer = 500;
        } else if (this.char.defending && Math.random() < 0.3) {
            this.char.defending = false;
        }
        
        // 移动决策
        const optimalDist = this.char.attackRange * 0.7;
        if (dist > optimalDist + 50) {
            this.targetX = this.enemy.x - Math.sign(dx) * optimalDist;
        } else if (dist < optimalDist - 30 && Math.random() < 0.4) {
            this.targetX = this.char.x - Math.sign(dx) * 60;
        } else {
            // 随机移动
            if (Math.random() < 0.2) {
                this.targetX = this.char.x + (Math.random() - 0.5) * 100;
            }
        }
        
        this.targetX = clamp(this.targetX, 50, SCREEN_WIDTH - 50);
        
        // 跳跃
        if (Math.random() < 0.05 && this.char.onGround) {
            this.char.attemptJump();
        }
    }
}

let aiController = null;

// ========== 游戏循环 ==========
let lastTime = 0;

function gameLoop(timestamp) {
    const dt = timestamp - lastTime || 16.67;
    lastTime = timestamp;
    
    updateShake();
    
    ctx.save();
    ctx.translate(screenShake.offsetX, screenShake.offsetY);
    
    if (gameState === 'selection') {
        drawSelectionScreen();
    } else if (gameState === 'battle') {
        updateBattle(dt, timestamp);
        drawBattle();
    } else if (gameState === 'shop') {
        drawShopScreen();
    } else if (gameState === 'formation') {
        drawFormationScreen();
    }
    
    ctx.restore();
    
    // 更新特效
    particles = particles.filter(p => { p.update(); return p.life > 0; });
    floatingTexts = floatingTexts.filter(t => { t.update(); return t.life > 0; });
    divineEffects = divineEffects.filter(e => { e.update(); return e.life > 0; });
    formationEffects = formationEffects.filter(f => { f.update(); return f.life > 0; });
    
    // 更新控件可见性
    updateControlsVisibility();
    
    requestAnimationFrame(gameLoop);
}

function updateControlsVisibility() {
    const controls = document.getElementById('controls');
    const mobileUtils = document.getElementById('mobileUtils');
    
    if (isMobile && gameState === 'battle' && !gameOver) {
        controls.style.display = 'block';
        mobileUtils.style.display = 'flex';
    } else {
        controls.style.display = 'none';
        if (isMobile && gameState !== 'selection') {
            mobileUtils.style.display = 'flex';
        } else {
            mobileUtils.style.display = 'none';
        }
    }
}

// ========== 战斗更新 ==========
function updateBattle(dt, currentTime) {
    if (gameOver) return;
    
    // 更新角色
    char1.moveByInput(dt);
    char1.applyPhysics(dt);
    char1.update(dt);
    
    char2.moveByInput(dt);
    char2.applyPhysics(dt);
    char2.update(dt);
    
    // AI更新
    if (vsAI && aiController) {
        aiController.update(currentTime);
    }
    
    // 阵法计时
    if (formationActive && formationTimer > 0) {
        formationTimer -= dt;
        if (formationTimer <= 0) {
            formationActive = false;
            currentFormation = null;
        }
    }
    
    // 检查胜负
    if (!char1.isAlive || !char2.isAlive) {
        gameOver = true;
        winner = char1.isAlive ? char1 : char2;
        
        if (winner === char1 && vsAI) {
            const goldReward = 50 + winStreak * 20;
            playerGold += goldReward;
            winStreak++;
            totalWins++;
            battleLog.unshift(`获得金币: ${goldReward}`);
        } else if (winner === char2 && vsAI) {
            winStreak = 0;
        }
    }
}

// ========== 战斗绘制 ==========
function drawBattle() {
    drawBackground(ctx);
    
    // 绘制阵法效果
    for (const f of formationEffects) {
        f.draw(ctx, 0, 0);
    }
    
    // 绘制角色
    drawCharacter(ctx, char1, 0, 0);
    drawCharacter(ctx, char2, 0, 0);
    
    // 绘制特效
    for (const p of particles) p.draw(ctx, 0, 0);
    for (const t of floatingTexts) t.draw(ctx, 0, 0);
    for (const e of divineEffects) e.draw(ctx, 0, 0);
    
    // UI
    drawBattleUI();
    
    // 胜负画面
    if (gameOver) {
        drawVictoryScreen();
    }
}

function drawVictoryScreen() {
    // 半透明遮罩
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
    
    // 胜利特效
    const centerX = SCREEN_WIDTH / 2;
    const centerY = SCREEN_HEIGHT / 2 - 30;
    
    // 光芒
    ctx.save();
    ctx.translate(centerX, centerY);
    const time = Date.now() * 0.002;
    for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2 + time;
        ctx.strokeStyle = winner.getColor();
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.3 + Math.sin(time * 2 + i) * 0.2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * 50, Math.sin(angle) * 50);
        ctx.lineTo(Math.cos(angle) * 150, Math.sin(angle) * 150);
        ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    
    // 胜利文字
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px Microsoft YaHei';
    ctx.fillStyle = winner.getColor();
    ctx.shadowColor = winner.getColor();
    ctx.shadowBlur = 20;
    ctx.fillText(`${winner.name} 得道!`, centerX, centerY);
    ctx.shadowBlur = 0;
    
    ctx.font = '24px Microsoft YaHei';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`施展【${winner.special}】镇压对手`, centerX, centerY + 50);

// ========== 选择界面 ==========
function drawSelectionScreen() {
    drawBackground(ctx);
    
    // 标题
    ctx.textAlign = 'center';
    ctx.font = 'bold 42px Microsoft YaHei';
    const titleGradient = ctx.createLinearGradient(SCREEN_WIDTH/2 - 150, 0, SCREEN_WIDTH/2 + 150, 0);
    titleGradient.addColorStop(0, '#ffd700');
    titleGradient.addColorStop(0.5, '#ffffff');
    titleGradient.addColorStop(1, '#ffd700');
    ctx.fillStyle = titleGradient;
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 20;
    ctx.fillText('封神对战', SCREEN_WIDTH/2, 50);
    ctx.shadowBlur = 0;
    
    // 阵营选择
    const factions = Object.keys(ALL_HEROES);
    const factionY = 95;
    const factionSpacing = 130;
    const startX = (SCREEN_WIDTH - (factions.length - 1) * factionSpacing) / 2;
    
    ctx.font = 'bold 18px Microsoft YaHei';
    for (let i = 0; i < factions.length; i++) {
        const f = factions[i];
        const fx = startX + i * factionSpacing;
        const isSelected = selectedFaction === f;
        
        // 阵营按钮
        ctx.fillStyle = isSelected ? getFactionColor(f) : 'rgba(60,60,80,0.8)';
        roundRect(ctx, fx - 55, factionY - 18, 110, 36, 8);
        ctx.fill();
        
        if (isSelected) {
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 10;
            roundRect(ctx, fx - 55, factionY - 18, 110, 36, 8);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }
        
        ctx.fillStyle = isSelected ? '#000' : '#fff';
        ctx.textAlign = 'center';
        ctx.fillText(f, fx, factionY + 6);
    }
    
    // 如果选择了阵营，显示人物列表
    if (selectedFaction) {
        const heroes = ALL_HEROES[selectedFaction];
        const heroAreaTop = 145;
        const heroAreaBottom = SCREEN_HEIGHT - 120;
        const heroAreaHeight = heroAreaBottom - heroAreaTop;
        const heroH = 45;
        const cols = 4;
        const rows = Math.ceil(heroes.length / cols);
        const totalHeight = rows * heroH;
        
        heroScrollMax = Math.max(0, totalHeight - heroAreaHeight);
        heroScrollY = clamp(heroScrollY, 0, heroScrollMax);
        
        // 裁剪区域
        ctx.save();
        ctx.beginPath();
        ctx.rect(50, heroAreaTop, SCREEN_WIDTH - 100, heroAreaHeight);
        ctx.clip();
        
        // 人物列表
        const colWidth = (SCREEN_WIDTH - 100) / cols;
        for (let i = 0; i < heroes.length; i++) {
            const hero = heroes[i];
            const col = i % cols;
            const row = Math.floor(i / cols);
            const hx = 50 + col * colWidth + colWidth / 2;
            const hy = heroAreaTop + 25 + row * heroH - heroScrollY;
            
            if (hy < heroAreaTop - 30 || hy > heroAreaBottom + 30) continue;
            
            const isSelected = selectedHero === hero;
            const stats = HERO_STATS[selectedFaction][hero];
            
            // 人物卡片
            ctx.fillStyle = isSelected ? 'rgba(255,215,0,0.3)' : 'rgba(40,40,60,0.8)';
            roundRect(ctx, hx - colWidth/2 + 5, hy - 18, colWidth - 10, 36, 6);

    // 物品列表
    const items = shopCategory === 'fabao' ? ALL_FABAO : ALL_ARMORS;
    const itemList = Object.keys(items).filter(name => items[name].price > 0);
    const startY = 140;
    const itemH = 55;

    const colW = (SCREEN_WIDTH - 100) / cols;
    
    const rows = Math.ceil(itemList.length / cols);

    shopScrollMax = Math.max(0, totalH - areaH);

    ctx.beginPath();

            ctx.fillStyle = '#88aaff';
            ctx.fillText('已装备', ix, iy + 12);
