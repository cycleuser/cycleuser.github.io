<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>封神对战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #gameCanvas {
            display: block;
            background: #000;
            border-radius: 4px;
            max-width: 100%;
            max-height: 100%;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            margin: 0 auto;
            box-shadow: 0 0 50px rgba(255, 200, 100, 0.3);
        }
        
        @media (max-width: 1023px) and (orientation: landscape) {
            #gameCanvas {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                margin: 0;
            }
        }
        
        @media (max-width: 1023px) and (orientation: portrait) {
            #gameCanvas {
                position: relative;
                margin: 10px auto;
                transform: none;
            }
        }
        @media (max-width: 1023px) and (orientation: portrait) {
            html, body {
                overflow: hidden;
                width: 100vw;
                height: 100vh;
            }
            body::before {
                content: "请将设备旋转至横向模式以获得最佳游戏体验";
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: linear-gradient(135deg, #1a0a2e 0%, #0a1a2e 100%);
                color: #ffd700;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 24px;
                text-align: center;
                z-index: 9999;
                padding: 20px;
                box-sizing: border-box;
                text-shadow: 0 0 20px #ffd700;
            }
        }
        
        #controls {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
        }
        
        .left-joystick-container {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: auto;
            z-index: 101;
        }
        
        .right-buttons-container {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 101;
        }
        
        .right-buttons-container > * {
            pointer-events: auto;
        }
        
        #joystickArea {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }

        #joystickArea::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, transparent 40%, rgba(255,215,0,0.15) 40%, rgba(255,215,0,0.15) 60%, transparent 60%),
                linear-gradient(0deg, transparent 40%, rgba(255,215,0,0.15) 40%, rgba(255,215,0,0.15) 60%, transparent 60%);
            border-radius: 50%;
            pointer-events: none;
        }

        #joystickBase {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        #joystickKnob {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffd700, #aa8800);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.05s;
            pointer-events: none;
            z-index: 2;
        }
        
        #joystickKnob.active {
            transform: translate(-50%, -50%) scale(0.95);
            background: radial-gradient(circle at 30% 30%, #ffee88, #ffd700);
        }

        .joy-indicator {
            position: absolute;
            color: rgba(255, 215, 0, 0.5);
            font-size: 24px;
            pointer-events: none;
            font-weight: bold;
        }
        .joy-indicator.up { top: 8px; left: 50%; transform: translateX(-50%); }
        .joy-indicator.down { bottom: 8px; left: 50%; transform: translateX(-50%); }
        .joy-indicator.left { left: 8px; top: 50%; transform: translateY(-50%); }
        .joy-indicator.right { right: 8px; top: 50%; transform: translateY(-50%); }

        .ctrl-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            transition: all 0.1s;
            user-select: none;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .ctrl-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.25);
        }

        .ctrl-btn.attack {
            background: linear-gradient(135deg, rgba(255, 100, 50, 0.5), rgba(255, 50, 50, 0.3));
            border-color: rgba(255, 150, 100, 0.5);
            box-shadow: 0 0 20px rgba(255, 100, 50, 0.3);
        }
        .ctrl-btn.attack:active {
            background: linear-gradient(135deg, rgba(255, 100, 50, 0.7), rgba(255, 50, 50, 0.5));
        }

        .ctrl-btn.defend {
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.5), rgba(80, 100, 255, 0.3));
            border-color: rgba(150, 180, 255, 0.5);
            box-shadow: 0 0 20px rgba(100, 150, 255, 0.3);
        }
        .ctrl-btn.defend:active {
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.7), rgba(80, 100, 255, 0.5));
        }

        .ctrl-btn.skill {
            background: linear-gradient(135deg, rgba(200, 100, 255, 0.5), rgba(150, 50, 255, 0.3));
            border-color: rgba(220, 150, 255, 0.5);
            box-shadow: 0 0 20px rgba(200, 100, 255, 0.3);
        }
        .ctrl-btn.skill:active {
            background: linear-gradient(135deg, rgba(200, 100, 255, 0.7), rgba(150, 50, 255, 0.5));
        }
        
        @media (min-width: 1024px) and (hover: hover) and (pointer: fine) {
            #controls { display: none !important; }
        }
        
        #fullscreenBtn {
            position: fixed;
            top: 8px;
            right: 8px;
            z-index: 200;
            background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(30,30,60,0.8));
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            touch-action: manipulation;
            text-shadow: 0 0 10px #ffd700;
        }
        #fullscreenBtn:active { background: rgba(255, 215, 0, 0.3); }
        
        #mobileUtils {
            display: none;
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 200;
            flex-direction: row;
            gap: 8px;
        }
        .util-btn {
            background: rgba(0,0,0,0.8);
            border: 2px solid #888;
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            text-align: center;
        }
        .util-btn:active { background: rgba(100,100,100,0.9); }
        .util-btn.restart { border-color: #88cc88; }
        .util-btn.back { border-color: #cc8888; }
        .util-btn.formation { border-color: #cc88cc; color: #ffaaff; }
    </style>
</head>

    if (windowRatio > aspectRatio) {

// ========== 工具函数 ==========
function hypot(dx, dy) { return Math.sqrt(dx*dx + dy*dy); }
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randFloat(min, max) { return Math.random() * (max - min) + min; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function getFactionColor(faction) {

        '商朝': SHANG_COLOR,
        '周朝': ZHOU_COLOR,
        '妖族': YAOZU_COLOR,
        '人仙': RENXIAN_COLOR
    };
    return colors[faction] || '#ffffff';
}

function fabaoCategory(fabao) {
    if (!fabao) return 'default';
    const f = ALL_FABAO[fabao];
    if (f) return f.category;
    return 'default';
}

function calculateStats(baseStats, fabao, armor) {
    const f = ALL_FABAO[fabao] || { attack: 0, defense: 0, range: 0 };
    const a = ALL_ARMORS[armor] || { defense: 0, speed: 0 };
    
    let blood = baseStats[0];
    let attack = baseStats[1] + f.attack;
    let defense = baseStats[2] + f.defense + a.defense;
    let range = baseStats[3] + (f.range - 100) * 0.5;
    
    const baseSpeed = 1 + a.speed;
    const bloodPenalty = Math.max(0, (blood - 400) * 0.0008);
    const defensePenalty = Math.max(0, defense * 0.015);
    let speed = baseSpeed - bloodPenalty - defensePenalty;
    speed = Math.max(0.35, speed);
    
    return { blood, attack, defense, range, speed };
}

function shake(duration, magnitude) {

}

function updateShake() {

        screenShake.duration--;
        screenShake.offsetX = randInt(-screenShake.magnitude, screenShake.magnitude);
        screenShake.offsetY = randInt(-screenShake.magnitude, screenShake.magnitude);

    }
}

class Particle {
    constructor(x, y, color, size, life, vx, vy, gravity = 0, glow = false) {
        this.x = x; this.y = y; this.color = color;
        this.size = size; this.life = life; this.maxLife = life;
        this.vx = vx; this.vy = vy; this.gravity = gravity;
        this.glow = glow;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.vy += this.gravity; this.life--;
        this.size *= 0.97;
    }
    draw(ctx, ox, oy) {
        if (this.life > 0) {
            const alpha = this.life / this.maxLife;
            ctx.globalAlpha = alpha;
            if (this.glow) {
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;
            }
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x - ox, this.y - oy, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
        }
    }
}

function spawnParticles(x, y, count, color, speed, size = 3, glow = false) {
    for (let i = 0; i < count; i++) {
        const vx = (Math.random() - 0.5) * speed * 2;
        const vy = (Math.random() - 0.5) * speed * 2;
        particles.push(new Particle(x, y, color, size * randFloat(0.5, 1.5), randInt(25, 50), vx, vy, 0.15, glow));
    }
}

function spawnDivineParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2;
        const speed = randFloat(3, 8);
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed - 2;
        particles.push(new Particle(x, y, color, randFloat(4, 8), randInt(40, 70), vx, vy, 0.1, true));
    }
}

class FloatingText {
    constructor(x, y, text, color, fontSize = 20) {
        this.x = x; this.y = y; this.text = text;
        this.color = color; this.life = 80; this.vy = -1.8;
        this.fontSize = fontSize;
    }
    update() { this.y += this.vy; this.life--; this.vy *= 0.98; }
    draw(ctx, ox, oy) {
        if (this.life > 0) {
            const alpha = this.life < 25 ? this.life / 25 : 1;
            ctx.globalAlpha = alpha;
            ctx.font = `bold ${this.fontSize}px Microsoft YaHei, SimHei, sans-serif`;
            ctx.fillStyle = this.color;
            ctx.textAlign = 'center';
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 10;
            ctx.fillText(this.text, this.x - ox, this.y - oy);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
        }
    }
}

function spawnText(x, y, text, color, fontSize = 20) {

}

// ========== 神通特效 ==========
class DivineEffect {
    constructor(x, y, character, skillName) {
        this.x = x; this.y = y;
        this.character = character;
        this.skillName = skillName;
        this.color = character.getColor();
        this.life = 120; this.maxLife = 120;
        this.radius = 10;
        this.phase = 0;
    }
    
    update() {
        this.life--;
        this.radius += 4;
        this.phase += 0.12;
    }
    
    draw(ctx, ox, oy) {
        if (this.life <= 0) return;
        const progress = 1 - this.life / this.maxLife;
        const alpha = Math.min(1, (1 - progress) * 1.8);
        const sx = this.x - ox, sy = this.y - oy;
        
        ctx.save();
        ctx.globalAlpha = alpha;
        
        // 绘制神通特效
        this.drawDivineSkill(ctx, sx, sy, progress);
        
        ctx.restore();
    }
    
    drawDivineSkill(ctx, sx, sy, progress) {
        const skill = this.skillName;
        
        // 根据神通类型绘制不同特效
        if (skill.includes('火') || skill.includes('焰') || skill.includes('炎')) {
            this.drawFireEffect(ctx, sx, sy, progress);
        } else if (skill.includes('雷') || skill.includes('电')) {
            this.drawLightningEffect(ctx, sx, sy, progress);
        } else if (skill.includes('剑') || skill.includes('刀')) {
            this.drawSwordEffect(ctx, sx, sy, progress);
        } else if (skill.includes('金') || skill.includes('光')) {
            this.drawGoldenEffect(ctx, sx, sy, progress);
        } else if (skill.includes('水') || skill.includes('海')) {
            this.drawWaterEffect(ctx, sx, sy, progress);
        } else if (skill.includes('妖') || skill.includes('魔')) {
            this.drawDarkEffect(ctx, sx, sy, progress);
        } else {
            this.drawDefaultEffect(ctx, sx, sy, progress);
        }
        
        // 显示神通名称
        if (progress < 0.5) {
            ctx.font = 'bold 28px Microsoft YaHei';
            ctx.fillStyle = this.color;
            ctx.textAlign = 'center';
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 20;
            ctx.fillText(this.skillName, sx, sy - 80 - progress * 50);
            ctx.shadowBlur = 0;
        }
    }
    
    drawFireEffect(ctx, sx, sy, progress) {
        // 火焰漩涡
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2 + this.phase;
            const r = this.radius * (0.5 + progress * 0.5);
            const x = sx + Math.cos(angle) * r;
            const y = sy + Math.sin(angle) * r * 0.6;
            
            const gradient = ctx.createRadialGradient(x, y, 0, x, y, 30);
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(0.3, '#ffaa00');
            gradient.addColorStop(0.7, '#ff4400');
            gradient.addColorStop(1, 'transparent');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(x, y, 30 - progress * 10, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // 中心火柱
        const gradient = ctx.createRadialGradient(sx, sy, 0, sx, sy, this.radius);
        gradient.addColorStop(0, 'rgba(255,255,255,0.9)');
        gradient.addColorStop(0.4, 'rgba(255,200,0,0.7)');
        gradient.addColorStop(1, 'rgba(255,0,0,0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(sx, sy, this.radius, 0, Math.PI * 2);
        ctx.fill();
    }
    
    drawLightningEffect(ctx, sx, sy, progress) {
        ctx.strokeStyle = '#88ffff';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 20;
        
        // 闪电链
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2 + this.phase;
            ctx.beginPath();
            let px = sx, py = sy;
            ctx.moveTo(px, py);
            
            for (let j = 0; j < 5; j++) {
                px += Math.cos(angle) * 25 + randFloat(-15, 15);
                py += Math.sin(angle) * 25 + randFloat(-15, 15);
                ctx.lineTo(px, py);
            }
            ctx.stroke();
        }
        ctx.shadowBlur = 0;
    }
    
    drawSwordEffect(ctx, sx, sy, progress) {
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;
        
        // 剑气纵横
        for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI * 2 + this.phase * 2;
            const r1 = 30 + progress * 80;
            const r2 = r1 + 60;
            
            ctx.beginPath();
            ctx.moveTo(sx + Math.cos(angle) * r1, sy + Math.sin(angle) * r1);
            ctx.lineTo(sx + Math.cos(angle) * r2, sy + Math.sin(angle) * r2);
            ctx.stroke();
        }
        ctx.shadowBlur = 0;
    }
    
    drawGoldenEffect(ctx, sx, sy, progress) {
        // 金光普照
        for (let i = 0; i < 3; i++) {
            const r = (30 + i * 40) * (0.3 + progress * 0.7);
            ctx.strokeStyle = `rgba(255, 215, 0, ${0.8 - i * 0.2})`;
            ctx.lineWidth = 4 - i;
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(sx, sy, r, 0, Math.PI * 2);
            ctx.stroke();
        }
        
        // 金色光芒
        for (let i = 0; i < 16; i++) {
            const angle = (i / 16) * Math.PI * 2 + this.phase;
            const len = 50 + Math.sin(this.phase * 3 + i) * 20;
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(sx + Math.cos(angle) * 40, sy + Math.sin(angle) * 40);
            ctx.lineTo(sx + Math.cos(angle) * (40 + len), sy + Math.sin(angle) * (40 + len));
            ctx.stroke();
        }
        ctx.shadowBlur = 0;
    }
    
    drawWaterEffect(ctx, sx, sy, progress) {
        // 水波荡漾
        for (let i = 0; i < 5; i++) {
            const r = (20 + i * 30) * progress;
            const wave = Math.sin(this.phase * 2 + i) * 5;
            ctx.strokeStyle = `rgba(0, 150, 255, ${0.7 - i * 0.12})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(sx, sy + wave, r, r * 0.4, 0, 0, Math.PI * 2);
            ctx.stroke();
        }
    }
    
    drawDarkEffect(ctx, sx, sy, progress) {
        // 暗黑妖气
        const gradient = ctx.createRadialGradient(sx, sy, 0, sx, sy, this.radius * 1.5);
        gradient.addColorStop(0, 'rgba(100, 0, 150, 0.8)');
        gradient.addColorStop(0.5, 'rgba(50, 0, 100, 0.5)');
        gradient.addColorStop(1, 'transparent');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(sx, sy, this.radius * 1.5, 0, Math.PI * 2);
        ctx.fill();
        
        // 妖气螺旋
        ctx.strokeStyle = '#aa44ff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        for (let i = 0; i < 100; i++) {
            const t = i / 100;
            const angle = t * Math.PI * 6 + this.phase;
            const r = t * this.radius * 1.2;
            const x = sx + Math.cos(angle) * r;
            const y = sy + Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }
    
    drawDefaultEffect(ctx, sx, sy, progress) {
        // 默认神通光环
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 20;
        
        for (let i = 0; i < 3; i++) {
            const r = (30 + i * 35) * progress;
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 4 - i;
            ctx.beginPath();
            ctx.arc(sx, sy, r, 0, Math.PI * 2);
            ctx.stroke();
        }
        
        // 放射线
        ctx.lineWidth = 2;
        for (let i = 0; i < 16; i++) {
            const angle = (i / 16) * Math.PI * 2 + this.phase;
            const r1 = 25 * progress;
            const r2 = (80 + Math.sin(this.phase * 2 + i) * 20) * progress;
            ctx.beginPath();
            ctx.moveTo(sx + Math.cos(angle) * r1, sy + Math.sin(angle) * r1);
            ctx.lineTo(sx + Math.cos(angle) * r2, sy + Math.sin(angle) * r2);
            ctx.stroke();
        }
        ctx.shadowBlur = 0;
    }
}

function spawnDivineEffect(x, y, character, skillName) {
    divineEffects.push(new DivineEffect(x, y, character, skillName));
    spawnDivineParticles(x, y, 30, character.getColor());

// ========== 阵法特效 ==========
class FormationEffect {
    constructor(formation, x, y) {
        this.formation = formation;
        this.x = x; this.y = y;
        this.life = 300;
        this.maxLife = 300;
        this.phase = 0;
        this.data = ALL_FORMATIONS[formation];
    }
    
    update() {
        this.life--;
        this.phase += 0.05;
    }
    
    draw(ctx, ox, oy) {
        if (this.life <= 0) return;
        const progress = 1 - this.life / this.maxLife;
        const alpha = this.life < 60 ? this.life / 60 : 1;
        const sx = this.x - ox, sy = this.y - oy;
        
        ctx.save();
        ctx.globalAlpha = alpha * 0.7;
        
        // 绘制阵法
        const color = this.data.color;
        const baseR = 120;
        
        // 外圈
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.shadowColor = color;
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(sx, sy, baseR, 0, Math.PI * 2);
        ctx.stroke();
        
        // 内部八卦图案
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2 + this.phase;
            const x1 = sx + Math.cos(angle) * 40;
            const y1 = sy + Math.sin(angle) * 40;
            const x2 = sx + Math.cos(angle) * baseR;
            const y2 = sy + Math.sin(angle) * baseR;
            
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }
        
        // 符文圆环
        ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
            const r = 50 + i * 30;
            ctx.beginPath();
            ctx.arc(sx, sy, r, this.phase + i, this.phase + i + Math.PI * 1.5);
            ctx.stroke();
        }
        
        // 阵法名称
        if (progress < 0.2) {
            ctx.font = 'bold 32px Microsoft YaHei';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.fillText(this.formation, sx, sy - baseR - 20);
            
            ctx.font = '16px Microsoft YaHei';
            ctx.fillText(this.data.effect, sx, sy - baseR + 5);
        }
        
        ctx.shadowBlur = 0;
        ctx.restore();
    }
}
