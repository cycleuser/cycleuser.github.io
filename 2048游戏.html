<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2048 · 撤回版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #faf8ef;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'SimHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .wrap {
            width: 100%;
            max-width: 480px;
            padding: 16px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 34px;
            font-weight: 800;
            color: #776e65;
            letter-spacing: 2px;
        }
        .scores {
            display: flex;
            gap: 8px;
        }
        .score-box {
            background: #bbada0;
            color: #fff;
            border-radius: 8px;
            padding: 6px 12px;
            text-align: center;
            min-width: 82px;
        }
        .score-box .label {
            font-size: 11px;
            text-transform: uppercase;
            opacity: .8;
        }
        .score-box .value {
            font-size: 20px;
            font-weight: 700;
        }
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            min-width: 70px;
            background: #8f7a66;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 0;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }
        .btn:hover { background: #9f8b77; }
        .btn:active { transform: scale(.96); }
        .btn.green { background: #4caf50; }
        .btn.green:hover { background: #5cb860; }
        .btn.undo { background: #607d8b; }
        .btn.undo:hover { background: #71919f; }
        .game {
            position: relative;
            background: #bbada0;
            border-radius: 10px;
            padding: 10px;
            touch-action: none;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .cell {
            background: rgba(238,228,218,.35);
            border-radius: 6px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 700;
            color: #776e65;
        }
        .tile-2    { background:#eee4da; color:#776e65; }
        .tile-4    { background:#ede0c8; color:#776e65; }
        .tile-8    { background:#f2b179; color:#f9f6f2; }
        .tile-16   { background:#f59563; color:#f9f6f2; }
        .tile-32   { background:#f67c5f; color:#f9f6f2; }
        .tile-64   { background:#f65e3b; color:#f9f6f2; }
        .tile-128  { background:#edcf72; color:#f9f6f2; font-size:28px; }
        .tile-256  { background:#edcc61; color:#f9f6f2; font-size:28px; }
        .tile-512  { background:#edc850; color:#f9f6f2; font-size:28px; }
        .tile-1024 { background:#edc53f; color:#f9f6f2; font-size:22px; }
        .tile-2048 { background:#edc22e; color:#f9f6f2; font-size:22px; }
        .tile-super{ background:#3c3a32; color:#f9f6f2; font-size:18px; }
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(238,228,218,.73);
            border-radius: 10px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 10;
        }
        .overlay.show { display: flex; }
        .overlay .msg { font-size: 32px; font-weight: 800; color: #776e65; }
        .tip { margin-top: 12px; text-align: center; color: #999; font-size: 12px; line-height: 1.7; }
        .tip b { color: #776e65; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <h1>2048</h1>
        <div class="scores">
            <div class="score-box"><div class="label">积分</div><div class="value" id="score">0</div></div>
            <div class="score-box"><div class="label">最高</div><div class="value" id="best">0</div></div>
        </div>
    </div>
    <div class="controls">
        <button class="btn green" onclick="newGame()">新游戏</button>
        <button class="btn undo" onclick="undo()">↩ 撤回</button>
        <button class="btn" onclick="autoHint()">💡 提示</button>
    </div>
    <div class="game" id="gameArea">
        <div class="grid" id="grid"></div>
        <div class="overlay" id="overlay">
            <div class="msg" id="ovMsg"></div>
            <button class="btn green" onclick="newGame()">再来一局</button>
        </div>
    </div>
    <div class="tip">
        <b>方向键 / WASD</b> 或 <b>滑动屏幕</b> 移动方块<br>
        <b>撤回</b> 可回到上一步，随时随地反悔
    </div>
</div>
<script>
(function () {
    var SIZE = 4;
    var grid = [];
    var score = 0;
    var best = parseInt(localStorage.getItem('s2048best') || '0');
    var history = [];       // 撤回栈
    var MAX_UNDO = 20;      // 最多撤回步数
    var canMove = true;

    var gridEl = document.getElementById('grid');
    var scoreEl = document.getElementById('score');
    var bestEl = document.getElementById('best');
    var overlay = document.getElementById('overlay');
    var ovMsg = document.getElementById('ovMsg');

    bestEl.textContent = best;

    function empty() {
        var g = [];
        for (var r = 0; r < SIZE; r++) {
            g.push(new Array(SIZE).fill(0));
        }
        return g;
    }

    function addRandom() {
        var cells = [];
        for (var r = 0; r < SIZE; r++)
            for (var c = 0; c < SIZE; c++)
                if (grid[r][c] === 0) cells.push([r, c]);
        if (cells.length === 0) return;
        var p = cells[Math.floor(Math.random() * cells.length)];
        grid[p[0]][p[1]] = Math.random() < 0.9 ? 2 : 4;
    }

    function compress(row) {
        // 去掉0，压缩到左侧
        var nz = row.filter(function (v) { return v !== 0; });
        while (nz.length < SIZE) nz.push(0);
        return nz;
    }

    function mergeRow(row, gain) {
        var original = row.slice();
        var merged = compress(row);
        for (var i = 0; i < SIZE - 1; i++) {
            if (merged[i] !== 0 && merged[i] === merged[i + 1]) {
                merged[i] *= 2;
                gain.score += merged[i];
                gain.changed = true;
                for (var k = i + 1; k < SIZE - 1; k++) merged[k] = merged[k + 1];
                merged[SIZE - 1] = 0;
            }
        }
        // 只要发生了位置变化（滑动或合并）就算移动
        if (!gain.changed) {
            for (var i = 0; i < SIZE; i++) {
                if (merged[i] !== original[i]) {
                    gain.changed = true;
                    break;
                }
            }
        }
        return merged;
    }

    // 返回 [新网格, 得分变化, 是否变化]
    function move(dir) {
        var gain = { score: 0, changed: false };
        var g = empty();
        for (var i = 0; i < SIZE; i++) {
            var row = [];
            for (var j = 0; j < SIZE; j++) {
                // 按方向取元素
                row.push(pick(grid, dir, i, j));
            }
            var res = mergeRow(row, gain);
            for (var j = 0; j < SIZE; j++) {
                put(g, dir, i, j, res[j]);
            }
        }
        if (gain.changed) {
            grid = g;
        }
        return gain;
    }

    function pick(g, dir, i, j) {
        switch (dir) {
            case 0: return g[i][j];          // 左
            case 1: return g[i][SIZE - 1 - j]; // 右
            case 2: return g[j][i];          // 上
            case 3: return g[SIZE - 1 - j][i]; // 下
        }
    }
    function put(g, dir, i, j, v) {
        switch (dir) {
            case 0: g[i][j] = v; break;
            case 1: g[i][SIZE - 1 - j] = v; break;
            case 2: g[j][i] = v; break;
            case 3: g[SIZE - 1 - j][i] = v; break;
        }
    }

    function canAnyMove() {
        for (var r = 0; r < SIZE; r++)
            for (var c = 0; c < SIZE; c++) {
                if (grid[r][c] === 0) return true;
                if (c + 1 < SIZE && grid[r][c] === grid[r][c + 1]) return true;
                if (r + 1 < SIZE && grid[r][c] === grid[r + 1][c]) return true;
            }
        return false;
    }

    function snapshot() {
        return {
            grid: grid.map(function (r) { return r.slice(); }),
            score: score
        };
    }

    function doMove(dir) {
        if (!canMove || overlay.classList.contains('show')) return;
        history.push(snapshot());
        if (history.length > MAX_UNDO) history.shift();

        var before = JSON.stringify(grid);
        var gain = move(dir);
        if (gain.changed) {
            addRandom();
            score += gain.score;
            updateScore();
            render();
            if (hasWon()) {
                overlay.classList.add('show');
                ovMsg.textContent = '🎉 你赢了！';
            } else if (!canAnyMove()) {
                overlay.classList.add('show');
                ovMsg.textContent = '😵 没有可移动的了';
            }
        } else {
            history.pop(); // 没变化不占撤回
        }
    }

    function hasWon() {
        for (var r = 0; r < SIZE; r++)
            for (var c = 0; c < SIZE; c++)
                if (grid[r][c] >= 2048) return true;
        return false;
    }

    function undo() {
        if (history.length === 0 || overlay.classList.contains('show')) return;
        var prev = history.pop();
        grid = prev.grid;
        score = prev.score;
        updateScore();
        render();
    }

    function newGame() {
        grid = empty();
        score = 0;
        history = [];
        overlay.classList.remove('show');
        addRandom();
        addRandom();
        updateScore();
        render();
    }

    function updateScore() {
        scoreEl.textContent = score;
        if (score > best) {
            best = score;
            localStorage.setItem('s2048best', String(best));
        }
        bestEl.textContent = best;
    }

    function tileClass(v) {
        if (v === 0) return '';
        if (v <= 2048) return 'tile-' + v;
        return 'tile-super';
    }

    function render() {
        gridEl.innerHTML = '';
        for (var r = 0; r < SIZE; r++) {
            for (var c = 0; c < SIZE; c++) {
                var d = document.createElement('div');
                d.className = 'cell ' + tileClass(grid[r][c]);
                if (grid[r][c]) d.textContent = grid[r][c];
                gridEl.appendChild(d);
            }
        }
    }

    // 提示：尝试四个方向，返回能产生最大得分的方向
    function autoHint() {
        if (overlay.classList.contains('show')) return;
        var bestDir = -1, bestScore = -1;
        for (var dir = 0; dir < 4; dir++) {
            var saved = grid.map(function (r) { return r.slice(); });
            var gain = move(dir);
            if (gain.changed && gain.score > bestScore) {
                bestScore = gain.score;
                bestDir = dir;
            }
            grid = saved;
        }
        var names = ['← 左', '→ 右', '↑ 上', '↓ 下'];
        if (bestDir >= 0) {
            ovMsg.style.background = 'transparent';
            ovMsg.textContent = '建议：' + names[bestDir];
            overlay.classList.add('show');
            setTimeout(function () { overlay.classList.remove('show'); }, 900);
        } else {
            ovMsg.textContent = '没有可移动的方向';
            overlay.classList.add('show');
            setTimeout(function () { overlay.classList.remove('show'); }, 900);
        }
    }

    // 键盘
    document.addEventListener('keydown', function (e) {
        var map = {
            ArrowLeft: 0, a: 0, A: 0,
            ArrowRight: 1, d: 1, D: 1,
            ArrowUp: 2, w: 2, W: 2,
            ArrowDown: 3, s: 3, S: 3
        };
        if (map[e.key] !== undefined) {
            e.preventDefault();
            doMove(map[e.key]);
        }
    });

    // 触摸滑动
    var startX, startY;
    var gameArea = document.getElementById('gameArea');
    gameArea.addEventListener('touchstart', function (e) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    }, { passive: true });
    gameArea.addEventListener('touchend', function (e) {
        if (startX === undefined) return;
        var dx = e.changedTouches[0].clientX - startX;
        var dy = e.changedTouches[0].clientY - startY;
        var adx = Math.abs(dx), ady = Math.abs(dy);
        if (Math.max(adx, ady) < 24) return;
        var dir = adx > ady ? (dx > 0 ? 1 : 0) : (dy > 0 ? 3 : 2);
        doMove(dir);
        startX = startY = undefined;
    }, { passive: true });

    // 暴露全局
    window.newGame = newGame;
    window.undo = undo;
    window.autoHint = autoHint;

    newGame();
})();
</script>
</body>
</html>
