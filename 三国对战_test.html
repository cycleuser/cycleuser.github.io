    ctx.fillText(shopTitle, SCREEN_WIDTH/2, 40);
    
    // Gold display
    const goldSize = isMobile ? 20 : 18;
    ctx.font = `${goldSize}px Microsoft YaHei, SimHei, sans-serif`;
    ctx.fillStyle = YELLOW;
    const currentGold = activeShopPlayer === 2 ? player2Gold : playerGold;
    ctx.fillText(`${t('gold')}: ${currentGold}`, SCREEN_WIDTH/2, 70);
    
    // Tab buttons - larger and more touch-friendly
    const tabHeight = isMobile ? 50 : 30;
    const tabY = 90 - (isMobile ? 10 : 0);
    const weaponsTabWidth = isMobile ? 180 : 150;
    const armorsTabWidth = isMobile ? 180 : 150;
    const weaponsTabX = 100 - (isMobile ? 15 : 0);
    const armorsTabX = 260 - (isMobile ? 15 : 0);
    
    // Weapons tab
    ctx.fillStyle = shopCategory === 'weapons' ? '#4488aa' : '#444444';
    roundRect(ctx, weaponsTabX, tabY, weaponsTabWidth, tabHeight, 8);
    ctx.fill();
    
    // Armors tab
    ctx.fillStyle = shopCategory === 'armors' ? '#4488aa' : '#444444';
    roundRect(ctx, armorsTabX, tabY, armorsTabWidth, tabHeight, 8);
    ctx.fill();
    
    // Tab borders
    ctx.strokeStyle = '#666666';
    ctx.lineWidth = 1;
    roundRect(ctx, weaponsTabX, tabY, weaponsTabWidth, tabHeight, 8);
    ctx.stroke();
    roundRect(ctx, armorsTabX, tabY, armorsTabWidth, tabHeight, 8);
    ctx.stroke();
    
    // Tab text
    const tabTextSize = isMobile ? 16 : 14;
    ctx.fillStyle = WHITE;
    ctx.font = `${tabTextSize}px Microsoft YaHei, SimHei, sans-serif`;
    ctx.fillText(t('weapons'), weaponsTabX + weaponsTabWidth/2, tabY + tabHeight/2 + 6);
    ctx.fillText(t('armors'), armorsTabX + armorsTabWidth/2, tabY + tabHeight/2 + 6);
    
    // Items
    const items = shopCategory === 'weapons' ? ALL_WEAPONS : ALL_ARMORS;
    const itemList = Object.keys(items);
    const startX = 100;
    const spacing = isMobile ? 130 : 120;  // More spacing on mobile
    const itemH = isMobile ? 90 : 80;      // Taller items on mobile
    const itemAreaTop = 140;
    const itemAreaBottom = SCREEN_HEIGHT - 150;
    const itemAreaHeight = itemAreaBottom - itemAreaTop;
    
    // Calculate grid dimensions
    const cols = 7;
    const rows = Math.ceil(itemList.length / cols);
    const totalContentHeight = rows * itemH;
    
    // Update scroll max
    shopScrollMax = Math.max(0, totalContentHeight - itemAreaHeight);
    shopScrollY = clamp(shopScrollY, 0, shopScrollMax);
    
    // Draw scroll indicator if needed
    if (shopScrollMax > 0) {
        // Scrollbar
        const scrollBarX = SCREEN_WIDTH - 20;
        const scrollBarH = itemAreaHeight - 20;
        ctx.fillStyle = 'rgba(100,100,100,0.3)';
        ctx.fillRect(scrollBarX, itemAreaTop + 10, 12, scrollBarH);
        
        const thumbH = Math.max(30, scrollBarH * (itemAreaHeight / totalContentHeight));
        const thumbY = itemAreaTop + 10 + (scrollBarH - thumbH) * (shopScrollY / shopScrollMax);
        ctx.fillStyle = 'rgba(200,200,200,0.7)';
        roundRect(ctx, scrollBarX, thumbY, 12, thumbH, 6);
        ctx.fill();
    }
    
    // Clip item area
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, itemAreaTop, SCREEN_WIDTH, itemAreaHeight);
    ctx.clip();
    
    for (let i = 0; i < itemList.length; i++) {
        const name = itemList[i];
        const item = items[name];
        const col = i % cols;
        const row = Math.floor(i / cols);
        const ix = startX + col * spacing;
        // Position accounting for scroll offset
        const iy = itemAreaTop + 20 + row * itemH - shopScrollY;
        
        // Skip items outside visible area
        if (iy < itemAreaTop - 30 || iy > itemAreaBottom + 30) continue;
        
        let owned, canBuy, isEquipped;
        if (activeShopPlayer === 2) {
             owned = shopCategory === 'weapons' ? player2Weapons.includes(name) : player2Armors.includes(name);
             canBuy = player2Gold >= item.price;
             isEquipped = shopCategory === 'weapons' ? (currentWeapon2 === name) : (currentArmor2 === name);
        } else {
             owned = shopCategory === 'weapons' ? playerWeapons.includes(name) : playerArmors.includes(name);
             canBuy = playerGold >= item.price;
             isEquipped = shopCategory === 'weapons' ? (currentWeapon === name) : (currentArmor === name);
        }
        
        // Item background with rounded corners
        if (isEquipped) {
            ctx.fillStyle = '#445588';  // Equipped highlight
        } else if (owned) {
            ctx.fillStyle = '#336633';
        } else if (canBuy) {
            ctx.fillStyle = '#444466';
        } else {
            ctx.fillStyle = '#333333';
        }
        const itemWidth = isMobile ? 110 : 100;
        const itemHeight = isMobile ? 60 : 50;
        roundRect(ctx, ix - itemWidth/2, iy - itemHeight/2, itemWidth, itemHeight, 8);
        ctx.fill();
        
        // Equipped indicator border
        if (isEquipped) {
            ctx.strokeStyle = '#88aaff';
            ctx.lineWidth = 2;
            roundRect(ctx, ix - itemWidth/2, iy - itemHeight/2, itemWidth, itemHeight, 8);
            ctx.stroke();
        }
        
        // Item name
        ctx.fillStyle = owned ? '#66ff66' : (canBuy ? WHITE : '#666666');
        const nameSize = isMobile ? 14 : 12;
        ctx.font = `${nameSize}px Microsoft YaHei, SimHei, sans-serif`;
        ctx.fillText(name, ix, iy - 5);
        
        // Price or status
        if (!owned) {
            ctx.fillStyle = canBuy ? YELLOW : '#666666';
            const priceSize = isMobile ? 12 : 11;
            ctx.font = `${priceSize}px Microsoft YaHei, SimHei, sans-serif`;
            ctx.fillText(`${t('price')}: ${item.price}`, ix, iy + 15);
        } else if (isEquipped) {
            ctx.fillStyle = '#88aaff';
            ctx.fillText(t('equipped'), ix, iy + 15);
        } else {
            ctx.fillStyle = '#66ff66';
            ctx.fillText(t('equip'), ix, iy + 15);
        }
    }
    
    ctx.restore();
    
    // Info panel
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(SCREEN_WIDTH - 280, 140, 260, 220);
    
    ctx.fillStyle = WHITE;
    const infoSize = isMobile ? 15 : 14;
    ctx.font = `${infoSize}px Microsoft YaHei, SimHei, sans-serif`;
    ctx.fillText(`${t('click')}${t('buy')}${t('goods')}`, SCREEN_WIDTH - 260, 170);
    ctx.fillText(`${t('owned')}${t('items')}${t('show')}${t('green')}`, SCREEN_WIDTH - 260, 195);
    ctx.fillText('可在商店购买更强武器', SCREEN_WIDTH - 260, 220);
    
    ctx.fillStyle = YELLOW;
    ctx.fillText(`${t('winStreak')}: ${winStreak}`, SCREEN_WIDTH - 260, 250);
    ctx.fillText(`${t('totalWins')}: ${totalWins}`, SCREEN_WIDTH - 260, 275);
    
    ctx.fillStyle = LIGHT_GRAY;
    ctx.fillText(`${t('current')}${t('equip')}:`, SCREEN_WIDTH - 260, 310);
    ctx.fillStyle = WHITE;
    const showWeapon = activeShopPlayer === 2 ? currentWeapon2 : currentWeapon;
    const showArmor = activeShopPlayer === 2 ? currentArmor2 : currentArmor;
    ctx.fillText(`${t('weapon')}: ${showWeapon || t('none')}`, SCREEN_WIDTH - 260, 335);
    ctx.fillText(`${t('armor')}: ${showArmor}`, SCREEN_WIDTH - 260, 360);
    
    ctx.textAlign = 'center';
    
    // Back button - larger on mobile
    const backBtnWidth = isMobile ? 120 : 100;
    const backBtnHeight = isMobile ? 45 : 35;
    const backBtnX = 40 - (isMobile ? 10 : 0);
    const backBtnY = SCREEN_HEIGHT - 80 - (isMobile ? 5 : 0);
    
    ctx.fillStyle = '#666666';
    roundRect(ctx, backBtnX, backBtnY, backBtnWidth, backBtnHeight, 8);
    ctx.fill();
    
    ctx.strokeStyle = '#888888';
    ctx.lineWidth = 1;
    roundRect(ctx, backBtnX, backBtnY, backBtnWidth, backBtnHeight, 8);
    ctx.stroke();
    
    ctx.fillStyle = WHITE;
    const backTextSize = isMobile ? 16 : 14;
    ctx.font = `${backTextSize}px Microsoft YaHei, SimHei, sans-serif`;
    ctx.fillText(t('back'), backBtnX + backBtnWidth/2, backBtnY + backBtnHeight/2 + 6);
    
    // Mobile tip
    if (isMobile) {
        ctx.font = '14px Microsoft YaHei, SimHei, sans-serif';
        ctx.fillStyle = '#888888';
        
        // Different tips based on whether we can return to battle
        if (battleReturnState === 'battle') {
            ctx.fillText('💡 购买完成后点击返回可继续战斗', SCREEN_WIDTH/2, SCREEN_HEIGHT - 20);
        } else {
            ctx.fillText('💡 点击商品购买或装备', SCREEN_WIDTH/2, SCREEN_HEIGHT - 20);
        }
    }
}

// Start game
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
