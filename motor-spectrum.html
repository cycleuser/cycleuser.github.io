<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电机音频频谱诊断</title>
<style>
:root{--bg:#0f1720;--card:#1b2733;--acc:#27ae60;--acc2:#c0392b;--mut:#8fa3b5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:#e8eef4;padding:44px 16px 16px;text-align:center}
h1{font-size:17px;margin:0 0 4px}
.sub{color:var(--mut);font-size:11px;line-height:1.4;margin:0 auto 10px;max-width:340px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.3);text-align:left}
.btn-row{display:flex;gap:8px;margin-bottom:10px}
.btn-row button{flex:1;min-width:0}
button{padding:12px 10px;font-size:14px;font-weight:600;border:0;border-radius:10px;
  background:var(--acc);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.sec{background:#31404f}
button:active{opacity:.8}
canvas{background:#0c141c;border-radius:12px;display:block;width:100%}
.row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.row:last-child{border-bottom:0}
.row .k{color:var(--mut)}
.row .val{font-variant-numeric:tabular-nums}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #31404f;
  background:#0c141c;color:#e8eef4;font-size:14px;margin-top:6px}
select{appearance:none}
label{font-size:12px;color:var(--mut);display:block;margin-top:8px}
.big{display:flex;gap:12px}
.big .item{flex:1;text-align:center}
.big .v{font-size:28px;font-weight:700;color:var(--acc);line-height:1.1}
.big .l{font-size:11px;color:var(--mut);margin-top:2px}
#homeLink,#langToggle{position:fixed;top:8px;z-index:1000;padding:6px 12px;font-size:13px;
  font-weight:600;border-radius:20px;background:rgba(49,64,79,.85);color:#e8eef4;
  backdrop-filter:blur(4px);box-shadow:0 1px 6px rgba(0,0,0,.35)}
#homeLink{left:8px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
#langToggle{right:8px;border:0;cursor:pointer}
.warn{color:#f1c40f;font-size:12px;margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<a id="homeLink" href="https://blog.cycleuser.org">← 博客</a>
<button id="langToggle">EN</button>
<h1>电机音频频谱诊断</h1>
<div class="sub">录制电机运转音频，频谱分析查找故障特征</div>

<div class="card">
  <div class="big">
    <div class="item"><div class="v" id="dbVal">--</div><div class="l">音量 dB</div></div>
    <div class="item"><div class="v" id="peakFreq">--</div><div class="l">主峰 Hz</div></div>
    <div class="item"><div class="v" id="statusVal">--</div><div class="l">状态</div></div>
  </div>
  <canvas id="spectrum" width="600" height="200"></canvas>
  <div id="peaksList" style="font-size:11px;color:var(--mut);margin-top:6px;text-align:center;min-height:18px"></div>
  <div class="btn-row" style="margin-top:8px">
    <button id="recBtn">录制</button>
    <button id="playBtn" class="sec" disabled>回放</button>
  </div>
</div>

<div class="card">
  <label>设备标识 / Motor ID</label>
  <input id="deviceId" placeholder="例：电机-A-左前">
  <label>转速 / RPM</label>
  <input id="rpm" type="number" placeholder="例：1500">
  <label>音量归一化倍数（自动校准后可用）</label>
  <input id="gain" type="range" min="0.1" max="5" step="0.1" value="1" style="width:100%">
  <span style="font-size:11px;color:var(--mut)">当前倍率: <span id="gainVal">1.0</span>× · 点击"自动校准"可自适应距离</span>
  <div class="btn-row" style="margin-top:8px">
    <button id="calibBtn" class="sec">自动校准</button>
    <button id="saveRecBtn" class="sec">保存本次</button>
  </div>
</div>

<div class="card">
  <div class="row"><span class="k">已存记录</span><span class="val" id="recCount">0</span></div>
  <div class="row"><span class="k" id="devicesLabel">设备数</span><span class="val" id="deviceCount">0</span></div>
</div>

<div class="btn-row">
  <button id="dlCsvBtn" class="sec">下载CSV</button>
  <button id="dlJsonBtn" class="sec">下载JSON</button>
  <button id="reportBtn">生成报告</button>
</div>

<details class="card" style="margin-top:12px">
  <summary style="cursor:pointer;font-size:13px;color:var(--mut);user-select:none">▸ 历史记录</summary>
  <div id="historyList" style="font-size:12px;max-height:300px;overflow:auto;margin-top:8px"></div>
</details>

<div class="warn">需 HTTPS 或 localhost 才能使用麦克风。首次使用授权录音权限。</div>
<div style="position:fixed;right:6px;bottom:4px;z-index:999;font-size:10px;color:rgba(143,163,181,.5);pointer-events:none;user-select:none">v1.0.0 · 2026-07-22</div>

<script>
const cv=document.getElementById('spectrum'),ctx=cv.getContext('2d');
const dpr=window.devicePixelRatio||1;
cv.style.width='100%';cv.style.height='200px';
cv.width=600*dpr;cv.height=200*dpr;
ctx.setTransform(dpr,0,0,dpr,0,0);

let audioCtx=null,analyser=null,stream=null,mediaRecorder=null,recChunks=[];
let isRecording=false,audioBuffer=null,sourceNode=null;
let gainNode=null,currentGain=1;
let records=[];
let freqData=null;
let autoCalibDone=false;

// spectrum animation
function drawSpectrum(){
  requestAnimationFrame(drawSpectrum);
  if(!analyser) return;
  if(!freqData) freqData=new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(freqData);

  const w=600,h=200;
  ctx.clearRect(0,0,w,h);
  // gradient bars
  const barW=w/freqData.length*2;
  let maxIdx=0,maxVal=0;
  for(let i=0;i<freqData.length;i++){
    if(freqData[i]>maxVal){maxVal=freqData[i];maxIdx=i;}
    const x=i*barW;
    const bh=(freqData[i]/255)*h;
    const hue=120-(freqData[i]/255)*120;
    ctx.fillStyle=`hsl(${hue},80%,50%)`;
    ctx.fillRect(x,h-bh,Math.max(barW-1,1),bh);
  }
  // peak frequency
  const nyquist=audioCtx.sampleRate/2;
  const peakHz=Math.round(maxIdx/analyser.frequencyBinCount*nyquist);
  // dB level
  let sum=0;
  for(let i=0;i<freqData.length;i++) sum+=freqData[i]*freqData[i];
  const rms=Math.sqrt(sum/freqData.length);
  const db=Math.round(20*Math.log10((rms+1)/256));

  document.getElementById('dbVal').textContent=db+' dB';
  document.getElementById('peakFreq').textContent=peakHz+' Hz';

  // status
  let status='监测中';
  if(maxVal<15) status='无声/低噪';
  else if(peakHz<50&&maxVal>180) status='低频共振⚠';
  else if(maxVal>200) status='高振幅⚠';
  else status='正常';
  document.getElementById('statusVal').textContent=status;
  document.getElementById('statusVal').style.color=status.includes('⚠')?'var(--acc2)':'var(--acc)';
}
drawSpectrum();

// init audio
async function initAudio(){
  if(audioCtx) return true;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=2048;
    analyser.smoothingTimeConstant=0.85;
    gainNode=audioCtx.createGain();
    gainNode.gain.value=currentGain;
    gainNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mic=audioCtx.createMediaStreamSource(stream);
    mic.connect(gainNode);
    return true;
  }catch(e){alert('麦克风不可用:'+e.message);return false;}
}

// record
document.getElementById('recBtn').onclick=async()=>{
  if(!await initAudio()) return;
  if(isRecording){mediaRecorder.stop();return;}
  recChunks=[];
  mediaRecorder=new MediaRecorder(stream);
  mediaRecorder.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
  mediaRecorder.onstop=async()=>{
    const blob=new Blob(recChunks,{type:'audio/webm'});
    const ab=await blob.arrayBuffer();
    audioBuffer=await audioCtx.decodeAudioData(ab);
    document.getElementById('playBtn').disabled=false;
    document.getElementById('recBtn').textContent='录制';
    document.getElementById('stopBtn').disabled=true;
    isRecording=false;
  };
  mediaRecorder.start();
  isRecording=true;
  document.getElementById('recBtn').textContent='录制中…';
  document.getElementById('stopBtn').disabled=false;
};

document.getElementById('stopBtn').onclick=()=>{
  if(mediaRecorder&&mediaRecorder.state==='recording') mediaRecorder.stop();
};

document.getElementById('playBtn').onclick=()=>{
  if(!audioBuffer) return;
  if(sourceNode){try{sourceNode.stop()}catch(e){}}
  sourceNode=audioCtx.createBufferSource();
  sourceNode.buffer=audioBuffer;
  sourceNode.connect(audioCtx.destination);
  sourceNode.start();
  document.getElementById('playBtn').textContent='播放中…';
  sourceNode.onended=()=>{document.getElementById('playBtn').textContent='回放'};
};

// gain slider
document.getElementById('gain').oninput=function(){
  currentGain=parseFloat(this.value);
  document.getElementById('gainVal').textContent=currentGain.toFixed(1);
  if(gainNode) gainNode.gain.value=currentGain;
};

// auto calibration: record 2s, measure RMS, set gain to normalize to target level
document.getElementById('calibBtn').onclick=async()=>{
  if(!await initAudio()) return;
  document.getElementById('calibBtn').textContent='校准中…(2秒)';
  const chunks=[];
  const mr=new MediaRecorder(stream);
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mr.start();
  setTimeout(async()=>{
    mr.stop();
    mr.onstop=async()=>{
      const blob=new Blob(chunks,{type:'audio/webm'});
      const ab=await blob.arrayBuffer();
      const buf=await audioCtx.decodeAudioData(ab);
      const data=buf.getChannelData(0);
      let rms=0;
      for(let i=0;i<data.length;i++) rms+=data[i]*data[i];
      rms=Math.sqrt(rms/data.length);
      const target=0.05;
      currentGain=Math.min(5,Math.max(0.1,target/(rms+0.0001)));
      currentGain=Math.round(currentGain*10)/10;
      document.getElementById('gain').value=currentGain;
      document.getElementById('gainVal').textContent=currentGain.toFixed(1);
      if(gainNode) gainNode.gain.value=currentGain;
      document.getElementById('calibBtn').textContent='自动校准 ✓';
      autoCalibDone=true;
      setTimeout(()=>{document.getElementById('calibBtn').textContent='自动校准'},1500);
    };
  },2000);
};

// save recording
document.getElementById('saveRecBtn').onclick=()=>{
  if(!audioBuffer){alert('请先录制音频');return;}
  const deviceId=document.getElementById('deviceId').value||'未命名';
  const rpm=document.getElementById('rpm').value||'0';
  const data=audioBuffer.getChannelData(0);
  let rms=0,peak=0;
  for(let i=0;i<data.length;i++){
    rms+=data[i]*data[i];
    if(Math.abs(data[i])>peak) peak=Math.abs(data[i]);
  }
  rms=Math.sqrt(rms/data.length);

  // FFT analysis
  const offlineCtx=new OfflineAudioContext(1,audioBuffer.length,audioBuffer.sampleRate);
  const offlineSrc=offlineCtx.createBufferSource();
  offlineSrc.buffer=audioBuffer;
  const offlineAnalyser=offlineCtx.createAnalyser();
  offlineAnalyser.fftSize=4096;
  offlineSrc.connect(offlineAnalyser);
  offlineAnalyser.connect(offlineCtx.destination);
  offlineSrc.start(0);
  offlineCtx.startRendering().then(rendered=>{
    const fftData=new Float32Array(offlineAnalyser.frequencyBinCount);
    offlineAnalyser.getFloatFrequencyData(fftData);
    // find peaks
    const peaks=[];
    const binWidth=audioBuffer.sampleRate/2/offlineAnalyser.frequencyBinCount;
    for(let i=1;i<fftData.length-1;i++){
      if(fftData[i]>fftData[i-1]&&fftData[i]>fftData[i+1]&&fftData[i]>-60){
        peaks.push({hz:Math.round(i*binWidth),db:Math.round(fftData[i])});
      }
    }
    peaks.sort((a,b)=>b.db-a.db);
    const topPeaks=peaks.slice(0,10);

    const rec={
      idx:records.length+1,
      time:new Date().toISOString(),
      device:deviceId,
      rpm:parseInt(rpm),
      duration:audioBuffer.duration.toFixed(2),
      rms:rms.toFixed(6),
      peak:peak.toFixed(4),
      gain:currentGain,
      topPeaks:topPeaks,
      sampleRate:audioBuffer.sampleRate
    };
    records.push(rec);
    updateUI();
    document.getElementById('saveRecBtn').textContent='已保存 ✓';
    setTimeout(()=>{document.getElementById('saveRecBtn').textContent='保存本次'},800);
  });
};

function updateUI(){
  document.getElementById('recCount').textContent=records.length;
  const devices=new Set(records.map(r=>r.device));
  document.getElementById('deviceCount').textContent=devices.size;
  renderHistory();
}

function renderHistory(){
  const el=document.getElementById('historyList');
  el.innerHTML=records.slice().reverse().map(r=>{
    const peaks=r.topPeaks.map(p=>p.hz+'Hz('+p.db+'dB)').slice(0,5).join(', ');
    return `<div style="padding:4px 0;border-bottom:1px solid rgba(255,255,255,.08)">
      <b>#${r.idx}</b> ${r.device} @ ${r.rpm}RPM
      <span style="color:var(--mut);font-size:11px"> ${r.duration}s · RMS=${r.rms} · Peak=${r.peak}</span>
      <div style="color:var(--mut);font-size:10px">${peaks}</div></div>`;
  }).join('');
  renderReport();
}

function renderReport(){
  if(records.length<2) return;
  const devices={};
  records.forEach(r=>{
    if(!devices[r.device]) devices[r.device]=[];
    devices[r.device].push(r);
  });
  // generate simple report per device
  let html='';
  for(const[dev,recs] of Object.entries(devices)){
    recs.sort((a,b)=>a.rpm-b.rpm);
    const rmsList=recs.map(r=>parseFloat(r.rms)).sort((a,b)=>a-b);
    const avg=rmsList.reduce((a,b)=>a+b,0)/rmsList.length;
    const baseline=rmsList[0];
    const anomalies=recs.filter(r=>Math.abs(parseFloat(r.rms)-baseline)/baseline>0.3);
    html+=`<div style="margin:8px 0"><b>${dev}</b> (${recs.length}次) `;
    html+=`RMS均值=${(avg*1000).toFixed(1)}‰ `;
    if(anomalies.length) html+=`<span style="color:var(--acc2)">异常点:${anomalies.map(r=>'#'+r.idx).join(',')}</span>`;
    html+='</div>';
  }
  const el=document.getElementById('historyList');
  el.innerHTML+='<div style="margin-top:12px;padding-top:8px;border-top:1px solid var(--acc)"><b>时间序列分析</b></div>'+html;
}

// report
document.getElementById('reportBtn').onclick=renderReport;

// download CSV
document.getElementById('dlCsvBtn').onclick=()=>{
  if(!records.length){alert('暂无数据');return;}
  const cols=['idx','time','device','rpm','duration','rms','peak','gain','top1hz','top1db','top2hz','top2db','top3hz','top3db','sampleRate'];
  const lines=[cols.join(',')];
  records.forEach(r=>{
    const row=[
      r.idx,r.time,r.device,r.rpm,r.duration,r.rms,r.peak,r.gain,
      r.topPeaks[0]?r.topPeaks[0].hz:'',r.topPeaks[0]?r.topPeaks[0].db:'',
      r.topPeaks[1]?r.topPeaks[1].hz:'',r.topPeaks[1]?r.topPeaks[1].db:'',
      r.topPeaks[2]?r.topPeaks[2].hz:'',r.topPeaks[2]?r.topPeaks[2].db:'',
      r.sampleRate
    ];
    lines.push(row.map(v=>{
      const s=String(v==null?'':v);
      return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
    }).join(','));
  });
  const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  downloadBlob(blob,'motor_spectrum_'+tsName()+'.csv');
};

document.getElementById('dlJsonBtn').onclick=()=>{
  if(!records.length){alert('暂无数据');return;}
  const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'});
  downloadBlob(blob,'motor_spectrum_'+tsName()+'.json');
};

function tsName(){
  const p=n=>String(n).padStart(2,'0');
  const d=new Date();
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}

function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
