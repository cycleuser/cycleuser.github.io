/* ---------- 音高检测：YIN 算法（CMNDF，单音基频检测黄金标准） ----------
   相比自相关，YIN 对弱音、衰减音更灵敏更准，且用"非周期性"指标天然拒绝噪声。
   返回 { freq, aper, rms }：aper 越小越像稳定乐音（噪声接近 1）。 */
function detectYIN(data, sampleRate, fmin, fmax){
  var n = data.length, i;
  var rms = 0;
  for (i = 0; i < n; i++){ rms += data[i] * data[i]; }
  rms = Math.sqrt(rms / n);
  if (rms < 0.0006) return { freq: -1, aper: 1, rms: rms };

  var tauMin = Math.max(2, Math.floor(sampleRate / fmax));
  var tauMax = Math.min(n - 2, Math.ceil(sampleRate / fmin));
  var W = n - tauMax;
  if (W < 64 || tauMax <= tauMin) return { freq: -1, aper: 1, rms: rms };

  // 差分函数 d(tau)
  var d = new Float32Array(tauMax + 1);
  for (var tau = tauMin; tau <= tauMax; tau++){
    var sum = 0;
    for (var j = 0; j < W; j++){ var df = data[j] - data[j + tau]; sum += df * df; }
    d[tau] = sum;
  }
  // 累积均值归一化差分函数 (CMNDF)
  var dp = new Float32Array(tauMax + 1);
  dp[0] = 1; var running = 0;
  for (var t = 1; t <= tauMax; t++){ running += d[t]; dp[t] = running > 0 ? d[t] * (t / running) : 1; }

  // 绝对阈值：取第一个低于阈值的点（其后的局部最小）
  var TH = 0.15, tauEst = -1;
  for (var t2 = tauMin; t2 <= tauMax; t2++){
    if (dp[t2] < TH){ while (t2 + 1 <= tauMax && dp[t2 + 1] < dp[t2]) t2++; tauEst = t2; break; }
  }
  if (tauEst < 0){
    var best = 1e9;
    for (var t3 = tauMin; t3 <= tauMax; t3++){ if (dp[t3] < best){ best = dp[t3]; tauEst = t3; } }
    if (best > 0.35) return { freq: -1, aper: best, rms: rms };
  }
  // 抛物线插值
  var T0 = tauEst;
  if (T0 > tauMin && T0 < tauMax){
    var x0 = dp[T0 - 1], x2 = dp[T0], x3 = dp[T0 + 1];
    var a2 = (x0 + x3 - 2 * x2) / 2;
    var b2 = (x3 - x0) / 2;
    if (a2 !== 0) T0 = T0 - b2 / (2 * a2);
  }
  return { freq: sampleRate / T0, aper: dp[tauEst], rms: rms };
}

/* ---------- 目标音匹配检测 ----------
   先用全频段自相关求出真正的基频（取第一个显著峰，避免把高音周期的整数倍
   误当成低音），再看这个基频是否落在本调弦方案某一根弦的容差窗口内：
   落在窗口内 -> 命中该弦；否则（说话声、别的音、噪声）一律判为无信号。
   这样"其他音"不会被误触发。 */
var TOL_CENTS = 180;   // 每根弦接受的目标音容差（音分），约 ±1.8 个半音

function detectTargets(data, sampleRate, strings, lockIndex){
  var r = detectYIN(data, sampleRate, 27, 1400);
  if (r.freq <= 0) return { ok: false, rms: r.rms, val: 1 - r.aper };
  var ratio = Math.pow(2, TOL_CENTS / 1200);
  var idx = -1;
  if (lockIndex >= 0){
    var f0 = strings[lockIndex].freq;
    if (r.freq >= f0 / ratio && r.freq <= f0 * ratio) idx = lockIndex;
  } else {
    for (var i = 0; i < strings.length; i++){
      var f = strings[i].freq;
      if (r.freq >= f / ratio && r.freq <= f * ratio){ idx = i; break; }
    }
  }
  if (idx < 0) return { ok: false, rms: r.rms, val: 1 - r.aper };
  return { ok: true, freq: r.freq, index: idx, clarity: 1 - r.aper, rms: r.rms };
}

}

}
function buildTuneSel(){
  var sel = $('tuneSel');
  sel.innerHTML = '';
  TUNINGS[state.instrument].list.forEach(function(tn){
    var o = document.createElement('option');
    o.value = tn.id; o.textContent = tn.name[lang];
    if (tn.id === state.tuningId) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = function(){ state.tuningId = sel.value; state.targetIndex = -1; buildStrings(); };
}
function buildStrings(){
  var tn = currentTuning();
  state.strings = tn.notes.map(function(pair){
    var midi = nameToMidi(pair[0], pair[1]);
    return { midi: midi, freq: midiToFreq(midi, state.refA4), label: pair[0] + pair[1] };
  });
  state.dispIndex = -1; state.pendIndex = -1; state.pendCount = 0; state.missCount = 0; state.smooth = -1; state.hist.length = 0;
  var box = $('strBox');
  box.innerHTML = '';
  if (state.strings.length === 0){
    var span = document.createElement('span');
    span.className = 'legend';
    var CHROMA = { zh:'半音阶模式：自动识别任意音高。', en:'Chromatic: detects any note automatically.', ja:'クロマチックモード：任意の音を自動認識します。' };
    span.textContent = CHROMA[lang] || CHROMA.en;
    box.appendChild(span);
    return;
  }
  var autoBtn = document.createElement('button');
  autoBtn.className = 'str auto' + (state.targetIndex === -1 ? ' on' : '');
  autoBtn.textContent = t('auto');
  autoBtn.onclick = function(){ state.targetIndex = -1; buildStrings(); };
  box.appendChild(autoBtn);
  state.strings.forEach(function(s, idx){
    var b = document.createElement('button');
    b.className = 'str' + (state.targetIndex === idx ? ' on' : '');
    b.textContent = s.label;
    b.onclick = function(){ state.targetIndex = idx; buildStrings(); };
    box.appendChild(b);
  });
}

/* ---------- 画指针表 ---------- */
function drawGauge(cents, active){
  var cv = $('gauge');
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  var cx = W / 2, cy = H * 0.82, R = Math.min(W * 0.44, H * 0.72);
  var maxC = 50;
  // 弧
  ctx.lineWidth = 14;
  ctx.strokeStyle = '#31404f';
  ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI, 2 * Math.PI); ctx.stroke();
  // 绿区 -5..+5
  var a0 = Math.PI + (Math.PI) * ((-5 + maxC) / (2 * maxC));
  var a1 = Math.PI + (Math.PI) * ((5 + maxC) / (2 * maxC));
  ctx.strokeStyle = '#27ae60';
  ctx.beginPath(); ctx.arc(cx, cy, R, a0, a1); ctx.stroke();
  // 刻度
  ctx.strokeStyle = '#8fa3b5';
  ctx.lineWidth = 2;
  for (var c = -50; c <= 50; c += 10){
    var ang = Math.PI + Math.PI * ((c + maxC) / (2 * maxC));
    var r1 = R - 9, r2 = R - (c % 50 === 0 ? 20 : 14);
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1);
    ctx.lineTo(cx + Math.cos(ang) * r2, cy + Math.sin(ang) * r2);
    ctx.stroke();
  }
  // 数字 / 升降号
  ctx.fillStyle = '#8fa3b5';
  ctx.font = '20px -apple-system,system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  [[-50,'♭'],[0,'0'],[50,'♯']].forEach(function(p){
    var ang = Math.PI + Math.PI * ((p[0] + maxC) / (2 * maxC));
    ctx.fillText(p[1], cx + Math.cos(ang) * (R + 6), cy + Math.sin(ang) * (R + 6) + 4);
  });
  // 指针
  var shown = isFinite(cents) ? Math.max(-maxC, Math.min(maxC, cents)) : 0;
  var angN = Math.PI + Math.PI * ((shown + maxC) / (2 * maxC));
  var col = (!active || !isFinite(cents)) ? '#8fa3b5' : (Math.abs(cents) <= 5 ? '#27ae60' : (Math.abs(cents) <= 15 ? '#f1c40f' : '#c0392b'));
  ctx.strokeStyle = col;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(angN) * (R - 6), cy + Math.sin(angN) * (R - 6));
  ctx.stroke();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(cx, cy, 8, 0, 2 * Math.PI); ctx.fill();
}

/* ---------- 更新显示：半音阶模式 ---------- */
function updateReadout(freq, clarity){
  var active = freq > 0 && clarity >= 0.5;
  var shownFreq = active ? freq : -1;
  if (active){ state.smooth = (state.smooth > 0) ? (state.smooth * 0.65 + freq * 0.35) : freq; shownFreq = state.smooth; }
  else { state.smooth = -1; }

  var cents = NaN, target = null;
  if (shownFreq > 0){
    var midi = 69 + 12 * Math.log2(shownFreq / state.refA4);
    var r = Math.round(midi);
    target = { midi: r, freq: midiToFreq(r, state.refA4) };
    cents = (midi - r) * 100;
  }
  drawGauge(cents, active);
  if (shownFreq > 0){
    var nm = midiToName(target.midi);
    $('bigNote').textContent = nm.name; $('bigOct').textContent = nm.oct;
    $('hz').textContent = shownFreq.toFixed(1) + ' Hz';
    $('centsBig').textContent = fmtCents(cents);
    $('centsBig').className = (Math.abs(cents) <= 5) ? 'ok' : 'off';
    $('vTarget').textContent = nm.name + nm.oct + ' · ' + target.freq.toFixed(1) + ' Hz';
    $('vDetect').textContent = nm.name + nm.oct + ' · ' + shownFreq.toFixed(1) + ' Hz';
  } else {
    $('bigNote').textContent = '–'; $('bigOct').textContent = '';
    $('hz').textContent = '— Hz'; $('centsBig').textContent = '—'; $('centsBig').className = '';
    $('vTarget').textContent = '—'; $('vDetect').textContent = '—';
  }
  $('vMode').textContent = t('auto');
  highlight(-1);
}

/* ---------- 更新显示：目标音模式（只认当前调弦的几个音） ---------- */
function updateTargeted(res){
  // 信号强度条
  var lvl = res.rms ? Math.min(100, Math.sqrt(res.rms) * 320) : 0;
  $('levelBar').style.width = lvl.toFixed(0) + '%';

  if (res.ok){
    state.missCount = 0;
    if (res.index === state.pendIndex){ state.pendCount++; }
    else { state.pendIndex = res.index; state.pendCount = 1; }
    if (state.pendCount >= 1) state.dispIndex = res.index;

    // 中值滤波（去离群跳变）+ 自适应指数平滑（偏得远跟得快，接近时更稳）
    state.hist.push(res.freq);
    if (state.hist.length > 7) state.hist.shift();
    var srt = state.hist.slice().sort(function(a, b){ return a - b; });
    var med = srt[Math.floor(srt.length / 2)];
    if (state.smooth > 0){
      var diff = Math.abs(centsBetween(med, state.smooth));
      var alpha = (diff > 20) ? 0.55 : 0.32;
      state.smooth = state.smooth * (1 - alpha) + med * alpha;
    } else {
      state.smooth = med;
    }
  } else {
    state.pendIndex = -1; state.pendCount = 0;
    state.missCount++;
    if (state.missCount > 20) state.dispIndex = -1;
  }
  var idx = (state.dispIndex >= 0) ? state.dispIndex : (res.ok ? res.index : -1);
  if (idx < 0){
    state.smooth = -1; state.hist.length = 0;
    drawGauge(NaN, false);
    $('inTune').classList.remove('on');
    $('bigNote').textContent = '–'; $('bigOct').textContent = '';
    $('hz').textContent = '— Hz'; $('centsBig').textContent = '—'; $('centsBig').className = '';
    $('vTarget').textContent = (state.targetIndex >= 0) ? state.strings[state.targetIndex].label : '—';
    $('vDetect').textContent = '—';
    $('vMode').textContent = (state.targetIndex >= 0) ? (t('lock') + ' ' + state.strings[state.targetIndex].label) : t('auto');
    highlight(-1);
    return;
  }
  var target = state.strings[idx];
  var cents = centsBetween(state.smooth, target.freq);
  drawGauge(cents, true);
  var inTune = Math.abs(cents) <= 5;
  $('inTune').classList.toggle('on', inTune);
  var tn = midiToName(target.midi);
  $('bigNote').textContent = tn.name; $('bigOct').textContent = tn.oct;
  $('hz').textContent = state.smooth.toFixed(1) + ' Hz';
  $('centsBig').textContent = fmtCents(cents);
  $('centsBig').className = inTune ? 'ok' : 'off';
  $('vTarget').textContent = tn.name + tn.oct + ' · ' + target.freq.toFixed(1) + ' Hz';
  var dm = midiToName(Math.round(69 + 12 * Math.log2(state.smooth / state.refA4)));
  $('vDetect').textContent = dm.name + dm.oct + ' · ' + state.smooth.toFixed(1) + ' Hz';
  $('vMode').textContent = (state.targetIndex >= 0) ? (t('lock') + ' ' + target.label) : t('auto');
  highlight(idx);
}

/* ---------- 音频循环 ---------- */
function loop(){
  if (!state.running) return;
  analyser.getFloatTimeDomainData(buf);
  var sr = audioCtx.sampleRate;
  if (state.strings.length === 0){
    var r = detectYIN(buf, sr, 27, 1400);
    updateReadout(r.freq, 1 - r.aper);
    $('levelBar').style.width = Math.min(100, Math.sqrt(r.rms) * 320).toFixed(0) + '%';
  } else {
    var rt = detectTargets(buf, sr, state.strings, state.targetIndex);
    updateTargeted(rt);
  }
  rafId = requestAnimationFrame(loop);
}

async function startTuning(){
  $('errBox').style.display = 'none';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showErr(t('insecure'));
    return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true }
    });
  } catch (e){
    showErr(t('micDenied') + ' (' + (e && e.name ? e.name : 'error') + ')');
    return;
  }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended'){ try { await audioCtx.resume(); } catch(e){} }
  srcNode = audioCtx.createMediaStreamSource(micStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 4096;
  analyser.smoothingTimeConstant = 0;
  srcNode.connect(analyser);
  buf = new Float32Array(analyser.fftSize);
  state.running = true;
  state.smooth = -1;
  $('startBtn').textContent = t('stop');
  $('playBtn').disabled = false;
  $('warnBox').style.display = 'block';
  $('warnBox').textContent = t('listening');
  loop();
}

function stopTuning(){
  state.running = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = 0;
  if (micStream){ micStream.getTracks().forEach(function(tr){ tr.stop(); }); micStream = null; }
  if (srcNode){ try{ srcNode.disconnect(); }catch(e){} srcNode = null; }
  if (audioCtx){ try{ audioCtx.close(); }catch(e){} audioCtx = null; }
  analyser = null; buf = null;
  state.smooth = -1;
  $('startBtn').textContent = t('start');
  $('playBtn').disabled = true;
  $('warnBox').style.display = 'none';
  clearDisplay();
}

function showErr(msg){
  var e = $('errBox');
  e.style.display = 'block';
  e.textContent = msg;
}

/* 播放标准音 */
async function playRef(){
  var target = null;
  if (state.strings.length > 0){
    target = (state.targetIndex >= 0) ? state.strings[state.targetIndex] : state.strings[0];
  }
  if (!target) return;
  var ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended'){ try { await ctx.resume(); } catch(e){} }
  var osc = ctx.createOscillator();
  var g = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = target.freq;
  g.gain.value = 0;
  osc.connect(g); g.connect(ctx.destination);
  var now = ctx.currentTime;
  g.gain.linearRampToValueAtTime(0.28, now + 0.03);
  g.gain.setValueAtTime(0.28, now + 1.4);
  g.gain.linearRampToValueAtTime(0, now + 1.6);
  osc.start(now); osc.stop(now + 1.65);
  osc.onended = function(){ try{ g.disconnect(); osc.disconnect(); }catch(e){} if (!state.running && ctx !== audioCtx){ try{ ctx.close(); }catch(e){} } };
  $('warnBox').style.display = 'block';
  $('warnBox').textContent = t('playHint');
}

/* ---------- i18n ---------- */
function applyLang(){
  document.documentElement.lang = (lang === 'zh' ? 'zh' : 'en');
  $('langToggle').textContent = LANG_LABEL[LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]];
  $('ttl').textContent = t('title');
  $('subTxt').textContent = t('sub');
  $('tuneLbl').textContent = t('tune');
  $('refLbl').textContent = t('ref');
  $('startBtn').textContent = state.running ? t('stop') : t('start');
  $('playBtn').textContent = t('play');
  $('kTarget').textContent = t('target');
  $('kDetect').textContent = t('detect');
  $('kMode').textContent = t('mode');
  $('legend').textContent = t('legend');
  $('inTune').textContent = t('inTune');
  $('levelLbl').textContent = t('level');
  var HOME = { zh:'← 博客', en:'← Blog', ja:'← ブログ' };
  $('homeLink').textContent = HOME[lang] || HOME.en;
  buildInstTabs(); buildTuneSel(); buildStrings();
}

/* ---------- 事件绑定 ---------- */
$('startBtn').onclick = function(){ state.running ? stopTuning() : startTuning(); };
$('playBtn').onclick = function(){ playRef(); };
$('langToggle').onclick = function(){ lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]; applyLang(); };
$('refA4').onchange = function(){
  var v = parseFloat($('refA4').value);
  if (isNaN(v)) v = 440;
  v = Math.max(420, Math.min(460, v));
  $('refA4').value = v; state.refA4 = v;
  buildStrings();
};

applyLang();
drawGauge(NaN, false);
</script>
