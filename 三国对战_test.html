                ctx.shadowColor = '#ff6600';
                ctx.shadowBlur = 30;
                // Axe shape
                ctx.beginPath();
                ctx.moveTo(sx - 25, axeY);
                ctx.quadraticCurveTo(sx - 40, axeY + 30, sx, axeY + 60);
                ctx.quadraticCurveTo(sx + 40, axeY + 30, sx + 25, axeY);
                ctx.closePath();
                ctx.fill();
                // Trail
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(sx, axeY - 20);
                ctx.lineTo(sx, axeY - 100 - fallProg * 50);
                ctx.stroke();
            } else {
                // Shockwave impact
                const impactProg = (progress - 0.4) / 0.6;
                ctx.shadowColor = '#ff4400';
                ctx.shadowBlur = 25;
                // Ground crack lines
                ctx.strokeStyle = '#ff6600';
                ctx.lineWidth = 6 - impactProg * 4;
                for (let i = 0; i < 12; i++) {
                    const ang = (i / 12) * Math.PI * 2;
                    const len = 150 * impactProg;
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx + Math.cos(ang) * len, sy + Math.sin(ang) * len * 0.3);
                    ctx.stroke();
                }
                // Circular shockwaves
                for (let w = 0; w < 3; w++) {
                    const waveR = (50 + w * 40) * impactProg;
                    ctx.strokeStyle = '#ffaa44';
                    ctx.lineWidth = 4 - w;
                    ctx.globalAlpha = alpha * (1 - w * 0.3) * (1 - impactProg);
                    ctx.beginPath();
                    ctx.ellipse(sx, sy, waveR, waveR * 0.3, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
                // Debris
                ctx.fillStyle = '#884422';
                for (let d = 0; d < 20; d++) {
                    const debrisAng = Math.random() * Math.PI * 2;
                    const debrisR = Math.random() * 100 * impactProg;
                    const debrisY = sy - Math.sin(impactProg * Math.PI) * 80 * Math.random();
                    ctx.globalAlpha = alpha * (1 - impactProg);
                    ctx.fillRect(sx + Math.cos(debrisAng) * debrisR - 4, debrisY - 4, 8, 8);
                }
            }
            ctx.shadowBlur = 0;
            return true;
        }
        
        // 胡琴 - Musical Healing Waves
        if (weapon === '胡琴') {
            ctx.globalAlpha = alpha;
            ctx.shadowColor = '#ff88cc';
            ctx.shadowBlur = 15;
            // Musical notes floating
            const noteSymbols = ['♪', '♫', '♬', '♩'];
            for (let i = 0; i < 12; i++) {
                const noteAng = (i / 12) * Math.PI * 2 + this.phase;
                const noteR = 60 + Math.sin(this.phase * 2 + i) * 30;
                const noteX = sx + Math.cos(noteAng) * noteR * progress;
                const noteY = sy - 40 + Math.sin(noteAng * 2) * 30 - progress * 50;
                ctx.font = '24px Arial';
                ctx.fillStyle = `hsl(${(i * 30 + this.phase * 50) % 360}, 80%, 70%)`;
                ctx.globalAlpha = alpha * (0.5 + Math.sin(this.phase + i) * 0.5);
                ctx.fillText(noteSymbols[i % 4], noteX, noteY);
            }
            // Sound waves
            ctx.globalAlpha = alpha * 0.6;
            for (let w = 0; w < 5; w++) {
                const waveR = (30 + w * 25) * progress;
                ctx.strokeStyle = `hsl(${(w * 40 + this.phase * 30) % 360}, 70%, 60%)`;
                ctx.lineWidth = 3 - w * 0.4;
                ctx.beginPath();
                ctx.arc(sx, sy - 30, waveR, 0, Math.PI * 2);
                ctx.stroke();
            }
            // Healing sparkles
            ctx.fillStyle = '#ffaaff';
            for (let s = 0; s < 20; s++) {
                const sparkAng = Math.random() * Math.PI * 2;
                const sparkR = Math.random() * 80 * progress;
                ctx.globalAlpha = alpha * Math.random();
                ctx.beginPath();
                ctx.arc(sx + Math.cos(sparkAng) * sparkR, sy - 30 + Math.sin(sparkAng) * sparkR, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            return true;
        }
        
        return false;
    }
    
    // Blade weapons - Crescent slash waves
    drawBladeMusou(ctx, sx, sy, progress, alpha) {
        ctx.globalAlpha = alpha;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;
        // Multiple spinning crescent slashes
        for (let ring = 0; ring < 3; ring++) {
            const ringR = (40 + ring * 35) * progress;
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 5 - ring;
            for (let i = 0; i < 4; i++) {
                const ang = (i / 4) * Math.PI * 2 + this.phase * (ring % 2 === 0 ? 1 : -1);
                ctx.beginPath();
                ctx.arc(sx, sy, ringR, ang, ang + Math.PI * 0.5);
                ctx.stroke();
            }
        }
        // Central slash cross
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#ffffff';
        const slashLen = 80 * progress;
        ctx.beginPath();
        ctx.moveTo(sx - slashLen, sy - slashLen * 0.5);
        ctx.lineTo(sx + slashLen, sy + slashLen * 0.5);
        ctx.moveTo(sx + slashLen, sy - slashLen * 0.5);
        ctx.lineTo(sx - slashLen, sy + slashLen * 0.5);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
    
    // Spear weapons - Thrust beam
    drawSpearMusou(ctx, sx, sy, progress, alpha) {
        ctx.globalAlpha = alpha;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 20;
        // Forward thrust beam
        const beamLen = 250 * progress;
        const dir = this.character.direction >= 0 ? 1 : -1;
        const grad = ctx.createLinearGradient(sx, sy, sx + dir * beamLen, sy);
        grad.addColorStop(0, this.color);
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(sx, sy - 15);
        ctx.lineTo(sx + dir * beamLen, sy);
        ctx.lineTo(sx, sy + 15);
        ctx.closePath();
        ctx.fill();
        // Spiral energy
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;
        for (let i = 0; i < beamLen; i += 15) {
            const spiralY = Math.sin(i * 0.1 + this.phase * 3) * 20;
            ctx.beginPath();
            ctx.arc(sx + dir * i, sy + spiralY, 8, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.shadowBlur = 0;
    }
    
    // Bow/Crossbow weapons - Arrow/Bolt rain
    drawBowMusou(ctx, sx, sy, progress, alpha, isCrossbow = false) {
        ctx.globalAlpha = alpha;
        ctx.shadowColor = isCrossbow ? '#88ff88' : '#ffff00';
        ctx.shadowBlur = 10;
        
        if (isCrossbow) {
            // Crossbow: Horizontal bolt storm (rapid fire spread)
            const numBolts = 35;
            for (let i = 0; i < numBolts; i++) {
                const delay = i * 0.02;
                if (progress < delay) continue;
                const boltProg = (progress - delay) / (1 - delay);
                const dir = this.character.direction >= 0 ? 1 : -1;
                const startX = sx;
                const startY = sy - 60 + (i % 5) * 25;
                const endX = sx + dir * 300;
                const boltX = startX + (endX - startX) * boltProg;
                const boltY = startY + Math.sin(boltProg * Math.PI * 2 + i) * 10;
                
                // Bolt shaft
                ctx.strokeStyle = '#8b7355';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(boltX, boltY);
                ctx.lineTo(boltX - dir * 20, boltY);
                ctx.stroke();
                
                // Bolt head
                ctx.fillStyle = '#c0c0c0';
                ctx.beginPath();
                ctx.moveTo(boltX + dir * 8, boltY);
                ctx.lineTo(boltX, boltY - 3);
                ctx.lineTo(boltX, boltY + 3);
                ctx.closePath();
                ctx.fill();
                
                // Trail effect
                ctx.strokeStyle = 'rgba(136, 255, 136, 0.4)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(boltX - dir * 20, boltY);
                ctx.lineTo(boltX - dir * 50, boltY);
                ctx.stroke();
            }
        } else {
            // Bow: Rain of arrows from above
            const numArrows = 25;
            for (let i = 0; i < numArrows; i++) {
                const delay = i * 0.03;
                if (progress < delay) continue;
                const arrowProg = (progress - delay) / (1 - delay);
                const startX = sx - 150 + i * 12;
                const startY = -50;
                const endY = sy + 20;
                const arrowY = startY + (endY - startY) * arrowProg;
                const arrowX = startX + (arrowProg * 30);
                // Arrow body
                ctx.strokeStyle = '#ffdd44';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(arrowX, arrowY);
                ctx.lineTo(arrowX - 5, arrowY - 25);
                ctx.stroke();
                // Arrow head
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(arrowX, arrowY + 5);
                ctx.lineTo(arrowX - 3, arrowY);
                ctx.lineTo(arrowX + 3, arrowY);
                ctx.fill();
                // Impact if landed
                if (arrowProg > 0.9) {
                    ctx.fillStyle = '#ffaa00';
                    ctx.globalAlpha = alpha * (1 - (arrowProg - 0.9) * 10);
                    ctx.beginPath();
                    ctx.arc(arrowX, endY, 10 * (arrowProg - 0.9) * 10, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        ctx.shadowBlur = 0;
    }
    
    // Fan weapons - Wind tornado
    drawFanMusou(ctx, sx, sy, progress, alpha) {
        ctx.globalAlpha = alpha * 0.8;
        ctx.shadowColor = '#88ffaa';
        ctx.shadowBlur = 15;
        // Tornado vortex
        const tornadoH = 180 * progress;
        for (let y = 0; y < tornadoH; y += 8) {
            const widthAtY = 20 + (tornadoH - y) * 0.4;
            const rotOffset = y * 0.05 + this.phase * 3;
            ctx.strokeStyle = `rgba(136, 255, 170, ${0.3 + (y / tornadoH) * 0.5})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(sx, sy - y, widthAtY, widthAtY * 0.3, rotOffset, 0, Math.PI * 2);
            ctx.stroke();
        }
        // Swirling leaves/debris
        ctx.fillStyle = '#44aa66';
        for (let i = 0; i < 15; i++) {
            const leafAng = (i / 15) * Math.PI * 4 + this.phase * 2;
            const leafY = sy - (i / 15) * tornadoH;
            const leafR = 15 + (tornadoH - (sy - leafY)) * 0.3;
            const leafX = sx + Math.cos(leafAng) * leafR;
            ctx.globalAlpha = alpha * (0.4 + Math.random() * 0.4);
            ctx.beginPath();
            ctx.ellipse(leafX, leafY, 6, 3, leafAng, 0, Math.PI * 2);
            ctx.fill();
        }
        // Wind character (风) appearing at top
        if (progress > 0.5) {
            ctx.globalAlpha = alpha * (progress - 0.5) * 2;
            ctx.font = 'bold 40px Microsoft YaHei';
            ctx.fillStyle = '#aaffcc';
            ctx.textAlign = 'center';
            ctx.fillText('风', sx, sy - tornadoH - 20);
        }
        ctx.shadowBlur = 0;
    }
    
    // Halberd weapons - Triple crescent attack
    drawHalberdMusou(ctx, sx, sy, progress, alpha) {
        ctx.globalAlpha = alpha;
        ctx.shadowColor = '#ff8844';
        ctx.shadowBlur = 20;
        // Triple expanding crescents
        for (let c = 0; c < 3; c++) {
            const cDelay = c * 0.15;
            if (progress < cDelay) continue;
            const cProg = (progress - cDelay) / (1 - cDelay);
            const cR = 60 * cProg;
            const cAng = (c / 3) * Math.PI * 2 + this.phase;
            ctx.strokeStyle = c === 0 ? '#ffaa44' : '#ff6622';
            ctx.lineWidth = 6 - c;
            // Main crescent
            ctx.beginPath();
            ctx.arc(sx, sy - 30, cR, cAng, cAng + Math.PI * 0.8);
            ctx.stroke();
            // Side crescents
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(sx, sy - 30, cR * 0.7, cAng + Math.PI, cAng + Math.PI * 1.5);
            ctx.stroke();
        }
        // Energy burst center
        const burstR = 30 * progress;
        ctx.fillStyle = '#ffcc00';
        ctx.globalAlpha = alpha * 0.6;
        ctx.beginPath();
        ctx.arc(sx, sy - 30, burstR, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    // Default musou for other weapons
    drawDefaultMusou(ctx, sx, sy, progress, alpha) {
        ctx.globalAlpha = alpha;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;
        // Energy burst rings
        for (let i = 0; i < 3; i++) {
            const ringR = (30 + i * 40) * progress;
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 5 - i;
            ctx.beginPath();
            ctx.arc(sx, sy, ringR, 0, Math.PI * 2);
            ctx.stroke();
        }
        // Radiating lines
        ctx.lineWidth = 3;
        for (let i = 0; i < 12; i++) {
            const ang = (i / 12) * Math.PI * 2 + this.phase;
            const innerR = 20 * progress;
            const outerR = 100 * progress;
            ctx.beginPath();
            ctx.moveTo(sx + Math.cos(ang) * innerR, sy + Math.sin(ang) * innerR);
            ctx.lineTo(sx + Math.cos(ang) * outerR, sy + Math.sin(ang) * outerR);
            ctx.stroke();
        }
        ctx.shadowBlur = 0;
    }
}

// ========== WEATHER SYSTEM ==========
let currentWeather = WEATHER_NONE;
let weatherIntensity = 0;
let weatherTransition = 0;
let rainDrops = [];
let snowFlakes = [];
let fogParticles = [];
let windParticles = [];

class RainDrop {
    constructor() {
        this.reset();
    }
    reset() {
        this.x = Math.random() * (SCREEN_WIDTH + 100) - 50;
        this.y = -20;
        this.speed = 12 + Math.random() * 8;
        this.length = 15 + Math.random() * 20;
        this.opacity = 0.3 + Math.random() * 0.4;
        this.windOffset = 2;
    }
    update() {
        this.y += this.speed;
        this.x += this.windOffset;
        if (this.y > SCREEN_HEIGHT) this.reset();
    }
    draw(ctx) {
        ctx.strokeStyle = `rgba(180, 200, 255, ${this.opacity})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + this.windOffset * 2, this.y + this.length);
        ctx.stroke();
    }
}

class SnowFlake {
    constructor() {
        this.reset();
    }
    reset() {
        this.x = Math.random() * SCREEN_WIDTH;
        this.y = -10;
        this.size = 1 + Math.random() * 4;
        this.speed = 1 + Math.random() * 2;
        this.wobble = Math.random() * Math.PI * 2;
        this.wobbleSpeed = 0.02 + Math.random() * 0.03;
        this.opacity = 0.5 + Math.random() * 0.5;
    }
    update() {
        this.y += this.speed;
        this.wobble += this.wobbleSpeed;
        this.x += Math.sin(this.wobble) * 1.5;
        if (this.y > SCREEN_HEIGHT) this.reset();
    }
    draw(ctx) {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

class FogParticle {
    constructor() {
        this.reset();
    }
    reset() {
        this.x = -100;
        this.y = GROUND_Y - 50 + Math.random() * 100;
        this.size = 100 + Math.random() * 150;
        this.speed = 0.3 + Math.random() * 0.5;
        this.opacity = 0.1 + Math.random() * 0.2;
        this.life = 300 + Math.random() * 200;
    }
    update() {
        this.x += this.speed;
        this.life--;
        if (this.life <= 0 || this.x > SCREEN_WIDTH + 200) this.reset();
    }
    draw(ctx) {
        const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
        grad.addColorStop(0, `rgba(150, 160, 180, ${this.opacity})`);
        grad.addColorStop(1, 'rgba(150, 160, 180, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

// Initialize weather particles
function initWeather() {
    rainDrops = [];
    for (let i = 0; i < 150; i++) {
        const drop = new RainDrop();
        drop.y = Math.random() * SCREEN_HEIGHT;
        rainDrops.push(drop);
    }
    snowFlakes = [];
    for (let i = 0; i < 100; i++) {
        const flake = new SnowFlake();
        flake.y = Math.random() * SCREEN_HEIGHT;
        snowFlakes.push(flake);
    }
    fogParticles = [];
    for (let i = 0; i < 15; i++) {
        const fog = new FogParticle();
        fog.x = Math.random() * SCREEN_WIDTH;
        fogParticles.push(fog);
    }
}
initWeather();

function updateWeather() {
    if (weatherTransition > 0) {
        weatherTransition = Math.max(0, weatherTransition - 0.15);
    }
    if (currentWeather === WEATHER_RAIN) {
        rainDrops.forEach(d => d.update());
    } else if (currentWeather === WEATHER_SNOW) {
        snowFlakes.forEach(s => s.update());
    } else if (currentWeather === WEATHER_FOG) {
        fogParticles.forEach(f => f.update());
    }
}

function drawWeather(ctx) {
    if (weatherTransition <= 0) return;
    const alpha = weatherTransition / 100;
    
    ctx.save();
    ctx.globalAlpha = alpha;
    
    if (currentWeather === WEATHER_RAIN) {
        rainDrops.forEach(d => d.draw(ctx));
    } else if (currentWeather === WEATHER_SNOW) {
        snowFlakes.forEach(s => s.draw(ctx));
    } else if (currentWeather === WEATHER_FOG) {
        fogParticles.forEach(f => f.draw(ctx));
    }
    
    ctx.restore();
}

function setWeather(weather, intensity = 100) {
    currentWeather = weather;
    weatherTransition = intensity;
}

// ========== DYNAMIC LIGHTING SYSTEM ==========
let dynamicLights = [];

class DynamicLight {
    constructor(x, y, radius, color, intensity = 1) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.color = color;
        this.intensity = intensity;
        this.flicker = 0;
        this.flickerSpeed = 0.05 + Math.random() * 0.1;
    }
    update() {
        this.flicker += this.flickerSpeed;
    }
    draw(ctx) {
        const flickerAmount = Math.sin(this.flicker) * 0.15 + 1;
        const r = this.radius * flickerAmount;
        const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
        grad.addColorStop(0, this.color.replace(')', `, ${0.3 * this.intensity * flickerAmount})`).replace('rgb', 'rgba'));
        grad.addColorStop(0.5, this.color.replace(')', `, ${0.1 * this.intensity * flickerAmount})`).replace('rgb', 'rgba'));
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
        ctx.fill();
    }
}

function addLight(x, y, radius, color, intensity = 1) {
    dynamicLights.push(new DynamicLight(x, y, radius, color, intensity));
}

function updateLights() {
    dynamicLights.forEach(l => {
        l.update();
        l.intensity *= 0.98; // Auto-decay
    });
    dynamicLights = dynamicLights.filter(l => l.intensity > 0.01);
}

function drawLights(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    dynamicLights.forEach(l => l.draw(ctx));
    ctx.restore();
}

// ========== COMBO SYSTEM ==========
let comboSystem = {
    combos: {},
    maxCombo: 0,
    currentCombo: 0,
    comboTimer: 0,
    comboDisplay: []
};

class ComboEntry {
    constructor(attacker, damage, type) {
        this.attacker = attacker;
        this.damage = damage;
        this.type = type;
        this.time = 0;
        this.maxTime = 60;
        this.y = 0;
    }
    update() {
        this.time++;
        this.y -= 1.5;
    }
    draw(ctx, x) {
        const alpha = 1 - this.time / this.maxTime;
        ctx.globalAlpha = alpha;
        ctx.font = `bold ${16 + this.damage * 0.1}px Microsoft YaHei, sans-serif`;
        ctx.fillStyle = this.type === 'critical' ? '#ffcc00' : 
                       this.type === 'musou' ? '#ff44ff' : '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText(`${this.damage}`, x, 100 + this.y);
        ctx.globalAlpha = 1;
    }
}

function addCombo(attacker, damage, type = 'normal') {
    comboSystem.currentCombo++;
    comboSystem.comboTimer = 90;
    comboSystem.maxCombo = Math.max(comboSystem.maxCombo, comboSystem.currentCombo);
    comboSystem.comboDisplay.push(new ComboEntry(attacker, damage, type));
    
    if (comboSystem.comboDisplay.length > 5) {
        comboSystem.comboDisplay.shift();
    }
}

function updateComboSystem() {
    if (comboSystem.comboTimer > 0) {
        comboSystem.comboTimer--;
    } else {
        comboSystem.currentCombo = 0;
    }
    comboSystem.comboDisplay = comboSystem.comboDisplay.filter(c => {
        c.update();
        return c.time < c.maxTime;
    });
}

function drawComboDisplay(ctx) {
    if (comboSystem.currentCombo >= 3) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = 'bold 28px Microsoft YaHei, sans-serif';
        
        const pulse = Math.sin(Date.now() * 0.01) * 0.2 + 1;
        ctx.fillStyle = `rgba(255, 200, 50, ${0.8 * pulse})`;
        ctx.fillText(`${comboSystem.currentCombo} 连击!`, SCREEN_WIDTH / 2, 130);
        
        ctx.restore();
    }
    
    comboSystem.comboDisplay.forEach((c, i) => {
        c.draw(ctx, SCREEN_WIDTH / 2 - 50 + i * 25);
    });
}

// Legacy simple MusouEffect for backwards compatibility
class MusouEffect {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.life = 40; this.maxLife = 40;
        this.radius = 10;
    }
    update() { this.life--; this.radius += 8; }
    draw(ctx, ox, oy) {
        if (this.life > 0) {
            const progress = 1 - this.life / this.maxLife;
            const alpha = 1 - progress;
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 6 * (1 - progress);
            ctx.globalAlpha = alpha * 0.8;
            ctx.beginPath();
            ctx.arc(this.x - ox, this.y - oy, this.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
        }
    }
}

function spawnMusouEffect(x, y, color, character = null) {
    if (character) {
        musouEffects.push(new CharacterMusouEffect(x, y, character));
    } else {
        musouEffects.push(new MusouEffect(x, y, color));
    }
    // Also spawn particles
    spawnParticles(x, y, 25, color, 10, 5);
    spawnParticles(x, y, 20, '#ffff00', 8, 4);
    spawnParticles(x, y, 15, '#ffffff', 6, 3);
}

// ========== CHARACTER ==========
class Character {
    constructor(name, faction, blood, attack, defense, range, weapon, isPlayer = false) {
        this.name = name;
        this.faction = faction;
        this.blood = blood;
        this.maxBlood = blood;
        this.attackPower = attack;
        this.defensePower = defense;
        // Use weapon range if available, otherwise use character base range
        this.attackRange = (ALL_WEAPONS[weapon]) ? ALL_WEAPONS[weapon].range : range;
        this.weapon = weapon;
        this.isPlayer = isPlayer;
        this.x = SCREEN_WIDTH / 2;
        this.y = GROUND_Y;
        this.vx = 0; this.vy = 0;
        this.direction = 0;
        this.radius = 25;
        this.isAlive = true;
        this.onGround = true;
        // Speed inversely related to attack power: stronger = slower
        // Base attack ~35, each point above/below adjusts speed
        this.maxSpeed = clamp(MAX_SPEED - (attack - 35) * 0.04, 4.5, 8.5);
        this.jumpStrength = 14;
        this.attackCooldown = 350;
        this.lastAttackTime = 0;
        this.attacking = false;
        this.attackDuration = 0;
        this.attackAnimTotal = 200;
        this.attackDirRad = 0;
        this.attackIsRanged = false;
        this.defending = false;
        this.defenseTimer = 0;
        this.hitTimer = 0;
        this.runPhase = 0;
        this.idlePhase = Math.random() * 100;
        this.torsoTilt = 0;
        this.moveLeft = false;
        this.moveRight = false;
        // Musou (Ultimate) system
        this.musou = 0;           // Current musou gauge
        this.musouMax = 8;        // Max musou (filled by musouMax hits)
        this.musouActive = false; // Is musou attack active?
        this.musouTimer = 0;      // Timer for musou effect display
        this.lastMusouName = '';  // For displaying skill name
        // Dodge roll system
        this.dodging = false;
        this.dodgeTimer = 0;
        this.dodgeCooldown = 0;
        this.dodgeDir = 0;
        this.dodgeInvincible = false; // Invincibility frames during dodge
        // Hitstun and blockstun
        this.hitstun = 0;
        this.blockstun = 0;
        // Smoothed render state
        this.currLx = this.x - 10; this.currLy = GROUND_Y;
        this.currRx = this.x + 10; this.currRy = GROUND_Y;
        this.currHxL = this.x; this.currHyL = this.y - 30;
        this.currHxR = this.x; this.currHyR = this.y - 30;
    }
    
    getColor() { return getFactionColor(this.faction); }
    
    moveByInput(dt) {
        if (!this.isAlive) return;
        // Can't move during hitstun or blockstun (but dodge roll overrides)
        if (this.hitstun > 0 || this.blockstun > 0) {
            this.vx *= Math.pow(0.9, dt / 16.67); // Friction during stun
            this.x += this.vx * (dt / 16.67);
            this.x = clamp(this.x, this.radius, SCREEN_WIDTH - this.radius);
            return;
        }
        const dtScale = dt / 16.67;
        let ax = 0;
        if (this.moveLeft) ax -= ACCEL;
        if (this.moveRight) ax += ACCEL;
        this.vx += ax * dtScale;
        if (!this.moveLeft && !this.moveRight) this.vx *= Math.pow(FRICTION, dtScale);
        this.vx = clamp(this.vx, -this.maxSpeed, this.maxSpeed);
        this.x += this.vx * dtScale;
        this.x = clamp(this.x, this.radius, SCREEN_WIDTH - this.radius);
    }
    
    attemptJump() {
        if (this.onGround && this.isAlive) {
            this.vy = -this.jumpStrength;
            this.onGround = false;
        }
    }
    
    attemptDodge(direction) {
        if (!this.isAlive || this.dodging || this.dodgeCooldown > 0) return false;
        if (this.hitstun > 0 || this.blockstun > 0) return false;
        this.dodging = true;
        this.dodgeTimer = 20; // frames
        this.dodgeCooldown = 45; // cooldown frames
        this.dodgeDir = direction;
        this.dodgeInvincible = true;
        this.vx = direction * 12; // Fast dash
        this.vy = -3; // Slight hop
        this.onGround = false;
        return true;
    }
    
    applyPhysics(dt) {
        const dtScale = dt / 16.67;
        this.vy += GRAVITY * dtScale;
        this.y += this.vy * dtScale;
        if (this.y >= GROUND_Y) {
            this.y = GROUND_Y;
            this.vy = 0;
            this.onGround = true;
        } else {
            this.onGround = false;
        }
    }
    
    faceEnemy(enemy) {
        const dx = enemy.x - this.x;
        // When overlapping, keep previous direction to avoid flickering
        if (Math.abs(dx) < 2) return;
        this.direction = dx >= 0 ? 0 : 180;
    }
    
    attack(enemy, currentTime) {
        if (!this.isAlive || !enemy.isAlive) return null;
        if (currentTime - this.lastAttackTime < this.attackCooldown) return null;
        if (this.hitstun > 0 || this.blockstun > 0 || this.dodging) return null;
        
        const dx = enemy.x - this.x;
        const dy = enemy.y - this.y;
        const distance = hypot(dx, dy);
        const rad = this.direction * Math.PI / 180;
        const frontDot = dx * Math.cos(rad) + dy * Math.sin(rad);
        const angleToEnemy = Math.atan2(dy, dx) * 180 / Math.PI;
        let angDiff = ((angleToEnemy - this.direction + 180) % 360) - 180;
        
        if (distance <= this.attackRange && frontDot > 0 && Math.abs(angDiff) <= ATTACK_FOV_DEG / 2) {
            let realDamage = Math.floor(this.attackPower * (1 - enemy.defensePower / 100));
            let isCrit = false;
            let isInstantKill = false;
            
            // Check if musou is full - trigger musou attack
            if (this.musou >= this.musouMax) {
                this.musouActive = true;
                this.musouTimer = 1500;  // Effect display duration
                this.lastMusouName = this.special;
                
                // Musou attack: 3x damage boost
                realDamage = Math.floor(realDamage * 3);
                isCrit = true;
                
                // Instant kill chance: capped at 12%, scales with attack but has a hard limit
                const instantKillChance = Math.min(0.12, 0.08 + this.attackPower * 0.0003);
                if (Math.random() < instantKillChance) {
                    realDamage = enemy.blood + 1;  // Guarantee kill
                    isInstantKill = true;
                }
                
                // Reset musou
                this.musou = 0;
                
                // Musou visual effects - pass character for unique animations
                spawnMusouEffect(this.x, this.y - 40, this.getColor(), this);
                shake(15, 12);  // Stronger shake for ultimate
                
                // Add dynamic light for musou
                addLight(this.x, this.y - 40, 100, this.getColor(), 1.5);
                
                // Add to combo system
                addCombo(this, realDamage, 'musou');
            } else {
                // Normal hit builds musou
                this.musou++;
                
                // Critical hit chance
                if (Math.random() < 0.1) {
                    realDamage = Math.floor(realDamage * 1.5);
                    isCrit = true;
                    addCombo(this, realDamage, 'critical');
                } else {
                    addCombo(this, realDamage, 'normal');
                }
            }
            
            const msg = enemy.takeDamage(realDamage, this, isCrit, isInstantKill);
            this.attackDirRad = Math.atan2(dy, dx);
            this.attackIsRanged = false;
            
            // Track max damage for achievement
            if (realDamage > (achievementData.maxDamage || 0)) {
                achievementData.maxDamage = realDamage;
                saveAchievements();
            }
            
            const cat = weaponCategory(this.weapon);
            const animMap = { spear: 240, blade: 300, sword: 240, axe: 320, whip: 280, fan: 220 };
            this.attackAnimTotal = animMap[cat] || 260;
            
            // Spawn weapon-specific slash trail
            const slashIntensity = this.musouActive ? 2 : (isCrit ? 1.5 : 1);
            spawnSlashTrail(this.x, this.y - 20, this.attackDirRad, this.attackRange, cat, this.getColor(), slashIntensity);
            
            this.lastAttackTime = currentTime;
            this.attacking = true;
            this.attackDuration = this.attackAnimTotal;
            
            if (isInstantKill) {
                return `${this.name} 发动无双「${this.special}」，秒杀 ${enemy.name}！`;
            } else if (isCrit) {
                return `${this.name} 发动无双「${this.special}」，暴击 ${enemy.name}，造成 ${realDamage} 点伤害！`;
            }
            return `${this.name} 使用 ${this.weapon} 攻击 ${enemy.name}，造成 ${realDamage} 点伤害`;
        }
        return null;
    }
    
    tryRangedAttack(enemy, currentTime) {
        if (!this.isAlive || !enemy.isAlive) return [null, null];
        if (this.hitstun > 0 || this.blockstun > 0 || this.dodging) return [null, null];
        
        const cat = weaponCategory(this.weapon);
        const isBow = ['强弓', '弓', '长弓'].includes(this.weapon) || this.name === '黄忠';
        const isCrossbow = cat === 'crossbow';
        
        if (isBow || isCrossbow) {
            const cooldown = isCrossbow ? this.attackCooldown * 0.6 : this.attackCooldown;
            if (currentTime - this.lastAttackTime < cooldown) return [null, null];
            
            const dx = enemy.x - this.x;
            const dy = enemy.y - this.y;
            const ang = Math.atan2(dy, dx);
            const speed = isCrossbow ? clamp(this.attackRange * 0.15, 8, 16) : clamp(this.attackRange * 0.12, 6, 14);
            const ax = this.x + Math.cos(ang) * (this.radius + 4);
            const ay = this.y - this.radius;
            
            let power = this.attackPower;
            let isMusou = false;
            let isCrit = false;
            let msg = '';
            
            // Check if musou is full - trigger musou ranged attack
            if (this.musou >= this.musouMax) {
                isMusou = true;
                this.musouActive = true;
                this.musouTimer = 1500;
                this.lastMusouName = this.special;
                power = Math.floor(power * 3); // 3x damage
                
                // Instant kill chance for musou arrows
                const instantKillChance = Math.min(0.12, 0.08 + this.attackPower * 0.0003);
                if (Math.random() < instantKillChance) {
                    power = 9999; // Guarantee kill
                }
                
                this.musou = 0;
                isCrit = true;
                
                // Musou visual effects
                spawnMusouEffect(this.x, this.y - 40, this.getColor(), this);
                shake(15, 12);
                addLight(this.x, this.y - 40, 100, this.getColor(), 1.5);
                addCombo(this, power, 'musou');
                
                // Musou arrow - enhanced projectile
                spawnSlashTrail(this.x, this.y - 20, ang, this.attackRange, 'bow', this.getColor(), 2);
                msg = `${this.name} 发动无双「${this.special}」，射出无双之箭！`;
            } else {
                // Normal hit builds musou
                this.musou++;
                
                // Critical hit chance
                if (Math.random() < 0.1) {
                    power = Math.floor(power * 1.5);
                    isCrit = true;
                    addCombo(this, power, 'critical');
                } else {
                    addCombo(this, power, 'normal');
                }
                msg = isCrossbow ? `${this.name} 向 ${enemy.name} 射出弩箭` : `${this.name} 向 ${enemy.name} 射出一箭`;
            }
            
            const proj = new Arrow(ax, ay, Math.cos(ang) * speed, Math.sin(ang) * speed, this, power, this.attackRange);
            proj.isBolt = isCrossbow;
            proj.isMusou = isMusou;
            proj.isCrit = isCrit;
            this.attackDirRad = ang;
            this.attackIsRanged = true;
            this.attackAnimTotal = isCrossbow ? 180 : 280;
            this.lastAttackTime = currentTime;
            this.attacking = true;
            this.attackDuration = this.attackAnimTotal;
            
            return [proj, msg];
        }
        return [null, null];
    }
    
    takeDamage(damage, attacker, isCrit = false, isInstantKill = false) {
        // Dodge roll invincibility
        if (this.dodgeInvincible) return null;
        
        const cat = weaponCategory(this.weapon);
        const hasShield = cat === 'shield' || cat === 'sword_shield';
        
        if (this.defending && this.defenseTimer > 0) {
            const dx = attacker.x - this.x;
            const dy = attacker.y - this.y;
            const angleToAttacker = Math.atan2(dy, dx) * 180 / Math.PI;
            let angDiff = ((angleToAttacker - this.direction + 180) % 360) - 180;
            if (Math.abs(angDiff) <= 100) {
                // Shield provides much better block
                damage = hasShield ? Math.floor(damage * 0.2) : Math.floor(damage * 0.4);
                const blockColor = hasShield ? '#ffdd44' : '#ffff66';
                spawnParticles(this.x, this.y - 30, hasShield ? 10 : 5, blockColor, 4);
                if (hasShield) {
                    spawnText(this.x, this.y - 40, '格挡!', '#ffdd44', 16);
                }
                // Shield block impact
                spawnGroundImpact(this.x, GROUND_Y, 0.8);
            } else {
                damage = hasShield ? Math.floor(damage * 0.7) : Math.floor(damage * 0.85);
            }
        }
        
        this.blood -= damage;
        
        // Different visual effects for crit/instant kill
        if (isInstantKill) {
            spawnParticles(this.x, this.y - 30, 25, '#ff0000', 8);
            spawnText(this.x, this.y - 60, '秒杀!', '#ff0000', 28);
            spawnHitSpark(this.x, this.y - 25, '#ff4444', 3);
            shake(15, 10);
            triggerScreenFlash('#ff0000', 12);
            spawnGroundImpact(this.x, GROUND_Y, 2.5);
        } else if (isCrit) {
            spawnParticles(this.x, this.y - 30, 15, '#ffcc00', 6);
            spawnText(this.x, this.y - 50, String(damage), '#ffcc00', 24);
            spawnHitSpark(this.x, this.y - 25, '#ffcc00', 2);
            triggerScreenFlash('#ffcc00', 5);
            spawnGroundImpact(this.x, GROUND_Y, 1.5);
        } else {
            spawnBlood(this.x, this.y - 30, Math.max(3, Math.floor(damage / 4)));
            spawnText(this.x, this.y - 50, String(damage), '#ff3030');
            spawnHitSpark(this.x, this.y - 25, '#ff8844', 0.8);
            if (damage > 25) {
                spawnGroundImpact(this.x, GROUND_Y, damage / 30);
            }
        }
        
        if (damage > 15) shake(5, 3);
        
        this.hitTimer = 220;
        // Apply hitstun based on damage
        this.hitstun = Math.min(30, Math.max(10, damage / 2));
        // Knockback on hit
        const knockDir = attacker.x < this.x ? 1 : -1;
        this.vx += knockDir * (damage / 8);
        
        if (this.blood <= 0) {
            this.blood = 0;
            this.isAlive = false;
            spawnParticles(this.x, this.y, 30, this.getColor(), 6, 5);
            triggerScreenFlash(this.getColor(), 10);
            spawnGroundImpact(this.x, GROUND_Y, 2);
            return `${this.name} 被 ${attacker.name} 击败了！`;
        }
        return `${this.name} 受到 ${damage} 点伤害，剩余 ${this.blood} 点血量`;
    }
    
    update(dt) {
        const dtScale = dt / 16.67;
        
        if (this.attacking) {
            this.attackDuration -= dt;
            if (this.attackDuration <= 0) this.attacking = false;
        }
        if (this.hitTimer > 0) {
            this.hitTimer -= dt;
            if (this.hitTimer < 0) this.hitTimer = 0;
        }
        if (this.defenseTimer > 0) {
            this.defenseTimer -= dt;
            if (this.defenseTimer <= 0) {
                this.defending = false;
                this.defenseTimer = 0;
            }
        }
        // Hitstun - prevents actions during hitstun
        if (this.hitstun > 0) {
            this.hitstun -= dtScale;
            if (this.hitstun < 0) this.hitstun = 0;
        }
        // Blockstun - brief stun after blocking
        if (this.blockstun > 0) {
            this.blockstun -= dtScale;
            if (this.blockstun < 0) this.blockstun = 0;
        }
        // Dodge roll update
        if (this.dodging) {
            this.dodgeTimer -= dtScale;
            if (this.dodgeTimer <= 0) {
                this.dodging = false;
                this.dodgeInvincible = false;
                this.vx *= 0.3; // Slow down after dodge
            }
        }
        if (this.dodgeCooldown > 0) {
            this.dodgeCooldown -= dtScale;
            if (this.dodgeCooldown < 0) this.dodgeCooldown = 0;
        }
        // Musou timer countdown
        if (this.musouTimer > 0) {
            this.musouTimer -= dt;
            if (this.musouTimer <= 0) {
                this.musouActive = false;
                this.musouTimer = 0;
            }
        }
        
        const speed = Math.abs(this.vx);
        if (this.onGround && speed > 0.1) {
            this.runPhase += (speed / this.maxSpeed) * 0.2 * (dt / 16);
        }
        this.idlePhase += dt * 0.0015;
    }
}

// ========== ARROW ==========
class Arrow {
    constructor(x, y, vx, vy, owner, power, maxRange) {
        this.x = x; this.y = y; this.sx = x; this.sy = y;
        this.vx = vx; this.vy = vy;
        this.owner = owner; this.power = power; this.maxRange = maxRange;
        this.alive = true;
        this.isMusou = false;
        this.isCrit = false;
        this.isBolt = false;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += GRAVITY * 0.15;
        if (hypot(this.x - this.sx, this.y - this.sy) >= this.maxRange) this.alive = false;
        if (this.x < -50 || this.x > SCREEN_WIDTH + 50 || this.y > SCREEN_HEIGHT + 50) this.alive = false;
    }
    checkHit(target) {
        if (!target.isAlive) return null;
        if (hypot(this.x - target.x, this.y - target.y) <= target.radius) {
            const realDamage = Math.floor(this.power * (1 - target.defensePower / 100));
            const msg = target.takeDamage(realDamage, this.owner, this.isCrit, this.power >= 9999);
            this.alive = false;
            
            // Musou arrow hit effects
            if (this.isMusou) {
                spawnHitSpark(this.x, this.y, '#ff44ff', 3);
                triggerScreenFlash(this.owner.getColor(), 10);
                spawnGroundImpact(this.x, GROUND_Y, 2.5);
            } else if (this.isCrit) {
                spawnHitSpark(this.x, this.y, '#ffcc00', 1.5);
            } else {
                spawnHitSpark(this.x, this.y, '#ff8844', 0.8);
            }
            
            // Award musou to arrow owner on hit (only for non-musou arrows)
            if (!this.isMusou && this.owner.musou < this.owner.musouMax) {
                this.owner.musou++;
            }
            
            return msg;
        }
        return null;
    }
    draw(ctx) {
        const ang = Math.atan2(this.vy, this.vx);
        const length = this.isMusou ? 45 : 35;
        const tailX = this.x - Math.cos(ang) * 10;
        const tailY = this.y - Math.sin(ang) * 10;
        const tipX = this.x + Math.cos(ang) * length;
        const tipY = this.y + Math.sin(ang) * length;
        
        // Musou arrow glow
        if (this.isMusou) {
            ctx.save();
            ctx.shadowColor = '#ff44ff';
            ctx.shadowBlur = 15;
            ctx.strokeStyle = '#ff88ff';
            ctx.lineWidth = 4;
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.moveTo(tailX, tailY);
            ctx.lineTo(tipX, tipY);
            ctx.stroke();
            ctx.restore();
        }
        
        // Arrow shaft (wooden)
        ctx.strokeStyle = this.isMusou ? '#ff88ff' : '#8B4513';
        ctx.lineWidth = this.isMusou ? 3.5 : 2.5;
        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(tipX - Math.cos(ang) * 8, tipY - Math.sin(ang) * 8);
        ctx.stroke();
        
        // Metal arrowhead
        ctx.fillStyle = this.isMusou ? '#ff44ff' : '#c0c0c0';
        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(tipX - Math.cos(ang) * 12 + Math.sin(ang) * 4, tipY - Math.sin(ang) * 12 - Math.cos(ang) * 4);
        ctx.lineTo(tipX - Math.cos(ang) * 8, tipY - Math.sin(ang) * 8);
        ctx.lineTo(tipX - Math.cos(ang) * 12 - Math.sin(ang) * 4, tipY - Math.sin(ang) * 12 + Math.cos(ang) * 4);
        ctx.closePath();
        ctx.fill();
        
        // Fletching (feathers)
        ctx.fillStyle = this.isMusou ? '#ff88ff' : '#cc3333';
        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(tailX + Math.cos(ang) * 6 + Math.sin(ang) * 5, tailY + Math.sin(ang) * 6 - Math.cos(ang) * 5);
        ctx.lineTo(tailX + Math.cos(ang) * 10, tailY + Math.sin(ang) * 10);
        ctx.lineTo(tailX + Math.cos(ang) * 6 - Math.sin(ang) * 5, tailY + Math.sin(ang) * 6 + Math.cos(ang) * 5);
        ctx.closePath();
        ctx.fill();
        
        // Motion trail
        ctx.strokeStyle = 'rgba(255, 200, 100, 0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(tailX - Math.cos(ang) * 15, tailY - Math.sin(ang) * 15);
        ctx.stroke();
    }
}

// ========== HERO RENDERER (Enhanced) ==========
const heroRenderer = {
    // Wuxia hero proportions - tall, graceful, heroic silhouette
    headR: 12,
    neckLen: 8,
    torsoLen: 42,
    shoulderW: 30,
    chestW: 28,
    waistW: 18,
    pelvisW: 22,
    upperArm: 22,
    foreArm: 20,
    thigh: 38,
    shin: 36,
    footLen: 16,
    handR: 4,
    
    // Character type based on stats
    isFemale(ch) {
        return FEMALE_HEROES.includes(ch.name);
    },
    
    getBodyType(ch) {
        // Female characters get elegant body type
        if (this.isFemale(ch)) return 'female';
        
        const atk = ch.attackPower;
        const def = ch.defensePower;
        if (atk >= 45) return 'warrior';
        if (def >= 35) return 'guardian';
        if (ch.attackRange >= 180) return 'archer';
        if (weaponCategory(ch.weapon) === 'fan') return 'strategist';
        return 'balanced';
    },
    
    // Heroic wuxia body type proportions - tall and graceful
    getBodyMods(type) {
        const mods = {
            warrior:    { shoulder: 1.20, chest: 1.15, waist: 1.08, legScale: 1.05, stance: 0.08, heightBonus: 4 },
            guardian:   { shoulder: 1.25, chest: 1.20, waist: 1.12, legScale: 1.02, stance: 0.03, heightBonus: 2 },
            archer:     { shoulder: 0.95, chest: 0.90, waist: 0.82, legScale: 1.12, stance: 0.05, heightBonus: 6 },
            strategist: { shoulder: 0.90, chest: 0.86, waist: 0.78, legScale: 1.10, stance: 0.0, heightBonus: 5 },
            balanced:   { shoulder: 1.0, chest: 1.0, waist: 1.0, legScale: 1.05, stance: 0.04, heightBonus: 3 },
            female:     { shoulder: 0.85, chest: 0.82, waist: 0.70, legScale: 1.15, stance: 0.0, heightBonus: 5 }
        };
        return mods[type] || mods.balanced;
    },
    
    // Robust IK solver for legs - returns object with knee position
    // facingDir: 1 for facing right, -1 for facing left
    solveIK(hipX, hipY, footX, footY, thighLen, shinLen, facingDir) {
        const dx = footX - hipX;
        const dy = footY - hipY;
        let dist = Math.sqrt(dx * dx + dy * dy);
        const totalLen = thighLen + shinLen;
        
        // Handle edge case: zero distance
        if (dist < 1) dist = 1;
        
        // Clamp distance to valid range
        const minDist = Math.abs(thighLen - shinLen) + 1;
        const maxDist = totalLen - 1;
        dist = Math.max(minDist, Math.min(maxDist, dist));
        
        // Law of cosines to find hip angle
        const denom = 2 * thighLen * dist;
        if (denom < 0.001) {
            // Fallback: straight leg
            return { kneeX: hipX, kneeY: hipY + thighLen, footX, footY };
        }
        
        let cosHip = (thighLen * thighLen + dist * dist - shinLen * shinLen) / denom;
        cosHip = Math.max(-1, Math.min(1, cosHip));
        const hipAngle = Math.acos(cosHip);
        
        // Angle from hip to foot
        const angleToFoot = Math.atan2(dy, dx);
        
        // CRITICAL: Knee should always bend FORWARD (in facing direction)
        // When standing (dy > 0), bend in facing direction
        // When foot is up (dy < 0), still bend forward
        const bendDir = facingDir || 1;
        const thighAngle = angleToFoot - bendDir * hipAngle;
        
        let kneeX = hipX + Math.cos(thighAngle) * thighLen;
        let kneeY = hipY + Math.sin(thighAngle) * thighLen;
        
        // Safeguard against NaN
        if (isNaN(kneeX) || isNaN(kneeY)) {
            kneeX = hipX + bendDir * 5;
            kneeY = hipY + thighLen;
        }
        
        return { kneeX, kneeY, footX, footY };
    },
    
    // Simple IK solver for arms - returns arrays [elbow, hand]
    solveArmIK(shoulder, hand, upperLen, foreLen, bendDir) {
        const dx = hand[0] - shoulder[0];
        const dy = hand[1] - shoulder[1];
        let dist = Math.sqrt(dx * dx + dy * dy);
        const totalLen = upperLen + foreLen;
        
        // Handle edge case
        if (dist < 1) dist = 1;
        
        // Clamp
        dist = Math.max(Math.abs(upperLen - foreLen) + 0.5, Math.min(totalLen - 0.5, dist));
        
        const baseAngle = Math.atan2(dy, dx);
        const denom = 2 * upperLen * dist;
        if (denom < 0.001) {
            return [[shoulder[0], shoulder[1] + upperLen], [hand[0], hand[1]]];
        }
        
        let cosVal = (upperLen * upperLen + dist * dist - foreLen * foreLen) / denom;
        cosVal = Math.max(-1, Math.min(1, cosVal));
        const alpha = Math.acos(cosVal);
        const angle1 = baseAngle + alpha * bendDir;
        
        let elbowX = shoulder[0] + Math.cos(angle1) * upperLen;
        let elbowY = shoulder[1] + Math.sin(angle1) * upperLen;
        
        // Safeguard against NaN
        if (isNaN(elbowX) || isNaN(elbowY)) {
            elbowX = shoulder[0];
            elbowY = shoulder[1] + upperLen;
        }
        
        return [[elbowX, elbowY], [hand[0], hand[1]]];
    },
    
    render(ctx, ch, enemy) {
        this.currentChar = ch; // Track current character for sub-functions
        if (!ch.isAlive) {
            this.drawDead(ctx, ch);
            return;
        }
        
        const bodyType = this.getBodyType(ch);
        const mods = this.getBodyMods(bodyType);
        const dirSign = ch.direction === 0 ? 1 : -1;
        const speedFactor = Math.min(1, Math.abs(ch.vx) / Math.max(0.001, ch.maxSpeed));
        const t = Date.now() * 0.001; // Animation timing for breathing, swaying, etc.
        
        // Leg lengths based on body type
        const thighLen = this.thigh * (mods.legScale || 1.0);
        const shinLen = this.shin * (mods.legScale || 1.0);
        const legTotal = thighLen + shinLen;
        
        // Subtle breathing
        const breathCycle = Math.sin(t * 2.0) * 0.5 + 0.5;
        const idleSway = Math.sin(t * 1.0) * 1 * (1 - speedFactor);
        
        // Minimal bob for graceful movement
        const runBob = Math.abs(Math.sin(ch.runPhase * Math.PI)) * 2 * speedFactor;
        const runTilt = Math.sin(ch.runPhase * Math.PI * 2) * 0.02 * speedFactor;
        
        // Character stands tall and proud - upright stance
        const standHeight = legTotal * 0.93;
        const hBonus = (mods.heightBonus || 0);
        let rootX = ch.x + idleSway;
        let rootY = ch.onGround ? GROUND_Y - standHeight - runBob + hBonus : ch.y - standHeight * 0.5 + hBonus * 0.5;
        
        // Heroic forward lean
        const baseLean = mods.stance * dirSign;
        const runLean = 0.08 * speedFactor * dirSign;
        const totalLean = baseLean + runLean;
        ch.torsoTilt = lerp(ch.torsoTilt, totalLean, 0.1);
        
        // Spine positions
        const spineX = rootX + Math.sin(ch.torsoTilt) * this.torsoLen;
        const spineY = rootY - Math.cos(ch.torsoTilt) * this.torsoLen;
        const chestX = rootX + Math.sin(ch.torsoTilt) * this.torsoLen * 0.5;
        const chestY = rootY - Math.cos(ch.torsoTilt) * this.torsoLen * 0.5;
        const neckX = spineX + Math.sin(ch.torsoTilt) * this.neckLen;
        const neckY = spineY - Math.cos(ch.torsoTilt) * this.neckLen;
        
        // Body widths
        const shoulderW = this.shoulderW * mods.shoulder;
        const chestW = this.chestW * mods.chest;
        const waistW = this.waistW * mods.waist;
        const pelvisW = this.pelvisW * mods.waist;
        
        // Shoulder positions
        const shAngle = ch.torsoTilt + runTilt;
        const shLx = spineX - Math.cos(shAngle) * (shoulderW / 2);
        const shLy = spineY - Math.sin(shAngle) * (shoulderW / 2);
        const shRx = spineX + Math.cos(shAngle) * (shoulderW / 2);
        const shRy = spineY + Math.sin(shAngle) * (shoulderW / 2);
        
        // Hip positions
        const hpLx = rootX - Math.cos(shAngle) * (pelvisW / 2);
        const hpLy = rootY - Math.sin(shAngle) * (pelvisW / 2);
        const hpRx = rootX + Math.cos(shAngle) * (pelvisW / 2);
        const hpRy = rootY + Math.sin(shAngle) * (pelvisW / 2);
        
        // === LEG ANIMATION ===
        // Heroic stance width - wider for confident posture
        const stanceW = bodyType === 'warrior' ? 22 : (bodyType === 'strategist' ? 14 : 18);
        
        // Idle pose - natural grounded stance with slight front/back offset
        let idleLx = ch.x - stanceW * 0.4;
        let idleRx = ch.x + stanceW * 0.4;
        
        // Running animation with smooth gait
        const runP = ch.runPhase * Math.PI * 2;
        const strideLen = 34 * speedFactor;
        const liftHeight = 14 * speedFactor;
        
        // Natural running gait - opposite legs
        const lSwing = Math.sin(runP);
        const rSwing = Math.sin(runP + Math.PI);
        
        let targetLx, targetLy, targetRx, targetRy;
        
        // Maximum leg reach to prevent stretching
        const maxReach = legTotal * 0.95;
        
        if (!ch.onGround) {
            // Jump pose - heroic wuxia leap, legs extended
            if (ch.vy < 0) {
                // Rising - dramatic leap
                targetLx = hpLx + 18 * dirSign;
                targetLy = hpLy + legTotal * 0.60;
                targetRx = hpRx - 10 * dirSign;
                targetRy = hpRy + legTotal * 0.50;
            } else {
                // Falling - prepare for landing
                targetLx = hpLx + 10 * dirSign;
                targetLy = hpLy + legTotal * 0.65;
                targetRx = hpRx - 6 * dirSign;
                targetRy = hpRy + legTotal * 0.70;
            }
            
            // Clamp foot positions to prevent stretching
            const clampFoot = (hipX, hipY, footX, footY) => {
                const dx = footX - hipX;
                const dy = footY - hipY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > maxReach) {
                    const scale = maxReach / dist;
                    return { x: hipX + dx * scale, y: hipY + dy * scale };
                }
                return { x: footX, y: footY };
            };
            
            const clampedL = clampFoot(hpLx, hpLy, targetLx, targetLy);
            const clampedR = clampFoot(hpRx, hpRy, targetRx, targetRy);
            targetLx = clampedL.x; targetLy = clampedL.y;
            targetRx = clampedR.x; targetRy = clampedR.y;
        } else {
            // Ground movement
            if (speedFactor < 0.1) {
                // Idle - elegant standing pose
                targetLx = idleLx;
                targetLy = GROUND_Y;
                targetRx = idleRx;
                targetRy = GROUND_Y;
            } else {
                // Running - smooth gait with proper foot contact
                const lContact = lSwing < 0; // foot on ground
                const rContact = rSwing < 0;
                targetLx = ch.x + lSwing * strideLen * dirSign;
                targetLy = GROUND_Y - Math.max(0, lSwing) * liftHeight;
                targetRx = ch.x + rSwing * strideLen * dirSign;
                targetRy = GROUND_Y - Math.max(0, rSwing) * liftHeight;
            }
        }
        
        // Smooth interpolation - reduced factor for more weight/fluidity
        const footSmooth = 0.15;
        ch.currLx = lerp(ch.currLx, targetLx, footSmooth);
        ch.currLy = lerp(ch.currLy, targetLy, footSmooth);
        ch.currRx = lerp(ch.currRx, targetRx, footSmooth);
        ch.currRy = lerp(ch.currRy, targetRy, footSmooth);
        
        // Solve leg IK - pass facing direction for natural knee bend
        const leftLeg = this.solveIK(hpLx, hpLy, ch.currLx, ch.currLy, thighLen, shinLen, dirSign);
        const rightLeg = this.solveIK(hpRx, hpRy, ch.currRx, ch.currRy, thighLen, shinLen, dirSign);
        
        // Hand/weapon positions based on character type and state
        const breathY = breathCycle * 2;
        let gripX, gripY, wAngle;
        let offHandX, offHandY;
        
        // Default weapon hand position
        const weaponHand = dirSign === 1 ? [shRx, shRy] : [shLx, shLy];
        const offHand = dirSign === 1 ? [shLx, shLy] : [shRx, shRy];
        
        if (bodyType === 'strategist') {
            // Elegant pose with fan
            gripX = weaponHand[0] + 15 * dirSign;
            gripY = weaponHand[1] + 10 + breathY;
            wAngle = dirSign === 1 ? -0.3 : Math.PI + 0.3;
            offHandX = offHand[0] - 5 * dirSign;
            offHandY = offHand[1] + 20 + Math.sin(t * 1.5) * 3;
        } else if (bodyType === 'archer') {
            // Ready stance
            gripX = weaponHand[0] + 12 * dirSign;
            gripY = weaponHand[1] + 15 + breathY;
            wAngle = -Math.PI / 3 * dirSign;
            offHandX = offHand[0] + 5 * dirSign;
            offHandY = offHand[1] + 18;
        } else if (bodyType === 'warrior') {
            // Aggressive weapon-forward stance
            gripX = weaponHand[0] + 18 * dirSign;
            gripY = weaponHand[1] + 8 + breathY;
            wAngle = -Math.PI / 4 * dirSign;
            offHandX = offHand[0];
            offHandY = offHand[1] + 22;
        } else {
            // Standard heroic stance
            gripX = weaponHand[0] + 12 * dirSign;
            gripY = weaponHand[1] + 20 + breathY;
            wAngle = -Math.PI / 2;
            offHandX = offHand[0] + Math.sin(t) * 4;
            offHandY = offHand[1] + 22 + Math.cos(t) * 2;
        }
        
        // Attack animation
        if (ch.attacking && !ch.attackIsRanged) {
            const prog = 1 - ch.attackDuration / ch.attackAnimTotal;
            const cat = weaponCategory(ch.weapon);
            
            if (cat === 'spear') {
                // Powerful thrust
                const thrustPower = Math.sin(prog * Math.PI);
                const thrustLen = 55 * thrustPower;
                gripX = weaponHand[0] + Math.cos(ch.attackDirRad) * thrustLen;
                gripY = weaponHand[1] + 5 + Math.sin(ch.attackDirRad) * thrustLen;
                wAngle = ch.attackDirRad;
            } else if (cat === 'fan') {
                // Elegant wave motion
                wAngle = ch.attackDirRad + Math.sin(prog * Math.PI * 3) * 0.5;
                gripX = weaponHand[0] + Math.cos(wAngle) * 25 * Math.sin(prog * Math.PI);
                gripY = weaponHand[1] + Math.sin(wAngle) * 25 * Math.sin(prog * Math.PI);
            } else {
                // Powerful slash
                const startAng = dirSign === 1 ? -2.2 : -0.9;
                const endAng = dirSign === 1 ? 0.6 : 2.5;
                const p = 1 - Math.pow(1 - clamp(prog, 0, 1), 2.5);
                let currAng = startAng + (endAng - startAng) * p;
                if (prog > 0.75) {
                    currAng -= (endAng - startAng) * (prog - 0.75) * 0.4;
                }
                wAngle = currAng;
                gripX = weaponHand[0] + Math.cos(wAngle) * 20;
                gripY = weaponHand[1] + Math.sin(wAngle) * 20;
            }
        }
        
        // Ranged attack animation (archery)
        if (ch.attacking && ch.attackIsRanged) {
            const prog = 1 - ch.attackDuration / ch.attackAnimTotal;
            
            // Store draw progress for bow rendering
            ch.bowDrawProgress = prog;
            
            // Aim angle toward enemy (can be any direction including backward)
            const aimAngle = ch.attackDirRad;
            ch.aimAngle = aimAngle;  // Store for bow rendering
            
            // Bow hand holds the bow grip, extends toward target
            // The bow body (curved part) faces the enemy
            gripX = ch.x + Math.cos(aimAngle) * 25;
            gripY = ch.y - 35 + Math.sin(aimAngle) * 15;
            
            // Bow angle - the bow is perpendicular to aim direction
            // The arc opens away from the shooter (toward enemy)
            wAngle = aimAngle;  // Store aim direction for bow rendering
            
            // Drawing animation phases:
            // Phase 1 (0-0.4): Draw bow back
            // Phase 2 (0.4-0.7): Hold and aim  
            // Phase 3 (0.7-1.0): Release
            const drawAmount = prog < 0.4 ? prog / 0.4 :
                              prog < 0.7 ? 1.0 :
                              1.0 - (prog - 0.7) / 0.3;
            
            // Pull hand draws the string back toward archer (opposite of aim)
            const pullDist = 30 * drawAmount;
            offHandX = gripX - Math.cos(aimAngle) * pullDist;
            offHandY = gripY - Math.sin(aimAngle) * pullDist;
            
            // Store for bow string rendering
            ch.stringPullX = offHandX;
            ch.stringPullY = offHandY;
            ch.bowGripX = gripX;
            ch.bowGripY = gripY;
        } else {
            ch.bowDrawProgress = 0;
        }
        
        // Smooth hand positions - reduced factor
        const handSmooth = 0.15;
        let targetRh = dirSign === 1 ? [gripX, gripY] : [offHandX, offHandY];
        let targetLh = dirSign === 1 ? [offHandX, offHandY] : [gripX, gripY];
        
        ch.currHxL += (targetLh[0] - ch.currHxL) * handSmooth;
        ch.currHyL += (targetLh[1] - ch.currHyL) * handSmooth;
        ch.currHxR += (targetRh[0] - ch.currHxR) * handSmooth;
        ch.currHyR += (targetRh[1] - ch.currHyR) * handSmooth;
        
        // Solve arm IK
        const [le, lw] = this.solveArmIK([shLx, shLy], [ch.currHxL, ch.currHyL], this.upperArm, this.foreArm, -1);
        const [re, rw] = this.solveArmIK([shRx, shRy], [ch.currHxR, ch.currHyR], this.upperArm, this.foreArm, 1);
        
        // Colors - use faction armor system for silhouette consistency
        const baseC = ch.getColor();
        const armor = getFactionArmor(ch.faction);
        const darkC = '#0a0a0a'; // Pure black for silhouette
        const lightC = '#0a0a0a'; // Pure black for silhouette  
        const trimC = '#0a0a0a'; // Pure black for silhouette
        const skinC = '#0a0a0a'; // Pure black for silhouette
        const skinDark = '#0a0a0a'; // Pure black for silhouette
        
        // === DRAW ORDER: Back to front ===
        
        // Flowing cape (behind everything)
        this.drawCape(ctx, ch, spineX, spineY, dirSign, speedFactor, t);
        
        // Back leg
        if (dirSign === 1) {
            this.drawLeg(ctx, hpLx, hpLy, leftLeg, darkC, dirSign, bodyType);
        } else {
            this.drawLeg(ctx, hpRx, hpRy, rightLeg, darkC, dirSign, bodyType);
        }
        
        // Back arm
        if (dirSign === 1) {
            this.drawArm(ctx, [shLx, shLy], le, lw, darkC, skinDark);
        } else {
            this.drawArm(ctx, [shRx, shRy], re, rw, darkC, skinDark);
        }
        
        // Torso with improved shape
        this.drawTorso(ctx, ch, rootX, rootY, chestX, chestY, spineX, spineY, 
                       shoulderW, chestW, waistW, pelvisW, baseC, darkC, lightC, mods);
        
        // Head and helmet
        this.drawHead(ctx, ch, neckX, neckY, skinC, dirSign);
        
        // Store render top for dynamic HUD positioning (head top)
        const charTopY = neckY - this.headR * 2.2;
        ch._hudTopY = charTopY;
        
        // Front leg
        if (dirSign === 1) {
            this.drawLeg(ctx, hpRx, hpRy, rightLeg, baseC, dirSign, bodyType);
        } else {
            this.drawLeg(ctx, hpLx, hpLy, leftLeg, baseC, dirSign, bodyType);
        }
        
        // Front arm with weapon
        const cat = weaponCategory(ch.weapon);
        const isDualWield = cat === 'double_sword' || cat === 'sword_shield';
        
        if (dirSign === 1) {
            this.drawArm(ctx, [shRx, shRy], re, rw, baseC, skinC);
            this.drawHand(ctx, rw[0], rw[1], skinC);
            this.drawWeapon(ctx, ch, rw, dirSign, wAngle, lw); // Pass off-hand position
            // Draw off-hand weapon/shield for dual-wield
            if (isDualWield) {
                this.drawOffHandItem(ctx, ch, lw, -dirSign, wAngle - Math.PI * 0.15);
            }
        } else {
            this.drawArm(ctx, [shLx, shLy], le, lw, baseC, skinC);
            this.drawHand(ctx, lw[0], lw[1], skinC);
            this.drawWeapon(ctx, ch, lw, dirSign, wAngle, rw); // Pass off-hand position
            // Draw off-hand weapon/shield for dual-wield
            if (isDualWield) {
                this.drawOffHandItem(ctx, ch, rw, -dirSign, wAngle + Math.PI * 0.15);
            }
        }
        
        // Defense effect
        if (ch.defending) {
            this.drawDefenseAura(ctx, ch);
        }
        
        // Hit flash - bright white overlay (silhouette hit effect)
        if (ch.hitTimer > 0 && Math.floor(ch.hitTimer / 50) % 2 === 0) {
            ctx.fillStyle = 'rgba(255,255,255,0.45)';  // Brighter white
            ctx.beginPath();
            ctx.ellipse(ch.x, ch.y - 40, 30, 50, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        
        this.drawHUD(ctx, ch);
    },
    
    darken(color, amount) {
        // Handle both hex (#rrggbb) and rgb(r,g,b) formats
        let r, g, b;
        if (color.startsWith('#')) {
            r = parseInt(color.slice(1, 3), 16);
            g = parseInt(color.slice(3, 5), 16);
            b = parseInt(color.slice(5, 7), 16);
        } else if (color.startsWith('rgb')) {
            const match = color.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
            if (match) {
                r = parseInt(match[1]);
                g = parseInt(match[2]);
                b = parseInt(match[3]);
            } else {
                return color; // Return as-is if can't parse
            }
        } else {
            return color;
        }
        r = Math.max(0, r - amount);
        g = Math.max(0, g - amount);
        b = Math.max(0, b - amount);
        return `rgb(${r},${g},${b})`;
    },
    
    lighten(color, amount) {
        // Handle both hex (#rrggbb) and rgb(r,g,b) formats
        let r, g, b;
        if (color.startsWith('#')) {
            r = parseInt(color.slice(1, 3), 16);
            g = parseInt(color.slice(3, 5), 16);
            b = parseInt(color.slice(5, 7), 16);
        } else if (color.startsWith('rgb')) {
            const match = color.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
            if (match) {
                r = parseInt(match[1]);
                g = parseInt(match[2]);
                b = parseInt(match[3]);
            } else {
                return color;
            }
        } else {
            return color;
        }
        r = Math.min(255, r + amount);
        g = Math.min(255, g + amount);
        b = Math.min(255, b + amount);
        return `rgb(${r},${g},${b})`;
    },
    
    drawTorso(ctx, ch, rootX, rootY, chestX, chestY, neckX, neckY,
              shoulderW, chestW, waistW, pelvisW, baseC, darkC, lightC, mods) {
        const isFemale = this.isFemale(ch);
        const facing = ch.direction === 0 ? 1 : -1;

        ctx.fillStyle = '#0a0a0a';
        ctx.lineWidth = 2.5;  // Thicker outline

        if (isFemale) {
            // Female silhouette: elegant curved torso + flowing robe skirt
            ctx.beginPath();

            // Front shoulder curve (forward facing side)
            ctx.quadraticCurveTo(neckX + shoulderW * 0.2 * facing, neckY - 2, neckX + shoulderW * 0.5 * facing, neckY + 8);
            // Bust / chest front curve
            ctx.quadraticCurveTo(neckX + chestW * 0.6 * facing, chestY + 6, neckX + waistW * 0.5 * facing, rootY - 2);

            ctx.quadraticCurveTo(neckX + pelvisW * 0.6 * facing, rootY + 14, neckX + pelvisW * 0.4 * facing, rootY + 34);
            // Bottom hem (flowing robe)

            ctx.quadraticCurveTo(neckX - pelvisW * 0.5 * facing, rootY + 12, neckX - waistW * 0.35 * facing, rootY - 4);

            // Back shoulder to neck

            // Back waist

    drawHead(ctx, ch, x, y, skinC, dirSign) {
        const r = this.headR;
        const isFemale = this.isFemale(ch);
        const facing = dirSign; // 1 = right, -1 = left

        // === SIDE PROFILE SILHOUETTE HEAD WITH BRIGHT OUTLINE ===

    drawArm(ctx, shoulder, elbow, hand, color, skinColor) {
        // Silhouette arm: pure black with bright white outline
        ctx.fillStyle = '#0a0a0a';
        ctx.lineWidth = 2.5;  // Thicker outline
        ctx.strokeStyle = '#ffffff';  // Bright white outline

        const upperArmW = 9;
        const elbowW = 6;
        const forearmW = 8;
        const wristW = 5;

        // Upper arm
        const upperAngle = Math.atan2(elbow[1] - shoulder[1], elbow[0] - shoulder[0]);
        const upperPerpX = -Math.sin(upperAngle);
        const upperPerpY = Math.cos(upperAngle);

        ctx.beginPath();
        ctx.moveTo(shoulder[0] + upperPerpX * upperArmW, shoulder[1] + upperPerpY * upperArmW);
        ctx.lineTo(elbow[0] + upperPerpX * elbowW, elbow[1] + upperPerpY * elbowW);
        ctx.lineTo(elbow[0] - upperPerpX * elbowW, elbow[1] - upperPerpY * elbowW);
        ctx.lineTo(shoulder[0] - upperPerpX * upperArmW, shoulder[1] - upperPerpY * upperArmW);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();  // Bright outline

        // Forearm
        const foreAngle = Math.atan2(hand[1] - elbow[1], hand[0] - elbow[0]);
        const forePerpX = -Math.sin(foreAngle);
        const forePerpY = Math.cos(foreAngle);

        ctx.beginPath();
        ctx.moveTo(elbow[0] + forePerpX * elbowW, elbow[1] + forePerpY * elbowW);
        ctx.lineTo(hand[0] + forePerpX * wristW, hand[1] + forePerpY * wristW);
        ctx.lineTo(hand[0] - forePerpX * wristW, hand[1] - forePerpY * wristW);
        ctx.lineTo(elbow[0] - forePerpX * elbowW, elbow[1] - forePerpY * elbowW);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();  // Bright outline

        // Elbow joint bulge (silhouette detail)
        ctx.beginPath();
        ctx.ellipse(elbow[0], elbow[1], 5, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();  // Bright outline
    },

    drawHand(ctx, x, y, color) {

        ctx.beginPath();
        ctx.ellipse(x, y, 5.5, 4.5, 0, 0, Math.PI * 2);
