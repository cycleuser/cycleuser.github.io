function updateSurvivalMode(dt, currentTime) {
    updateShake();
    updateWeather();
    updateLights();
    updateComboSystem();
    updateAchievementDisplay();
    updateHitSparks();
    updateSlashTrails();
    
    // Update particles
    particles = particles.filter(p => { p.update(); return p.life > 0; });
    floatingTexts = floatingTexts.filter(t => { t.update(); return t.life > 0; });
    musouEffects = musouEffects.filter(m => { m.update(); return m.life > 0; });
    
    // Update powerups
    survivalPowerups = survivalPowerups.filter(p => {
        p.life--;
        // Check if player collects powerup
        if (p.active && hypot(p.x - char1.x, p.y - char1.y) < 40) {
            p.active = false;
            applySurvivalPowerup(p);
            return false;
        }
        return p.life > 0;
    });
    
    // Wave entrance animation
    if (survivalWaveEntrance > 0) {
        survivalWaveEntrance--;
    }
    
    // Player input
    char1.moveLeft = keys['a'] || touch.left;
    char1.moveRight = keys['d'] || touch.right;
    
    if ((keys['w'] || touch.jump) && !lastJump) {
        char1.attemptJump();
        playSound('jump', 0.15);
    }
    lastJump = keys['w'] || touch.jump;
    
    if ((keys['x'] || touch.attack) && !lastAttack && !gameOver) {
        // Find nearest enemy
        let nearestEnemy = null;
        let nearestDist = Infinity;
        for (const enemy of survivalEnemies) {
            if (!enemy.isAlive) continue;
            const dist = hypot(enemy.x - char1.x, enemy.y - char1.y);
            if (dist < nearestDist) {
                nearestDist = dist;
                nearestEnemy = enemy;
            }
        }
        
        if (nearestEnemy) {
            char1.faceEnemy(nearestEnemy);
            const [arr, msg] = char1.tryRangedAttack(nearestEnemy, currentTime);
            if (arr) {
                projectiles.push(arr);
                if (msg) addMessage(msg);
                if (msg && msg.includes('无双')) {
                    playSound('musou', 0.4);
                    achievementData.totalMusou = (achievementData.totalMusou || 0) + 1;
                    saveAchievements();
                } else {
                    playSound('arrow', 0.2);
                }
            } else {
                const res = char1.attack(nearestEnemy, currentTime);
                if (res) {
                    addMessage(res);
                    if (res.includes('无双')) {
                        playSound('musou', 0.4);
                        achievementData.totalMusou = (achievementData.totalMusou || 0) + 1;
                        saveAchievements();
                    }
                    else if (res.includes('暴击')) playSound('critical', 0.3);
                    else if (res.includes('伤害')) playSound('hit', 0.2);
                    
                    // Kill tracking + heal-on-kill for melee
                    if (!nearestEnemy.isAlive) {
                        onSurvivalKill(nearestEnemy.x, nearestEnemy.y);
                    }
                }
            }
        }
    }
    lastAttack = keys['x'] || touch.attack;
    
    if ((keys['c'] || touch.defend) && !lastDefend) {
        char1.defending = true;
        char1.defenseTimer = 400;
        playSound('block', 0.15);
    }
    if (!(keys['c'] || touch.defend)) {
        char1.defending = false;
    }
    lastDefend = keys['c'] || touch.defend;
    
    // Dodge roll input
    if (keys['q'] && !lastDodgeLeft) {
        if (char1.attemptDodge(-1)) {
            playSound('jump', 0.1);
            spawnDustTrail(char1.x, GROUND_Y, -5);
        }
    }
    lastDodgeLeft = keys['q'];
    if (keys['e'] && !lastDodgeRight) {
        if (char1.attemptDodge(1)) {
            playSound('jump', 0.1);
            spawnDustTrail(char1.x, GROUND_Y, 5);
        }
    }
    lastDodgeRight = keys['e'];
    
    // Wave management
    if (survivalBetweenWaves) {
        survivalWaveDelay--;
        if (survivalWaveDelay <= 0) {
            survivalWave++;
            survivalBetweenWaves = false;
            survivalSpawnTimer = 0;
            survivalSpawnedThisWave = 0;
            survivalEnemies = survivalEnemies.filter(e => e.isAlive);
            
            // Check if boss wave (every 5 waves)
            survivalIsBossWave = (survivalWave % 5 === 0);
            
            // Wave entrance animation
            survivalWaveEntrance = 90; // 1.5 seconds
            
            if (survivalWave > survivalMaxWave) {
                survivalMaxWave = survivalWave;
                if (survivalMaxWave >= 5 || survivalMaxWave >= 10) {
                    const newAch = checkAchievements();
                    newAch.forEach(ach => showAchievementNotification(ach));
                    saveAchievements();
                }
            }
            
            if (survivalIsBossWave) {
                addMessage(`⚔️ BOSS波 ${survivalWave}! ⚔️`);
                triggerScreenFlash('#ff4444', 15);
                shake(10, 8);
            } else {
                addMessage(`第 ${survivalWave} 波!`);
            }
        }
    } else {
        // Spawn enemies - reduced count and slower spawn
        const aliveCount = survivalEnemies.filter(e => e.isAlive).length;
        const baseEnemies = survivalIsBossWave ? 1 : Math.min(3, 1 + Math.floor(survivalWave * 0.35));
        const bonusEnemies = survivalIsBossWave ? 0 : Math.floor(survivalWave / 4);
        const enemiesPerWave = baseEnemies + bonusEnemies;
        const spawnInterval = Math.max(70, 140 - survivalWave * 3); // Slower spawn
        
        survivalSpawnTimer++;
        if (survivalSpawnTimer >= spawnInterval && aliveCount < enemiesPerWave && survivalSpawnedThisWave < enemiesPerWave) {
            survivalSpawnTimer = 0;
            spawnSurvivalEnemy();
            survivalSpawnedThisWave++;
        }
        
        // Update enemies - use enhanced AI with attack spacing
        const attackingCount = () => survivalEnemies.filter(e => e.isAlive && e.attacking).length;
        survivalEnemies.forEach(enemy => {
            if (!enemy.isAlive) return;
            
            // Enemy attack spacing - prevent simultaneous attacks
            const timeSinceLastAttack = currentTime - survivalLastEnemyAttack;
            const minAttackGap = survivalIsBossWave ? 500 : 800; // Boss attacks faster
            
            // Force non-attacking state if too many are already attacking
            if (enemy.aiState && enemy.aiState.mode === 'attack' && attackingCount() >= 2) {
                enemy.aiState.mode = 'circle';
                enemy.aiState.stateTimer = 25 + Math.random() * 20;
            }
            
            if (timeSinceLastAttack < minAttackGap && enemy.aiState) {
                // Force enemy to wait if too soon since last attack
                enemy.aiState.stateTimer = Math.max(enemy.aiState.stateTimer, Math.ceil((minAttackGap - timeSinceLastAttack) / 16.67));
            }
            
            updateAI(enemy, char1, currentTime);
            
            // Track when enemy attacks
            if (enemy.attacking) {
                survivalLastEnemyAttack = currentTime;
            }
            
            // Ranged attack support for survival enemies with spacing
            if (enemy.isAlive && attackingCount() < 2) {
                const dist = Math.abs(char1.x - enemy.x);
                const cat = weaponCategory(enemy.weapon);
                if (['bow', 'crossbow'].includes(cat) && dist > 150) {
                    const [arr, msg] = enemy.tryRangedAttack(char1, currentTime);
                    if (arr) {
                        projectiles.push(arr);
                        if (msg) addMessage(msg);
                        if (msg && msg.includes('无双')) playSound('musou', 0.4);
                        else playSound('arrow', 0.2);
                        survivalLastEnemyAttack = currentTime;
                    }
                }
            }
            
            enemy.update(dt);
            enemy.moveByInput(dt);
            enemy.applyPhysics(dt);
        });
        
        // Enemy-enemy collision prevention
        for (let i = 0; i < survivalEnemies.length; i++) {
            const a = survivalEnemies[i];
            if (!a.isAlive) continue;
            for (let j = i + 1; j < survivalEnemies.length; j++) {
                const b = survivalEnemies[j];
                if (!b.isAlive) continue;
                const overlap = (a.radius + b.radius) - Math.abs(a.x - b.x);
                if (overlap > 0) {
                    const pushX = overlap / 2 + 1;
                    if (a.x < b.x) {
                        a.x -= pushX;
                        b.x += pushX;
                    } else {
                        a.x += pushX;
                        b.x -= pushX;
                    }
                    a.x = clamp(a.x, a.radius, SCREEN_WIDTH - a.radius);
                    b.x = clamp(b.x, b.radius, SCREEN_WIDTH - b.radius);
                }
            }
        }
        
        // Check if wave is complete
        const aliveEnemies = survivalEnemies.filter(e => e.isAlive);
        if (aliveEnemies.length === 0 && survivalSpawnedThisWave >= enemiesPerWave) {
            survivalBetweenWaves = true;
            survivalWaveDelay = 120; // 2 seconds between waves
            
            // Score reward
            const waveScore = survivalWave * 100 + survivalKills * 10;
            survivalScore += waveScore;
            
            // Gold reward
            const waveReward = 20 + survivalWave * 10;
            playerGold += waveReward;
            addMessage(`波次完成! +${waveReward} 金币 | 得分: ${survivalScore}`);
            
            // Healing between waves - more generous
            const healPercent = survivalIsBossWave ? 0.35 : 0.25;
            const healAmount = Math.floor(char1.maxBlood * healPercent);
            char1.blood = Math.min(char1.maxBlood, char1.blood + healAmount);
            addMessage(`血量恢复 ${Math.floor(healPercent * 100)}% (+${healAmount})`);
            spawnParticles(char1.x, char1.y - 30, 12, '#44ff44', 4, 4);
            spawnText(char1.x, char1.y - 70, `+${healAmount} HP`, '#44ff44', 22);
            
            // Spawn power-up between waves
            spawnSurvivalPowerup();
            
            // Boss wave bonus
            if (survivalIsBossWave) {
                playerGold += 50;
                addMessage('BOSS击杀奖励: +50 金币');
                triggerScreenFlash('#ffdd44', 10);
            }
        }
    }
    
    char1.update(dt);
    char1.moveByInput(dt);
    char1.applyPhysics(dt);
    
    // Projectiles
    projectiles = projectiles.filter(p => {
        p.update();
        // Check hit against player
        if (p.owner !== char1 && p.alive) {
            const msg = p.checkHit(char1);
            if (msg) {
                addMessage(msg);
                playSound('hit', 0.2);
            }
        }
        // Check hit against enemies
        if (p.owner === char1 && p.alive) {
            for (const enemy of survivalEnemies) {
                if (enemy.isAlive) {
                    const msg = p.checkHit(enemy);
                    if (msg) {
                        addMessage(msg);
                        playSound('hit', 0.2);
                        if (!enemy.isAlive) {
                            onSurvivalKill(enemy.x, enemy.y);
                        }
                        break;
                    }
                }
            }
        }
        return p.alive;
    });
    
    // Kill streak timer decay
    if (survivalKillStreakTimer > 0) {
        survivalKillStreakTimer -= dt;
        if (survivalKillStreakTimer <= 0) {
            survivalKillStreak = 0;
            survivalKillStreakTimer = 0;
        }
    }
    if (survivalKillStreakBuffTimer > 0) {
        survivalKillStreakBuffTimer -= dt;
        if (survivalKillStreakBuffTimer <= 0 && survivalKillStreakActive) {
            if (survivalKillStreakActive === 'attack') {
                char1.attackPower = Math.floor(char1.attackPower / 1.2);
            } else if (survivalKillStreakActive === 'speed') {
                char1.maxSpeed /= 1.15;
            }
            survivalKillStreakActive = '';
            addMessage('杀敌加成已消失');
        }
    }
    
    // Message timer
    if (messageTimer > 0) {
        messageTimer -= dt;
        if (messageTimer <= 0) messages = [];
    }
    
    // Check player death
    if (!gameOver && !char1.isAlive) {
        gameOver = true;
        winner = null;
        addMessage(`生存结束! 坚持了 ${survivalWave} 波, 击杀 ${survivalKills} 个敌人`);
        
        const finalReward = survivalWave * 15 + survivalKills * 5 + Math.floor(survivalScore / 10);
        playerGold += finalReward;
        addMessage(`获得 ${finalReward} 金币奖励 (基础+得分)`);
        
        // Check survival achievements
        saveAchievements();
        const newAch = checkAchievements();
        newAch.forEach(ach => showAchievementNotification(ach));
    }
}

function onSurvivalKill(enemyX, enemyY) {
    survivalKills++;
    survivalScore += 25;
    const killHeal = Math.floor(char1.maxBlood * 0.10);
    char1.blood = Math.min(char1.maxBlood, char1.blood + killHeal);
    spawnParticles(char1.x, char1.y - 20, 8, '#44ff44', 3, 3);
    spawnText(char1.x, char1.y - 80, `+${killHeal} HP`, '#44ff44', 18);
    addLight(char1.x, char1.y, 60, '#44ff44', 0.6);
    
    // Kill streak system
    survivalKillStreak++;
    survivalKillStreakTimer = 300; // 5 seconds to chain kills
    
    if (survivalKillStreak === 3 && !survivalKillStreakActive) {
        survivalKillStreakActive = 'attack';
        survivalKillStreakBuffTimer = 600; // 10 seconds buff
        char1.attackPower = Math.floor(char1.attackPower * 1.2);
        addMessage('🔥 三连杀! 攻击力提升 20%!');
        triggerScreenFlash('#ff4400', 6);
        spawnParticles(char1.x, char1.y - 30, 15, '#ff4400', 5, 4);
    } else if (survivalKillStreak === 6 && !survivalKillStreakActive) {
        survivalKillStreakActive = 'speed';
        survivalKillStreakBuffTimer = 600;
        char1.maxSpeed *= 1.15;
        addMessage('⚡ 六连杀! 速度提升 15%!');
        triggerScreenFlash('#4488ff', 6);
        spawnParticles(char1.x, char1.y - 30, 15, '#4488ff', 5, 4);
    } else if (survivalKillStreak >= 9 && !survivalKillStreakActive) {
        survivalKillStreakActive = 'musou';
        survivalKillStreakBuffTimer = 600;
        char1.musou = Math.min(char1.musouMax, char1.musou + 5);
        addMessage('✨ 九连杀! 无双已充满!');
        triggerScreenFlash('#ff44ff', 8);
        spawnParticles(char1.x, char1.y - 30, 20, '#ff44ff', 6, 5);
    }
}

function spawnSurvivalEnemy() {
    const factions = ['汉', '魏', '吴', '晋', '西凉', '黄巾', '其他'];
    let f, h, weapon;
    
    if (survivalIsBossWave && survivalSpawnedThisWave === 0) {
        // Boss enemy - pick a strong hero
        const bossHeroes = [
            { faction: '汉', hero: '吕布' },
            { faction: '汉', hero: '关羽' },
            { faction: '魏', hero: '曹操' },
            { faction: '吴', hero: '周瑜' },
            { faction: '魏', hero: '夏侯惇' },
            { faction: '汉', hero: '张飞' },
            { faction: '吴', hero: '孙策' },
        ];
        const boss = bossHeroes[randInt(0, bossHeroes.length - 1)];
        f = boss.faction;
        h = boss.hero;
    } else {
        f = factions[randInt(0, factions.length - 1)];
        const heroes = ALL_HEROES[f];
        h = heroes[randInt(0, heroes.length - 1)];
    }
    
    weapon = HERO_STATS[f][h] ? HERO_STATS[f][h][4] : '剑';
    
    // Reduced difficulty scaling - much gentler
    const waveMod = 1 + survivalWave * 0.03;
    const armorType = survivalWave >= 10 ? '皮甲' : '布衣';
    const enemy = createCharacter(h, f, false, weapon, armorType);
    
    // Scale stats more gently
    enemy.maxBlood = Math.floor(enemy.maxBlood * waveMod);
    enemy.blood = enemy.maxBlood;
    enemy.attackPower = Math.floor(enemy.attackPower * (1 + survivalWave * 0.02));
    enemy.defensePower = Math.floor(enemy.defensePower * (1 + survivalWave * 0.015));
    enemy.maxSpeed = Math.min(MAX_SPEED * 0.65, enemy.maxSpeed * (1 + survivalWave * 0.008));
    enemy.attackCooldown = Math.max(650, enemy.attackCooldown - survivalWave * 3);
    
    // Boss wave - extra tough but more fair
    if (survivalIsBossWave && survivalSpawnedThisWave === 0) {
        enemy.maxBlood = Math.floor(enemy.maxBlood * 2.0);
        enemy.blood = enemy.maxBlood;
        enemy.attackPower = Math.floor(enemy.attackPower * 1.3);
        enemy.maxSpeed = Math.min(MAX_SPEED * 0.75, enemy.maxSpeed * 1.15);
        enemy.attackCooldown = Math.max(500, enemy.attackCooldown - 80);
    }
    
    // Spawn from edges with variety
    const spawnSide = Math.random();
    if (spawnSide < 0.4) {
        enemy.x = -30; // Left
    } else if (spawnSide < 0.8) {
        enemy.x = SCREEN_WIDTH + 30; // Right
    } else {
        enemy.x = Math.random() < 0.5 ? -30 : SCREEN_WIDTH + 30;
    }
    enemy.y = GROUND_Y;
    
    survivalEnemies.push(enemy);
}

// Power-up system for survival mode
function spawnSurvivalPowerup() {
    const types = ['health', 'attack', 'speed', 'musou'];
    const type = types[randInt(0, types.length - 1)];
    
    const colors = {
        health: '#44ff44',
        attack: '#ff4444',
        speed: '#4488ff',
        musou: '#ffcc00'
    };
    
    const labels = {
        health: '❤️ 生命',
        attack: '⚔️ 攻击',
        speed: '💨 速度',
        musou: '✨ 无双'
    };
    
    survivalPowerups.push({
        x: 100 + Math.random() * (SCREEN_WIDTH - 200),
        y: GROUND_Y - 20,
        type: type,
        color: colors[type],
        label: labels[type],
        life: 600, // 10 seconds to collect
        active: true,
        bobPhase: Math.random() * Math.PI * 2
    });
}

function applySurvivalPowerup(powerup) {
    const t = Date.now() * 0.001;
    spawnParticles(powerup.x, powerup.y, 15, powerup.color, 5, 4);
    spawnText(powerup.x, powerup.y - 30, powerup.label, powerup.color, 20);
    
    switch (powerup.type) {
        case 'health':
            const heal = Math.floor(char1.maxBlood * 0.3);
            char1.blood = Math.min(char1.maxBlood, char1.blood + heal);
            addMessage(`生命恢复 +${heal} HP`);
            break;
        case 'attack':
            char1.attackPower = Math.floor(char1.attackPower * 1.3);
            addMessage('攻击力提升 30%!');
            break;
        case 'speed':
            char1.maxSpeed *= 1.2;
            addMessage('速度提升 20%!');
            break;
        case 'musou':
            char1.musou = Math.min(char1.musouMax, char1.musou + 3);
            addMessage('无双值 +3!');
            break;
    }
    
    playSound('select', 0.2);
    triggerScreenFlash(powerup.color, 8);
}

function drawSurvivalMode() {
    const ox = screenShake.offsetX;
    const oy = screenShake.offsetY;
    const t = Date.now() * 0.001;
    
    ctx.save();
    ctx.translate(-ox, -oy);
    
    drawBackground(ctx);
    
    // Draw ambient particles
    ambientParticles.forEach(p => {
        p.update();
        p.draw(ctx);
    });
    
    // Draw player
    if (char1) heroRenderer.render(ctx, char1, null);
    
    // Draw enemies
    survivalEnemies.forEach(enemy => {
        if (enemy.isAlive) {
            heroRenderer.render(ctx, enemy, char1);
            
            // Boss indicator
            if (survivalIsBossWave && enemy.maxBlood > char1.maxBlood * 1.5) {
                ctx.textAlign = 'center';
                ctx.font = 'bold 12px Microsoft YaHei';
                ctx.fillStyle = '#ff4444';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 8;
                ctx.fillText('BOSS', enemy.x, enemy.y - 85);
                ctx.shadowBlur = 0;
            }
        }
    });
    
    // Draw powerups
    survivalPowerups.forEach(p => {
        if (!p.active) return;
        const bob = Math.sin(t * 3 + p.bobPhase) * 5;
        const alpha = p.life < 120 ? (p.life / 120) : 1;
        
        ctx.save();
        ctx.globalAlpha = alpha;
        
        // Glow effect
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 15;
        
        // Powerup orb
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y + bob, 15, 0, Math.PI * 2);
        ctx.fill();
        
        // Inner highlight
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = alpha * 0.4;
        ctx.beginPath();
        ctx.arc(p.x - 3, p.y + bob - 3, 6, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
        
        // Label
        ctx.textAlign = 'center';
        ctx.font = 'bold 11px Microsoft YaHei';
        ctx.fillStyle = p.color;
        ctx.fillText(p.label, p.x, p.y + bob - 22);
    });
    
    // Dust trails
    dustTrails = dustTrails.filter(d => {
        d.update();
        d.draw(ctx);
        return d.life > 0;
    });
    
    // Ground impacts
    groundImpacts = groundImpacts.filter(g => {
        g.update();
        g.draw(ctx);
        return g.life > 0;
    });
    
    projectiles.forEach(p => p.draw(ctx));
    particles.forEach(p => p.draw(ctx, ox, oy));
    floatingTexts.forEach(t => t.draw(ctx, ox, oy));
    musouEffects.forEach(m => m.draw(ctx, ox, oy));
    drawSlashTrails(ctx);
    drawHitSparks(ctx);
    
    ctx.restore();
    
    drawWeather(ctx);
    drawLights(ctx);
    drawComboDisplay(ctx);
    
    updateScreenFlash();
    drawScreenFlash(ctx);
    
    // Wave entrance animation
    if (survivalWaveEntrance > 0) {
        drawWaveEntrance(survivalWaveEntrance);
    }
    
    // Messages
    if (messages.length > 0) {
        ctx.font = 'bold 16px Microsoft YaHei, SimHei, sans-serif';
        ctx.textAlign = 'center';
        let yOff = 60;
        messages.slice(-3).forEach(msg => {
            ctx.fillStyle = BLACK;
            ctx.fillText(msg, SCREEN_WIDTH/2 + 1, yOff + 1);
            ctx.fillStyle = YELLOW;
            ctx.fillText(msg, SCREEN_WIDTH/2, yOff);
            yOff += 25;
        });
    }
    
    // Survival HUD
    drawSurvivalHUD();
    
    // Game over
    if (gameOver) {
        const bannerH = 180;
        const grad = ctx.createLinearGradient(0, 0, 0, bannerH);
        grad.addColorStop(0, 'rgba(0,0,0,0.95)');
        grad.addColorStop(0.6, 'rgba(0,0,0,0.7)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, SCREEN_WIDTH, bannerH);
        
        ctx.textAlign = 'center';
        
        // Title with glow
        ctx.shadowColor = '#ff4444';
        ctx.shadowBlur = 20 + Math.sin(t * 4) * 5;
        ctx.font = 'bold 42px Microsoft YaHei, SimHei, sans-serif';
        ctx.fillStyle = '#ff6644';
        ctx.fillText('⚔ 生存结束 ⚔', SCREEN_WIDTH/2, 42);
        ctx.shadowBlur = 0;
        
        // Stats with better visual
        ctx.font = 'bold 18px Microsoft YaHei, SimHei, sans-serif';
        ctx.fillStyle = '#ffdd88';
        ctx.fillText(`坚持波次: ${survivalWave}`, SCREEN_WIDTH/2, 75);
        ctx.fillStyle = '#aaddff';
        ctx.fillText(`击杀: ${survivalKills}`, SCREEN_WIDTH/2 + 120, 75);
        ctx.fillStyle = '#ff88aa';
        ctx.fillText(`最高纪录: ${survivalMaxWave}`, SCREEN_WIDTH/2 - 130, 75);
        
        ctx.font = '20px Microsoft YaHei, SimHei, sans-serif';
        ctx.fillStyle = '#ffcc44';
        ctx.shadowColor = '#ff8800';
        ctx.shadowBlur = 8;
        ctx.fillText(`🏆 总得分: ${survivalScore}`, SCREEN_WIDTH/2, 105);
        ctx.shadowBlur = 0;
        
        ctx.font = '16px Microsoft YaHei, SimHei, sans-serif';
        ctx.fillStyle = '#ffdd44';
        ctx.fillText(`金币奖励: +${survivalWave * 15 + survivalKills * 5 + Math.floor(survivalScore / 10)}`, SCREEN_WIDTH/2, 128);
        
        ctx.font = '16px Microsoft YaHei, SimHei, sans-serif';
        ctx.fillStyle = '#cccccc';
        ctx.fillText(`${t('pressR')} | ${t('pressESC')}`, SCREEN_WIDTH/2, 155);
    }
}

// Dramatic battle opening entrance animation
function drawBattleEntrance(timer) {
    const duration = 100;
    const progress = 1 - timer / duration;
    
    ctx.save();
    
    // Dark overlay
    const overlayAlpha = progress < 0.15 ? 1 - progress / 0.15 : (progress > 0.75 ? (1 - progress) / 0.25 : 0);
    ctx.fillStyle = `rgba(0,0,0,${overlayAlpha * 0.85})`;
    ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
    
    ctx.textAlign = 'center';
    
    // VS splash at ~15% progress
    if (progress > 0.05 && progress < 0.45) {
        const vsProgress = (progress - 0.05) / 0.4;
        const vsScale = vsProgress < 0.2 ? vsProgress * 5 : (vsProgress > 0.8 ? (1 - vsProgress) * 5 : 1);
        const vsAlpha = vsProgress < 0.1 ? vsProgress * 10 : (vsProgress > 0.85 ? (1 - vsProgress) * 6.67 : 1);
        
        ctx.globalAlpha = vsAlpha * 0.9;
        ctx.shadowColor = '#ff4444';
        ctx.shadowBlur = 50 + Math.sin(timer * 0.15) * 15;
        ctx.font = `bold ${80 * vsScale}px Microsoft YaHei, SimHei, sans-serif`;
        ctx.fillStyle = '#ff2200';
        ctx.fillText('VS', SCREEN_WIDTH/2, SCREEN_HEIGHT/2 + 25 * vsScale);
        ctx.shadowBlur = 0;
        
        // Background burst - throttled to reduce lag
        if (vsProgress < 0.3 && timer % 12 === 0) {
            spawnParticles(SCREEN_WIDTH/2 + (Math.random()-0.5)*150, SCREEN_HEIGHT/2 + (Math.random()-0.5)*80, 2, '#ff4444', 2, 1);
            spawnParticles(SCREEN_WIDTH/2 + (Math.random()-0.5)*150, SCREEN_HEIGHT/2 + (Math.random()-0.5)*80, 2, '#ffaa00', 2, 1);
        }
    }
    
    // Character names at top - slide in from sides
    const nameAlpha = Math.min(1, Math.max(0, (progress - 0.2) / 0.15));
    if (nameAlpha > 0) {
        ctx.globalAlpha = nameAlpha;
        ctx.font = 'bold 28px Microsoft YaHei, SimHei, sans-serif';
        
        // Player name - slide from left
        const nameOffset = Math.max(0, (1 - (progress - 0.2) / 0.3) * 100);
        ctx.textAlign = 'left';
        ctx.shadowColor = char1.getColor();
        ctx.shadowBlur = 15;
        ctx.fillStyle = char1.getColor();
        ctx.fillText(char1.name, 40 - nameOffset, 35);
        ctx.shadowBlur = 0;
        
        // Enemy name - slide from right
        ctx.textAlign = 'right';
        ctx.shadowColor = char2.getColor();
        ctx.shadowBlur = 15;
        ctx.fillStyle = char2.getColor();
        ctx.fillText(vsAI ? char2.name : '玩家2', SCREEN_WIDTH - 40 + nameOffset, 35);
        ctx.shadowBlur = 0;
        
        // Separator line
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.font = '18px Microsoft YaHei, SimHei, sans-serif';
        ctx.fillText('⚔', SCREEN_WIDTH/2, 35);
    }
    
    // Bottom subtitle - faction names
    const subAlpha = Math.min(1, Math.max(0, (progress - 0.35) / 0.1));
    if (subAlpha > 0) {
        ctx.globalAlpha = subAlpha;
        ctx.font = '14px Microsoft YaHei, SimHei, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillStyle = '#cccccc';
        ctx.fillText(`[${char1.faction}]`, 40, 60);
        ctx.textAlign = 'right';
        ctx.fillText(`[${char2.faction}]`, SCREEN_WIDTH - 40, 60);
    }
    
    ctx.globalAlpha = 1;
    ctx.restore();
}

// Dramatic wave entrance animation - enhanced
function drawWaveEntrance(timer) {
    const duration = 90;
    const progress = 1 - timer / duration;
    const alpha = progress < 0.15 ? progress / 0.15 : (progress > 0.8 ? (1 - progress) / 0.2 : 1);
    const t = Date.now() * 0.001;
    
    ctx.save();
    
    // Dark overlay with radial gradient spotlight
    const grad = ctx.createRadialGradient(SCREEN_WIDTH/2, SCREEN_HEIGHT/2, 0, SCREEN_WIDTH/2, SCREEN_HEIGHT/2, 300);
    grad.addColorStop(0, 'rgba(0,0,0,0.2)');
    grad.addColorStop(0.5, 'rgba(0,0,0,0.6)');
    grad.addColorStop(1, 'rgba(0,0,0,0.9)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
    
    // Wave number with dramatic entrance
    ctx.textAlign = 'center';
    const scaleIn = progress < 0.3 ? Math.sin(progress / 0.3 * Math.PI / 2) : 1;
    const bounceScale = progress < 0.35 ? scaleIn * (1 + (1 - scaleIn) * 0.3) : 1;
    
    // Glow color based on wave type
    const isBoss = survivalIsBossWave;
    const glowColor = isBoss ? '#ff2200' : '#ff8844';
    const textColor = isBoss ? '#ff4444' : '#ffcc44';
    const accentColor = isBoss ? '#ff6644' : '#ffdd88';
    
    // Background shockwave ring
    if (progress < 0.5) {
        const ringSize = progress * 2 * 350;
        const ringAlpha = (1 - progress * 2) * 0.3;
        ctx.globalAlpha = ringAlpha;
        ctx.strokeStyle = glowColor;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(SCREEN_WIDTH/2, SCREEN_HEIGHT/2, ringSize, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
    }
    
    ctx.save();
    ctx.translate(SCREEN_WIDTH / 2, SCREEN_HEIGHT / 2 - 20);
    ctx.scale(bounceScale, bounceScale);
    
    // Outer glow
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 40 + Math.sin(t * 8) * 10;
    
    if (isBoss) {
        ctx.font = 'bold 64px Microsoft YaHei, SimHei, sans-serif';
        ctx.fillStyle = textColor;
        ctx.fillText(`⚔️ BOSS 波 ${survivalWave} ⚔️`, 0, 0);
        ctx.shadowBlur = 0;
        // Subtitle with pulse
        ctx.globalAlpha = Math.min(1, alpha * 1.5);
        ctx.font = 'bold 22px Microsoft YaHei, SimHei, sans-serif';
        ctx.fillStyle = accentColor;
        ctx.fillText('⚠ 强敌来袭，准备迎战! ⚠', 0, 42);
    } else {
        ctx.font = 'bold 54px Microsoft YaHei, SimHei, sans-serif';
        ctx.fillStyle = textColor;
        ctx.fillText(`第 ${survivalWave} 波`, 0, 0);
        ctx.shadowBlur = 0;
        ctx.globalAlpha = Math.min(1, alpha * 1.5);
        ctx.font = '20px Microsoft YaHei, SimHei, sans-serif';
        ctx.fillStyle = accentColor;
        ctx.fillText('⚔ 敌人来袭 ⚔', 0, 36);
    }
    
    ctx.restore();
    
    // Golden particles burst at start - throttled
    if (progress < 0.25 && timer % 8 === 0) {
        const px = SCREEN_WIDTH/2 + (Math.random() - 0.5) * 200;
        const py = SCREEN_HEIGHT/2 + (Math.random() - 0.5) * 100;
        spawnParticles(px, py, 2, isBoss ? '#ff4444' : '#ffcc44', 2, 1);
    }
    
    ctx.globalAlpha = alpha * 0.6;
    
    // Ornate side lines - sweeping in from edges
    const lineProgress = Math.min(1, progress * 1.5);
    const lineWidth = 3;
    ctx.strokeStyle = glowColor;
    ctx.lineWidth = lineWidth;
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 8;
    
    // Top and bottom decorative lines
    const lineY1 = SCREEN_HEIGHT / 2 - 55;
    const lineY2 = SCREEN_HEIGHT / 2 + 55;
    const maxLineW = 250;
    const currentW = maxLineW * lineProgress;
    
    // Sweep left side
    ctx.beginPath();
    ctx.moveTo(SCREEN_WIDTH / 2 - currentW, lineY1 - (isBoss ? 10 : 0));
    ctx.lineTo(SCREEN_WIDTH / 2 - 60, lineY1 - (isBoss ? 10 : 0));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(SCREEN_WIDTH / 2 - currentW, lineY2 + (isBoss ? 10 : 0));
    ctx.lineTo(SCREEN_WIDTH / 2 - 60, lineY2 + (isBoss ? 10 : 0));
    ctx.stroke();
    
    // Sweep right side
    ctx.beginPath();
    ctx.moveTo(SCREEN_WIDTH / 2 + currentW, lineY1 - (isBoss ? 10 : 0));
    ctx.lineTo(SCREEN_WIDTH / 2 + 60, lineY1 - (isBoss ? 10 : 0));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(SCREEN_WIDTH / 2 + currentW, lineY2 + (isBoss ? 10 : 0));
    ctx.lineTo(SCREEN_WIDTH / 2 + 60, lineY2 + (isBoss ? 10 : 0));
    ctx.stroke();
    
    // Decorative diamond at center sides
    if (progress > 0.3) {
        const dSize = 6;
        ctx.fillStyle = glowColor;
        for (const dx of [-1, 1]) {
            for (const dy of [-1, 1]) {
                const cx = SCREEN_WIDTH/2 + dx * 65;
                const cy = SCREEN_HEIGHT/2 + dy * 50;
                ctx.beginPath();
                ctx.moveTo(cx, cy - dSize);
                ctx.lineTo(cx + dSize, cy);
                ctx.lineTo(cx, cy + dSize);
                ctx.lineTo(cx - dSize, cy);
                ctx.closePath();
                ctx.fill();
            }
        }
    }
    
    ctx.shadowBlur = 0;
    ctx.restore();
}

function addMessage(msg) {

// ========== SOUND SYSTEM (Web Audio API) ==========
let audioContext = null;
let soundEnabled = true;

function initAudio() {
    try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
        console.warn('Web Audio API not supported');
        soundEnabled = false;
    }
}

function playSound(type, volume = 0.3) {
    if (!soundEnabled || !audioContext) return;
    
    try {
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        gainNode.gain.value = volume;
        
        switch(type) {
            case 'hit':
                oscillator.frequency.value = 150;
                oscillator.type = 'sawtooth';
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.15);
                break;
            case 'critical':
                oscillator.frequency.value = 400;
                oscillator.type = 'square';
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.3);
                break;
            case 'musou':
                oscillator.frequency.value = 600;
                oscillator.type = 'sine';
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.5);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.5);
                break;
            case 'block':
                oscillator.frequency.value = 200;
                oscillator.type = 'triangle';
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.1);
                break;
            case 'jump':
                oscillator.frequency.value = 300;
                oscillator.type = 'sine';
                oscillator.frequency.exponentialRampToValueAtTime(600, audioContext.currentTime + 0.15);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.15);
                break;
            case 'victory':
                oscillator.frequency.value = 523;
                oscillator.type = 'sine';
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.8);
                oscillator.start();
                setTimeout(() => {
                    if (audioContext && audioContext.state !== 'closed') {
                        try {
                            const osc2 = audioContext.createOscillator();
                            const gain2 = audioContext.createGain();
                            osc2.connect(gain2);
                            gain2.connect(audioContext.destination);
                            osc2.frequency.value = 659;
                            gain2.gain.value = volume;
                            gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.8);
                            osc2.start();
                            osc2.stop(audioContext.currentTime + 0.8);
                        } catch (e) {
                            // Silently fail
                        }
                    }
                }, 200);
                oscillator.stop(audioContext.currentTime + 0.8);
                break;
            case 'arrow':
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.2);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.2);
                break;
            case 'select':
                oscillator.frequency.value = 440;
                oscillator.type = 'sine';
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.1);
                break;
        }
    } catch (e) {
        // Silently fail
    }
}

// Initialize audio on first interaction
function tryInitAudio() {
    if (!audioContext) initAudio();
    if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
    }
}
document.addEventListener('click', tryInitAudio, { once: true });
document.addEventListener('keydown', tryInitAudio, { once: true });
document.addEventListener('touchstart', tryInitAudio, { once: true });

// ========== ENHANCED AI SYSTEM ==========
function updateAI(ai, enemy, currentTime) {
    ai.moveLeft = false;
    ai.moveRight = false;
    const dx = enemy.x - ai.x;
    const dist = Math.abs(dx);
    
    // AI personality based on win streak
    const aggression = Math.min(1, 0.4 + winStreak * 0.08);
    const reactionTime = Math.max(200, 500 - winStreak * 25);
    
    // AI state machine
    if (!ai.aiState) {
        ai.aiState = {
            mode: 'approach', // approach, attack, retreat, dodge, feint
            stateTimer: 0,
            feintCooldown: 0,
            comboCount: 0,
            lastAttackResult: null,
            dodgeCooldown: 0
        };
    }
    
    const state = ai.aiState;
    state.stateTimer--;
    state.feintCooldown--;
    state.dodgeCooldown--;
    
    // Dodge projectiles intelligently - only if heading toward AI
    let shouldDodge = false;
    for (const p of projectiles) {
        if (p.owner !== ai && p.alive) {
            const projDist = hypot(p.x - ai.x, p.y - ai.y);
            if (projDist < 120) {
                // Check if projectile is moving toward AI
                const dotProduct = p.vx * (ai.x - p.x) + p.vy * (ai.y - p.y);
                if (dotProduct <= 0) continue; // Moving away from AI
                const projSpeed = hypot(p.vx, p.vy);
                if (projSpeed < 0.1) continue;
                const timeToImpact = projDist / projSpeed;
                if (timeToImpact < 30 && Math.random() < 0.7 && state.dodgeCooldown <= 0) {
                    shouldDodge = true;
                    state.dodgeCooldown = 60;
                }
            }
        }
    }
    
    if (shouldDodge) {
        // Use dodge roll instead of jump
        const dodgeDir = dx > 0 ? -1 : 1; // Dodge away from projectile
        ai.attemptDodge(dodgeDir);
        return;
    }
    
    // State machine behavior
    if (state.stateTimer <= 0) {
        // Choose new state
        const rand = Math.random();
        
        if (dist > ai.attackRange * 1.2) {
            // Too far - approach
            state.mode = 'approach';
            state.stateTimer = 30 + Math.random() * 30;
        } else if (dist < ai.attackRange * 0.5) {
            // Too close - might retreat or attack
            if (rand < 0.3 * aggression) {
                state.mode = 'retreat';
                state.stateTimer = 20 + Math.random() * 20;
            } else {
                state.mode = 'attack';
                state.stateTimer = 15 + Math.random() * 20;
            }
        } else {
            // In range
            if (rand < 0.15 && state.feintCooldown <= 0) {
                // Feint - fake attack then back off
                state.mode = 'feint';
                state.stateTimer = 25;
                state.feintCooldown = 120;
            } else if (rand < 0.15 + 0.5 * aggression) {
                state.mode = 'attack';
                state.stateTimer = 20 + Math.random() * 30;
            } else if (rand < 0.15 + 0.5 * aggression + 0.2) {
                state.mode = 'retreat';
                state.stateTimer = 20 + Math.random() * 20;
            } else {
                state.mode = 'circle';
                state.stateTimer = 30 + Math.random() * 30;
            }
        }
    }
    
    // Execute state
    switch (state.mode) {
        case 'approach':
            if (dx > 0) ai.moveRight = true;
            else ai.moveLeft = true;
            // Jump occasionally while approaching
            if (ai.onGround && Math.random() < 0.02) {
                ai.attemptJump();
            }
            break;
            
        case 'attack':
            ai.faceEnemy(enemy);
            
            // Use ranged attacks if available
            const cat = weaponCategory(ai.weapon);
            const isRanged = ['bow', 'crossbow'].includes(cat);
            
            if (isRanged && dist > 150) {
                const [arr, msg] = ai.tryRangedAttack(enemy, currentTime);
                if (arr) {
                    projectiles.push(arr);
                    if (msg) addMessage(msg);
                    if (msg && msg.includes('无双')) playSound('musou', 0.4);
                    else playSound('arrow', 0.2);
                }
            } else {
                // Melee attack with combo potential
                const res = ai.attack(enemy, currentTime);
                if (res) {
                    addMessage(res);
                    if (res.includes('无双')) playSound('musou', 0.4);
                    else if (res.includes('暴击')) playSound('critical', 0.3);
                    else playSound('hit', 0.2);
                    
                    state.comboCount++;
                    state.lastAttackResult = 'hit';
                    
                    // Chain attacks if combo - wait for cooldown to expire
                    if (state.comboCount < 3 && Math.random() < 0.4 * aggression) {
                        state.stateTimer = Math.max(15, Math.ceil(ai.attackCooldown / 16.67));
                    }
                } else {
                    state.comboCount = 0;
                    state.lastAttackResult = 'miss';
                }
            }
            break;
            
        case 'retreat':
            if (dx > 0) ai.moveLeft = true;
            else ai.moveRight = true;
            // Jump while retreating
            if (ai.onGround && Math.random() < 0.05) {
                ai.attemptJump();
            }
            break;
            
        case 'feint':
            // Move toward enemy as if attacking, then back off
            if (state.stateTimer > 12) {
                // Approach phase
                if (dx > 0) ai.moveRight = true;
                else ai.moveLeft = true;
            } else {
                // Retreat phase
                if (dx > 0) ai.moveLeft = true;
                else ai.moveRight = true;
                // Maybe jump while retreating
                if (ai.onGround && state.stateTimer === 10) {
                    ai.attemptJump();
                }
            }
            break;
            
        case 'circle':
            // Strafe left/right while maintaining distance
            if (Math.sin(Date.now() * 0.003 + ai.x) > 0) {
                ai.moveRight = true;
            } else {
                ai.moveLeft = true;
            }
            break;
    }
    
    // Smart jumping
    if (ai.onGround && Math.random() < 0.03 * aggression && dist < 250) {
        ai.attemptJump();
    }
    
    // Defensive behavior - more responsive when low health
    ai.faceEnemy(enemy);
    const healthRatio = ai.blood / ai.maxBlood;
    const defendPriority = (0.3 + aggression * 0.2) * (healthRatio < 0.4 ? 2 : 1);
    if (enemy.attacking && dist < enemy.attackRange * 1.3) {
        const timeSinceEnemyAttack = currentTime - enemy.lastAttackTime;
        if (timeSinceEnemyAttack < 400 && Math.random() < defendPriority) {
            ai.defending = true;
            ai.defenseTimer = 350;
        }
    }
    // Sometimes defend when approaching a ranged enemy
    if (state.mode === 'approach') {
        const enemyCat = weaponCategory(enemy.weapon);
        if (['bow', 'crossbow'].includes(enemyCat) && dist < 300 && dist > 100) {
            if (Math.random() < 0.15 * aggression) {
                ai.defending = true;
                ai.defenseTimer = 250;
            }
        }
    }
}

// Update visibility of mobile controls based on game state
function updateControlsVisibility() {
    // Check if isMobile is defined, if not assume false or check touch
    const mobileMode = (typeof isMobile !== 'undefined') ? isMobile : ('ontouchstart' in window);
    if (!mobileMode) return;
    
    const controls = document.getElementById('controls');
    const mobileUtils = document.getElementById('mobileUtils');
    const rightButtons = document.querySelector('.right-buttons-container');
    
    // Show controls in battle, selection, shop, and survival
    const showControls = (gameState === 'battle' || gameState === 'selection' || gameState === 'shop' || gameState === 'survival');
    
    if (controls) {
        controls.style.display = showControls ? 'block' : 'none';
    }
    
    // Only show action buttons (Attack/Defend) in battle and survival
    if (rightButtons) {
        rightButtons.style.display = (gameState === 'battle' || gameState === 'survival') ? 'flex' : 'none';
    }
    
    if (mobileUtils) {
        mobileUtils.style.display = (gameState === 'battle' || gameState === 'survival') ? 'flex' : 'none';
    }
}

// Handle joystick and keyboard scrolling for menus
function updateMenuControls() {
    const scrollSpeed = 15;
    
    // Check both touch/joystick and keyboard input
    const up = (typeof touch !== 'undefined' && touch.up) || (keys && (keys['arrowup'] || keys['w']));
    const down = (typeof touch !== 'undefined' && touch.down) || (keys && (keys['arrowdown'] || keys['s']));
    
    if (gameState === 'selection' && selectedFaction) {
        if (up) {
            heroScrollY = clamp(heroScrollY - scrollSpeed, 0, heroScrollMax);
        }
        if (down) {
            heroScrollY = clamp(heroScrollY + scrollSpeed, 0, heroScrollMax);
        }
    } else if (gameState === 'shop') {
        if (up) {
            shopScrollY = clamp(shopScrollY - scrollSpeed, 0, shopScrollMax);
        }
        if (down) {
            shopScrollY = clamp(shopScrollY + scrollSpeed, 0, shopScrollMax);
        }
    }
}

// ========== GAME LOOP ==========
let lastTime = 0;
let frameCount = 0;

function gameLoop(timestamp) {
    if (timestamp - lastTime > 1000) {
        lastTime = timestamp;
    }
    
    const dt = Math.min(32, timestamp - lastTime);
    lastTime = timestamp;
    
    // Anti-freeze check
    frameCount++;
    
    // Auto-update mobile controls visibility
    updateControlsVisibility();
    
    // Handle menu scrolling with joystick
    updateMenuControls();
    
    // Random weather changes during battle
    if (gameState === 'battle' && frameCount % 600 === 0) { // Every ~10 seconds
        const weatherRoll = Math.random();
        if (weatherRoll < 0.15) {
            setWeather(WEATHER_RAIN, 80);
        } else if (weatherRoll < 0.25) {
            setWeather(WEATHER_SNOW, 70);
        } else if (weatherRoll < 0.35) {
            setWeather(WEATHER_FOG, 60);
        } else if (weatherRoll < 0.45) {
            setWeather(WEATHER_NONE, 0);
        }
    }
    
    ctx.clearRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
    
    // Update transition effect
    updateTransition();
    updateHitSparks();
    updateSlashTrails();
    
    if (gameState === 'language') {
        drawLanguageScreen();
    } else if (gameState === 'selection') {
        drawSelectionScreen();
    } else if (gameState === 'shop') {
        drawShopScreen();
    } else if (gameState === 'battle') {
        updateBattle(dt, timestamp);
        drawBattle();
    } else if (gameState === 'survival') {
        updateSurvivalMode(dt, timestamp);
        drawSurvivalMode();
    }
    
    drawTransition(ctx);
    
    requestAnimationFrame(gameLoop);
}

function updateBattle(dt, currentTime) {
    updateShake();
    updateWeather();
    updateLights();
    updateComboSystem();
    updateAchievementDisplay();
    
    // Update particles
    particles = particles.filter(p => { p.update(); return p.life > 0; });
    floatingTexts = floatingTexts.filter(t => { t.update(); return t.life > 0; });
    musouEffects = musouEffects.filter(m => { m.update(); return m.life > 0; });
    
    // Player 1 input
    char1.moveLeft = keys['a'] || touch.left;
    char1.moveRight = keys['d'] || touch.right;
    
    if ((keys['w'] || touch.jump) && !lastJump) {
        char1.attemptJump();
        playSound('jump', 0.15);
    }
    lastJump = keys['w'] || touch.jump;
    
    if ((keys['x'] || touch.attack) && !lastAttack && !gameOver) {
        char1.faceEnemy(char2);
        const [arr, msg] = char1.tryRangedAttack(char2, currentTime);
        if (arr) {
            projectiles.push(arr);
            if (msg) addMessage(msg);
            if (msg && msg.includes('无双')) playSound('musou', 0.4);
            else playSound('arrow', 0.2);
        } else {
            const res = char1.attack(char2, currentTime);
            if (res) {
                addMessage(res);
                if (res.includes('无双')) playSound('musou', 0.4);
                else if (res.includes('暴击')) playSound('critical', 0.3);
                else if (res.includes('伤害')) playSound('hit', 0.2);
            }
        }
    }
    lastAttack = keys['x'] || touch.attack;
    
    if ((keys['c'] || touch.defend) && !lastDefend) {
        char1.defending = true;
        char1.defenseTimer = 400;
        playSound('block', 0.15);
    }
    if (!(keys['c'] || touch.defend)) {
        char1.defending = false;
    }
    lastDefend = keys['c'] || touch.defend;
    
    // Dodge roll input (Q=left dodge, E=right dodge)
    if (keys['q'] && !lastDodgeLeft) {
        if (char1.attemptDodge(-1)) {
            playSound('jump', 0.1);
            spawnDustTrail(char1.x, GROUND_Y, -5);
        }
    }
    lastDodgeLeft = keys['q'];
    if (keys['e'] && !lastDodgeRight) {
        if (char1.attemptDodge(1)) {
            playSound('jump', 0.1);
            spawnDustTrail(char1.x, GROUND_Y, 5);
        }
    }
    lastDodgeRight = keys['e'];
    
    // AI or Player 2
    if (vsAI && char2.isAlive && char1.isAlive) {
        updateAI(char2, char1, currentTime);
    } else if (!vsAI) {
        char2.moveLeft = keys['arrowleft'];
        char2.moveRight = keys['arrowright'];
        if (keys['arrowup'] && !lastP2Jump) {
            char2.attemptJump();
            playSound('jump', 0.15);
        }
        lastP2Jump = keys['arrowup'];
        if (keys['enter'] && !lastP2Attack && !gameOver) {
            char2.faceEnemy(char1);
            const [arr, msg] = char2.tryRangedAttack(char1, currentTime);
            if (arr) {
                projectiles.push(arr);
                if (msg) addMessage(msg);
                if (msg && msg.includes('无双')) playSound('musou', 0.4);
                else playSound('arrow', 0.2);
            } else {
                const res = char2.attack(char1, currentTime);
                if (res) {
                    addMessage(res);
                    if (res.includes('无双')) playSound('musou', 0.4);
                    else if (res.includes('暴击')) playSound('critical', 0.3);
                    else if (res.includes('伤害')) playSound('hit', 0.2);
                }
            }
        }
        lastP2Attack = keys['enter'];
        if (keys['shift']) {
            char2.defending = true;
            char2.defenseTimer = 400;
        } else {
            char2.defending = false;
        }
    }
    
    char1.update(dt);
    char2.update(dt);
    char1.moveByInput(dt);
    char2.moveByInput(dt);
    char1.applyPhysics(dt);
    char2.applyPhysics(dt);
    
    // Spawn dust trails when running
    if (char1.isAlive && char1.onGround) {
        spawnDustTrail(char1.x, GROUND_Y, char1.vx);
    }
    if (char2.isAlive && char2.onGround) {
        spawnDustTrail(char2.x, GROUND_Y, char2.vx);
    }
    
    if (char1.attacking) char1.faceEnemy(char2);
    else if (Math.abs(char1.vx) > 0.1) char1.direction = char1.vx >= 0 ? 0 : 180;
    if (char2.attacking) char2.faceEnemy(char1);
    else if (Math.abs(char2.vx) > 0.1) char2.direction = char2.vx >= 0 ? 0 : 180;
    
    // Projectiles
    projectiles = projectiles.filter(p => {
        p.update();
        const target = p.owner === char2 ? char1 : char2;
        const msg = p.checkHit(target);
        if (msg) {
            addMessage(msg);
            playSound('hit', 0.2);
        }
        return p.alive;
    });
    
    // Message timer
    if (messageTimer > 0) {
        messageTimer -= dt;
        if (messageTimer <= 0) messages = [];
    }
    
    // Battle entrance timer
    if (battleEntranceTimer > 0) {
        battleEntranceTimer--;
        if (battleEntranceTimer === 85) {
            addMessage(`⚔ ${char1.name} VS ${vsAI ? char2.name : '玩家2'} ⚔`);
            triggerScreenFlash('#ffffff', 8);
            shake(6, 5);
        }
    }
    
    // Check win
    if (!gameOver && (!char1.isAlive || !char2.isAlive)) {
        if (char1.isAlive) {
            endBattle(char1);
            playSound('victory', 0.3);
        } else if (char2.isAlive) {
            endBattle(char2);
        } else {
            endBattle(null);
        }
    }
}

function drawBattle() {
    const ox = screenShake.offsetX;
    const oy = screenShake.offsetY;
    
    ctx.save();
    ctx.translate(-ox, -oy);
    
    drawBackground(ctx);
    
    // Draw ambient particles behind characters
    ambientParticles.forEach(p => {
        p.update();
        p.draw(ctx);
    });
    
    heroRenderer.render(ctx, char1, char2);
    heroRenderer.render(ctx, char2, char1);
    
    // Draw dust trails
    dustTrails = dustTrails.filter(d => {
        d.update();
        d.draw(ctx);
        return d.life > 0;
    });
    
    // Draw ground impacts
    groundImpacts = groundImpacts.filter(g => {
        g.update();
        g.draw(ctx);
        return g.life > 0;
    });
    
    // Attack range indicator for player 1
    if (char1.isAlive && char1.isPlayer) {
        ctx.globalAlpha = 0.15;
        ctx.fillStyle = char1.getColor();
        ctx.beginPath();
        ctx.moveTo(char1.x, char1.y);
        const rad = char1.direction * Math.PI / 180;
        const halfFov = ATTACK_FOV_DEG * Math.PI / 360;
        for (let i = 0; i <= 12; i++) {
            const a = rad - halfFov + (2 * halfFov) * i / 12;
            ctx.lineTo(char1.x + Math.cos(a) * char1.attackRange, char1.y + Math.sin(a) * char1.attackRange);
        }
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // Attack range indicator for player 2
    if (char2.isAlive && char2.isPlayer) {
        ctx.globalAlpha = 0.15;
        ctx.fillStyle = char2.getColor();
        ctx.beginPath();
        ctx.moveTo(char2.x, char2.y);
        const rad = char2.direction * Math.PI / 180;
        const halfFov = ATTACK_FOV_DEG * Math.PI / 360;
        for (let i = 0; i <= 12; i++) {
            const a = rad - halfFov + (2 * halfFov) * i / 12;
            ctx.lineTo(char2.x + Math.cos(a) * char2.attackRange, char2.y + Math.sin(a) * char2.attackRange);
        }
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
    }
    
    projectiles.forEach(p => p.draw(ctx));
    particles.forEach(p => p.draw(ctx, ox, oy));
    floatingTexts.forEach(t => t.draw(ctx, ox, oy));
    musouEffects.forEach(m => m.draw(ctx, ox, oy));
    drawSlashTrails(ctx);
    drawHitSparks(ctx);
    
    ctx.restore();
    
    // Draw weather effects
    drawWeather(ctx);
    
    // Draw dynamic lighting
    drawLights(ctx);
    
    // Draw combo display
    drawComboDisplay(ctx);
    
    // Screen flash effect
    updateScreenFlash();
    drawScreenFlash(ctx);
    
    // Messages
    if (messages.length > 0) {
        ctx.font = 'bold 16px Microsoft YaHei, SimHei, sans-serif';
        ctx.textAlign = 'center';
        let yOff = 60;
        messages.slice(-3).forEach(msg => {
            ctx.fillStyle = BLACK;
            ctx.fillText(msg, SCREEN_WIDTH/2 + 1, yOff + 1);
            ctx.fillStyle = YELLOW;
            ctx.fillText(msg, SCREEN_WIDTH/2, yOff);
            yOff += 25;
        });
    }
    
    // Game over banner - at top, doesn't block characters
    if (gameOver) {
        const t2 = Date.now() * 0.001;
        const bannerH = 140;
        const grad = ctx.createLinearGradient(0, 0, 0, bannerH);
        grad.addColorStop(0, 'rgba(0,0,0,0.9)');
        grad.addColorStop(0.7, 'rgba(0,0,0,0.6)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, SCREEN_WIDTH, bannerH);
        
        ctx.textAlign = 'center';
        ctx.font = 'bold 36px Microsoft YaHei, SimHei, sans-serif';
        if (winner) {
            ctx.shadowColor = winner.getColor();
            ctx.shadowBlur = 20 + Math.sin(t2 * 5) * 5;
            ctx.fillStyle = winner.getColor();
            ctx.fillText(`🏆 ${winner.name} ${t('wins')}!`, SCREEN_WIDTH/2, 45);
            ctx.shadowBlur = 0;
        } else {
            ctx.fillStyle = WHITE;
            ctx.fillText('平局!', SCREEN_WIDTH/2, 45);
        }
        
        // Show rewards if player won - with heal info
        if (winner === char1) {
            ctx.font = '18px Microsoft YaHei, SimHei, sans-serif';
            ctx.fillStyle = '#44ff44';
            ctx.fillText(`❤ 恢复 30% 血量`, SCREEN_WIDTH/2, 72);
            ctx.font = '20px Microsoft YaHei, SimHei, sans-serif';
            ctx.fillStyle = YELLOW;
            ctx.fillText(`${t('gold')}: ${playerGold} | ${t('winStreak')}: ${winStreak}`, SCREEN_WIDTH/2, 97);
        }
        
        ctx.font = '16px Microsoft YaHei, SimHei, sans-serif';
        ctx.fillStyle = '#cccccc';
        ctx.fillText(`${t('pressR')} | ${t('pressESC')}`, SCREEN_WIDTH/2, 122);
        
        // Shop button if player won - bottom right corner
        if (winner === char1) {
            ctx.fillStyle = 'rgba(68,136,170,0.9)';
            ctx.fillRect(SCREEN_WIDTH - 130, SCREEN_HEIGHT - 50, 120, 40);
            ctx.strokeStyle = '#66aacc';
            ctx.lineWidth = 2;
            ctx.strokeRect(SCREEN_WIDTH - 130, SCREEN_HEIGHT - 50, 120, 40);
            ctx.fillStyle = WHITE;
            ctx.font = 'bold 16px Microsoft YaHei, SimHei, sans-serif';
            ctx.fillText(t('shop'), SCREEN_WIDTH - 70, SCREEN_HEIGHT - 25);
        }
    }
    
    // Battle entrance animation
    if (battleEntranceTimer > 0) {
        drawBattleEntrance(battleEntranceTimer);
    }
    
    // Enhanced HUD with musou bars
    drawEnhancedHUD();
}

function drawEnhancedHUD() {
    if (!char1 || !char2) return;
    
    const t = Date.now() * 0.003;
    
    // Player 1 health bar with animation
    if (char1.isAlive) {
        const barX = 20;
        const barY = SCREEN_HEIGHT - 65;
        const barW = 150;
        const barH = 16;
        const healthPct = char1.blood / char1.maxBlood;
        
        // Background with border
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        roundRect(ctx, barX - 2, barY - 2, barW + 4, barH + 4, 8);
        ctx.fill();
        
        // Health bar with gradient
        const healthGrad = ctx.createLinearGradient(barX, barY, barX, barY + barH);
        if (healthPct > 0.6) {
            healthGrad.addColorStop(0, '#44dd44');
            healthGrad.addColorStop(1, '#22aa22');
        } else if (healthPct > 0.3) {
            healthGrad.addColorStop(0, '#dddd44');
            healthGrad.addColorStop(1, '#aaaa22');
        } else {
            // Pulsing red when low
            const pulse = Math.sin(t * 3) * 0.2 + 0.8;
            healthGrad.addColorStop(0, `rgba(220, 40, 40, ${pulse})`);
            healthGrad.addColorStop(1, `rgba(180, 20, 20, ${pulse})`);
        }
        ctx.fillStyle = healthGrad;
        roundRect(ctx, barX, barY, barW * healthPct, barH, 6);
        ctx.fill();
        
        // Shine effect
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        roundRect(ctx, barX, barY, barW * healthPct, barH / 2, 6);
        ctx.fill();
        
        // Name and health text
        ctx.font = 'bold 11px Microsoft YaHei, sans-serif';
        ctx.fillStyle = WHITE;
        ctx.textAlign = 'left';
        ctx.fillText(`${char1.name}`, barX + 5, barY + 12);
        ctx.font = '10px Microsoft YaHei, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`${char1.blood}/${char1.maxBlood}`, barX + barW - 5, barY + 12);
        
        // Musou bar
        const musouY = barY + barH + 5;
        const musouH = 10;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        roundRect(ctx, barX, musouY, barW, musouH, 5);
        ctx.fill();
        
        const musouPercent = char1.musou / char1.musouMax;
        if (musouPercent >= 1) {
            // Full musou - animated glow
            const glow = Math.sin(t * 5) * 0.3 + 0.7;
            ctx.fillStyle = `rgba(255, 68, 255, ${glow})`;
            ctx.shadowColor = '#ff44ff';
            ctx.shadowBlur = 10;
        } else {
            ctx.fillStyle = '#4488ff';
            ctx.shadowBlur = 0;
        }
        roundRect(ctx, barX, musouY, barW * musouPercent, musouH, 5);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.font = 'bold 9px Microsoft YaHei, sans-serif';
        ctx.fillStyle = WHITE;
        ctx.textAlign = 'left';
        ctx.fillText('无双', barX + 4, musouY + 8);
        
        if (musouPercent >= 1) {
            ctx.fillStyle = '#ffff00';
            ctx.textAlign = 'right';
            ctx.fillText('满!', barX + barW - 4, musouY + 8);
        }
    }
    
    // Player 2 Musou bar (if not AI)
    if (!vsAI && char2.isAlive && char2.isPlayer) {
        const barX = SCREEN_WIDTH - 170;
        const barY = SCREEN_HEIGHT - 65;
        const barW = 150;
        const barH = 16;
        const healthPct = char2.blood / char2.maxBlood;
        
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        roundRect(ctx, barX - 2, barY - 2, barW + 4, barH + 4, 8);
        ctx.fill();
        
        const healthGrad = ctx.createLinearGradient(barX, barY, barX, barY + barH);
        if (healthPct > 0.6) {
            healthGrad.addColorStop(0, '#44dd44');
            healthGrad.addColorStop(1, '#22aa22');
        } else if (healthPct > 0.3) {
            healthGrad.addColorStop(0, '#dddd44');
            healthGrad.addColorStop(1, '#aaaa22');
        } else {
            const pulse = Math.sin(t * 3) * 0.2 + 0.8;
            healthGrad.addColorStop(0, `rgba(220, 40, 40, ${pulse})`);
            healthGrad.addColorStop(1, `rgba(180, 20, 20, ${pulse})`);
        }
        ctx.fillStyle = healthGrad;
        roundRect(ctx, barX, barY, barW * healthPct, barH, 6);
        ctx.fill();
        
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        roundRect(ctx, barX, barY, barW * healthPct, barH / 2, 6);
        ctx.fill();
        
        ctx.font = 'bold 11px Microsoft YaHei, sans-serif';
        ctx.fillStyle = WHITE;
        ctx.textAlign = 'right';
        ctx.fillText(`${char2.name}`, barX + barW - 5, barY + 12);
        ctx.font = '10px Microsoft YaHei, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`${char2.blood}/${char2.maxBlood}`, barX + 5, barY + 12);
        
        // Musou bar
        const musouY = barY + barH + 5;
        const musouH = 10;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        roundRect(ctx, barX, musouY, barW, musouH, 5);
        ctx.fill();
        
        const musouPercent = char2.musou / char2.musouMax;
        if (musouPercent >= 1) {
            const glow = Math.sin(t * 5) * 0.3 + 0.7;
            ctx.fillStyle = `rgba(255, 68, 255, ${glow})`;
            ctx.shadowColor = '#ff44ff';
            ctx.shadowBlur = 10;
        } else {
            ctx.fillStyle = '#4488ff';
            ctx.shadowBlur = 0;
        }
        roundRect(ctx, barX, musouY, barW * musouPercent, musouH, 5);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Musou text label
        ctx.font = 'bold 9px Microsoft YaHei, sans-serif';
        ctx.fillStyle = WHITE;
        ctx.textAlign = 'left';
        ctx.fillText('无双', barX + 4, musouY + 8);
        
        if (musouPercent >= 1) {
            ctx.fillStyle = '#ffff00';
            ctx.textAlign = 'right';
            ctx.fillText('满!', barX + barW - 4, musouY + 8);
        }
    }
}

function drawLanguageScreen() {
    drawBackground(ctx);
    
    const now = Date.now() * 0.001;
    ctx.textAlign = 'center';
    
    // Title with glow effect
    const titleSize = isMobile ? 40 : 36;
    ctx.shadowColor = '#ff8844';
    ctx.shadowBlur = 20 + Math.sin(now * 3) * 5;
    ctx.font = `bold ${titleSize}px Microsoft YaHei, SimHei, sans-serif`;
    ctx.fillStyle = '#ffcc44';
    ctx.fillText(t('title'), SCREEN_WIDTH/2, 55);
    ctx.shadowBlur = 0;
    
    // Decorative line under title
    ctx.strokeStyle = 'rgba(255,204,68,0.4)';
    ctx.lineWidth = 2;
    const lineW = 200 + Math.sin(now * 2) * 10;
    ctx.beginPath();
    ctx.moveTo(SCREEN_WIDTH/2 - lineW/2, 70);
    ctx.lineTo(SCREEN_WIDTH/2 + lineW/2, 70);
    ctx.stroke();
    
    // Instructions - more descriptive for mobile
    const instructionSize = isMobile ? 20 : 16;
    ctx.font = `${instructionSize}px Microsoft YaHei, SimHei, sans-serif`;
    ctx.fillStyle = YELLOW;
    const instruction = isMobile ? t('selectLanguageMobile') : t('selectLanguage');
    ctx.fillText(instruction, SCREEN_WIDTH/2, 100);
    
    // Language buttons - responsive sizing
    const cols = 5;
    const btnW = isMobile ? 180 : 160;
    const btnH = isMobile ? 70 : 60;
    const startX = (SCREEN_WIDTH - cols * (btnW + 15)) / 2 + btnW/2;
    const startY = 160;
    const rowGap = isMobile ? 90 : 80;
    
    for (let i = 0; i < LANGUAGES.length; i++) {
        const lang = LANGUAGES[i];
        const col = i % cols;
        const row = Math.floor(i / cols);
        const x = startX + col * (btnW + 15);
        const y = startY + row * rowGap;
        
        const isSelected = currentLang === lang.code;
        
        // Button background with gradient
        const gradient = ctx.createLinearGradient(x - btnW/2, y - btnH/2, x - btnW/2, y + btnH/2);
        if (isSelected) {
            gradient.addColorStop(0, '#ffcc00');
            gradient.addColorStop(1, '#cc9900');
        } else {
            gradient.addColorStop(0, '#4a4a4a');
            gradient.addColorStop(1, '#2a2a2a');
        }
        ctx.fillStyle = gradient;
        roundRect(ctx, x - btnW/2, y - btnH/2, btnW, btnH, 10);
        ctx.fill();
        
        // Button border
        ctx.strokeStyle = isSelected ? '#ffffff' : '#666666';
        ctx.lineWidth = isSelected ? 3 : 2;
        roundRect(ctx, x - btnW/2, y - btnH/2, btnW, btnH, 10);
        ctx.stroke();
        
        // Flag
        ctx.font = `${isMobile ? 28 : 24}px sans-serif`;
        ctx.fillStyle = WHITE;
        ctx.fillText(lang.flag, x - btnW/2 + 15, y + 8);
        
        // Language name
        ctx.font = `bold ${isMobile ? 20 : 16}px Microsoft YaHei, SimHei, sans-serif`;
        ctx.fillStyle = isSelected ? '#000000' : WHITE;
        ctx.fillText(lang.name, x + 20, y + 8);
        
        // Code (smaller)
        ctx.font = `${isMobile ? 14 : 12}px monospace`;
        ctx.fillStyle = isSelected ? 'rgba(0,0,0,0.7)' : '#aaaaaa';
        ctx.fillText(`(${lang.code.toUpperCase()})`, x + 20, y + 25);
    }
    
    // Continue button - larger on mobile
    const contY = startY + 2 * rowGap + 80;
    const contW = isMobile ? 220 : 200;
    const contH = isMobile ? 60 : 50;
    
    // Continue button with gradient
    const contGradient = ctx.createLinearGradient(SCREEN_WIDTH/2 - contW/2, contY - contH/2, SCREEN_WIDTH/2 - contW/2, contY + contH/2);
    contGradient.addColorStop(0, '#22aa44');
    contGradient.addColorStop(1, '#1a8833');
    ctx.fillStyle = contGradient;
    roundRect(ctx, SCREEN_WIDTH/2 - contW/2, contY - contH/2, contW, contH, 12);
    ctx.fill();
    
    // Continue button border
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Continue text
    ctx.font = `bold ${isMobile ? 22 : 20}px Microsoft YaHei, SimHei, sans-serif`;
    ctx.fillStyle = WHITE;
    ctx.fillText(currentLang === 'zh' ? '开始游戏' : 'Start Game', SCREEN_WIDTH/2, contY + 8);
    
    // Mobile tip
    if (isMobile) {
        ctx.font = '14px Microsoft YaHei, SimHei, sans-serif';
        ctx.fillStyle = '#888888';
        ctx.fillText('💡 轻触按钮选择语言', SCREEN_WIDTH/2, contY + 60);
    }
}

function handleLanguageClick(x, y) {
    const cols = 5;
    const btnW = isMobile ? 180 : 160;  // Larger on mobile
    const btnH = isMobile ? 70 : 60;    // Larger on mobile
    const startX = (SCREEN_WIDTH - cols * (btnW + 15)) / 2 + btnW/2;
    const startY = 160;
    const rowGap = isMobile ? 90 : 80;  // More spacing on mobile
    
    // Add visual feedback for touch
    let touchedButton = null;
    
    for (let i = 0; i < LANGUAGES.length; i++) {
        const lang = LANGUAGES[i];
        const col = i % cols;
        const row = Math.floor(i / cols);
        const bx = startX + col * (btnW + 15);
        const by = startY + row * rowGap;
        
        const hitPadding = isMobile ? 15 : 10;
        const hitLeft = bx - btnW/2 - hitPadding;
        const hitRight = bx + btnW/2 + hitPadding;
        const hitTop = by - btnH/2 - hitPadding;
        const hitBottom = by + btnH/2 + hitPadding;
        
        if (x > hitLeft && x < hitRight && y > hitTop && y < hitBottom) {
            currentLang = lang.code;
            updateUILanguage();
            vibrate(15);
            
            // Visual feedback
            drawLanguageSelectionFeedback(bx, by, btnW, btnH);
            return;
        }
    }
    
    // Check continue button - also enlarged
    const contY = startY + 2 * rowGap + 80;
    const contWidth = isMobile ? 220 : 200;
    const contHeight = isMobile ? 60 : 50;
    const hitPadding = isMobile ? 20 : 15;
    
    const contHitLeft = SCREEN_WIDTH/2 - contWidth/2 - hitPadding;
    const contHitRight = SCREEN_WIDTH/2 + contWidth/2 + hitPadding;
    const contHitTop = contY - contHeight/2 - hitPadding;
    const contHitBottom = contY + contHeight/2 + hitPadding;
    
    if (x > contHitLeft && x < contHitRight && y > contHitTop && y < contHitBottom) {
        gameState = 'selection';
        vibrate(20);
        
        drawContinueButtonFeedback(SCREEN_WIDTH/2, contY, contWidth, contHeight);
    }
}

// Add roundRect support for older browsers
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, width, height, radius) {
        if (width < 2 * radius) radius = width / 2;
        if (height < 2 * radius) radius = height / 2;
        this.beginPath();
        this.moveTo(x + radius, y);
        this.arcTo(x + width, y, x + width, y + height, radius);
        this.arcTo(x + width, y + height, x, y + height, radius);
        this.arcTo(x, y + height, x, y, radius);
        this.arcTo(x, y, x + width, y, radius);
        this.closePath();
        return this;
    };
}

// Handle touch for all screens (mobile support) with swipe gestures
canvas.addEventListener('touchstart', e => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches[0].clientX - rect.left) / scale;
    const y = (e.touches[0].clientY - rect.top) / scale;
    
    e.preventDefault();
    
    // Store swipe start position
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
    swipeStartTime = Date.now();
    
    // Haptic feedback on touch
    vibrate(5);
    
    if (gameState === 'selection') {
        handleSelectionClick(x, y);
    } else if (gameState === 'shop') {
        handleShopClick(x, y);
    } else if (gameState === 'battle' && gameOver) {
        // Check if shop button clicked (bottom right)
        if (winner === char1 && 
            x > SCREEN_WIDTH - 130 && x < SCREEN_WIDTH - 10 &&
            y > SCREEN_HEIGHT - 50 && y < SCREEN_HEIGHT - 10) {
            gameState = 'shop';
            vibrate(15);
        } else {
            restartBattle();
            vibrate(10);
        }
    }
}, { passive: false });

// Swipe gesture detection
canvas.addEventListener('touchend', e => {
    if (e.changedTouches.length === 0) return;
    
    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;
    const deltaX = endX - swipeStartX;
    const deltaY = endY - swipeStartY;
    const deltaTime = Date.now() - swipeStartTime;
    
    // Minimum swipe distance and maximum time
    const minSwipeDist = 50;
    const maxSwipeTime = 300;
    
    if (deltaTime < maxSwipeTime) {
        const absDx = Math.abs(deltaX);
        const absDy = Math.abs(deltaY);
        
        // Horizontal swipe is dominant
        if (absDx > minSwipeDist && absDx > absDy) {
            if (gameState === 'selection' && !selectedFaction) {
                // Swipe to change faction in selection
                const factions = ['汉', '魏', '吴', '晋', '西凉', '黄巾', '其他'];
                let idx = selectedFaction ? factions.indexOf(selectedFaction) : 0;
                if (deltaX > 0) idx = (idx + 1) % factions.length;
                else idx = (idx - 1 + factions.length) % factions.length;
                selectedFaction = factions[idx];
                vibrate(10);
            } else if (gameState === 'shop') {
                // Swipe to change shop category
                shopCategory = shopCategory === 'weapons' ? 'armors' : 'weapons';
                vibrate(10);
            }
        }
        // Vertical swipe - scroll heroes
        else if (absDy > minSwipeDist && absDy > absDx) {
            if (gameState === 'selection' && selectedFaction && heroScrollMax > 0) {
                heroScrollY = clamp(heroScrollY - deltaY, 0, heroScrollMax);
            }
        }
    }
}, { passive: true });
