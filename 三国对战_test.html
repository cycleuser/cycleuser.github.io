<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>三国对战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #gameCanvas {
            display: block;
            background: #000;
            border-radius: 4px;
            max-width: 100%;
            max-height: 100%;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            /* Ensure proper positioning */
            position: relative;
            margin: 0 auto;
        }
        
        /* Orientation-specific canvas positioning */
        @media (max-width: 1023px) and (orientation: landscape) {
            #gameCanvas {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                margin: 0;
            }
        }
        
        @media (max-width: 1023px) and (orientation: portrait) {
            #gameCanvas {
                position: relative;
                margin: 10px auto;
                transform: none;
            }
        }
        /* Force landscape orientation on mobile - with dismiss option */
        @media (max-width: 1023px) and (orientation: portrait) {
            html, body {
                overflow: hidden;
                width: 100vw;
                height: 100vh;
            }
            #portraitOverlay {
                display: flex !important;
            }
        }
        
        /* FINAL CORRECT Layout - Full screen overlay for perfect game area */
        #controls {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none; /* Crucial: allows touching the center screen */
        }
        
        /* LEFT SIDE - Directional joystick perfectly vertically centered */
        .left-joystick-container {
            position: absolute;
            left: 20px; /* Closer to edge */
            top: 50%;
            transform: translateY(-50%);
            pointer-events: auto;
            z-index: 101;
        }
        
        /* RIGHT SIDE - Attack/Defense buttons perfectly vertically centered */
        .right-buttons-container {
            position: absolute;
            right: 20px; /* Closer to edge */
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 25px; /* Clean separation */
            z-index: 101;
        }
        
        .right-buttons-container > * {
            pointer-events: auto;
        }
        /* Joystick Area - D-pad style visual */
        #joystickArea {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        /* Cross D-pad visual background */
        #joystickArea::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, transparent 40%, rgba(255,255,255,0.1) 40%, rgba(255,255,255,0.1) 60%, transparent 60%),
                linear-gradient(0deg, transparent 40%, rgba(255,255,255,0.1) 40%, rgba(255,255,255,0.1) 60%, transparent 60%);
            border-radius: 50%;
            pointer-events: none;
        }

        #joystickBase {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        /* Joystick Knob */
        #joystickKnob {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.05s; /* Faster response */
            pointer-events: none;
            z-index: 2;
        }
        
        #joystickKnob.active {
            transform: translate(-50%, -50%) scale(0.95);
            background: rgba(255, 255, 255, 1);
        }

        /* Direction Indicators */
        .joy-indicator {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 24px;
            pointer-events: none;
            font-weight: bold;
        }
        .joy-indicator.up { top: 8px; left: 50%; transform: translateX(-50%); }
        .joy-indicator.down { bottom: 8px; left: 50%; transform: translateX(-50%); }
        .joy-indicator.left { left: 8px; top: 50%; transform: translateY(-50%); }
        .joy-indicator.right { right: 8px; top: 50%; transform: translateY(-50%); }

        /* Action Buttons - Elegant Glass Style */
        .ctrl-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.1s;
            user-select: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .ctrl-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.2);
        }

        .ctrl-btn.attack {
            background: linear-gradient(135deg, rgba(255, 80, 80, 0.4), rgba(255, 40, 40, 0.2));
            border-color: rgba(255, 100, 100, 0.4);
        }
        .ctrl-btn.attack:active {
            background: linear-gradient(135deg, rgba(255, 80, 80, 0.6), rgba(255, 40, 40, 0.4));
        }

        .ctrl-btn.defend {
            background: linear-gradient(135deg, rgba(80, 80, 255, 0.4), rgba(60, 60, 255, 0.2));
            border-color: rgba(100, 100, 255, 0.4);
        }
        .ctrl-btn.defend:active {
            background: linear-gradient(135deg, rgba(80, 80, 255, 0.6), rgba(60, 60, 255, 0.4));
        }
        
        /* Hide on desktop */
        @media (min-width: 1024px) and (hover: hover) and (pointer: fine) {
            #controls { display: none !important; }
        }
        /* Fullscreen button - more prominent on mobile */
        #fullscreenBtn {
            position: fixed;
            top: 8px;
            right: 8px;
            z-index: 200;
            background: rgba(0,0,0,0.7);
            border: 2px solid #888;
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            touch-action: manipulation;
        }
        #fullscreenBtn:active { background: rgba(100,150,255,0.8); }
        /* Mobile utility buttons container */
        #mobileUtils {
            display: none;
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 200;
            flex-direction: row;
            gap: 8px;
        }
        .util-btn {
            background: rgba(0,0,0,0.7);
            border: 2px solid #666;
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            text-align: center;
        }

        .util-btn.restart { border-color: #88cc88; }
        .util-btn.back { border-color: #cc8888; }
        .util-btn.lang { border-color: #88cccc; font-size: 16px; }
    </style>
</head>

// Translation function
function t(key) {
    if (I18N[key] && I18N[key][currentLang]) {
        return I18N[key][currentLang];
    }
    // Fallback to Chinese, then English
    if (I18N[key]) {
        return I18N[key]['zh'] || I18N[key]['en'] || key;
    }
    return key;
}

// Get faction name in current language
function getFactionName(faction) {
    const factionMap = {
        '汉': 'factionHan', '魏': 'factionWei', '吴': 'factionWu', '晋': 'factionJin',
        '西凉': 'factionXiliang', '黄巾': 'factionYellowTurbans', '其他': 'factionOthers'
    };
    return t(factionMap[faction]) || faction;
}

function loadAchievements() {
    try {
        const saved = localStorage.getItem('sanguo_achievements');
        if (saved) {
            achievementData = JSON.parse(saved);
        }
    } catch (e) {
        achievementData = {};
    }
}

function saveAchievements() {
    try {
        localStorage.setItem('sanguo_achievements', JSON.stringify(achievementData));
    } catch (e) {
        // Silently fail
    }

function resizeCanvas() {
    const container = document.getElementById('gameContainer');
    const aspectRatio = SCREEN_WIDTH / SCREEN_HEIGHT;
    
    let targetWidth, targetHeight;
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    const windowRatio = windowWidth / windowHeight;
    
    // Update mobile detection
    isMobile = 'ontouchstart' in window || window.innerWidth < 1024;
    
    // Always use full available space
    if (windowRatio > aspectRatio) {
        // Window is wider - fit to height
        targetHeight = windowHeight;
        targetWidth = targetHeight * aspectRatio;
    } else {
        // Window is taller - fit to width
        targetWidth = windowWidth;
        targetHeight = targetWidth / aspectRatio;
    }
    
    canvas.width = SCREEN_WIDTH;
    canvas.height = SCREEN_HEIGHT;
    canvas.style.width = targetWidth + 'px';
    canvas.style.height = targetHeight + 'px';
    scale = targetWidth / SCREEN_WIDTH;
    
    // Position canvas correctly based on orientation
    if (isMobile) {
        // Mobile: Always absolute center to maximize usage
        canvas.style.position = 'absolute';
        canvas.style.left = '50%';
        canvas.style.top = '50%';
        canvas.style.transform = 'translate(-50%, -50%)';
        canvas.style.margin = '0';
    } else {
        // Desktop: Center normally
        canvas.style.position = 'relative';
        canvas.style.left = 'auto';
        canvas.style.top = 'auto';
        canvas.style.transform = 'none';
        canvas.style.margin = '0 auto';
    }
    
    // Mobile controls layout adjustment
    const controls = document.getElementById('controls');
    if (isMobile) {
        // Note: Display is handled by updateControlsVisibility() loop
        if (window.innerWidth > window.innerHeight) {
            controls.style.flexDirection = 'row';

        }
    }
}

// ========== UTILITY ==========
function hypot(dx, dy) { return Math.sqrt(dx*dx + dy*dy); }
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randFloat(min, max) { return Math.random() * (max - min) + min; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function weaponCategory(weapon) {
    if (!weapon) return 'default';
    const w = ALL_WEAPONS[weapon];
    if (w) return w.category;
    if (['枪','戟','矛'].some(k => weapon.includes(k))) return 'spear';
    if (['双股','双剑','双刀'].some(k => weapon.includes(k))) return 'double_sword';
    if (['刀','偃月','雁月'].some(k => weapon.includes(k))) return 'blade';
    if (weapon.includes('剑')) return 'sword';
    if (weapon.includes('斧') || weapon.includes('锤')) return 'axe';
    if (['鞭','链'].some(k => weapon.includes(k))) return 'whip';
    if (weapon.includes('扇')) return 'fan';
    if (['弓','长弓'].some(k => weapon.includes(k))) return 'bow';
    if (weapon.includes('盾')) return 'sword_shield';
    if (weapon.includes('弩')) return 'crossbow';
    if (weapon.includes('琴')) return 'instrument';
    return 'default';
}

    if (faction === '其他') return QITA_COLOR;
    return WHITE;
}

function calculateStats(baseStats, weapon, armor) {
    const w = ALL_WEAPONS[weapon] || { attack: 0, defense: 0, range: 0 };
    const a = ALL_ARMORS[armor] || { defense: 0, speed: 0 };
    
    // Base stats from hero
    let blood = baseStats[0];
    let attack = baseStats[1] + w.attack;
    let defense = baseStats[2] + w.defense + a.defense;
    let range = baseStats[3] + (w.range - 100);
    
    // Speed calculation with balance consideration
    // Higher defense/blood reduces speed naturally
    const baseSpeed = 1 + a.speed;
    
    // Blood-based speed penalty - heavier characters move slower
    const bloodPenalty = Math.max(0, (blood - 300) * 0.001);
    
    // Defense-based speed penalty - heavily armored characters move slower
    const defensePenalty = Math.max(0, defense * 0.02);
    
    // Weapon weight penalty - heavy weapons slow down character
    const weaponWeightPenalty = Math.max(0, w.attack * 0.01);
    
    // Calculate final speed with all penalties
    let speed = baseSpeed - bloodPenalty - defensePenalty - weaponWeightPenalty;
    
    // Ensure minimum speed
    speed = Math.max(0.3, speed);
    
    return {
        blood: blood,
        attack: attack,
        defense: defense,
        range: range,
        speed: speed
    };
}

function updateShake() {
    if (screenShake.duration > 0) {
        screenShake.duration--;

}

class Particle {
    constructor(x, y, color, size, life, vx, vy, gravity = 0) {
        this.x = x; this.y = y; this.color = color;
        this.size = size; this.life = life; this.maxLife = life;
        this.vx = vx; this.vy = vy; this.gravity = gravity;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.vy += this.gravity; this.life--;
        this.size *= 0.96;
    }
    draw(ctx, ox, oy) {
        if (this.life > 0) {
            const alpha = this.life / this.maxLife;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x - ox, this.y - oy, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }
}

function spawnParticles(x, y, count, color, speed, size = 3) {
    for (let i = 0; i < count; i++) {
        const vx = (Math.random() - 0.5) * speed * 2;
        const vy = (Math.random() - 0.5) * speed * 2;
        particles.push(new Particle(x, y, color, size * randFloat(0.5, 1.5), randInt(20, 40), vx, vy, 0.2));
    }
    // Cap particles to prevent memory issues
    if (particles.length > 500) {
        particles.splice(0, particles.length - 500);
    }
}

function spawnBlood(x, y, count) {
    for (let i = 0; i < count; i++) {
        const vx = (Math.random() - 0.5) * 6;
        const vy = randFloat(-6, -2);
        particles.push(new Particle(x, y, '#c80000', randInt(3, 6), randInt(30, 60), vx, vy, 0.5));
    }
}

class FloatingText {
    constructor(x, y, text, color, fontSize = 20) {
        this.x = x; this.y = y; this.text = text;
        this.color = color; this.life = 60; this.vy = -1.5;
        this.fontSize = fontSize;
    }
    update() { this.y += this.vy; this.life--; }
    draw(ctx, ox, oy) {
        if (this.life > 0) {
            const alpha = this.life < 20 ? this.life / 20 : 1;
            ctx.globalAlpha = alpha;
            ctx.font = `bold ${this.fontSize}px Microsoft YaHei, SimHei, sans-serif`;
            ctx.textAlign = 'center';
            // Shadow for readability
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillText(this.text, this.x - ox + 1, this.y - oy + 1);
            ctx.fillStyle = this.color;
            ctx.fillText(this.text, this.x - ox, this.y - oy);
            ctx.globalAlpha = 1;
        }
    }
}

function spawnText(x, y, text, color, fontSize = 20) {

// Musou (Ultimate) effect - burst of energy
let musouEffects = [];

// Enhanced Character-specific Musou Effect
class CharacterMusouEffect {
    constructor(x, y, character) {
        this.x = x; this.y = y;
        this.character = character;
        this.weapon = character.weapon;
        this.color = character.getColor();
        this.life = 90; this.maxLife = 90; // Longer duration
        this.radius = 10;
        this.phase = 0;
    }
    
    update() {
        this.life--;
        this.radius += 5;
        this.phase += 0.15;
    }
    
    draw(ctx, ox, oy) {
        if (this.life <= 0) return;
        const progress = 1 - this.life / this.maxLife;
        const alpha = Math.min(1, (1 - progress) * 1.5);
        const sx = this.x - ox, sy = this.y - oy;
        
        ctx.save();
        
        // Draw weapon-specific ultimate animation
        if (this.drawLegendaryMusou(ctx, sx, sy, progress, alpha)) {
            ctx.restore();
            return;
        }
        
        // Weapon category based animations
        const cat = weaponCategory(this.weapon);
        
        if (cat === 'blade') {
            this.drawBladeMusou(ctx, sx, sy, progress, alpha);
        } else if (cat === 'spear') {
            this.drawSpearMusou(ctx, sx, sy, progress, alpha);
        } else if (cat === 'bow' || cat === 'crossbow') {
            this.drawBowMusou(ctx, sx, sy, progress, alpha, cat === 'crossbow');
        } else if (cat === 'fan') {
            this.drawFanMusou(ctx, sx, sy, progress, alpha);
        } else if (cat === 'halberd') {
            this.drawHalberdMusou(ctx, sx, sy, progress, alpha);
        } else {
            this.drawDefaultMusou(ctx, sx, sy, progress, alpha);
        }
        
        ctx.restore();
    }
    
    // Legendary weapon special effects
    drawLegendaryMusou(ctx, sx, sy, progress, alpha) {
        const weapon = this.weapon;
        
        // 青龙偃月刀 - Green Dragon Rising
        if (weapon === '青龙偃月刀') {
            ctx.globalAlpha = alpha;
            // Dragon body spiraling upward
            const dragonLen = 200 * progress;
            ctx.strokeStyle = '#00ff44';
            ctx.lineWidth = 12 - progress * 8;
            ctx.shadowColor = '#00ff00';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            for (let i = 0; i < dragonLen; i += 3) {
                const t = i / 50;
                const dx = sx + Math.sin(t * 3 + this.phase) * (30 + i * 0.15);
                const dy = sy - i * 1.2;
                if (i === 0) ctx.moveTo(dx, dy);
                else ctx.lineTo(dx, dy);
            }
            ctx.stroke();
            // Dragon head
            if (progress > 0.3) {
                const headY = sy - dragonLen * 1.2;
                const headX = sx + Math.sin(this.phase * 3) * 30;
                ctx.fillStyle = '#00ff44';
                ctx.beginPath();
                ctx.arc(headX, headY, 15 - progress * 5, 0, Math.PI * 2);
                ctx.fill();
                // Eyes
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(headX - 6, headY - 3, 3, 0, Math.PI * 2);
                ctx.arc(headX + 6, headY - 3, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            // Green crescent slashes
            for (let i = 0; i < 5; i++) {
                const ang = (i / 5) * Math.PI * 2 + this.phase;
                const r = this.radius * 1.5;
                ctx.strokeStyle = '#44ff88';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(sx + Math.cos(ang) * r, sy + Math.sin(ang) * r * 0.5, 20, ang, ang + Math.PI * 0.7);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
            return true;
        }
        
        // 丈八蛇矛 - Serpent Strike
        if (weapon === '丈八蛇矛') {
            ctx.globalAlpha = alpha;
            ctx.shadowColor = '#8844ff';
            ctx.shadowBlur = 15;
            // Multiple serpent trails
            for (let s = 0; s < 3; s++) {
                const offset = (s - 1) * 40;
                ctx.strokeStyle = s === 1 ? '#aa66ff' : '#6633aa';
                ctx.lineWidth = s === 1 ? 8 : 5;
                ctx.beginPath();
                for (let i = 0; i < 180 * progress; i += 4) {
                    const t = i / 30;
                    const px = sx + offset + Math.sin(t * 4 + this.phase + s) * (20 + i * 0.1);
                    const py = sy - i;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
            }
            // Serpent fangs at tips
            if (progress > 0.5) {
                ctx.fillStyle = '#ff4444';
                for (let s = 0; s < 3; s++) {
                    const tipY = sy - 180 * progress;
                    const tipX = sx + (s - 1) * 40;
                    ctx.beginPath();
                    ctx.moveTo(tipX - 8, tipY);
                    ctx.lineTo(tipX, tipY - 15);
                    ctx.lineTo(tipX + 8, tipY);
                    ctx.fill();
                }

            ctx.shadowBlur = 0;
            return true;

        // 方天画戟 - Sky Piercing Pillars

            // Golden light pillars

            for (let i = 0; i < numPillars; i++) {

                const localProg = (progress - delay) / (1 - delay);
                const px = sx + (i - numPillars/2) * 35;
                const pillarH = 300 * localProg;
                // Gradient pillar
                const grad = ctx.createLinearGradient(px, sy, px, sy - pillarH);
                grad.addColorStop(0, 'rgba(255,200,50,0.8)');
                grad.addColorStop(0.5, 'rgba(255,255,100,0.6)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(px - 8, sy - pillarH, 16, pillarH);
                // Top crescent

                    ctx.strokeStyle = '#ffcc00';
                    ctx.lineWidth = 3;
                    ctx.beginPath();

            // Central triple crescent

            ctx.shadowBlur = 20;
            for (let i = 0; i < 3; i++) {

                ctx.arc(sx, sy - 50, 40 + progress * 30, ang, ang + Math.PI * 0.5);

            }
            ctx.shadowBlur = 0;
