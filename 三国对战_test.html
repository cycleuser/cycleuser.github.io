    // Flowing cape - pure black silhouette with bright outline
    drawCape(ctx, ch, shoulderX, shoulderY, dirSign, speed, t) {
        const capeLen = 95;
        const capeWidth = 44;

        // Cape flows opposite to movement direction
        const flowX = -ch.vx * 0.5;
        const flowWave = Math.sin(t * 3 + ch.x * 0.02) * 12 * (1 - speed * 0.5);
        const windWave = Math.sin(t * 5) * 6;
        const secondaryWave = Math.sin(t * 7 + 1) * 4;

        // Cape attachment point (back of shoulders)
        const attachX = shoulderX - 10 * dirSign;
        const attachY = shoulderY + 5;

        // Multiple control points for flowing curve
        const cp1x = attachX - 20 * dirSign + flowX;
        const cp1y = attachY + capeLen * 0.35 + flowWave;
        const cp2x = attachX - 28 * dirSign + flowX + windWave;
        const cp2y = attachY + capeLen * 0.65 + flowWave * 0.5;
        const cp3x = attachX - 22 * dirSign + flowX * 1.2 + windWave + secondaryWave;
        const cp3y = attachY + capeLen * 0.85 + flowWave * 0.3;
        const endX = attachX - 18 * dirSign + flowX * 1.5 + windWave;
        const endY = attachY + capeLen + flowWave * 0.3;

        // Draw cape - pure black silhouette
        ctx.fillStyle = '#0a0a0a';
        ctx.lineWidth = 2.5;  // Thicker outline
        ctx.strokeStyle = '#ffffff';  // Bright white outline
        ctx.beginPath();
        ctx.moveTo(attachX - capeWidth/2 * dirSign, attachY);
        ctx.bezierCurveTo(
            cp1x - capeWidth/2 * dirSign, cp1y,
            cp2x - capeWidth/3 * dirSign, cp2y,
            cp3x - capeWidth/4 * dirSign, cp3y
        );
        ctx.quadraticCurveTo(
            endX - 10 * dirSign, endY,
            endX, endY
        );
        ctx.quadraticCurveTo(
            endX + 10 * dirSign, endY - 5,
            cp3x + capeWidth/4 * dirSign, cp3y - 8
        );
        ctx.bezierCurveTo(
            cp2x + capeWidth/3 * dirSign, cp2y - 8,
            cp1x + capeWidth/2 * dirSign, cp1y - 5,
            attachX + capeWidth/2 * dirSign, attachY
        );
        ctx.closePath();
        ctx.fill();
        ctx.stroke();  // Bright outline
    },
    
    drawLeg(ctx, hipX, hipY, leg, color, dirSign, bodyType) {
        if (!leg) return;
        const { kneeX, kneeY, footX, footY } = leg;
        const facing = dirSign;

        // Silhouette leg proportions with bright outline
        const thighW = bodyType === 'warrior' ? 11 : 9;
        const kneeW = 6;
        const ankleW = 4;

        ctx.fillStyle = '#0a0a0a';
        ctx.lineWidth = 2.5;  // Thicker outline
        ctx.strokeStyle = '#ffffff';  // Bright white outline

        // Thigh
        const thighAngle = Math.atan2(kneeY - hipY, kneeX - hipX);
        const thighPerpX = -Math.sin(thighAngle);
        const thighPerpY = Math.cos(thighAngle);

        ctx.beginPath();
        ctx.moveTo(hipX + thighPerpX * thighW, hipY + thighPerpY * thighW);
        ctx.lineTo(kneeX + thighPerpX * kneeW, kneeY + thighPerpY * kneeW);
        ctx.lineTo(kneeX - thighPerpX * kneeW, kneeY - thighPerpY * kneeW);
        ctx.lineTo(hipX - thighPerpX * thighW, hipY - thighPerpY * thighW);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();  // Bright outline

        // Shin
        const shinAngle = Math.atan2(footY - kneeY, footX - kneeX);
        const shinPerpX = -Math.sin(shinAngle);
        const shinPerpY = Math.cos(shinAngle);

        ctx.beginPath();
        ctx.moveTo(kneeX + shinPerpX * kneeW, kneeY + shinPerpY * kneeW);
        ctx.lineTo(footX + shinPerpX * ankleW, footY + shinPerpY * ankleW);
        ctx.lineTo(footX - shinPerpX * ankleW, footY - shinPerpY * ankleW);
        ctx.lineTo(kneeX - shinPerpX * kneeW, kneeY - shinPerpY * kneeW);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();  // Bright outline

        // Knee joint bulge (silhouette detail)
        ctx.beginPath();
        ctx.ellipse(kneeX, kneeY, 4, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();  // Bright outline

        // Boot
        this.drawBoot(ctx, footX, footY, kneeX, kneeY, facing, bodyType);
    },
    
    drawBoot(ctx, footX, footY, kneeX, kneeY, dirSign, bodyType) {
        const facing = dirSign;
        const bootLen = bodyType === 'warrior' ? 22 : 18;
        const bootTopH = bodyType === 'warrior' ? 12 : 9;

        ctx.fillStyle = '#0a0a0a';
        ctx.lineWidth = 2.5;  // Thicker outline
        ctx.strokeStyle = '#ffffff';  // Bright white outline

        ctx.beginPath();
        // Ankle top
        ctx.moveTo(footX - 4 * facing, footY - bootTopH);
        // Calf curve (front)
        ctx.quadraticCurveTo(footX + bootLen * 0.15 * facing, footY + 2, footX + bootLen * 0.55 * facing, footY + 1);
        // Toe tip
        ctx.quadraticCurveTo(footX + bootLen * 0.9 * facing, footY - 1, footX + bootLen * facing, footY - 4);
        // Top of foot
        ctx.quadraticCurveTo(footX + bootLen * 0.7 * facing, footY - bootTopH + 3, footX + bootLen * 0.2 * facing, footY - bootTopH + 2);
        // Back to ankle
        ctx.quadraticCurveTo(footX - 1 * facing, footY - bootTopH + 1, footX - 4 * facing, footY - bootTopH);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();  // Bright outline

        // Boot sole line (ground contact)
        ctx.lineWidth = 3.0;  // Thicker sole line
        ctx.strokeStyle = '#ffffff';  // Bright white sole
        ctx.beginPath();
        ctx.moveTo(footX, footY);
        ctx.lineTo(footX + bootLen * facing, footY - 1);
        ctx.stroke();
    },
    
    // Draw legendary weapons with unique graphics matching their literary descriptions
    drawLegendaryWeapon(ctx, ch, handPos, dirSign, angle, offHandPos = null) {
        const weapon = ch.weapon;
        const ux = Math.cos(angle), uy = Math.sin(angle);
        const px = -uy, py = ux; // Perpendicular direction
        
        // Set up silhouette style for legendary weapons
        ctx.fillStyle = '#0a0a0a';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        // 青龙偃月刀 - Guan Yu's Green Dragon Crescent Blade
        if (weapon === '青龙偃月刀') {
            const len = 85; // Extra long
            const ex = handPos[0] + ux * len;
            const ey = handPos[1] + uy * len;
            
            // Long wooden shaft with red wrapping (silhouette version)
            ctx.beginPath();
            ctx.moveTo(handPos[0] - ux * 20, handPos[1] - uy * 20);
            ctx.lineTo(ex - ux * 25, ey - uy * 25);
            ctx.stroke();
            
            // Red silk wrapping bands (silhouette version)
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 3; i++) {
                const t = 0.2 + i * 0.25;
                const wx = handPos[0] + ux * len * t;
                const wy = handPos[1] + uy * len * t;
                ctx.beginPath();
                ctx.moveTo(wx + px * 4, wy + py * 4);
                ctx.lineTo(wx - px * 4, wy - py * 4);
                ctx.stroke();
            }
            
            // Large crescent moon blade - the iconic shape (silhouette version)
            const bladeStart = 0.65;
            const bsx = handPos[0] + ux * len * bladeStart;
            const bsy = handPos[1] + uy * len * bladeStart;
            
            ctx.beginPath();
            // Crescent shape curving outward
            ctx.moveTo(bsx, bsy);
            ctx.quadraticCurveTo(
                bsx + ux * 15 + px * 35, bsy + uy * 15 + py * 35,
                ex + px * 8, ey + py * 8
            );
            ctx.lineTo(ex, ey); // Tip
            ctx.quadraticCurveTo(
                ex - ux * 8 - px * 5, ey - uy * 8 - py * 5,
                bsx + ux * 10, bsy + uy * 10
            );
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Blade edge highlight (silhouette version)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.0;
            ctx.beginPath();
            ctx.moveTo(bsx + px * 5, bsy + py * 5);
            ctx.quadraticCurveTo(
                bsx + ux * 18 + px * 30, bsy + uy * 18 + py * 30,
                ex + px * 5, ey + py * 5
            );
            ctx.stroke();
            
            // Dragon engraving on blade (silhouette version)
            ctx.lineWidth = 0.5;
            const dx = bsx + ux * 12 + px * 15;
            const dy = bsy + uy * 12 + py * 15;
            ctx.beginPath();
            ctx.moveTo(dx, dy);
            ctx.quadraticCurveTo(dx + ux * 8, dy + uy * 8 + 3, dx + ux * 12, dy + uy * 12);
            ctx.stroke();
            
            // Back spike (characteristic of guan dao)
            ctx.beginPath();
            ctx.moveTo(bsx - ux * 5 - px * 8, bsy - uy * 5 - py * 8);
            ctx.lineTo(bsx + ux * 3 - px * 15, bsy + uy * 3 - py * 15);
            ctx.lineTo(bsx + ux * 8 - px * 5, bsy + uy * 8 - py * 5);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Red tassel at junction (silhouette version)
            ctx.lineWidth = 1.0;
            const tassX = bsx - ux * 3;
            const tassY = bsy - uy * 3;
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(tassX, tassY);
                ctx.quadraticCurveTo(
                    tassX - px * 12 + (i - 2) * 3 - uy * 8,
                    tassY - py * 12 + (i - 2) * 2 + ux * 8,
                    tassX - px * 20 + (i - 2) * 6,
                    tassY - py * 20 + (i - 2) * 4 + 5
                );
                ctx.stroke();
            }
            return true;
        }
        
        // 丈八蛇矛 - Zhang Fei's Serpent Spear (18-foot snake spear)
        if (weapon === '丈八蛇矛') {
            const len = 95; // Extra long (zhang ba = 18 feet)
            const ex = handPos[0] + ux * len;
            const ey = handPos[1] + uy * len;
            
            // Very long black iron shaft (silhouette version)
            ctx.beginPath();
            ctx.moveTo(handPos[0] - ux * 25, handPos[1] - uy * 25);
            ctx.lineTo(ex - ux * 22, ey - uy * 22);
            ctx.stroke();
            
            // Metal rings along shaft (silhouette version)
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 4; i++) {
                const t = 0.15 + i * 0.2;
                const rx = handPos[0] + ux * len * t;
                const ry = handPos[1] + uy * len * t;
                ctx.beginPath();
                ctx.arc(rx, ry, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
            
            // Serpentine/wavy blade tip - the snake head (silhouette version)
            const bladeLen = 28;
            const bladeStart = ex - ux * bladeLen;
            const bladeStartY = ey - uy * bladeLen;
            
            // Snake-like wavy blade
            ctx.beginPath();
            ctx.moveTo(bladeStart - px * 3, bladeStartY - py * 3);
            // Wavy edge (serpentine pattern)
            ctx.quadraticCurveTo(
                bladeStart + ux * 8 - px * 8, bladeStartY + uy * 8 - py * 8,
                bladeStart + ux * 12 - px * 4, bladeStartY + uy * 12 - py * 4
            );
            ctx.quadraticCurveTo(
                bladeStart + ux * 18 - px * 7, bladeStartY + uy * 18 - py * 7,
                ex - px * 2, ey - py * 2
            );
            ctx.lineTo(ex, ey); // Sharp tip
            ctx.quadraticCurveTo(
                bladeStart + ux * 18 + px * 5, bladeStartY + uy * 18 + py * 5,
                bladeStart + ux * 12 + px * 3, bladeStartY + uy * 12 + py * 3
            );
            ctx.quadraticCurveTo(
                bladeStart + ux * 6 + px * 6, bladeStartY + uy * 6 + py * 6,
                bladeStart + px * 3, bladeStartY + py * 3
            );
            ctx.closePath();

                handPos[0] - lax * bowRadius * 0.8, handPos[1] - lay * bowRadius * 0.8,
                handPos[0] - lax * bowRadius, handPos[1] - lay * bowRadius
            );
            ctx.stroke();
            
            // Grip handle (silhouette version)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(handPos[0] + ux * 3, handPos[1] + uy * 3);
            ctx.lineTo(handPos[0] - ux * 3, handPos[1] - uy * 3);
            ctx.stroke();
            
            // Bow tips (silhouette version)
            ctx.beginPath();
            ctx.arc(handPos[0] + lax * bowRadius, handPos[1] + lay * bowRadius, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(handPos[0] - lax * bowRadius, handPos[1] - lay * bowRadius, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            return true;
        }
        
        // If no legendary weapon matched, return false to use regular weapon
        return false;
    },
    
    drawWeapon(ctx, ch, handPos, dirSign, angle, offHandPos = null) {
        // Check for legendary weapons first
        if (this.drawLegendaryWeapon(ctx, ch, handPos, dirSign, angle, offHandPos)) {
            return; // Legendary weapon was drawn
        }
        
        // Silhouette weapon rendering — pure black, bright outline
        // Regular weapons get silhouette treatment
        const cat = weaponCategory(ch.weapon);
        const lengthMap = {
            spear: 75, blade: 58, sword: 48, axe: 55,
            whip: 55, fan: 28, bow: 45, double_sword: 42,
            shield: 35, crossbow: 50, sword_shield: 45, instrument: 40, default: 45
        };
        const length = lengthMap[cat] || 45;
        const ux = Math.cos(angle), uy = Math.sin(angle);
        const px = -uy, py = ux;
        const ex = handPos[0] + ux * length;
        const ey = handPos[1] + uy * length;

        ctx.fillStyle = '#0a0a0a';
        ctx.strokeStyle = '#ffffff';  // Bright white outline
        ctx.lineWidth = 2.5;  // Thicker outline
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (cat === 'spear') {
            // Spear shaft + triangular head as silhouette
            ctx.beginPath();
            ctx.moveTo(handPos[0] - ux * 15 + px * 2, handPos[1] - uy * 15 + py * 2);
            ctx.lineTo(ex - ux * 12 + px * 2, ey - uy * 12 + py * 2);
            ctx.lineTo(ex + px * 5, ey + py * 5);
            ctx.lineTo(ex - px * 2, ey - py * 2);
            ctx.lineTo(ex - ux * 12 - px * 2, ey - uy * 12 - py * 2);
            ctx.lineTo(handPos[0] - ux * 15 - px * 2, handPos[1] - uy * 15 - py * 2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();  // Bright outline
        } else if (cat === 'blade') {
            // Curved blade silhouette
            ctx.beginPath();
            ctx.moveTo(handPos[0] - px * 3, handPos[1] - py * 3);
            ctx.lineTo(handPos[0] + ux * 12 - px * 3, handPos[1] + uy * 12 - py * 3);
            ctx.quadraticCurveTo(
                handPos[0] + ux * length * 0.6 - px * 10,
                handPos[1] + uy * length * 0.6 - py * 10,
                ex, ey
            );
            ctx.quadraticCurveTo(
                handPos[0] + ux * length * 0.6 + px * 4,
                handPos[1] + uy * length * 0.6 + py * 4,
                handPos[0] + ux * 12 + px * 3, handPos[1] + uy * 12 + py * 3
            );
            ctx.closePath();
            ctx.fill();
            ctx.stroke();  // Bright outline
        } else if (cat === 'sword' || cat === 'double_sword') {
            // Straight blade silhouette
            ctx.beginPath();
            ctx.moveTo(handPos[0] - px * 4, handPos[1] - py * 4);
            ctx.lineTo(handPos[0] + ux * 5 - px * 4, handPos[1] + uy * 5 - py * 4);
            ctx.lineTo(ex - px * 2, ey - py * 2);
            ctx.lineTo(ex + px * 2, ey + py * 2);
            ctx.lineTo(handPos[0] + ux * 5 + px * 4, handPos[1] + uy * 5 + py * 4);
            ctx.lineTo(handPos[0] + px * 4, handPos[1] + py * 4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();  // Bright outline
            // Crossguard silhouette
            ctx.beginPath();
            ctx.moveTo(handPos[0] - px * 10, handPos[1] - py * 10);
            ctx.lineTo(handPos[0] + px * 10, handPos[1] + py * 10);
            ctx.lineWidth = 3.5;  // Thicker crossguard
            ctx.strokeStyle = '#ffffff';  // Bright white
            ctx.stroke();
        } else if (cat === 'axe') {
            // Axe handle + head silhouette
            ctx.beginPath();
            ctx.moveTo(handPos[0] - px * 3, handPos[1] - py * 3);
            ctx.lineTo(ex - ux * 15 - px * 3, ey - uy * 15 - py * 3);
            ctx.lineTo(ex - ux * 5 - px * 18, ey - uy * 5 - py * 18);
            ctx.lineTo(ex + px * 5, ey + py * 5);
            ctx.quadraticCurveTo(
                ex - ux * 8 + px * 5, ey - uy * 8 + py * 5,
                ex - ux * 8 - px * 3, ey - uy * 8 - py * 3
            );
            ctx.lineTo(handPos[0] + px * 3, handPos[1] + py * 3);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();  // Bright outline
        } else if (cat === 'fan') {
            // Fan silhouette — filled sector
            ctx.beginPath();
            ctx.moveTo(handPos[0], handPos[1]);
            ctx.arc(handPos[0], handPos[1], 25, angle - 0.8, angle + 0.8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();  // Bright outline
            // Ribs
            for (let d = -0.8; d <= 0.8; d += 0.25) {
                const fx = handPos[0] + Math.cos(angle + d) * 24;
                const fy = handPos[1] + Math.sin(angle + d) * 24;
                ctx.lineWidth = 1.8;  // Thicker ribs
                ctx.beginPath();
                ctx.moveTo(handPos[0], handPos[1]);
                ctx.lineTo(fx, fy);
                ctx.stroke();
            }
        } else if (cat === 'whip') {
            // Whip silhouette — thin curved line
            ctx.lineWidth = 3.0;  // Thicker whip
            ctx.beginPath();
            ctx.moveTo(handPos[0], handPos[1]);
            for (let i = 1; i <= 10; i++) {
                const p = i / 10;
                const wx = handPos[0] + ux * length * p;
                const wy = handPos[1] + uy * length * p + p * p * 12;
                ctx.lineTo(wx, wy);
            }
            ctx.stroke();
            // Weight at end
            ctx.fillStyle = '#0a0a0a';
            ctx.strokeStyle = '#ffffff';  // Bright outline
            ctx.lineWidth = 2.0;
            const endX = handPos[0] + ux * length;
            const endY = handPos[1] + uy * length + 12;
            ctx.beginPath();
            ctx.arc(endX, endY, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();  // Bright outline
        } else if (cat === 'bow') {
            // Bow silhouette — curved arc
            ctx.lineWidth = 3.5;  // Thicker bow
            ctx.beginPath();
            // Upper limb
            ctx.moveTo(handPos[0], handPos[1] + 6);
            ctx.quadraticCurveTo(handPos[0] + px * 20, handPos[1] + py * 20, handPos[0] + px * 30 + ux * 5, handPos[1] + py * 30 + uy * 5);
            // String
            ctx.lineTo(handPos[0] + px * 30 - ux * 12, handPos[1] + py * 30 - uy * 12);
            // Lower limb
            ctx.quadraticCurveTo(handPos[0] + px * 20, handPos[1] + py * 20 - 12, handPos[0], handPos[1] - 6);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();  // Bright outline
        } else if (cat === 'crossbow') {
            // Crossbow silhouette — stock + bow + trigger
            ctx.beginPath();
            // Stock (horizontal bar)
            ctx.moveTo(handPos[0] - ux * 8, handPos[1] - uy * 8);
            ctx.lineTo(handPos[0] + ux * length + px * 3, handPos[1] + uy * length + py * 3);
            ctx.lineTo(handPos[0] + ux * length - px * 3, handPos[1] + uy * length - py * 3);
            ctx.lineTo(handPos[0] - ux * 8 - px * 2, handPos[1] - uy * 8 - py * 2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // Bow arms (perpendicular at front)
            const bx = handPos[0] + ux * (length * 0.7);
            const by = handPos[1] + uy * (length * 0.7);
            ctx.lineWidth = 2.8;
            ctx.beginPath();
            ctx.moveTo(bx - px * 22, by - py * 22);
            ctx.quadraticCurveTo(bx + ux * 8, by + uy * 8, bx + px * 22, by + py * 22);
            ctx.stroke();
            // String
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(bx - px * 22, by - py * 22);
            ctx.lineTo(handPos[0] + ux * 5, handPos[1] + uy * 5);
            ctx.lineTo(bx + px * 22, by + py * 22);
            ctx.stroke();
        } else if (cat === 'instrument') {
            // Instrument (erhu/huqin) silhouette — body + neck + bow
            ctx.lineWidth = 2.5;
            // Body (small oval)
            const bodyX = handPos[0] + ux * 15;
            const bodyY = handPos[1] + uy * 15;
            ctx.beginPath();
            ctx.ellipse(bodyX, bodyY, 10, 7, angle, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            // Neck (long shaft)
            ctx.lineWidth = 3.0;
            ctx.beginPath();
            ctx.moveTo(bodyX - ux * 3 + px * 2, bodyY - uy * 3 + py * 2);
            ctx.lineTo(ex + px * 2, ey + py * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(bodyX - ux * 3 - px * 2, bodyY - uy * 3 - py * 2);
            ctx.lineTo(ex - px * 2, ey - py * 2);
            ctx.stroke();
        } else {
            // Default weapon silhouette — straight tapered blade
            ctx.beginPath();
            ctx.moveTo(handPos[0] - px * 2, handPos[1] - py * 2);
            ctx.lineTo(ex - px * 1, ey - py * 1);
            ctx.lineTo(ex + px * 3, ey + py * 3);
            ctx.lineTo(handPos[0] + px * 2, handPos[1] + py * 2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();  // Bright outline
        }
    },
    
    // Draw off-hand item (shield, second sword, etc.)
    drawOffHandItem(ctx, ch, handPos, dirSign, angle) {
        const cat = weaponCategory(ch.weapon);
        const ux = Math.cos(angle), uy = Math.sin(angle);
        const px = -uy, py = ux;
        
        // Sword + Shield combo - draw shield
        if (cat === 'sword_shield') {
            this.drawShield(ctx, handPos, dirSign, angle, ch);
            return;
        }
        
        // Double sword category - draw second sword
        if (cat === 'double_sword') {
            // Draw identical sword in off-hand position
            this.drawWeapon(ctx, ch, handPos, dirSign, angle, null);
            return;
        }
    },
    
    // Draw shield with detailed graphics
    drawShield(ctx, handPos, dirSign, angle, ch) {
        // Shield silhouette — simplified, bright outline
        const shieldW = 28;
        const shieldH = 38;
        const cx = handPos[0];
        const cy = handPos[1];

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle + Math.PI * 0.3 * dirSign);

        ctx.fillStyle = '#0a0a0a';
        ctx.lineWidth = 2.5;  // Thicker outline
        ctx.strokeStyle = '#ffffff';  // Bright white outline

        // Shield outline
        ctx.beginPath();
        ctx.moveTo(0, -shieldH/2);
        ctx.quadraticCurveTo(shieldW/2 + 2, -shieldH/4, shieldW/2, 0);
        ctx.quadraticCurveTo(shieldW/2 - 2, shieldH/3, 0, shieldH/2);
        ctx.quadraticCurveTo(-shieldW/2 + 2, shieldH/3, -shieldW/2, 0);
        ctx.quadraticCurveTo(-shieldW/2 - 2, -shieldH/4, 0, -shieldH/2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();  // Bright outline

        // Center boss
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();  // Bright outline

        ctx.restore();
    },
    
    drawDefenseAura(ctx, ch) {
        // Silhouette defense stance - bright white outline
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';  // Bright white instead of blue
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(ch.x, ch.y - 20, 36, 0, Math.PI * 2);
        ctx.stroke();
        // Small shield dots (bright white dots)
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2;
            const px = ch.x + Math.cos(a) * 38;
            const py = ch.y - 20 + Math.sin(a) * 38;
            ctx.beginPath();
            ctx.arc(px, py, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }
    },
    
    drawDead(ctx, ch) {
        // Heroic fallen warrior pose - silhouette style with bright outline
        const dirSign = ch.direction === 0 ? 1 : -1;
        
        const groundY = GROUND_Y;
        const bodyX = ch.x;
        
        // Cape spread on ground (black with bright outline)
        ctx.fillStyle = '#0a0a0a';
        ctx.lineWidth = 2.5;  // Thicker outline
        ctx.strokeStyle = '#ffffff';  // Bright white outline
        ctx.beginPath();
        ctx.ellipse(bodyX - 20 * dirSign, groundY - 5, 35, 12, -0.2 * dirSign, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();  // Bright outline
        
        // Torso - fallen sideways (black with bright outline)
        ctx.fillStyle = '#0a0a0a';
        ctx.beginPath();
        ctx.ellipse(bodyX, groundY - 8, 22, 10, 0.15 * dirSign, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();  // Bright outline
        
        // Armor detail on fallen body (bright outline only)
        ctx.strokeStyle = '#ffffff';  // Bright white outline
        ctx.lineWidth = 2.5;  // Thicker outline
        ctx.beginPath();
        ctx.moveTo(bodyX - 10 * dirSign, groundY - 8);
        ctx.lineTo(bodyX + 5 * dirSign, groundY - 6);
        ctx.stroke();
        
        // Legs - one bent, one straight (bright outline only)
        ctx.strokeStyle = '#ffffff';  // Bright white outline
        ctx.lineWidth = 6;  // Thicker legs
        ctx.lineCap = 'round';
        // Back leg straight
        ctx.beginPath();
        ctx.moveTo(bodyX + 15 * dirSign, groundY - 5);
        ctx.lineTo(bodyX + 45 * dirSign, groundY - 2);
        ctx.stroke();
        // Front leg bent
        ctx.beginPath();
        ctx.moveTo(bodyX + 12 * dirSign, groundY - 8);
        ctx.quadraticCurveTo(bodyX + 25 * dirSign, groundY - 20, bodyX + 35 * dirSign, groundY - 5);
        ctx.stroke();
        
        // Boot on straight leg (black with bright outline)
        ctx.fillStyle = '#0a0a0a';
        ctx.beginPath();
        ctx.ellipse(bodyX + 48 * dirSign, groundY - 1, 8, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();  // Bright outline
        
        // Head - resting peacefully (black with bright outline)
        ctx.fillStyle = '#0a0a0a';
        ctx.beginPath();
        ctx.ellipse(bodyX - 28 * dirSign, groundY - 10, 9, 8, 0.3 * dirSign, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();  // Bright outline
        
        // Hair/helmet fallen (black with bright outline)
        ctx.fillStyle = '#0a0a0a';
        ctx.beginPath();
        ctx.arc(bodyX - 30 * dirSign, groundY - 16, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();  // Bright outline
        
        // Extended arm reaching forward (dramatic) (bright outline only)
        ctx.strokeStyle = '#ffffff';  // Bright white outline
        ctx.lineWidth = 5;  // Thicker arm
        ctx.beginPath();
        ctx.moveTo(bodyX - 15 * dirSign, groundY - 10);
        ctx.quadraticCurveTo(bodyX - 35 * dirSign, groundY - 15, bodyX - 50 * dirSign, groundY - 5);
        ctx.stroke();
        
        // Hand reaching out (black with bright outline)
        ctx.fillStyle = '#0a0a0a';
        ctx.strokeStyle = '#ffffff';  // Bright white outline
        ctx.lineWidth = 2.5;  // Thicker hand outline
        ctx.beginPath();
        ctx.arc(bodyX - 52 * dirSign, groundY - 4, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();  // Bright outline
        
        // Dropped weapon nearby (bright outline only)
        const wCat = weaponCategory(ch.weapon);
        ctx.strokeStyle = '#ffffff';  // Bright white outline
        ctx.lineWidth = 4;  // Thicker weapon
        ctx.beginPath();
        if (wCat === 'spear') {
            ctx.moveTo(bodyX + 20, groundY - 3);
            ctx.lineTo(bodyX + 70, groundY + 2);
        } else {
            ctx.moveTo(bodyX + 25 * dirSign, groundY - 2);
            ctx.lineTo(bodyX + 55 * dirSign, groundY + 3);
        }
        ctx.stroke();
        
        // Weapon blade/head (black with bright outline)
        ctx.fillStyle = '#0a0a0a';
        ctx.strokeStyle = '#ffffff';  // Bright white outline
        ctx.lineWidth = 2.5;  // Thicker blade outline
        ctx.beginPath();
        if (wCat === 'spear') {
            ctx.moveTo(bodyX + 70, groundY + 2);
            ctx.lineTo(bodyX + 78, groundY - 2);
            ctx.lineTo(bodyX + 72, groundY + 5);
        } else {
            ctx.arc(bodyX + 58 * dirSign, groundY + 2, 5, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.stroke();  // Bright outline
        
        this.drawHUD(ctx, ch);
    },
    
    drawIconHead(ctx, ch, cx, cy) {
        // Draw a small decorative icon above name - silhouette style with bright outline
        const r = 6;

        // Outer circle
        ctx.fillStyle = '#0a0a0a';
        ctx.lineWidth = 2.0;  // Thicker outline
        ctx.strokeStyle = '#ffffff';  // Bright white outline
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();  // Bright outline

        // Inner icon: simplified helmet or hair bun
        const isFemale = this.isFemale(ch);
        if (isFemale) {
            // Hair bun
            ctx.fillStyle = '#0a0a0a';
            ctx.beginPath();
            ctx.ellipse(cx, cy - 1, 3, 3.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();  // Bright outline
            // Ribbon hint
            ctx.strokeStyle = '#ffffff';  // Bright white
            ctx.lineWidth = 1.5;  // Thicker ribbon
            ctx.beginPath();
            ctx.moveTo(cx + 2, cy - 1);
            ctx.lineTo(cx + 5, cy + 2);
            ctx.stroke();
        } else {
            // Helmet / topknot
            ctx.fillStyle = '#0a0a0a';
            ctx.beginPath();
            ctx.ellipse(cx, cy - 2, 2.5, 3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();  // Bright outline
            // Plume / ornament
            ctx.fillStyle = '#0a0a0a';
            ctx.beginPath();
            ctx.moveTo(cx - 1, cy - 4);
            ctx.lineTo(cx, cy - 8);
            ctx.lineTo(cx + 1, cy - 4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();  // Bright outline
        }
    },

    drawHUD(ctx, ch) {
        // Dynamic HUD positioning based on character size
        const nameY = ch._hudTopY || (ch.y - 126);

        ctx.textAlign = 'center';

        // === NAME BUBBLE ===
        const nameLen = ch.name.length;
        const fontSize = nameLen <= 2 ? 16 : (nameLen <= 3 ? 14 : 12);
        ctx.font = `bold ${fontSize}px Microsoft YaHei, SimHei, sans-serif`;

        const nameWidth = ctx.measureText(ch.name).width;
        const bubbleW = nameWidth + 24;
        const bubbleH = fontSize + 12;
        const bubbleX = ch.x - bubbleW / 2;
        const bubbleY = nameY - bubbleH;

        // Bubble shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        roundRect(ctx, bubbleX + 1, bubbleY + 1, bubbleW, bubbleH, 6);
        ctx.fill();

        // Bubble body with subtle faction tint
        ctx.fillStyle = 'rgba(10,10,10,0.85)';  // Pure dark instead of faction tint
        roundRect(ctx, bubbleX, bubbleY, bubbleW, bubbleH, 6);
        ctx.fill();

        // Bubble border
        const factionColor = getFactionColor(ch.faction);
        ctx.strokeStyle = factionColor;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.7;
        roundRect(ctx, bubbleX, bubbleY, bubbleW, bubbleH, 6);
        ctx.stroke();
        ctx.globalAlpha = 1;

        // Draw tiny icon above name bubble
        this.drawIconHead(ctx, ch, ch.x, bubbleY - 9);

        // Name text with slight shadow
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillText(ch.name, ch.x + 1, bubbleY + bubbleH / 2 + fontSize * 0.33 + 1);
        ctx.fillStyle = '#ffeedd';
        ctx.fillText(ch.name, ch.x, bubbleY + bubbleH / 2 + fontSize * 0.33);

        // === HEALTH BAR ===
        const bw = 72, bh = 8;
        const pct = Math.max(0, ch.blood / ch.maxBlood);
        const barY = nameY + 5;

        // Bar background (dark rounded)
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        roundRect(ctx, ch.x - bw / 2 - 1, barY - 1, bw + 2, bh + 2, 3);
        ctx.fill();

        // Health fill color
        const healthColor = pct > 0.6 ? '#33cc33' : (pct > 0.3 ? '#ffcc00' : '#ff3333');
        ctx.fillStyle = healthColor;
        const fillW = bw * pct;
        roundRect(ctx, ch.x - bw / 2, barY, fillW, bh, 3);
        ctx.fill();

        // Health bar inner shine
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        roundRect(ctx, ch.x - bw / 2, barY, fillW, 2.5, 1);
        ctx.fill();

        // Health bar border
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        roundRect(ctx, ch.x - bw / 2, barY, bw, bh, 3);
        ctx.stroke();

        // === MUSOU GAUGE ===
        const mw = 72, mh = 5;
        const musouBarY = barY + bh + 4;
        const musouPct = Math.min(1, ch.musou / ch.musouMax);

        // Musou background
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        roundRect(ctx, ch.x - mw / 2 - 1, musouBarY - 0.5, mw + 2, mh + 1, 2);
        ctx.fill();

        // Musou fill
        if (musouPct >= 1) {
            // Glowing golden when full
            ctx.fillStyle = 'rgba(255, 220, 80, 1)';
            ctx.shadowColor = '#ffcc00';
            ctx.shadowBlur = 5;
            roundRect(ctx, ch.x - mw / 2, musouBarY, mw, mh, 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        } else {
            ctx.fillStyle = 'rgba(60, 140, 255, 0.85)';
            roundRect(ctx, ch.x - mw / 2, musouBarY, mw * musouPct, mh, 2);
            ctx.fill();
        }

        // Musou border
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 0.8;
        roundRect(ctx, ch.x - mw / 2, musouBarY, mw, mh, 2);
        ctx.stroke();

        // === MUSOU ACTIVE BURST TEXT ===
        if (ch.musouActive && ch.musouTimer > 0) {
            const alpha = Math.min(1, ch.musouTimer / 500);
            ctx.globalAlpha = alpha;
            ctx.font = 'bold 22px Microsoft YaHei, SimHei, sans-serif';
            ctx.fillStyle = '#000000';
            ctx.fillText(`「${ch.special}」`, ch.x + 1, nameY - 36);
            ctx.fillStyle = '#ffcc00';
            ctx.fillText(`「${ch.special}」`, ch.x, nameY - 37);
            ctx.globalAlpha = 1;
        }
    }
};

// ========== ENHANCED VISUAL EFFECTS SYSTEM ==========
let groundImpacts = [];
let dustTrails = [];
let screenFlash = { active: false, color: '#fff', alpha: 0, duration: 0 };
let ambientParticles = [];
let transitionEffect = { active: false, alpha: 0, fadeIn: true, targetState: null, callback: null };

class GroundImpact {
    constructor(x, y, intensity = 1) {
        this.x = x; this.y = y;
        this.intensity = intensity;
        this.life = 30; this.maxLife = 30;
        this.radius = 5;
    }
    update() {
        this.life--;
        this.radius += 3 * this.intensity;
    }
    draw(ctx) {
        if (this.life <= 0) return;
        const alpha = this.life / this.maxLife;
        ctx.strokeStyle = `rgba(180, 160, 120, ${alpha * 0.6})`;
        ctx.lineWidth = 2 * this.intensity;
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, this.radius, this.radius * 0.3, 0, 0, Math.PI * 2);
        ctx.stroke();
        // Crack lines
        if (this.intensity > 1.5) {
            ctx.strokeStyle = `rgba(100, 80, 60, ${alpha * 0.4})`;
            ctx.lineWidth = 1;
            for (let i = 0; i < 6; i++) {
                const ang = (i / 6) * Math.PI * 2 + this.x * 0.1;
                const len = this.radius * 1.5;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + Math.cos(ang) * len, this.y + Math.sin(ang) * len * 0.3);
                ctx.stroke();
            }
        }
    }
}

class DustTrail {
    constructor(x, y, vx) {
        this.x = x; this.y = y;
        this.vx = vx * 0.3;
        this.life = 20; this.maxLife = 20;
        this.size = 3 + Math.random() * 4;
    }
    update() {
        this.life--;
        this.x += this.vx;
        this.size *= 1.05;
    }
    draw(ctx) {
        if (this.life <= 0) return;
        const alpha = (this.life / this.maxLife) * 0.3;
        ctx.fillStyle = `rgba(160, 140, 100, ${alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function triggerScreenFlash(color, duration = 8) {
    screenFlash.active = true;
    screenFlash.color = color;
    screenFlash.alpha = 0.4;
    screenFlash.duration = duration;
}

function updateScreenFlash() {
    if (!screenFlash.active) return;
    screenFlash.duration--;
    screenFlash.alpha *= 0.85;
    if (screenFlash.duration <= 0) {
        screenFlash.active = false;
        screenFlash.alpha = 0;
    }
}

function drawScreenFlash(ctx) {
    if (!screenFlash.active) return;
    ctx.fillStyle = screenFlash.color;
    ctx.globalAlpha = screenFlash.alpha;
    ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
    ctx.globalAlpha = 1;
}

// Screen transition system
function startTransition(targetState, callback = null) {
    transitionEffect.active = true;
    transitionEffect.alpha = 0;
    transitionEffect.fadeIn = true;
    transitionEffect.targetState = targetState;
    transitionEffect.callback = callback;
}

function updateTransition() {
    if (!transitionEffect.active) return;
    if (transitionEffect.fadeIn) {
        transitionEffect.alpha += 0.06;
        if (transitionEffect.alpha >= 1) {
            transitionEffect.alpha = 1;
            transitionEffect.fadeIn = false;
            if (transitionEffect.targetState) {
                if (transitionEffect.targetState === 'battle') {
                    startBattle();
                } else if (transitionEffect.targetState === 'survival') {
                    startSurvivalMode();
                } else {
                    gameState = transitionEffect.targetState;
                }
                transitionEffect.targetState = null;
            }
            if (transitionEffect.callback) transitionEffect.callback();
        }
    } else {
        transitionEffect.alpha -= 0.04;
        if (transitionEffect.alpha <= 0) {
            transitionEffect.alpha = 0;
            transitionEffect.active = false;
        }
    }
}

function drawTransition(ctx) {
    if (!transitionEffect.active || transitionEffect.alpha <= 0) return;
    ctx.fillStyle = '#000';
    ctx.globalAlpha = transitionEffect.alpha;
    ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
    ctx.globalAlpha = 1;
}

// Hit spark system for impact feedback
let hitSparks = [];
function spawnHitSpark(x, y, color, intensity = 1) {
    const count = Math.floor(6 * intensity);
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 4 * intensity;
        hitSparks.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: 15 + Math.random() * 10,
            maxLife: 25,
            color,
            size: 2 + Math.random() * 2 * intensity
        });
    }
}

// Weapon-specific slash trail system
let slashTrails = [];
function spawnSlashTrail(x, y, angle, range, weaponCat, color, intensity = 1) {
    const trailConfigs = {
        'blade':  { width: 12, color: '#ff8844', glow: '#ff4400', arc: 1.2, name: 'blade' },
        'sword':  { width: 8, color: '#aaddff', glow: '#4488ff', arc: 0.8, name: 'sword' },
        'spear':  { width: 6, color: '#ffcc44', glow: '#ff8800', arc: 0.4, name: 'spear' },
        'axe':    { width: 16, color: '#ff6644', glow: '#cc2200', arc: 1.4, name: 'axe' },
        'whip':   { width: 4, color: '#dd88ff', glow: '#8844cc', arc: 1.6, name: 'whip' },
        'fan':    { width: 10, color: '#88ffcc', glow: '#44cc88', arc: 1.0, name: 'fan' },
        'bow':    { width: 3, color: '#ffdd88', glow: '#ffaa44', arc: 0.3, name: 'bow' },
        'crossbow': { width: 4, color: '#ffaa66', glow: '#ff6622', arc: 0.2, name: 'crossbow' },
        'default': { width: 8, color: '#cccccc', glow: '#888888', arc: 0.6, name: 'default' }
    };
    
    const cfg = trailConfigs[weaponCat] || trailConfigs['default'];
    const arcAngle = cfg.arc * intensity;
    
    slashTrails.push({
        x, y,
        angle: angle - arcAngle / 2,
        arc: arcAngle,
        range: range * 0.8,
        width: cfg.width * intensity,
        color: cfg.color,
        glow: cfg.glow,
        life: 12,
        maxLife: 12
    });
}

function updateSlashTrails() {
    slashTrails = slashTrails.filter(s => {
        s.life--;
        return s.life > 0;
    });
}

function drawSlashTrails(ctx) {
    slashTrails.forEach(s => {
        const alpha = s.life / s.maxLife;
        const progress = 1 - alpha;
        
        ctx.save();
        ctx.globalAlpha = alpha * 0.8;
        
        // Outer glow
        ctx.strokeStyle = s.glow;
        ctx.lineWidth = s.width * 1.5;
        ctx.lineCap = 'round';
        ctx.shadowColor = s.glow;
        ctx.shadowBlur = 15 * alpha;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.range * (0.3 + progress * 0.7), s.angle, s.angle + s.arc);
        ctx.stroke();
        
        // Inner bright core
        ctx.strokeStyle = s.color;
        ctx.lineWidth = s.width * 0.5;
        ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.range * (0.3 + progress * 0.7), s.angle, s.angle + s.arc);
        ctx.stroke();
        
        ctx.restore();
    });
}

function updateHitSparks() {
    hitSparks = hitSparks.filter(s => {
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.15;
        s.vx *= 0.96;
        s.life--;
        return s.life > 0;
    });
}

function drawHitSparks(ctx) {
    hitSparks.forEach(s => {
        const alpha = s.life / s.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        const r = s.size * alpha;
        ctx.arc(s.x, s.y, Math.max(0.5, r), 0, Math.PI * 2);
        ctx.fill();
        if (s.size > 2.5) {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.globalAlpha = alpha * 0.5;
            ctx.beginPath();
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(s.x - s.vx * 3, s.y - s.vy * 3);
            ctx.stroke();
        }
    });
    ctx.globalAlpha = 1;
}

// Ambient particles for atmosphere
class AmbientParticle {
    constructor(type) {
        this.type = type;
        this.reset();
    }
    reset() {
        this.x = Math.random() * SCREEN_WIDTH;
        this.y = Math.random() * SCREEN_HEIGHT;
        this.size = 1 + Math.random() * 2;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.speedY = -0.2 - Math.random() * 0.3;
        this.opacity = 0.1 + Math.random() * 0.3;
        this.life = 200 + Math.random() * 300;
        this.maxLife = this.life;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life--;
        if (this.life <= 0 || this.y < -10 || this.x < -10 || this.x > SCREEN_WIDTH + 10) {
            this.reset();
            this.y = SCREEN_HEIGHT + 10;
        }
    }
    draw(ctx) {
        const alpha = this.opacity * (this.life / this.maxLife);
        if (this.type === 'dust') {
            ctx.fillStyle = `rgba(200, 180, 140, ${alpha})`;
        } else if (this.type === 'ember') {
            ctx.fillStyle = `rgba(255, ${100 + Math.random() * 100}, 0, ${alpha})`;
        } else {
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.5})`;
        }
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function initAmbientParticles() {
    ambientParticles = [];
    for (let i = 0; i < 25; i++) {
        ambientParticles.push(new AmbientParticle('dust'));
    }
}
initAmbientParticles();

function spawnGroundImpact(x, y, intensity = 1) {
    groundImpacts.push(new GroundImpact(x, y, intensity));
}

function spawnDustTrail(x, y, vx) {
    if (Math.abs(vx) > 2 && Math.random() < 0.3) {
        dustTrails.push(new DustTrail(x, y, vx));
    }
}

    const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);

// Scene 4: 烽火连天 - Flames of War (Enhanced)
function drawScene_BattleField(ctx) {
    const t = Date.now() * 0.001;
    
    // Smoky red sky with animated clouds
    const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    grad.addColorStop(0, '#0a0505');
    grad.addColorStop(0.3, '#2a1010');
    grad.addColorStop(0.6, '#3a1515');
    grad.addColorStop(1, '#2a1a10');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, SCREEN_WIDTH, GROUND_Y);
    
    // Animated smoke clouds
    ctx.fillStyle = 'rgba(30, 20, 15, 0.6)';
    for (let i = 0; i < 10; i++) {
        const cx = (i * 150 + t * 30) % (SCREEN_WIDTH + 200) - 100;
        const cy = 60 + Math.sin(i + t * 0.5) * 25 + i * 8;
        const size = 50 + Math.sin(i * 2) * 20;
        ctx.beginPath();
        ctx.arc(cx, cy, size, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Distant burning city silhouette
    ctx.fillStyle = '#150a0a';
    for (let i = 0; i < 5; i++) {
        const bx = 100 + i * 180;
        const bh = 60 + (i % 3) * 25;
        ctx.fillRect(bx - 20, GROUND_Y - bh - 30, 40, bh + 30);
        // Pagoda roof
        ctx.beginPath();
        ctx.moveTo(bx - 30, GROUND_Y - bh - 30);
        ctx.lineTo(bx, GROUND_Y - bh - 50);
        ctx.lineTo(bx + 30, GROUND_Y - bh - 30);
        ctx.closePath();
        ctx.fill();
    }
    
    // Burning buildings silhouettes with animated flames
    const buildings = [100, 300, 550, 800];
    buildings.forEach((bx, i) => {
        const bh = 80 + (i % 3) * 30;
        // Building
        ctx.fillStyle = '#1a1010';
        ctx.fillRect(bx - 25, GROUND_Y - bh, 50, bh);
        ctx.fillRect(bx - 30, GROUND_Y - bh - 20, 60, 25);
        
        // Animated flames with multiple layers
        const ft = Date.now() * 0.004 + i * 2;
        // Outer flame
        ctx.fillStyle = 'rgba(255, 80, 0, 0.6)';
        ctx.beginPath();
        ctx.moveTo(bx - 25, GROUND_Y - bh);
        ctx.quadraticCurveTo(bx - 15 + Math.sin(ft) * 12, GROUND_Y - bh - 50, bx, GROUND_Y - bh - 70 - Math.sin(ft * 1.5) * 15);
        ctx.quadraticCurveTo(bx + 15 + Math.cos(ft) * 12, GROUND_Y - bh - 50, bx + 25, GROUND_Y - bh);
        ctx.fill();
        
        // Inner flame
        ctx.fillStyle = 'rgba(255, 200, 50, 0.8)';
        ctx.beginPath();
        ctx.moveTo(bx - 12, GROUND_Y - bh);
        ctx.quadraticCurveTo(bx - 5 + Math.sin(ft + 1) * 8, GROUND_Y - bh - 30, bx, GROUND_Y - bh - 45 - Math.sin(ft * 2) * 10);
        ctx.quadraticCurveTo(bx + 5 + Math.cos(ft + 1) * 8, GROUND_Y - bh - 30, bx + 12, GROUND_Y - bh);
        ctx.fill();
        
        // Fire glow
        ctx.fillStyle = 'rgba(255, 80, 0, 0.15)';
        ctx.beginPath();
        ctx.arc(bx, GROUND_Y - bh - 30, 50 + Math.sin(ft) * 10, 0, Math.PI * 2);
        ctx.fill();
        
        // Flying embers
        ctx.fillStyle = '#ff6600';
        for (let e = 0; e < 5; e++) {
            const ex = bx + Math.sin(ft + e * 1.5) * 40;
            const ey = GROUND_Y - bh - 40 - (e * 15 + Math.sin(ft + e) * 10) % 60;
            const alpha = 0.5 + Math.sin(ft * 2 + e) * 0.3;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(ex, ey, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    });
    
    // Distant fire glow on horizon
    const horizonGlow = ctx.createLinearGradient(0, GROUND_Y - 40, 0, GROUND_Y);
    horizonGlow.addColorStop(0, 'rgba(200, 50, 0, 0)');
    horizonGlow.addColorStop(1, 'rgba(200, 50, 0, 0.4)');
    ctx.fillStyle = horizonGlow;
    ctx.fillRect(0, GROUND_Y - 40, SCREEN_WIDTH, 40);
    
    // Scattered debris on ground
    ctx.fillStyle = '#2a1a10';
    for (let i = 0; i < 15; i++) {
        const dx = (i * 73 + 20) % SCREEN_WIDTH;
        const dw = 5 + (i % 4) * 3;
        ctx.fillRect(dx, GROUND_Y - 2, dw, 3);
    }
    
    // Broken weapons on ground
    ctx.strokeStyle = '#4a3a2a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(200, GROUND_Y - 3);
    ctx.lineTo(230, GROUND_Y - 8);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(700, GROUND_Y - 2);
    ctx.lineTo(720, GROUND_Y + 2);
    ctx.stroke();
}

function drawScene_BambooForest(ctx) {

        ctx.beginPath();

    }
    
    // Mid bamboo (parallax layer 2)
    ctx.fillStyle = '#0a1a0a';
    for (let i = 0; i < 12; i++) {

        ctx.strokeStyle = '#0a250a';
        ctx.lineWidth = 1;
        for (let j = 0; j < bh; j += 30) {
            ctx.beginPath();
            ctx.moveTo(bx - 2, GROUND_Y - bh + j);
            ctx.lineTo(bx + 14, GROUND_Y - bh + j);
            ctx.stroke();
        }
        // Leaves
        ctx.fillStyle = '#1a3a1a';
        for (let l = 0; l < 3; l++) {
            const ly = GROUND_Y - bh + 20 + l * 40;
            ctx.beginPath();
            ctx.ellipse(bx + 6 + Math.sin(t + i + l) * 3, ly, 20, 6, Math.sin(t * 0.5 + i) * 0.3, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    // Close bamboo (parallax layer 3)
    ctx.fillStyle = '#0a250a';
    for (let i = 0; i < 6; i++) {
        const bx = (i * 180 + 50 + t * 12) % (SCREEN_WIDTH + 200) - 100;
        const bh = 220 + Math.sin(i) * 15;
        ctx.fillRect(bx, GROUND_Y - bh, 16, bh);
        // Bamboo segments
        ctx.strokeStyle = '#1a3a1a';
        ctx.lineWidth = 2;
        for (let j = 0; j < bh; j += 25) {
            ctx.beginPath();
            ctx.moveTo(bx - 3, GROUND_Y - bh + j);
            ctx.lineTo(bx + 19, GROUND_Y - bh + j);
            ctx.stroke();
        }
        // Large leaves
        ctx.fillStyle = '#2a5a2a';
        for (let l = 0; l < 4; l++) {
            const ly = GROUND_Y - bh + 30 + l * 45;
            const sway = Math.sin(t + i * 0.5 + l) * 5;
            ctx.beginPath();
            ctx.ellipse(bx + 8 + sway, ly, 25, 8, Math.sin(t * 0.3 + i) * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    // Fireflies
    ctx.fillStyle = '#aaffaa';
    for (let i = 0; i < 15; i++) {
        const fx = (i * 73 + Math.sin(t + i) * 30) % SCREEN_WIDTH;
        const fy = GROUND_Y - 100 - Math.sin(t * 0.5 + i * 0.3) * 50;
        const alpha = 0.3 + Math.sin(t * 2 + i) * 0.3;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(fx, fy, 2, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// Scene 7: 大漠风沙 - Desert Storm
function drawScene_DesertStorm(ctx) {

    const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);

    grad.addColorStop(0.4, '#4a2510');
    grad.addColorStop(0.7, '#6a3515');
    grad.addColorStop(1, '#8a4520');

    // Sun
    ctx.fillStyle = '#ffaa44';
    ctx.beginPath();
    ctx.arc(SCREEN_WIDTH / 2, 80, 50, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 150, 50, 0.2)';
    for (let i = 0; i < 5; i++) {
        const y = 100 + i * 30;
        ctx.beginPath();
        for (let x = 0; x < SCREEN_WIDTH; x += 10) {

            else ctx.lineTo(x, y + wave);
        }
        ctx.lineTo(SCREEN_WIDTH, y + 20);
        ctx.lineTo(0, y + 20);
        ctx.closePath();
        ctx.fill();
    }
    
    // Sand dunes (parallax)
    ctx.fillStyle = '#5a3515';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for (let x = 0; x <= SCREEN_WIDTH; x += 20) {
        const y = GROUND_Y - 60 - Math.sin(x * 0.008 + t * 0.3) * 40 - Math.sin(x * 0.015) * 20;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(SCREEN_WIDTH, GROUND_Y);
    ctx.closePath();
    ctx.fill();
    
    // Distant ruins

        ctx.beginPath();
        ctx.arc(px, py, 2 + Math.random(), 0, Math.PI * 2);

    }
}

// ========== GAME STATES ==========
let gameState = 'language'; // language, selection, shop, battle, survival
let selectedFaction = null;
let selectedHero = null;
// selectedWeapon removed - weapon selection is direct

// Survival mode variables
let survivalWave = 0;
let survivalKills = 0;
let survivalMaxWave = 0;
let survivalEnemies = [];
let survivalSpawnTimer = 0;
let survivalBetweenWaves = false;
let survivalWaveDelay = 0;
let survivalSpawnedThisWave = 0;
let survivalWaveEntrance = 0; // Wave entrance animation timer
let battleEntranceTimer = 0; // Battle opening entrance animation timer
let survivalKillStreak = 0; // Kill streak counter for survival mode
let survivalKillStreakTimer = 0; // Timer for kill streak
let survivalKillStreakActive = ''; // Active streak buff type
let survivalKillStreakBuffTimer = 0; // Duration of streak buff
let survivalScore = 0; // Survival score for rewards
let survivalPowerups = []; // Power-ups between waves
let survivalLastEnemyAttack = 0; // Prevent simultaneous enemy attacks

// Multi-player selection state
let selectionPhase = 1; // 1 = Player 1, 2 = Player 2
let p1Selection = { faction: null, hero: null, weapon: null, armor: null };
let p2Selection = { faction: null, hero: null, weapon: null, armor: null };
let heroScrollY = 0;  // Scroll offset for hero list
let heroScrollMax = 0; // Maximum scroll value
let shopScrollY = 0;   // Scroll offset for shop items
let shopScrollMax = 0; // Maximum scroll value for shop
let vsAI = true;
let char1 = null, char2 = null;
let projectiles = [];
let messages = [];
let messageTimer = 0;
let gameOver = false;
let winner = null;
let shopCategory = 'weapons'; // weapons or armors

// ========== KEYBOARD MAPPING ==========
// All possible key mappings for full keyboard support
const KEY_MAP = {
    // Player 1 controls (WASD + nearby keys)
    p1_left: ['a', 'arrowleft', 'q'],
    p1_right: ['d', 'arrowright', 'e'],
    p1_up: ['w', 'arrowup', ','],
    p1_down: ['s', 'arrowdown', 'o'],
    p1_jump: ['w', ' ', 'arrowup'],
    p1_attack: ['j', 'x', 'z', 'enter', 'numpad1'],
    p1_defend: ['k', 'c', 'shift', 'numpad2'],
    // Special skill auto-triggers when musou is full
    // Player 2 controls (for local multiplayer)
    p2_left: ['arrowleft', '4', 'numpad4'],
    p2_right: ['arrowright', '6', 'numpad6'],
    p2_jump: ['arrowup', '8', 'numpad8'],
    p2_attack: ['numpad0', '/', '0'],
    p2_defend: ['numpad.', '*', '.'],
    // UI controls
    confirm: ['enter', ' '],
    cancel: ['escape', 'backspace'],
    restart: ['r'],
    shop: ['b', 'tab'],
    nextPage: ['pagedown', ']', '.'],
    prevPage: ['pageup', '[', ',']
};

function isKeyPressed(action, key) {
    const k = key.toLowerCase();
    return KEY_MAP[action] && KEY_MAP[action].includes(k);
}

// ========== INPUT ==========
const keys = {};
const touch = { left: false, right: false, up: false, down: false, jump: false, attack: false, defend: false };
// Swipe gesture tracking
let swipeStartX = 0, swipeStartY = 0;
let swipeStartTime = 0;

document.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();
    keys[key] = true;
    
    // Prevent default for game keys
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'tab'].includes(key)) {
        e.preventDefault();
    }
    
    if (gameState === 'language') {
        // Language screen navigation
        if (key === 'enter' || key === ' ') {
            gameState = 'selection';
        }
        if (key === 'escape') {
            // If already selected language, go back to selection
            if (currentLang !== 'zh') {
                gameState = 'selection';
            }
        }
    }
    else if (gameState === 'selection') handleSelectionKey(e.key);
    else if (gameState === 'shop') handleShopKey(e.key);
    else if (gameState === 'battle') {
        if (gameOver && isKeyPressed('restart', key)) restartBattle();
        if (isKeyPressed('cancel', key)) { gameState = 'selection'; resetSelection(); }
        if (isKeyPressed('shop', key) && gameOver && (winner === char1 || (!vsAI && winner === char2))) { 
            if (winner === char1) activeShopPlayer = 1;
            else activeShopPlayer = 2;
            saveBattleState();
            gameState = 'shop'; 
        }
    } else if (gameState === 'survival') {
        if (gameOver && isKeyPressed('restart', key)) startTransition('survival');
        if (isKeyPressed('cancel', key)) { gameState = 'selection'; resetSelection(); }

// ========== VIRTUAL JOYSTICK & ENHANCED TOUCH CONTROLS ==========
const joystickArea = document.getElementById('joystickArea');
const joystickKnob = document.getElementById('joystickKnob');
let joystickActive = false;
let joystickTouchId = null;
let joystickCenter = { x: 50, y: 50 };
const joystickMaxDist = 45; // Maximum distance knob can move from center

// Haptic feedback helper
function vibrate(pattern = 10) {
    if (navigator.vibrate) {
        navigator.vibrate(pattern);
    }
}

// Virtual Joystick Touch Handling
if (joystickArea) {
    joystickArea.addEventListener('touchstart', e => {
        e.preventDefault();
        if (joystickActive) return;
        
        const touch = e.changedTouches[0];
        joystickTouchId = touch.identifier;
        joystickActive = true;
        
        const rect = joystickArea.getBoundingClientRect();
        joystickCenter = {
            x: rect.left + rect.width / 2,
            y: rect.top + rect.height / 2
        };
        
        joystickKnob.classList.add('active');
        updateJoystickPosition(touch.clientX, touch.clientY);
        vibrate(5);
    }, { passive: false });
    
    joystickArea.addEventListener('touchmove', e => {
        e.preventDefault();
        if (!joystickActive) return;
        
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === joystickTouchId) {
                updateJoystickPosition(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                break;
            }
        }
    }, { passive: false });
    
    const endJoystick = e => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === joystickTouchId) {
                joystickActive = false;
                joystickTouchId = null;
                joystickKnob.classList.remove('active');
                joystickKnob.style.transform = 'translate(-50%, -50%)';
                
                // Remove active state classes
                joystickArea.classList.remove('active-left', 'active-right', 'active-up', 'active-down');
                
                touch.left = false;
                touch.right = false;
                touch.up = false;
                touch.down = false;
                break;
            }
        }
    };
    
    joystickArea.addEventListener('touchend', endJoystick, { passive: false });
    joystickArea.addEventListener('touchcancel', endJoystick, { passive: false });
}

function updateJoystickPosition(clientX, clientY) {
    let dx = clientX - joystickCenter.x;
    let dy = clientY - joystickCenter.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    // Clamp to max distance
    if (dist > joystickMaxDist) {
        dx = (dx / dist) * joystickMaxDist;
        dy = (dy / dist) * joystickMaxDist;
    }
    
    // Move knob visually
    joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    
    // Calculate normalized values (-1 to 1)
    const normX = dx / joystickMaxDist;
    const normY = dy / joystickMaxDist;
    
    // Set touch controls based on joystick position
    // Use thresholds to prevent accidental inputs
    const threshold = 0.3;
    const leftActive = normX < -threshold;
    const rightActive = normX > threshold;
    const upActive = normY < -threshold;
    const downActive = normY > threshold;
    
    touch.left = leftActive;
    touch.right = rightActive;
    touch.up = upActive;
    touch.down = downActive;
    
    // Update visual feedback classes
    joystickArea.classList.toggle('active-left', leftActive);
    joystickArea.classList.toggle('active-right', rightActive);
    joystickArea.classList.toggle('active-up', upActive);
    joystickArea.classList.toggle('active-down', downActive);
    
    // Jump when pushing up
    if (upActive && !touch.jump) {
        touch.jump = true;
        vibrate(8);
    } else if (!upActive) {
        touch.jump = false;
    }
}

// Enhanced Action Button Touch Handling with haptic feedback
function setupTouchBtn(id, prop) {
    const btn = document.getElementById(id);
    if (!btn) return;
    
    let btnTouchId = null;
    
    btn.addEventListener('touchstart', e => {
        e.preventDefault();
        e.stopPropagation();
        if (btnTouchId !== null) return;
        
        btnTouchId = e.changedTouches[0].identifier;
        touch[prop] = true;
        btn.classList.add('pressed');
        vibrate(prop === 'attack' ? 15 : 8); // Stronger feedback for attack
    }, { passive: false });
    
    const endBtnTouch = e => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === btnTouchId) {
                btnTouchId = null;
                touch[prop] = false;
                btn.classList.remove('pressed');
                break;
            }
        }
    };
    
    btn.addEventListener('touchend', endBtnTouch, { passive: false });
    btn.addEventListener('touchcancel', endBtnTouch, { passive: false });
    
    // Mouse support for testing
    btn.addEventListener('mousedown', e => {
        e.preventDefault();
        touch[prop] = true;
        btn.classList.add('pressed');
    });
    btn.addEventListener('mouseup', e => {
        touch[prop] = false;
        btn.classList.remove('pressed');
    });
    btn.addEventListener('mouseleave', e => {
        touch[prop] = false;
        btn.classList.remove('pressed');
    });
}

        const deltaX = touch.clientX - touchStartX;

    if (y > tabY && y < tabY + tabHeight) {
        // Weapons tab
        const weaponsTabWidth = isMobile ? 180 : 150;
        const weaponsTabX = 100 - (isMobile ? 15 : 0);
        if (x > weaponsTabX && x < weaponsTabX + weaponsTabWidth) {
            shopCategory = 'weapons';
            shopScrollY = 0;
            vibrate(10);
            return;
        }
        
        // Armors tab
        const armorsTabWidth = isMobile ? 180 : 150;
        const armorsTabX = 260 - (isMobile ? 15 : 0);
        if (x > armorsTabX && x < armorsTabX + armorsTabWidth) {
            shopCategory = 'armors';
            shopScrollY = 0;
            vibrate(10);
            return;
        }
    }
    
    // Item purchase - accounting for scroll
    const items = shopCategory === 'weapons' ? ALL_WEAPONS : ALL_ARMORS;
    const itemList = Object.keys(items);
    const startX = 100;
    const spacing = isMobile ? 130 : 120;
    const itemH = isMobile ? 90 : 80;
    const itemAreaTop = 140;
    const cols = 7;
    
    // Check if click is within item area
    if (y >= itemAreaTop && y <= SCREEN_HEIGHT - 150) {
        for (let i = 0; i < itemList.length; i++) {
            const col = i % cols;
            const row = Math.floor(i / cols);
            const ix = startX + col * spacing;
            const iy = itemAreaTop + 20 + row * itemH - shopScrollY;
            
            const hitPaddingX = isMobile ? 25 : 20;
            const hitPaddingY = isMobile ? 30 : 25;
            
            if (x > ix - hitPaddingX && x < ix + hitPaddingX && 
                y > iy - hitPaddingY && y < iy + hitPaddingY) {
                const itemName = itemList[i];
                const item = items[itemName];
                let owned;
                if (activeShopPlayer === 2) {
                    owned = shopCategory === 'weapons' ? player2Weapons.includes(itemName) : player2Armors.includes(itemName);
                } else {
                    owned = shopCategory === 'weapons' ? playerWeapons.includes(itemName) : playerArmors.includes(itemName);
                }
                
                const currentGold = activeShopPlayer === 2 ? player2Gold : playerGold;
                
                if (!owned && currentGold >= item.price) {
                    if (activeShopPlayer === 2) {
                        player2Gold -= item.price;
                        if (shopCategory === 'weapons') {
                            player2Weapons.push(itemName);
                            currentWeapon2 = itemName;
                            if (battleReturnState === 'battle' && typeof char2 !== 'undefined' && char2 && char2.isPlayer) {
                                const baseStats = HERO_STATS[char2.faction][char2.name];
                                const stats = calculateStats(baseStats, itemName, currentArmor2);
                                char2.attackPower = stats.attack;
                                char2.defensePower = stats.defense;
                                char2.attackRange = stats.range;
                                char2.maxSpeed = MAX_SPEED * stats.speed;
                                char2.weapon = itemName;
                            }
                        } else {
                            player2Armors.push(itemName);
                            currentArmor2 = itemName;
                            if (battleReturnState === 'battle' && typeof char2 !== 'undefined' && char2 && char2.isPlayer) {
                                const baseStats = HERO_STATS[char2.faction][char2.name];
                                const stats = calculateStats(baseStats, currentWeapon2, itemName);
                                char2.attackPower = stats.attack;
                                char2.defensePower = stats.defense;
                                char2.attackRange = stats.range;
                                char2.maxSpeed = MAX_SPEED * stats.speed;
                                char2.armor = itemName;
                            }
                        }
                    } else {
                        playerGold -= item.price;
                        if (shopCategory === 'weapons') {
                            playerWeapons.push(itemName);
                            currentWeapon = itemName;
                            if (battleReturnState === 'battle' && typeof char1 !== 'undefined' && char1 && char1.isPlayer) {
                                const baseStats = HERO_STATS[char1.faction][char1.name];
                                const stats = calculateStats(baseStats, itemName, currentArmor);
                                char1.attackPower = stats.attack;
                                char1.defensePower = stats.defense;
                                char1.attackRange = stats.range;
                                char1.maxSpeed = MAX_SPEED * stats.speed;
                                char1.weapon = itemName;
                            }
                        } else {
                            playerArmors.push(itemName);
                            currentArmor = itemName;
                            if (battleReturnState === 'battle' && typeof char1 !== 'undefined' && char1 && char1.isPlayer) {
                                const baseStats = HERO_STATS[char1.faction][char1.name];
                                const stats = calculateStats(baseStats, currentWeapon, itemName);
                                char1.attackPower = stats.attack;
                                char1.defensePower = stats.defense;
                                char1.attackRange = stats.range;
                                char1.maxSpeed = MAX_SPEED * stats.speed;
                                char1.armor = itemName;
                            }
                        }
                    }
                } else if (owned) {
                    if (activeShopPlayer === 2) {
                         if (shopCategory === 'weapons') {
                            currentWeapon2 = itemName;
                            if (battleReturnState === 'battle' && typeof char2 !== 'undefined' && char2 && char2.isPlayer) {
                                const baseStats = HERO_STATS[char2.faction][char2.name];
                                const stats = calculateStats(baseStats, itemName, currentArmor2);
                                char2.attackPower = stats.attack;
                                char2.defensePower = stats.defense;
                                char2.attackRange = stats.range;
                                char2.maxSpeed = MAX_SPEED * stats.speed;
                                char2.weapon = itemName;
                            }
                        } else {
                            currentArmor2 = itemName;
                            if (battleReturnState === 'battle' && typeof char2 !== 'undefined' && char2 && char2.isPlayer) {
                                const baseStats = HERO_STATS[char2.faction][char2.name];
                                const stats = calculateStats(baseStats, currentWeapon2, itemName);
                                char2.attackPower = stats.attack;
                                char2.defensePower = stats.defense;
                                char2.attackRange = stats.range;
                                char2.maxSpeed = MAX_SPEED * stats.speed;
                                char2.armor = itemName;
                            }
                        }
                    } else {
                        if (shopCategory === 'weapons') {
                            currentWeapon = itemName;
                            if (battleReturnState === 'battle' && typeof char1 !== 'undefined' && char1 && char1.isPlayer) {
                                const baseStats = HERO_STATS[char1.faction][char1.name];
                                const stats = calculateStats(baseStats, itemName, currentArmor);
                                char1.attackPower = stats.attack;
                                char1.defensePower = stats.defense;
                                char1.attackRange = stats.range;
                                char1.maxSpeed = MAX_SPEED * stats.speed;
                                char1.weapon = itemName;
                            }
                        } else {
                            currentArmor = itemName;
                            if (battleReturnState === 'battle' && typeof char1 !== 'undefined' && char1 && char1.isPlayer) {
                                const baseStats = HERO_STATS[char1.faction][char1.name];
                                const stats = calculateStats(baseStats, currentWeapon, itemName);
                                char1.attackPower = stats.attack;
                                char1.defensePower = stats.defense;
                                char1.attackRange = stats.range;
                                char1.maxSpeed = MAX_SPEED * stats.speed;
                                char1.armor = itemName;
                            }

                }
                vibrate(15);
                
                // Visual feedback
                drawShopItemFeedback(ix, iy, hitPaddingX, hitPaddingY);

        }
    }
    
    // Back button - enlarged for mobile
    const backBtnWidth = isMobile ? 120 : 100;
    const backBtnHeight = isMobile ? 45 : 35;
    const backBtnX = 40 - (isMobile ? 10 : 0);
    const backBtnY = SCREEN_HEIGHT - 80 - (isMobile ? 5 : 0);

        y > backBtnY && y < backBtnY + backBtnHeight) {

            vibrate(15);
            drawShopBackButtonFeedback(backBtnX + backBtnWidth/2, backBtnY + backBtnHeight/2, backBtnWidth, backBtnHeight);
            return;
        }
        
        gameState = 'selection';
        vibrate(15);

        drawShopBackButtonFeedback(backBtnX + backBtnWidth/2, backBtnY + backBtnHeight/2, backBtnWidth, backBtnHeight);

}

// Global variables to preserve battle state
let battleReturnState = null;  // Store state to return to after shop
let savedChar1 = null;         // Saved player character
let savedChar2 = null;         // Saved opponent character
let savedGameOver = false;     // Saved game over state
let savedWinner = null;        // Saved winner

function resetSelection() {
    selectedFaction = null;
    selectedHero = null;
    gameOver = false;
    winner = null;
    messages = [];
    particles = [];
    floatingTexts = [];
    projectiles = [];

}

// New function to save battle state before entering shop
function saveBattleState() {
    battleReturnState = 'battle';
    savedChar1 = char1;
    savedChar2 = char2;
    savedGameOver = gameOver;
    savedWinner = winner;
}

// New function to restore battle state
function restoreBattleState() {
    if (battleReturnState === 'battle' && savedChar1 && savedChar2) {
        // Clear accumulated effects
        projectiles = [];
        particles = particles.filter(p => p.life > 0);
        floatingTexts = floatingTexts.filter(t => t.life > 0);
        musouEffects = musouEffects.filter(m => m.life > 0);
        groundImpacts = [];
        dustTrails = [];
        messages = [];
        
        // Restore characters
        char1 = savedChar1;
        char2 = savedChar2;
        gameOver = savedGameOver;
        winner = savedWinner;
        
        // Return to battle state
        gameState = 'battle';
        battleReturnState = null;
        
        return true;
    }
    return false;
}

// Clear battle state when starting new battles
function clearBattleState() {
    battleReturnState = null;
    savedChar1 = null;
    savedChar2 = null;
    savedGameOver = false;
    savedWinner = null;
}

function createCharacter(name, faction, isPlayer, weapon = null, armor = '布衣') {
    const baseStats = HERO_STATS[faction][name] || [300, 30, 25, 100, '剑', '无', 8];
    const useWeapon = weapon || baseStats[4];
    const stats = calculateStats(baseStats, useWeapon, armor);
    
    const ch = new Character(
        name, faction, 
        stats.blood, stats.attack, stats.defense, stats.range,
        useWeapon, isPlayer
    );
    ch.maxSpeed = MAX_SPEED * stats.speed;
    ch.special = baseStats[5] || '无';
    ch.musouMax = baseStats[6] || 8;  // Set musou max from hero data
    ch.armor = armor;
    return ch;
}

function startBattle() {
    try {
        // Clear any saved battle state when starting a new battle
        clearBattleState();
        
        // Reset combo system
        comboSystem.currentCombo = 0;
        comboSystem.maxCombo = 0;
        comboSystem.comboTimer = 0;
        comboSystem.comboDisplay = [];
        
        // Reset weather
        setWeather(WEATHER_NONE, 0);
        
        // Reset lights
        dynamicLights = [];
        
        // Player 1
        const p1Data = p1Selection.hero ? p1Selection : { 
            faction: selectedFaction, 
            hero: selectedHero, 
            weapon: currentWeapon, 
            armor: currentArmor 
        };
        
        const p1Weapon = p1Data.weapon || HERO_STATS[p1Data.faction][p1Data.hero][4];
        char1 = createCharacter(p1Data.hero, p1Data.faction, true, p1Weapon, p1Data.armor);
        char1.x = SCREEN_WIDTH / 4;
        char1.direction = 0;
        
        if (vsAI) {
            // AI gets a random faction and hero, with scaling difficulty
            const factions = ['汉', '魏', '吴', '晋', '西凉', '黄巾', '其他'];
            const f2 = factions[randInt(0, factions.length - 1)];
            const h2 = ALL_HEROES[f2][randInt(0, ALL_HEROES[f2].length - 1)];
            const aiWeapon = HERO_STATS[f2][h2][4];
            const aiArmor = winStreak >= 3 ? '皮甲' : '布衣';
            
            char2 = createCharacter(h2, f2, false, aiWeapon, aiArmor);
            // Scale AI difficulty based on win streak
            const difficultyMod = 1 + winStreak * 0.05;
            char2.maxSpeed = MAX_SPEED * 0.55 * difficultyMod;
            char2.attackCooldown = Math.max(500, 700 - winStreak * 30);
        } else {
            // Player 2 in local multiplayer - Use P2 Selection
            const p2Data = p2Selection;
            // Fallback if p2Selection is empty (shouldn't happen with correct flow)
            if (!p2Data.hero) {
                // Should not happen if flow is correct, but safe fallback
                char2 = createCharacter('关羽', '汉', true);
            } else {
                const p2Weapon = p2Data.weapon || HERO_STATS[p2Data.faction][p2Data.hero][4];
                char2 = createCharacter(p2Data.hero, p2Data.faction, true, p2Weapon, p2Data.armor);
            }
        }
        char2.x = 3 * SCREEN_WIDTH / 4;
        char2.direction = 180;
        
        projectiles = [];
        messages = [];
        gameOver = false;
        winner = null;
        battleEntranceTimer = 100; // 1.7s dramatic entrance
        randomizeScene();  // Select random background scene
        gameState = 'battle';
    } catch (error) {
        console.error('Error starting battle:', error);
        // Reset to selection screen on error
        gameState = 'selection';
        resetSelection(); // Ensure clean state
    }
}

function restartBattle() {
    particles = [];
    floatingTexts = [];
    startBattle();
}

function endBattle(winnerChar) {
    gameOver = true;
    winner = winnerChar;
    
    if (winnerChar === char1) {
        // Player won - heal recovery for victory
        const victoryHeal = Math.floor(char1.maxBlood * 0.30);
        char1.blood = Math.min(char1.maxBlood, char1.blood + victoryHeal);
        spawnParticles(char1.x, char1.y - 30, 20, '#44ff44', 5, 4);
        spawnText(char1.x, char1.y - 70, `+${victoryHeal} HP`, '#44ff44', 22);
        
        const goldReward = 50 + winStreak * 20 + randInt(0, 30);
        playerGold += goldReward;
        winStreak++;
        totalWins++;
        addMessage(`胜利! 获得 ${goldReward} 金币, 恢复 ${victoryHeal} 血量`);
        addMessage(`连胜: ${winStreak} | 总胜利: ${totalWins}`);
        
        // Track faction wins for achievement
        if (!achievementData.factionWins) achievementData.factionWins = {};
        achievementData.factionWins[char1.faction] = (achievementData.factionWins[char1.faction] || 0) + 1;
        saveAchievements();
    } else if (winnerChar === char2) {
        winStreak = 0;
        addMessage(`${char2.name} 获得胜利!`);
    } else {
        addMessage('平局!');
    }
    
    // Check and show achievements
    const newAch = checkAchievements();
    newAch.forEach(ach => showAchievementNotification(ach));
}
