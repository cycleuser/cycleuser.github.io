<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>
  <rect x="30" y="30" width="540" height="340" fill="none" stroke="#000000" stroke-width="3"/>
  <rect x="36" y="36" width="528" height="328" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- 左侧：被挤掉的通识课，堆在角落 -->
  <!-- 书堆（自然科学/人文社科）被压在底下 -->
  <rect x="60" y="310" width="70" height="18" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="72" y="323" font-family="serif" font-size="8" fill="#000000" opacity="0.6">物理</text>
  <rect x="60" y="290" width="70" height="18" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="72" y="303" font-family="serif" font-size="8" fill="#000000" opacity="0.6">化学</text>
  <rect x="60" y="270" width="70" height="18" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="68" y="283" font-family="serif" font-size="8" fill="#000000" opacity="0.6">哲学史</text>
  <rect x="60" y="250" width="70" height="18" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="68" y="263" font-family="serif" font-size="8" fill="#000000" opacity="0.6">世界史</text>

  <!-- 上面压着的大厚书：操作系统、编译原理、算法、ML -->
  <rect x="55" y="230" width="80" height="20" fill="none" stroke="#000000" stroke-width="2.5"/>
  <text x="62" y="244" font-family="serif" font-size="9" fill="#000000">操作系统</text>
  <rect x="55" y="210" width="80" height="20" fill="none" stroke="#000000" stroke-width="2.5"/>
  <text x="62" y="224" font-family="serif" font-size="9" fill="#000000">编译原理</text>
  <rect x="55" y="190" width="80" height="20" fill="none" stroke="#000000" stroke-width="2.5"/>
  <text x="62" y="204" font-family="serif" font-size="9" fill="#000000">算法</text>
  <rect x="55" y="170" width="80" height="20" fill="none" stroke="#000000" stroke-width="2.5"/>
  <text x="62" y="184" font-family="serif" font-size="9" fill="#000000">机器学习</text>

  <!-- 一个箭头指向通识课，表示被压 -->
  <path d="M 40 310 L 50 310" stroke="#000000" stroke-width="1.5"/>
  <text x="42" y="330" font-family="serif" font-size="9" fill="#000000" opacity="0.5">通识课</text>
  <text x="38" y="342" font-family="serif" font-size="8" fill="#000000" opacity="0.4">被挤掉</text>

  <!-- 中间：小孙悟空在电脑前 -->
  <!-- 电脑屏幕 -->
  <rect x="200" y="200" width="100" height="70" fill="none" stroke="#000000" stroke-width="2.5"/>
  <rect x="205" y="205" width="90" height="60" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- 屏幕内容 -->
  <line x1="215" y1="215" x2="285" y2="215" stroke="#000000" stroke-width="1"/>
  <line x1="215" y1="225" x2="270" y2="225" stroke="#000000" stroke-width="1"/>
  <line x1="215" y1="235" x2="280" y2="235" stroke="#000000" stroke-width="1"/>
  <line x1="215" y1="245" x2="260" y2="245" stroke="#000000" stroke-width="1"/>
  <line x1="215" y1="255" x2="275" y2="255" stroke="#000000" stroke-width="1"/>
  <!-- 键盘 -->
  <rect x="210" y="270" width="80" height="15" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="250" y1="285" x2="250" y2="295" stroke="#000000" stroke-width="2"/>

  <!-- 小孙悟空坐在电脑前 -->
  <circle cx="250" cy="180" r="26" fill="none" stroke="#000000" stroke-width="2.5"/>
  <path d="M 226 168 Q 250 156 274 168" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="242" cy="180" r="3.5" fill="#000000"/>
  <circle cx="258" cy="180" r="3.5" fill="#000000"/>
  <path d="M 244 193 Q 250 196 256 193" fill="none" stroke="#000000" stroke-width="1.5"/>
  <path d="M 230 205 Q 250 208 270 205 L 272 270 Q 250 272 228 270 Z" fill="none" stroke="#000000" stroke-width="2.5"/>

  <!-- 对话气泡：屏幕里的一切我都能定义 -->
  <path d="M 310 130 Q 310 110 330 110 L 430 110 Q 450 110 450 130 L 450 155 Q 450 175 430 175 L 350 175 L 340 188 L 335 175 L 330 175 Q 310 175 310 155 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="325" y="130" font-family="serif" font-size="12" fill="#000000">规则是我定的</text>
  <text x="325" y="148" font-family="serif" font-size="12" fill="#000000">边界不够加显卡</text>

  <!-- 右侧：真实世界的边界 - 挡在面前的一堵墙 -->
  <rect x="470" y="80" width="8" height="230" fill="none" stroke="#000000" stroke-width="2.5"/>
  <!-- 墙上的硬限制符号 -->
  <text x="478" y="100" font-family="serif" font-size="10" fill="#000000">能量守恒</text>
  <text x="478" y="130" font-family="serif" font-size="10" fill="#000000">熵增</text>
  <text x="478" y="160" font-family="serif" font-size="10" fill="#000000">测不准关系</text>
  <text x="478" y="200" font-family="serif" font-size="10" fill="#000000" opacity="0.5">宇宙硬限制</text>
  <text x="478" y="215" font-family="serif" font-size="9" fill="#000000" opacity="0.4">加显卡突破不了</text>

  <!-- 小孙悟空在墙前，停下脚步 -->
  <circle cx="430" cy="280" r="22" fill="none" stroke="#000000" stroke-width="2.5"/>
  <path d="M 410 268 Q 430 258 450 268" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="423" cy="278" r="3" fill="#000000"/>
  <circle cx="437" cy="278" r="3" fill="#000000"/>
  <circle cx="430" cy="290" r="2.5" fill="none" stroke="#000000" stroke-width="1.5"/>
  <path d="M 414 300 Q 430 302 446 300 L 446 330 Q 430 332 414 330 Z" fill="none" stroke="#000000" stroke-width="2.5"/>
  <!-- 手碰墙 -->
  <line x1="446" y1="305" x2="470" y2="280" stroke="#000000" stroke-width="2.5"/>
  <!-- 感叹号 -->
  <text x="425" y="250" font-family="serif" font-size="24" fill="#000000">!</text>

  <!-- 标题 -->
  <text x="55" y="22" font-family="serif" font-size="13" fill="#000000">伍 · 更需要通识的计算机专业</text>
</svg>