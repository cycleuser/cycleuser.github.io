<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>
  <rect x="30" y="30" width="540" height="340" fill="none" stroke="#000000" stroke-width="3"/>
  <rect x="36" y="36" width="528" height="328" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- 左侧：锤子砸各种东西 -->
  <!-- 锤子 -->
  <rect x="60" y="120" width="40" height="25" fill="none" stroke="#000000" stroke-width="2.5"/>
  <line x1="80" y1="145" x2="80" y2="210" stroke="#000000" stroke-width="3"/>
  <!-- 被砸的钉子 -->
  <line x1="50" y1="250" x2="50" y2="230" stroke="#000000" stroke-width="2.5"/>
  <circle cx="50" cy="228" r="4" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="100" y1="250" x2="100" y2="235" stroke="#000000" stroke-width="2.5"/>
  <circle cx="100" cy="233" r="3" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- 非钉子的东西：螺丝 -->
  <circle cx="150" cy="240" r="8" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="142" y1="240" x2="158" y2="240" stroke="#000000" stroke-width="1.5"/>
  <line x1="150" y1="232" x2="150" y2="248" stroke="#000000" stroke-width="1.5"/>
  <!-- 问号：这是钉子吗？ -->
  <text x="138" y="220" font-family="serif" font-size="20" fill="#000000" opacity="0.5">？</text>

  <!-- 中间：地图和路 -->
  <!-- 地图卷轴 -->
  <ellipse cx="300" cy="80" rx="50" ry="15" fill="none" stroke="#000000" stroke-width="2.5"/>
  <path d="M 250 80 L 250 130 Q 300 140 350 130 L 350 80" fill="none" stroke="#000000" stroke-width="2.5"/>
  <ellipse cx="300" cy="130" rx="50" ry="12" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- 地图上的路线 -->
  <path d="M 260 90 Q 280 100 300 95 Q 320 105 340 90" fill="none" stroke="#000000" stroke-width="1.5"/>
  <path d="M 260 110 Q 280 115 300 120 Q 320 110 340 118" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.5"/>
  <!-- 路标：多个方向 -->
  <line x1="300" y1="130" x2="300" y2="180" stroke="#000000" stroke-width="2"/>
  <path d="M 300 155 L 320 150 L 320 160 Z" fill="none" stroke="#000000" stroke-width="2"/>
  <path d="M 300 170 L 280 165 L 280 175 Z" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- 被扔掉的地图，旁边"只有一条路"被划掉 -->
  <rect x="250" y="200" width="100" height="35" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="260" y="218" font-family="serif" font-size="10" fill="#000000">只有一条路</text>
  <line x1="245" y1="195" x2="355" y2="240" stroke="#000000" stroke-width="3"/>
  <text x="250" y="250" font-family="serif" font-size="9" fill="#000000" opacity="0.5">不一定是邪路</text>

  <!-- 右侧：肉两种吃法 -->
  <!-- 煮的锅 -->
  <ellipse cx="450" cy="200" rx="35" ry="10" fill="none" stroke="#000000" stroke-width="2.5"/>
  <path d="M 415 200 Q 415 220 450 225 Q 485 220 485 200" fill="none" stroke="#000000" stroke-width="2.5"/>
  <ellipse cx="450" cy="200" rx="28" ry="6" fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- 蒸汽 -->
  <path d="M 440 195 Q 435 180 440 165" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.5"/>
  <path d="M 450 195 Q 450 175 455 160" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.5"/>
  <path d="M 460 195 Q 465 180 460 165" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.5"/>
  <text x="425" y="245" font-family="serif" font-size="11" fill="#000000">煮着吃</text>

  <!-- 烤的签子 -->
  <line x1="510" y1="170" x2="510" y2="230" stroke="#000000" stroke-width="2.5"/>
  <rect x="515" y="185" width="20" height="40" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="515" y1="195" x2="535" y2="195" stroke="#000000" stroke-width="1"/>
  <line x1="515" y1="205" x2="535" y2="205" stroke="#000000" stroke-width="1"/>
  <line x1="515" y1="215" x2="535" y2="215" stroke="#000000" stroke-width="1"/>
  <!-- 火焰 -->
  <path d="M 520 230 Q 515 240 525 245 Q 530 240 535 230" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="510" y="260" font-family="serif" font-size="11" fill="#000000">烤着吃</text>

  <!-- 底部小孙悟空，走路状态，轻松 -->
  <circle cx="300" cy="305" r="26" fill="none" stroke="#000000" stroke-width="2.5"/>
  <path d="M 276 292 Q 300 280 324 292" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="292" cy="303" r="3.5" fill="#000000"/>
  <circle cx="308" cy="303" r="3.5" fill="#000000"/>
  <path d="M 294 318 Q 300 323 306 318" fill="none" stroke="#000000" stroke-width="2"/>
  <path d="M 280 330 Q 300 333 320 330 L 322 370 Q 300 373 278 370 Z" fill="none" stroke="#000000" stroke-width="2.5"/>
  <!-- 走路的腿 -->
  <line x1="290" y1="368" x2="285" y2="388" stroke="#000000" stroke-width="2.5"/>
  <line x1="310" y1="368" x2="315" y2="388" stroke="#000000" stroke-width="2.5"/>
  <!-- 手里拿着金箍棒当拐杖 -->
  <line x1="322" y1="335" x2="335" y2="375" stroke="#000000" stroke-width="2.5"/>
  <rect x="333" y="372" width="6" height="8" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- 旁边文字 -->
  <text x="180" y="360" font-family="serif" font-size="10" fill="#000000" opacity="0.5">保持开放，持续走</text>

  <!-- 标题 -->
  <text x="55" y="22" font-family="serif" font-size="13" fill="#000000">柒 · 保持开放心态</text>
</svg>