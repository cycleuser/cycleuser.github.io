// ========== 输入处理 ==========
const keys = {};

document.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    
    if (gameState === 'battle' && !gameOver && char1) {
        if (['w', 'arrowup'].includes(e.key.toLowerCase())) char1.attemptJump();
        if (e.key.toLowerCase() === 'j' || e.key.toLowerCase() === 'x') {
            const result = char1.attack(char2, performance.now());
            if (result) battleLog.unshift(result);
        }
        if (e.key.toLowerCase() === 'k' || e.key.toLowerCase() === 'c') {
            char1.defending = true;
            char1.defenseTimer = 800;
        }
    }
    
    // 双人模式玩家2
    if (gameState === 'battle' && !gameOver && !vsAI && char2) {
        if (e.key === 'ArrowUp') char2.attemptJump();
        if (e.key === '1') {
            const result = char2.attack(char1, performance.now());
            if (result) battleLog.unshift(result);
        }
        if (e.key === '2') {
            char2.defending = true;
            char2.defenseTimer = 800;
        }
    }
    
    // 全局按键
    if (e.key.toLowerCase() === 'r' && gameOver) {
        restartBattle();
    }
    if (e.key === 'Escape') {
        if (gameState === 'battle') {
            gameState = 'selection';
            gameOver = false;
        } else if (gameState === 'shop' || gameState === 'formation') {
            gameState = battleReturnState || 'selection';
        }
    }
});

document.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
});

// 持续移动检测
setInterval(() => {
    if (gameState === 'battle' && !gameOver && char1) {
        char1.moveLeft = keys['a'] || keys['arrowleft'];
        char1.moveRight = keys['d'] || keys['arrowright'];
        char1.faceEnemy(char2);
    }
    if (gameState === 'battle' && !gameOver && !vsAI && char2) {
        char2.moveLeft = keys['arrowleft'];
        char2.moveRight = keys['arrowright'];
        char2.faceEnemy(char1);
    }
}, 16);

// ========== 鼠标/触摸处理 ==========
canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / scale;
    const y = (e.clientY - rect.top) / scale;
    
    handleClick(x, y);
});

canvas.addEventListener('touchstart', e => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches[0].clientX - rect.left) / scale;
    const y = (e.touches[0].clientY - rect.top) / scale;
    
    e.preventDefault();
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
    swipeStartTime = Date.now();
    
    vibrate(5);
    handleClick(x, y);
}, { passive: false });

canvas.addEventListener('touchend', e => {
    if (e.changedTouches.length === 0) return;
    
    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;
    const deltaX = endX - swipeStartX;
    const deltaY = endY - swipeStartY;
    const deltaTime = Date.now() - swipeStartTime;
    
    const minSwipeDist = 50;
    const maxSwipeTime = 300;
    
    if (deltaTime < maxSwipeTime) {
        const absDx = Math.abs(deltaX);
        const absDy = Math.abs(deltaY);
        
        // 垂直滑动 - 滚动列表
        if (absDy > minSwipeDist && absDy > absDx) {
            if (gameState === 'selection' && selectedFaction && heroScrollMax > 0) {
                heroScrollY = clamp(heroScrollY - deltaY, 0, heroScrollMax);
            } else if (gameState === 'shop' && shopScrollMax > 0) {
                shopScrollY = clamp(shopScrollY - deltaY, 0, shopScrollMax);
            }
        }
    }
}, { passive: true });

// 鼠标滚轮
canvas.addEventListener('wheel', e => {
    if (gameState === 'selection' && selectedFaction && heroScrollMax > 0) {
        heroScrollY = clamp(heroScrollY + e.deltaY * 0.5, 0, heroScrollMax);
    } else if (gameState === 'shop' && shopScrollMax > 0) {
        shopScrollY = clamp(shopScrollY + e.deltaY * 0.5, 0, shopScrollMax);
    }
});

function handleClick(x, y) {
    if (gameState === 'selection') {
        handleSelectionClick(x, y);
    } else if (gameState === 'shop') {
        handleShopClick(x, y);
    } else if (gameState === 'formation') {
        handleFormationClick(x, y);
    } else if (gameState === 'battle' && gameOver) {
        // 检查商店按钮
        if (vsAI && winner === char1 && 
            x > SCREEN_WIDTH - 130 && x < SCREEN_WIDTH - 10 &&
            y > SCREEN_HEIGHT - 50 && y < SCREEN_HEIGHT - 10) {
            battleReturnState = 'battle';
            gameState = 'shop';
            vibrate(15);
        } else {
            restartBattle();
            vibrate(10);
        }
    }
}

function handleSelectionClick(x, y) {
    // 阵营选择
    const factions = Object.keys(ALL_HEROES);
    const factionY = 95;
    const factionSpacing = 130;
    const startX = (SCREEN_WIDTH - (factions.length - 1) * factionSpacing) / 2;
    
    for (let i = 0; i < factions.length; i++) {
        const fx = startX + i * factionSpacing;
        if (x > fx - 55 && x < fx + 55 && y > factionY - 18 && y < factionY + 18) {
            selectedFaction = factions[i];
            selectedHero = null;
            heroScrollY = 0;
            vibrate(10);
            return;
        }
    }
    
    // 人物选择
    if (selectedFaction) {
        const heroes = ALL_HEROES[selectedFaction];
        const heroAreaTop = 145;
        const heroH = 45;
        const cols = 4;
        const colWidth = (SCREEN_WIDTH - 100) / cols;
        
        for (let i = 0; i < heroes.length; i++) {
            const hero = heroes[i];
            const col = i % cols;
            const row = Math.floor(i / cols);
            const hx = 50 + col * colWidth + colWidth / 2;
            const hy = heroAreaTop + 25 + row * heroH - heroScrollY;
            
            if (x > hx - colWidth/2 + 5 && x < hx + colWidth/2 - 5 &&
                y > hy - 18 && y < hy + 18) {
                selectedHero = hero;
                vibrate(10);
                return;
            }
        }
    }
    
    // 开始按钮
    if (selectedHero && 
        x > SCREEN_WIDTH - 160 && x < SCREEN_WIDTH - 20 &&
        y > SCREEN_HEIGHT - 55 && y < SCREEN_HEIGHT - 15) {
        startBattle();
        vibrate(15);
        return;
    }
    
    // 商店按钮
    if (x > 20 && x < 120 && y > SCREEN_HEIGHT - 55 && y < SCREEN_HEIGHT - 15) {
        battleReturnState = 'selection';
        gameState = 'shop';
        vibrate(10);
        return;
    }
    
    // 模式切换
    if (y > SCREEN_HEIGHT - 45 && y < SCREEN_HEIGHT - 15 &&
        x > SCREEN_WIDTH/2 - 100 && x < SCREEN_WIDTH/2 + 100) {
        vsAI = !vsAI;
        vibrate(10);
    }
}

function handleShopClick(x, y) {
    // 分类标签
    const tabY = 95;
    if (y > tabY - 20 && y < tabY + 20) {
        if (x > 80 && x < 220) {
            shopCategory = 'fabao';
            shopScrollY = 0;
            vibrate(10);
            return;
        }
        if (x > 280 && x < 420) {
            shopCategory = 'armors';
            shopScrollY = 0;
            vibrate(10);
            return;
        }
    }
    
    // 物品点击
    const items = shopCategory === 'fabao' ? ALL_FABAO : ALL_ARMORS;
    const itemList = Object.keys(items).filter(name => items[name].price > 0);
    const startY = 140;
    const itemH = 55;
    const cols = 5;
    const colW = (SCREEN_WIDTH - 100) / cols;
    
    for (let i = 0; i < itemList.length; i++) {
        const name = itemList[i];
        const item = items[name];
        const col = i % cols;
        const row = Math.floor(i / cols);
        const ix = 50 + col * colW + colW / 2;
        const iy = startY + 30 + row * itemH - shopScrollY;
        
        if (x > ix - colW/2 + 5 && x < ix + colW/2 - 5 &&
            y > iy - 22 && y < iy + 22) {
            
            const owned = shopCategory === 'fabao' ? playerFabao.includes(name) : playerArmors.includes(name);
            
            if (owned) {
                // 装备
                if (shopCategory === 'fabao') {
                    currentFabao = name;
                } else {
                    currentArmor = name;
                }
                vibrate(10);
            } else if (playerGold >= item.price) {
                // 购买
                playerGold -= item.price;
                if (shopCategory === 'fabao') {
                    playerFabao.push(name);
                    currentFabao = name;
                } else {
                    playerArmors.push(name);
                    currentArmor = name;
                }
                vibrate(15);
            }
            return;
        }
    }
    
    // 返回按钮
    if (x > 30 && x < 130 && y > SCREEN_HEIGHT - 60 && y < SCREEN_HEIGHT - 20) {
        gameState = battleReturnState || 'selection';
        vibrate(10);
    }
}

function handleFormationClick(x, y) {
    // 阵法点击
    const formations = Object.keys(ALL_FORMATIONS);
    const cols = 4;
    const colW = (SCREEN_WIDTH - 80) / cols;
    const rowH = 100;
    const startY = 90;
    
    for (let i = 0; i < formations.length; i++) {
        const name = formations[i];
        const col = i % cols;
        const row = Math.floor(i / cols);
        const fx = 40 + col * colW + colW / 2;
        const fy = startY + row * rowH + rowH / 2;
        
        if (x > fx - colW/2 + 10 && x < fx + colW/2 - 10 &&
            y > fy - 40 && y < fy + 40) {
            // 激活阵法
            if (char1 && char1.shenTong >= char1.shenTongMax) {
                activateFormation(name, SCREEN_WIDTH/2, GROUND_Y - 50);
                char1.shenTong = 0;
                gameState = 'battle';
                vibrate(20);
            }
            return;
        }
    }
    
    // 返回按钮
    if (x > 30 && x < 130 && y > SCREEN_HEIGHT - 50 && y < SCREEN_HEIGHT - 15) {
        gameState = battleReturnState || 'battle';
        vibrate(10);
    }
}

// ========== 战斗初始化 ==========
function startBattle() {
    if (!selectedHero || !selectedFaction) return;
    
    const stats1 = HERO_STATS[selectedFaction][selectedHero];
    if (!stats1) return;
    
    // 创建玩家1
    const fabao1 = currentFabao || stats1[4];
    const calcStats1 = calculateStats(stats1, fabao1, currentArmor);
    
    char1 = new Character(
        selectedHero, selectedFaction,
        calcStats1.blood, calcStats1.attack, calcStats1.defense, calcStats1.range,
        fabao1, true
    );
    char1.special = stats1[5];
    char1.shenTongMax = stats1[6];
    char1.realm = stats1[7];
    char1.x = 200;
    char1.direction = 0;
    
    // 创建AI对手
    const enemyFaction = getRandomFaction();
    const enemyHeroes = ALL_HEROES[enemyFaction];
    const enemyHero = enemyHeroes[randInt(0, enemyHeroes.length - 1)];
    const stats2 = HERO_STATS[enemyFaction][enemyHero];
    
    if (!stats2) {
        console.error('Enemy stats not found:', enemyFaction, enemyHero);
        return;
    }
    
    const fabao2 = stats2[4];
    const calcStats2 = calculateStats(stats2, fabao2, '布衣');
    
    char2 = new Character(
        enemyHero, enemyFaction,
        calcStats2.blood, calcStats2.attack, calcStats2.defense, calcStats2.range,
        fabao2, false
    );
    char2.special = stats2[5];
    char2.shenTongMax = stats2[6];
    char2.realm = stats2[7];
    char2.x = SCREEN_WIDTH - 200;
    char2.direction = 180;
    
    if (vsAI) {
        aiController = new AIController(char2, char1);
    }
    
    gameState = 'battle';
    gameOver = false;
    winner = null;
    battleLog = [`${char1.name} 对战 ${char2.name}!`];
    particles = [];
    floatingTexts = [];
    divineEffects = [];
    formationEffects = [];
    formationActive = false;
    currentFormation = null;
}

function getRandomFaction() {
    const factions = Object.keys(ALL_HEROES);
    return factions[randInt(0, factions.length - 1)];
}

function restartBattle() {
    startBattle();
}

// ========== 移动端控制 ==========
let joystickActive = false;
const joystickArea = document.getElementById('joystickArea');
const joystickKnob = document.getElementById('joystickKnob');

joystickArea.addEventListener('touchstart', e => {
    joystickActive = true;
    joystickKnob.classList.add('active');
    updateJoystick(e);
}, { passive: true });

joystickArea.addEventListener('touchmove', e => {
    if (joystickActive) updateJoystick(e);
}, { passive: true });

joystickArea.addEventListener('touchend', () => {
    joystickActive = false;
    joystickKnob.classList.remove('active');
    joystickKnob.style.transform = 'translate(-50%, -50%)';
    if (char1) {
        char1.moveLeft = false;
        char1.moveRight = false;
    }
});

function updateJoystick(e) {
    const rect = joystickArea.getBoundingClientRect();
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    const touchX = e.touches[0].clientX - rect.left;
    const touchY = e.touches[0].clientY - rect.top;
    
    let dx = touchX - centerX;
    let dy = touchY - centerY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxDist = 35;
    
    if (dist > maxDist) {
        dx = dx / dist * maxDist;
        dy = dy / dist * maxDist;
    }
    
    joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    
    if (char1 && gameState === 'battle' && !gameOver) {
        char1.moveLeft = dx < -10;
        char1.moveRight = dx > 10;
        if (dy < -20 && char1.onGround) {
            char1.attemptJump();
        }
    }
}

// 攻击按钮
document.getElementById('btnAttack').addEventListener('touchstart', e => {
    e.preventDefault();
    if (char1 && char2 && gameState === 'battle' && !gameOver) {
        const result = char1.attack(char2, performance.now());
        if (result) battleLog.unshift(result);
    }
    vibrate(10);
}, { passive: false });

// 防御按钮
document.getElementById('btnDefend').addEventListener('touchstart', e => {
    e.preventDefault();
    if (char1 && gameState === 'battle' && !gameOver) {
        char1.defending = true;
        char1.defenseTimer = 800;
    }
    vibrate(8);
}, { passive: false });

document.getElementById('btnDefend').addEventListener('touchend', () => {
    if (char1) {
        char1.defending = false;
    }
});

// 神通/法术按钮
document.getElementById('btnSkill').addEventListener('touchstart', e => {
    e.preventDefault();
    if (char1 && char1.shenTong >= char1.shenTongMax) {
        battleReturnState = 'battle';
        gameState = 'formation';
    }
    vibrate(12);
}, { passive: false });

// 工具按钮
document.getElementById('btnRestart').addEventListener('click', () => {
    if (gameOver) restartBattle();
    vibrate(10);
});

document.getElementById('btnBack').addEventListener('click', () => {
    if (gameState === 'battle') {
        gameState = 'selection';
        gameOver = false;
    } else if (gameState === 'shop' || gameState === 'formation') {
        gameState = battleReturnState || 'selection';
    }
    vibrate(10);
});

document.getElementById('btnFormation').addEventListener('click', () => {
    if (gameState === 'battle' && !gameOver) {
        battleReturnState = 'battle';
        gameState = 'formation';
    }
    vibrate(10);
});

// ========== 启动游戏 ==========
requestAnimationFrame(gameLoop);
</script>
